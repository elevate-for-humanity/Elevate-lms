name: GPU Deploy Observer

on:
  issues:
    types: [opened, edited]

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  observe:
    if: startsWith(github.event.issue.title, '[GPU DEPLOY]')
    runs-on: ubuntu-latest
    steps:
      - name: Post latest GPU deployment workflow runs
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy-gpu-worker.yml',
              branch: 'main',
              per_page: 10,
            });
            const lines = data.workflow_runs.map(run =>
              `- run ${run.id}: ${run.status}/${run.conclusion || 'pending'} | event=${run.event} | sha=${run.head_sha} | ${run.html_url}`
            );
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `GPU workflow runs visible to observer:\n${lines.length ? lines.join('\n') : '- none found'}`,
            });
