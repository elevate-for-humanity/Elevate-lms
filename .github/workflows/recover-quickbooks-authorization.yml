name: Recover existing QuickBooks authorization
on:
  push:
    branches: [main]
    paths: ['scripts/gcp/recover-quickbooks-authorization*', '.github/workflows/recover-quickbooks-authorization.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: write
  id-token: write
concurrency:
  group: quickbooks-authorization-recovery
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test scripts/gcp/recover-quickbooks-authorization.test.mjs
  dispatch:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST repos/$GITHUB_REPOSITORY/actions/workflows/recover-quickbooks-authorization.yml/dispatches -f ref=main
  verify:
    needs: test
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        with: {skip_install: true}
      - name: Recover only an already authorized existing company
        run: node scripts/gcp/recover-quickbooks-authorization.mjs
      - name: Refresh live connection evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/$GITHUB_REPOSITORY/actions/workflows/integration-connection-acceptance.yml/dispatches -f ref=main
