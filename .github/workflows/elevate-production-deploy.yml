name: Elevate Production Deployment

on:
  workflow_dispatch:
    inputs:
      service:
        description: Service to deploy
        required: true
        type: choice
        options:
          - marketing
          - admin
          - lms
          - all
      environment:
        description: Deployment environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      git_sha:
        description: Exact Git SHA to deploy
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: elevate-${{ inputs.environment }}-${{ inputs.service }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.28.2"
  REGISTRY: ghcr.io
  GITHUB_OWNER: elevate-for-humanity

jobs:
  prepare:
    name: Resolve deployment
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      short_sha: ${{ steps.resolve.outputs.short_sha }}
      deploy_marketing: ${{ steps.services.outputs.marketing }}
      deploy_admin: ${{ steps.services.outputs.admin }}
      deploy_lms: ${{ steps.services.outputs.lms }}
    steps:
      - name: Resolve Git SHA
        id: resolve
        shell: bash
        run: |
          set -Eeuo pipefail
          REQUESTED_SHA="${{ inputs.git_sha }}"
          if [[ -n "$REQUESTED_SHA" ]]; then SHA="$REQUESTED_SHA"
          else SHA="${{ github.sha }}"; fi
          if [[ ! "$SHA" =~ ^[a-fA-F0-9]{7,40}$ ]]; then echo "Invalid Git SHA: $SHA"; exit 1; fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHA:0:12}" >> "$GITHUB_OUTPUT"
      - name: Resolve selected services
        id: services
        shell: bash
        run: |
          set -Eeuo pipefail
          SERVICE="${{ inputs.service }}"
          case "$SERVICE" in
            marketing) echo "marketing=true" >> "$GITHUB_OUTPUT"; echo "admin=false" >> "$GITHUB_OUTPUT"; echo "lms=false" >> "$GITHUB_OUTPUT" ;;
            admin) echo "marketing=false" >> "$GITHUB_OUTPUT"; echo "admin=true" >> "$GITHUB_OUTPUT"; echo "lms=false" >> "$GITHUB_OUTPUT" ;;
            lms) echo "marketing=false" >> "$GITHUB_OUTPUT"; echo "admin=false" >> "$GITHUB_OUTPUT"; echo "lms=true" >> "$GITHUB_OUTPUT" ;;
            all) echo "marketing=true" >> "$GITHUB_OUTPUT"; echo "admin=true" >> "$GITHUB_OUTPUT"; echo "lms=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unknown service: $SERVICE"; exit 1 ;;
          esac

  validate-repository:
    name: Validate repository
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 1
      - name: Enable Corepack
        run: corepack enable
      - name: Install pnpm
        run: corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate
      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Verify pnpm version
        run: node --version && pnpm --version
      - name: Install dependencies
        env:
          NODE_OPTIONS: --max-old-space-size=16384
        run: pnpm install --frozen-lockfile
      - name: Validate required files
        shell: bash
        run: |
          set -Eeuo pipefail
          for FILE in Dockerfile.marketing Dockerfile.admin Dockerfile.lms apps/marketing/next.config.mjs apps/admin/next.config.mjs apps/lms/next.config.mjs; do
            if [[ ! -f "$FILE" ]]; then echo "::error::Missing required file: $FILE"; exit 1; fi
            echo "Found: $FILE"
          done
      - name: Check Docker startup commands
        shell: bash
        run: |
          set -Eeuo pipefail
          for FILE in Dockerfile.marketing Dockerfile.admin Dockerfile.lms; do
            if ! grep -Eq 'CMD.*server\.js|CMD.*pnpm.*start|ENTRYPOINT.*server\.js' "$FILE"; then
              echo "::error file=$FILE::No valid production startup command found."
              exit 1
            fi
          done

  build-marketing:
    name: Build and test Marketing
    runs-on: ubuntu-latest
    needs: [prepare, validate-repository]
    if: needs.prepare.outputs.deploy_marketing == 'true'
    timeout-minutes: 45
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build marketing image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.marketing
          load: true
          push: false
          tags: elevate-marketing:test
          build-args: |
            GITHUB_SHA=${{ needs.prepare.outputs.sha }}
            GIT_SHA=${{ needs.prepare.outputs.sha }}
            NEXT_PUBLIC_GIT_SHA=${{ needs.prepare.outputs.sha }}
            BUILD_TIMESTAMP=${{ github.event.repository.updated_at }}
          cache-from: type=gha,scope=marketing
          cache-to: type=gha,mode=max,scope=marketing
      - name: Verify image contains runnable application
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm --entrypoint sh elevate-marketing:test -c '
            set -e
            if [ -f server.js ]; then echo "Found server.js"; exit 0; fi
            if [ -f .next/standalone/server.js ]; then echo "Found standalone server.js"; exit 0; fi
            if [ -f package.json ]; then echo "Found package.json"; exit 0; fi
            echo "No valid startup application was found."; exit 1
          '
      - name: Smoke test marketing container
        run: |
          chmod +x scripts/smoke-test-container.sh
          scripts/smoke-test-container.sh "elevate-marketing:test" "marketing-smoke" "3100"

  build-admin:
    name: Build and test Admin
    runs-on: ubuntu-latest
    needs: [prepare, validate-repository]
    if: needs.prepare.outputs.deploy_admin == 'true'
    timeout-minutes: 60
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build admin image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.admin
          load: true
          push: false
          tags: elevate-admin:test
          build-args: |
            GITHUB_SHA=${{ needs.prepare.outputs.sha }}
            GIT_SHA=${{ needs.prepare.outputs.sha }}
            NEXT_PUBLIC_GIT_SHA=${{ needs.prepare.outputs.sha }}
            BUILD_TIMESTAMP=${{ github.event.repository.updated_at }}
            NODE_OPTIONS=--max-old-space-size=16384
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin
      - name: Verify image contains runnable application
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm --entrypoint sh elevate-admin:test -c '
            set -e
            if [ -f server.js ]; then echo "Found server.js"; exit 0; fi
            if [ -f .next/standalone/server.js ]; then echo "Found standalone server.js"; exit 0; fi
            if [ -f package.json ]; then echo "Found package.json"; exit 0; fi
            echo "No valid Admin startup application was found."; exit 1
          '
      - name: Smoke test admin container
        run: |
          chmod +x scripts/smoke-test-container.sh
          scripts/smoke-test-container.sh "elevate-admin:test" "admin-smoke" "3200"

  build-lms:
    name: Build and test LMS
    runs-on: ubuntu-latest
    needs: [prepare, validate-repository]
    if: needs.prepare.outputs.deploy_lms == 'true'
    timeout-minutes: 60
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build LMS image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.lms
          load: true
          push: false
          tags: elevate-lms:test
          build-args: |
            GITHUB_SHA=${{ needs.prepare.outputs.sha }}
            GIT_SHA=${{ needs.prepare.outputs.sha }}
            NEXT_PUBLIC_GIT_SHA=${{ needs.prepare.outputs.sha }}
            BUILD_TIMESTAMP=${{ github.event.repository.updated_at }}
            NODE_OPTIONS=--max-old-space-size=16384
          cache-from: type=gha,scope=lms
          cache-to: type=gha,mode=max,scope=lms
      - name: Verify image contains runnable application
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm --entrypoint sh elevate-lms:test -c '
            set -e
            if [ -f server.js ]; then echo "Found server.js"; exit 0; fi
            if [ -f .next/standalone/server.js ]; then echo "Found standalone server.js"; exit 0; fi
            if [ -f package.json ]; then echo "Found package.json"; exit 0; fi
            echo "No valid LMS startup application was found."; exit 1
          '
      - name: Smoke test LMS container
        run: |
          chmod +x scripts/smoke-test-container.sh
          scripts/smoke-test-container.sh "elevate-lms:test" "lms-smoke" "3300"

  publish-images:
    name: Publish validated images
    runs-on: ubuntu-latest
    needs: [prepare, validate-repository, build-marketing, build-admin, build-lms]
    if: |
      always() &&
      needs.validate-repository.result == 'success' &&
      (needs.build-marketing.result == 'success' || needs.build-marketing.result == 'skipped') &&
      (needs.build-admin.result == 'success' || needs.build-admin.result == 'skipped') &&
      (needs.build-lms.result == 'success' || needs.build-lms.result == 'skipped')
    outputs:
      marketing_image: ${{ steps.images.outputs.marketing_image }}
      admin_image: ${{ steps.images.outputs.admin_image }}
      lms_image: ${{ steps.images.outputs.lms_image }}
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish marketing image
        if: needs.prepare.outputs.deploy_marketing == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.marketing
          push: true
          tags: |
            ghcr.io/${{ env.GITHUB_OWNER }}/elevate-marketing:${{ needs.prepare.outputs.sha }}
            ghcr.io/${{ env.GITHUB_OWNER }}/elevate-marketing:${{ inputs.environment }}-${{ needs.prepare.outputs.short_sha }}
          build-args: |
            GITHUB_SHA=${{ needs.prepare.outputs.sha }}
            GIT_SHA=${{ needs.prepare.outputs.sha }}
            NEXT_PUBLIC_GIT_SHA=${{ needs.prepare.outputs.sha }}
            BUILD_TIMESTAMP=${{ github.event.repository.updated_at }}
          cache-from: type=gha,scope=marketing
      - name: Publish admin image
        if: needs.prepare.outputs.deploy_admin == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.admin
          push: true
          tags: |
            ghcr.io/${{ env.GITHUB_OWNER }}/elevate-admin:${{ needs.prepare.outputs.sha }}
            ghcr.io/${{ env.GITHUB_OWNER }}/elevate-admin:${{ inputs.environment }}-${{ needs.prepare.outputs.short_sha }}
          build-args: |
            GITHUB_SHA=${{ needs.prepare.outputs.sha }}
            GIT_SHA=${{ needs.prepare.outputs.sha }}
            NEXT_PUBLIC_GIT_SHA=${{ needs.prepare.outputs.sha }}
            BUILD_TIMESTAMP=${{ github.event.repository.updated_at }}
            NODE_OPTIONS=--max-old-space-size=16384
          cache-from: type=gha,scope=admin
      - name: Publish LMS image
        if: needs.prepare.outputs.deploy_lms == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.lms
          push: true
          tags: |
            ghcr.io/${{ env.GITHUB_OWNER }}/elevate-lms:${{ needs.prepare.outputs.sha }}
            ghcr.io/${{ env.GITHUB_OWNER }}/elevate-lms:${{ inputs.environment }}-${{ needs.prepare.outputs.short_sha }}
          build-args: |
            GITHUB_SHA=${{ needs.prepare.outputs.sha }}
            GIT_SHA=${{ needs.prepare.outputs.sha }}
            NEXT_PUBLIC_GIT_SHA=${{ needs.prepare.outputs.sha }}
            BUILD_TIMESTAMP=${{ github.event.repository.updated_at }}
            NODE_OPTIONS=--max-old-space-size=16384
          cache-from: type=gha,scope=lms
      - name: Export image names
        id: images
        shell: bash
        run: |
          echo "marketing_image=ghcr.io/${GITHUB_OWNER}/elevate-marketing:${{ needs.prepare.outputs.sha }}" >> "$GITHUB_OUTPUT"
          echo "admin_image=ghcr.io/${GITHUB_OWNER}/elevate-admin:${{ needs.prepare.outputs.sha }}" >> "$GITHUB_OUTPUT"
          echo "lms_image=ghcr.io/${GITHUB_OWNER}/elevate-lms:${{ needs.prepare.outputs.sha }}" >> "$GITHUB_OUTPUT"

  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    environment: staging
    needs: [prepare, publish-images]
    if: inputs.environment == 'staging'
    steps:
      - name: Trigger Northflank marketing staging deployment
        if: needs.prepare.outputs.deploy_marketing == 'true'
        env:
          WEBHOOK_URL: ${{ secrets.NORTHFLANK_MARKETING_STAGING_WEBHOOK }}
          IMAGE_TAG: ${{ needs.publish-images.outputs.marketing_image }}
        run: scripts/trigger-northflank.sh "$WEBHOOK_URL" "$IMAGE_TAG"
      - name: Trigger Northflank admin staging deployment
        if: needs.prepare.outputs.deploy_admin == 'true'
        env:
          WEBHOOK_URL: ${{ secrets.NORTHFLANK_ADMIN_STAGING_WEBHOOK }}
          IMAGE_TAG: ${{ needs.publish-images.outputs.admin_image }}
        run: scripts/trigger-northflank.sh "$WEBHOOK_URL" "$IMAGE_TAG"
      - name: Trigger Northflank LMS staging deployment
        if: needs.prepare.outputs.deploy_lms == 'true'
        env:
          WEBHOOK_URL: ${{ secrets.NORTHFLANK_LMS_STAGING_WEBHOOK }}
          IMAGE_TAG: ${{ needs.publish-images.outputs.lms_image }}
        run: scripts/trigger-northflank.sh "$WEBHOOK_URL" "$IMAGE_TAG"
      - name: Verify staging services
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "${{ needs.prepare.outputs.deploy_marketing }}" == "true" ]]; then
            scripts/wait-for-public-health.sh "https://staging.elevateforhumanity.org/api/health" "${{ needs.prepare.outputs.sha }}"
          fi
          if [[ "${{ needs.prepare.outputs.deploy_admin }}" == "true" ]]; then
            scripts/wait-for-public-health.sh "https://admin-staging.elevateforhumanity.org/api/health" "${{ needs.prepare.outputs.sha }}"
          fi
          if [[ "${{ needs.prepare.outputs.deploy_lms }}" == "true" ]]; then
            scripts/wait-for-public-health.sh "https://app-staging.elevateforhumanity.org/api/health" "${{ needs.prepare.outputs.sha }}"
          fi

  deploy-production:
    name: Deploy to production
    runs-on: ubuntu-latest
    environment: production
    needs: [prepare, publish-images]
    if: inputs.environment == 'production'
    steps:
      - name: Trigger Northflank marketing production deployment
        if: needs.prepare.outputs.deploy_marketing == 'true'
        env:
          WEBHOOK_URL: ${{ secrets.NORTHFLANK_MARKETING_PRODUCTION_WEBHOOK }}
          IMAGE_TAG: ${{ needs.publish-images.outputs.marketing_image }}
        run: scripts/trigger-northflank.sh "$WEBHOOK_URL" "$IMAGE_TAG"
      - name: Trigger Northflank admin production deployment
        if: needs.prepare.outputs.deploy_admin == 'true'
        env:
          WEBHOOK_URL: ${{ secrets.NORTHFLANK_ADMIN_PRODUCTION_WEBHOOK }}
          IMAGE_TAG: ${{ needs.publish-images.outputs.admin_image }}
        run: scripts/trigger-northflank.sh "$WEBHOOK_URL" "$IMAGE_TAG"
      - name: Trigger Northflank LMS production deployment
        if: needs.prepare.outputs.deploy_lms == 'true'
        env:
          WEBHOOK_URL: ${{ secrets.NORTHFLANK_LMS_PRODUCTION_WEBHOOK }}
          IMAGE_TAG: ${{ needs.publish-images.outputs.lms_image }}
        run: scripts/trigger-northflank.sh "$WEBHOOK_URL" "$IMAGE_TAG"
      - name: Verify production services
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "${{ needs.prepare.outputs.deploy_marketing }}" == "true" ]]; then
            scripts/wait-for-public-health.sh "https://www.elevateforhumanity.org/api/health" "${{ needs.prepare.outputs.sha }}"
          fi
          if [[ "${{ needs.prepare.outputs.deploy_admin }}" == "true" ]]; then
            scripts/wait-for-public-health.sh "https://admin.elevateforhumanity.org/api/health" "${{ needs.prepare.outputs.sha }}"
          fi
          if [[ "${{ needs.prepare.outputs.deploy_lms }}" == "true" ]]; then
            scripts/wait-for-public-health.sh "https://app.elevateforhumanity.org/api/health" "${{ needs.prepare.outputs.sha }}"
          fi

  deployment-failed:
    name: Deployment failure report
    runs-on: ubuntu-latest
    if: failure()
    needs: [prepare, validate-repository, build-marketing, build-admin, build-lms, publish-images, deploy-staging, deploy-production]
    steps:
      - name: Report blocked deployment
        run: |
          echo "::error::Deployment was blocked because validation, container startup, health verification, publishing, or deployment failed."
          echo "No additional production deployment should be attempted until the failing step is corrected."
