name: Patch dashboard audit branch

on:
  push:
    branches:
      - audit/platform-typography-pwa-dashboards-20260809
    paths:
      - '.github/workflows/patch-dashboard-audit-branch.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/platform-typography-pwa-dashboards-20260809
          fetch-depth: 1

      - name: Patch remaining verified dashboard defects
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          # Workforce: preserve case-manager scoped total query and clean syntax.
          p = Path('apps/lms/app/workforce/dashboard/page.tsx')
          s = p.read_text()
          s = s.replace(
              "        : db.from('program_enrollments').select('*', { count: 'exact', head: true })\n            ,",
              "        : enrollBase,",
              1,
          )
          p.write_text(s)

          # Provider: retired super_admin role is no longer valid.
          p = Path('apps/marketing/app/provider/dashboard/page.tsx')
          s = p.read_text().replace(
              "requireRole(['provider_admin', 'admin', 'super_admin', 'staff'])",
              "requireRole(['provider_admin', 'admin', 'staff'])",
              1,
          )
          p.write_text(s)

          # Case manager: light slate text on a dark blue hero fails readable contrast.
          p = Path('apps/marketing/app/case-manager/dashboard/page.tsx')
          s = p.read_text().replace(
              'className="text-slate-500 text-sm"',
              'className="text-blue-50 text-sm"',
              1,
          )
          p.write_text(s)

          # Staff: Admin host routes are root-relative; /admin/programs is a duplicate/legacy prefix.
          p = Path('apps/admin/app/staff-portal/dashboard/page.tsx')
          s = p.read_text().replace(
              "href={`https://admin.${PLATFORM_DEFAULTS.canonicalDomain}/admin/programs`}",
              'href="/programs"',
              1,
          )
          p.write_text(s)

          # Parent: centralize support email instead of a separate hard-coded contact address.
          p = Path('apps/lms/app/parent-portal/dashboard/page.tsx')
          s = p.read_text().replace(
              'href="mailto:info@elevateforhumanity.org"',
              'href={`mailto:${PLATFORM_DEFAULTS.supportEmail}`}',
              1,
          )
          p.write_text(s)
          PY

          git diff --check
          git diff -- \
            apps/lms/app/workforce/dashboard/page.tsx \
            apps/marketing/app/provider/dashboard/page.tsx \
            apps/marketing/app/case-manager/dashboard/page.tsx \
            apps/admin/app/staff-portal/dashboard/page.tsx \
            apps/lms/app/parent-portal/dashboard/page.tsx

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/lms/app/workforce/dashboard/page.tsx \
            apps/marketing/app/provider/dashboard/page.tsx \
            apps/marketing/app/case-manager/dashboard/page.tsx \
            apps/admin/app/staff-portal/dashboard/page.tsx \
            apps/lms/app/parent-portal/dashboard/page.tsx
          git commit -m 'fix(dashboards): finish role routing and contrast cleanup' || exit 0
          git push origin HEAD:audit/platform-typography-pwa-dashboards-20260809
