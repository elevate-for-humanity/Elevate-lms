name: Legacy Route Consolidation Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dry-run collision-safe consolidation
        run: node scripts/consolidate-legacy-routes.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: legacy-route-consolidation-audit
          path: artifacts/legacy-route-consolidation.json
