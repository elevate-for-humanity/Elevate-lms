name: Deploy production (all services)

# Canonical full-platform production deploy. Synchronizes the shared production
# environment, configures Northflank, builds and verifies Marketing/LMS/Admin
# from one exact commit, then proves the same exact SHA is live on all three.
on:
  workflow_dispatch:
  issues:
    types: [opened, reopened]
  push:
    branches: [main]
    paths:
      - '.github/deploy-production-trigger'

permissions:
  contents: read
  issues: write

jobs:
  deploy-all:
    if: github.event_name != 'issues' || github.event.issue.title == 'DEPLOY PRODUCTION ALL SERVICES'
    name: Sync, configure, build, and verify Marketing + LMS + Admin
    concurrency:
      group: northflank-production-full
      cancel-in-progress: true
    runs-on: ubuntu-latest
    env:
      NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
      NORTHFLANK_TEAM_ID: ${{ secrets.NORTHFLANK_TEAM_ID || 'elevates-team' }}
      NORTHFLANK_PROJECT_ID: ${{ secrets.NORTHFLANK_PROJECT_ID || 'elevate-platform' }}
      NORTHFLANK_MARKETING_SERVICE_ID: ${{ secrets.NORTHFLANK_MARKETING_SERVICE_ID || 'elevate-marketing' }}
      NORTHFLANK_LMS_SERVICE_ID: ${{ secrets.NORTHFLANK_LMS_SERVICE_ID || 'elevate-lms' }}
      NORTHFLANK_ADMIN_SERVICE_ID: ${{ secrets.NORTHFLANK_ADMIN_SERVICE_ID || 'elevate-admin' }}
      NORTHFLANK_SECRET_GROUP_ID: ${{ secrets.NORTHFLANK_SECRET_GROUP_ID || 'elevate-production-env' }}
      DEPLOY_BRANCH: main
      NORTHFLANK_EPHEMERAL_STORAGE_MB: '32768'

      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}

      NEXT_PUBLIC_SITE_URL: https://www.elevateforhumanity.org
      NEXT_PUBLIC_PUBLIC_SITE_URL: https://www.elevateforhumanity.org
      NEXT_PUBLIC_APP_URL: https://app.elevateforhumanity.org
      NEXT_PUBLIC_LMS_URL: https://app.elevateforhumanity.org
      NEXT_PUBLIC_ADMIN_URL: https://admin.elevateforhumanity.org
      EXPECTED_SHA: ${{ github.sha }}

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          clean: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Verify production secrets
        run: |
          set -euo pipefail
          required=(
            NORTHFLANK_API_TOKEN
            NEXT_PUBLIC_SUPABASE_URL
            NEXT_PUBLIC_SUPABASE_ANON_KEY
            SUPABASE_SERVICE_ROLE_KEY
            NEXTAUTH_SECRET
            STRIPE_SECRET_KEY
          )
          for name in "${required[@]}"; do
            test -n "${!name:-}" || { echo "$name GitHub secret is missing"; exit 1; }
          done

      - name: Sync shared production env to all services
        run: |
          if [ -z "${SENDGRID_API_KEY:-}" ]; then
            echo "SENDGRID_API_KEY is not available in GitHub Secrets; preserving the existing Northflank secret group."
            echo "Skipping full secret-group replacement so an existing runtime email key is not erased."
          else
            pnpm tsx scripts/northflank/sync-env.ts --execute
          fi

      - name: Configure all Northflank production services
        run: pnpm tsx scripts/northflank/configure-services.ts --all --execute

      - name: Verify health probe configuration
        run: pnpm tsx scripts/northflank/verify-health-checks.ts --all

      # Northflank's shared BuildKit storage cannot reliably export three large
      # monorepo images concurrently. Build sequentially, but do not deploy any
      # service until every exact-SHA build has completed and been verified.
      - name: Trigger Marketing build
        id: marketing
        run: pnpm tsx scripts/northflank/trigger-build.ts "$NORTHFLANK_MARKETING_SERVICE_ID"

      - name: Wait for Marketing
        run: pnpm tsx scripts/northflank/wait-service.ts "$NORTHFLANK_MARKETING_SERVICE_ID" --build-id "${{ steps.marketing.outputs.build_id }}" --timeout-ms 3600000

      - name: Trigger LMS build
        id: lms
        run: pnpm tsx scripts/northflank/trigger-build.ts "$NORTHFLANK_LMS_SERVICE_ID"

      - name: Wait for LMS
        run: pnpm tsx scripts/northflank/wait-service.ts "$NORTHFLANK_LMS_SERVICE_ID" --build-id "${{ steps.lms.outputs.build_id }}" --timeout-ms 3600000

      - name: Trigger Admin build
        id: admin
        run: pnpm tsx scripts/northflank/trigger-build.ts "$NORTHFLANK_ADMIN_SERVICE_ID"

      - name: Wait for Admin
        run: pnpm tsx scripts/northflank/wait-service.ts "$NORTHFLANK_ADMIN_SERVICE_ID" --build-id "${{ steps.admin.outputs.build_id }}" --timeout-ms 3600000

      - name: Verify Marketing build
        run: pnpm tsx scripts/northflank/verify-build.ts "$NORTHFLANK_MARKETING_SERVICE_ID" --build-id "${{ steps.marketing.outputs.build_id }}" --sha "${{ github.sha }}"

      - name: Verify LMS build
        run: pnpm tsx scripts/northflank/verify-build.ts "$NORTHFLANK_LMS_SERVICE_ID" --build-id "${{ steps.lms.outputs.build_id }}" --sha "${{ github.sha }}"

      - name: Verify Admin build
        run: pnpm tsx scripts/northflank/verify-build.ts "$NORTHFLANK_ADMIN_SERVICE_ID" --build-id "${{ steps.admin.outputs.build_id }}" --sha "${{ github.sha }}"

      - name: Deploy Marketing build
        run: pnpm tsx scripts/northflank/trigger-deployment.ts "$NORTHFLANK_MARKETING_SERVICE_ID" --build-id "${{ steps.marketing.outputs.build_id }}" --sha "${{ github.sha }}"

      - name: Deploy LMS build
        run: pnpm tsx scripts/northflank/trigger-deployment.ts "$NORTHFLANK_LMS_SERVICE_ID" --build-id "${{ steps.lms.outputs.build_id }}" --sha "${{ github.sha }}"

      - name: Deploy Admin build
        run: pnpm tsx scripts/northflank/trigger-deployment.ts "$NORTHFLANK_ADMIN_SERVICE_ID" --build-id "${{ steps.admin.outputs.build_id }}" --sha "${{ github.sha }}"

      - name: Wait for Marketing deployment
        run: pnpm tsx scripts/northflank/wait-service.ts "$NORTHFLANK_MARKETING_SERVICE_ID" --timeout-ms 3600000

      - name: Wait for LMS deployment
        run: pnpm tsx scripts/northflank/wait-service.ts "$NORTHFLANK_LMS_SERVICE_ID" --timeout-ms 3600000

      - name: Wait for Admin deployment
        run: pnpm tsx scripts/northflank/wait-service.ts "$NORTHFLANK_ADMIN_SERVICE_ID" --timeout-ms 3600000

      - name: Verify exact live SHA and smoke all production services
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          verify_live_sha() {
            service="$1"
            url="$2"
            output="$3"

            curl -fsS --max-time 20 "$url" > "$output"
            cat "$output"

            live_sha=$(node -e '
              const fs = require("fs");
              const body = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              const sha = body.commit || body.buildId || body.sha || body.gitSha || "";
              process.stdout.write(String(sha).trim());
            ' "$output")

            if [ -z "$live_sha" ] || [ "$live_sha" = "unknown" ] || [ "$live_sha" = "MISSING" ]; then
              echo "$service does not expose a live Git SHA; refusing to mark production green."
              exit 1
            fi

            if [ "$live_sha" != "$EXPECTED_SHA" ]; then
              echo "$service live SHA mismatch: expected $EXPECTED_SHA, received $live_sha"
              exit 1
            fi

            echo "$service live SHA verified: $live_sha"
          }

          verify_live_sha "Marketing" "https://www.elevateforhumanity.org/api/health" "/tmp/marketing-health.json"
          verify_live_sha "LMS" "https://app.elevateforhumanity.org/api/ping" "/tmp/lms-ping.json"
          verify_live_sha "Admin" "https://admin.elevateforhumanity.org/api/ping" "/tmp/admin-ping.json"

          echo "All production services are healthy and serving exact SHA $EXPECTED_SHA"

      - name: Verify trial infrastructure dependency
        run: |
          set -euo pipefail
          status=$(curl -sk --max-time 15 -o /tmp/trial-check.json -w "%{http_code}" \
            -X POST -H 'content-type: application/json' \
            --data '{"orgName":"x","adminName":"x","adminEmail":"invalid"}' \
            https://www.elevateforhumanity.org/api/trial/start-managed || true)
          cat /tmp/trial-check.json || true
          test "$status" = "400"

      - name: Post production deployment result
        if: always() && github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const ok = '${{ job.status }}' === 'success';
            const body = `${ok ? 'PRODUCTION DEPLOYMENT PASS' : 'PRODUCTION DEPLOYMENT FAIL'}\n\nCommit: ${context.sha}\nJob status: ${{ job.status }}\n\nThe canonical Northflank workflow synchronized production environment/configuration, built and verified Marketing/LMS/Admin from the same commit, deployed the exact verified builds, waited for health, and required every live service endpoint to report the exact workflow SHA. A PASS means all three services are both healthy and on the identical release SHA; a FAIL means production remains blocked.`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
