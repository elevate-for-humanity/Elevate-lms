name: Diagnose Northflank apex

on:
  push:
    branches:
      - diagnose/northflank-apex-20260922
    paths:
      - '.github/workflows/diagnose-northflank-apex.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
      NORTHFLANK_TEAM_ID: ${{ secrets.NORTHFLANK_TEAM_ID || 'elevates-team' }}
      NORTHFLANK_PROJECT_ID: ${{ secrets.NORTHFLANK_PROJECT_ID || 'elevate-platform' }}
      NORTHFLANK_MARKETING_SERVICE_ID: ${{ secrets.NORTHFLANK_MARKETING_SERVICE_ID || 'elevate-marketing' }}
    steps:
      - name: Inspect Northflank apex state
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NORTHFLANK_API_TOKEN"
          node <<'NODE'
          const base = 'https://api.northflank.com/v1';
          const token = process.env.NORTHFLANK_API_TOKEN;
          const team = process.env.NORTHFLANK_TEAM_ID;
          const project = process.env.NORTHFLANK_PROJECT_ID;
          const service = process.env.NORTHFLANK_MARKETING_SERVICE_ID;
          const domain = 'elevateforhumanity.org';

          async function inspect(label, path) {
            const response = await fetch(base + path, {
              headers: { Authorization: `Bearer ${token}` },
            });
            const text = await response.text();
            let body;
            try {
              body = text ? JSON.parse(text) : {};
            } catch {
              body = { raw: text.slice(0, 500) };
            }
            console.log(`\n=== ${label} ===`);
            console.log(JSON.stringify({ status: response.status, body }, null, 2));
          }

          await inspect('team domains', `/teams/${team}/domains`);
          await inspect(
            'apex subdomain',
            `/teams/${team}/domains/${encodeURIComponent(domain)}/subdomains/%40`,
          );
          await inspect(
            'domain subdomains',
            `/teams/${team}/domains/${encodeURIComponent(domain)}/subdomains`,
          );
          await inspect('marketing ports', `/projects/${project}/services/${service}/ports`);
          NODE
