name: Deploy Google Store runtime identity
on:
  push:
    branches: [main]
    paths:
      [
        'scripts/gcp/production-acceptance.*',
        'scripts/build-memory-policy.*',
        'scripts/check-build-memory-policy.mjs',
        'scripts/run-bounded-build.*',
        'scripts/build-next-app.*',
        'scripts/container-build-policy.mjs',
        '.github/workflows/deploy-google-store-runtime.yml',
        'scripts/gcp/smoke-marketing-container.mjs',
        'scripts/gcp/store-page-contract.mjs',
        'scripts/gcp/test_store_preflight_admission.py',
        'scripts/gcp/store-rollout-diagnostics.test.mjs',
        'apps/marketing/**',
        'components/**',
        'lib/**',
        'packages/**',
        'Dockerfile.marketing',
        'next.config.mjs',
        'package.json',
        'pnpm-lock.yaml',
        'scripts/gcp/activate-tested-public-revision.mjs',
        'public/**',
        'content/**',
        'config/**',
        'pnpm-workspace.yaml',
        'tsconfig.json',
        'tsconfig.*.json',
        '.dockerignore',
        'apps/admin/package.json',
        'apps/lms/package.json',
        'scripts/stamp-sw.mjs',
        'scripts/verify-portal-production-contracts.mjs',
        'scripts/gcp/resolve-main-release*',
      ]
  workflow_dispatch:
    inputs:
      requested_sha:
        description: Exact main commit requested by a push dispatch
        required: false
        type: string
permissions:
  actions: write
  contents: read
  id-token: write
jobs:
  dispatch:
    if: vars.GOOGLE_RELEASE_HOLD != 'true' && (github.event_name == 'push')
    concurrency:
      group: google-store-dispatch-main
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch through approved Google identity event
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          [[ "$latest" =~ ^[a-f0-9]{40}$ ]]
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-google-store-runtime.yml/dispatches" -f ref=main -f "inputs[requested_sha]=$latest"
  validate:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.release.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Resolve current main or hand off superseded release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ inputs.requested_sha }}
          RELEASE_WORKFLOW: deploy-google-store-runtime.yml
        run: |
          node --test scripts/gcp/resolve-main-release.test.mjs
          node scripts/gcp/resolve-main-release.mjs
  build-store:
    name: Build and upload Store image
    outputs:
      digest: ${{ steps.upload.outputs.digest }}
    needs: validate
    concurrency:
      group: google-store-build-main
      # Finish the active tested release; queue the latest main update.
      cancel-in-progress: false
      queue: max
    if: vars.GOOGLE_RELEASE_HOLD != 'true' && (needs.validate.outputs.ready == 'true')
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 120
    env:
      COMPONENT: store
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Reject superseded Store requests before building
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_WORKFLOW: deploy-google-store-runtime.yml
        run: node scripts/gcp/prune-web-release-requests.mjs --assert-latest
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.2 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Typecheck shared application before Docker build
        run: |
          node scripts/run-bounded-build.mjs -- pnpm install --frozen-lockfile --strict-peer-dependencies=false
          pnpm run typecheck:marketing
      - name: Verify Store and Marketing identity contracts
        run: node --experimental-strip-types --test scripts/gcp/public-runtime-service.test.mjs scripts/gcp/verify-public-health.test.mjs scripts/gcp/verify-runtime-readiness.test.mjs scripts/gcp/preflight-web-rollout.test.mjs
      - name: Verify rejected rollout leaves no phantom candidate
        run: python3 scripts/gcp/test_store_preflight_admission.py
      - name: Verify independent build boundary
        run: node --test scripts/gcp/admin-build-boundary.test.mjs
      - name: Verify automatic container memory policy
        run: node scripts/check-build-memory-policy.mjs --source-only
      - name: Build shared commerce application for Store
        run: |
          set -euo pipefail
          docker build -f Dockerfile.marketing -t "elevate-store:$GITHUB_SHA" \
            --build-arg APPLICATION_SERVICE=store \
            --build-arg "NF_GIT_SHA=$GITHUB_SHA" \
            --build-arg "BUILD_TIMESTAMP=$(date -u +%FT%TZ)" \
            --build-arg NEXT_PUBLIC_SUPABASE_URL --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY .
      - name: Test actual Store container identity and health routing
        timeout-minutes: 5
        run: node scripts/gcp/smoke-marketing-container.mjs
      - name: Refresh Google credentials after build
        uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        with: { skip_install: true }
      - name: Verify project billing and empty upload admission before uploading
        run: node scripts/gcp/preflight-billing.mjs
      - name: Upload tested Store image
        id: upload
        run: |
          set -euo pipefail
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
          IMAGE="us-central1-docker.pkg.dev/elegant-racer-299721/elevate/store:$GITHUB_SHA"
          docker tag "elevate-store:$GITHUB_SHA" "$IMAGE"
          docker push "$IMAGE"
          DIGEST="$(gcloud artifacts docker images describe "$IMAGE" --project=elegant-racer-299721 --format='value(image_summary.digest)')"
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
  deploy:
    name: Deploy and verify Store on Google
    needs: [validate, build-store]
    concurrency:
      group: google-runtime-us-central1
      # Finish the active tested release; queue the latest main update.
      cancel-in-progress: false
      queue: max
    if: vars.GOOGLE_RELEASE_HOLD != 'true' && (needs.validate.outputs.ready == 'true')
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 120
    env:
      IMAGE_DIGEST: ${{ needs.build-store.outputs.digest }}
      COMPONENT: store
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Authenticate immutable image rollout
        uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        with: { skip_install: true }
      - name: Admit the tested image without reverting a newer rollout
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_WORKFLOW: deploy-google-store-runtime.yml
        run: node scripts/gcp/prune-web-release-requests.mjs --assert-tested-web-rollout
      - name: Verify rollout SDK and billing admission
        run: |
          node scripts/gcp/verify-sdk.mjs
          node scripts/gcp/preflight-billing.mjs
      - name: Deploy Store with HTTP probes and idle scale-to-zero
        id: deploy
        timeout-minutes: 15
        run: |
          set -euo pipefail
          IMAGE="us-central1-docker.pkg.dev/elegant-racer-299721/elevate/store"
          DIGEST="$(gcloud artifacts docker images describe "$IMAGE:$GITHUB_SHA" --project=elegant-racer-299721 --format='value(image_summary.digest)')"
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          test "$DIGEST" = "$IMAGE_DIGEST"
          SUFFIX="r${GITHUB_SHA:0:8}-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          CANDIDATE_SERVICE=elevate-store-migration node scripts/gcp/cleanup-unused-candidate-tags.mjs
          CANDIDATE_SERVICE=elevate-store-migration CANDIDATE_CPU=4 CANDIDATE_MEMORY=8Gi node scripts/gcp/preflight-web-rollout.mjs
          echo "revision=elevate-store-migration-$SUFFIX" >> "$GITHUB_OUTPUT"
          gcloud run services update elevate-store-migration --project=elegant-racer-299721 --region=us-central1 \
            --image="$IMAGE@$DIGEST" --revision-suffix="$SUFFIX" --no-traffic --execution-environment=gen2 \
            --no-cpu-boost --update-env-vars=STORE_ONLY_RUNTIME=true --cpu=4 --memory=8Gi --min=0 --min-instances=0 --max-instances=1 \
            --startup-probe='httpGet.path=/api/ping,httpGet.port=3000,failureThreshold=24,periodSeconds=5,timeoutSeconds=5' \
            --liveness-probe='httpGet.path=/api/ping,httpGet.port=3000,failureThreshold=3,periodSeconds=30,timeoutSeconds=5' --quiet
      - name: Verify and activate the exact Store candidate
        env:
          CANDIDATE_SERVICE: elevate-store-migration
          CANDIDATE_REVISION: ${{ steps.deploy.outputs.revision }}
          IMAGE_SHA: ${{ github.sha }}
        run: |
          node --test scripts/test-public-revision-activation.mjs scripts/gcp/store-rollout-diagnostics.test.mjs
          node scripts/gcp/activate-tested-public-revision.mjs
      - name: Verify Store identity, dependencies, storefront and traffic
        timeout-minutes: 5
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          const base='https://elevate-store-migration-aabnh2y32a-uc.a.run.app';
          for(let sample=0;sample<3;sample++) {
            for(const path of ['/api/ping','/api/ready','/api/health','/api/version']) {
              const r=await fetch(base+path,{signal:AbortSignal.timeout(20000)});
              const b=await r.json();
              console.log(JSON.stringify({path,status:r.status,service:b.service,commit:b.commit||b.commitSha,healthy:b.healthy,ready:b.ready}));
              assert.equal(r.status,200);assert.equal(b.service,'store');
              assert.equal(b.commit||b.commitSha,process.env.GITHUB_SHA);
              if(path==='/api/health') assert.ok(b.healthy&&b.dependencies?.supabase?.ok);
              if(path==='/api/ready') assert.ok(b.ready);
            }
          }
          const page=await fetch(base+'/store',{signal:AbortSignal.timeout(30000)});
          assert.equal(page.status,200);
          const service=JSON.parse(execFileSync('gcloud',['run','services','describe','elevate-store-migration','--project=elegant-racer-299721','--region=us-central1','--format=json'],{encoding:'utf8',timeout:20000}));
          const latest=service.status.latestReadyRevisionName;
          assert.equal((service.status.traffic||[]).filter(x=>x.revisionName===latest).reduce((n,x)=>n+Number(x.percent||0),0),100);
          console.log(JSON.stringify({revision:latest,traffic:service.status.traffic,storefrontStatus:page.status}));
          const marketing=await fetch('https://www.elevateforhumanity.org/api/health',{signal:AbortSignal.timeout(20000)});
          const health=await marketing.json();assert.equal(marketing.status,200);assert.equal(health.service,'marketing');assert.ok(health.healthy);
          const publicStore=await fetch('https://store.elevateforhumanity.org/api/health',{signal:AbortSignal.timeout(30000)});
          const publicBody=await publicStore.json();
          console.log(JSON.stringify({publicStoreStatus:publicStore.status,service:publicBody.service,commit:publicBody.commit}));
          assert.equal(publicStore.status,200);assert.equal(publicBody.service,'store');assert.equal(publicBody.commit,process.env.GITHUB_SHA);
          NODE
      - name: Collect exact failed Store revision logs
        if: ${{ failure() && steps.deploy.outputs.revision != '' }}
        timeout-minutes: 3
        env:
          FAILED_SERVICE: elevate-store-migration
          FAILED_REVISION: ${{ steps.deploy.outputs.revision }}
        run: node scripts/gcp/collect-marketing-revision-diagnostics.mjs
      - uses: actions/upload-artifact@v4
        if: ${{ failure() && steps.deploy.outputs.revision != '' }}
        with:
          name: store-revision-${{ github.run_id }}
          path: deployment-diagnostics/marketing-revision.json
          if-no-files-found: warn
  acceptance:
    needs: deploy
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && needs.deploy.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Explicitly hand the verified Store release to production acceptance
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPTANCE_COMPONENT: store
          ACCEPTANCE_SHA: ${{ github.sha }}
          ACCEPTANCE_RUN_ID: ${{ github.run_id }}
        run: |
          node --test scripts/gcp/production-acceptance.test.mjs
          node scripts/gcp/production-acceptance.mjs dispatch
