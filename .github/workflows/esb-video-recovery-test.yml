name: ESB Video Recovery Test

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  trigger:
    if: startsWith(github.event.issue.title, '[ESB VIDEO TEST]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ADMIN_URL: ${{ secrets.ADMIN_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Trigger canonical Course Builder video worker
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$CRON_SECRET"
          if [ -z "$ADMIN_URL" ]; then ADMIN_URL='https://admin.elevateforhumanity.org'; fi
          status=$(curl -sS --max-time 45 -o /tmp/result.json -w '%{http_code}' \
            -X POST "$ADMIN_URL/api/internal/videos/process-queue" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H 'Content-Type: application/json' \
            --data '{"courseId":"398acfef-5d20-4c1d-b23a-6982dc05a250","maxJobs":1}' || true)
          echo "$status" >/tmp/status.txt
          cat /tmp/result.json || true
          case "$status" in 200|202) ;; *) exit 1;; esac
      - name: Post result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            let status='unknown', body='';
            try { status=fs.readFileSync('/tmp/status.txt','utf8').trim(); } catch {}
            try { body=fs.readFileSync('/tmp/result.json','utf8'); } catch {}
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:`ESB video worker trigger HTTP ${status}\n\n\`\`\`json\n${body.slice(0,12000)}\n\`\`\``});
