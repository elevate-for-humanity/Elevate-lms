name: Canonical Docker + Northflank Gate

on:
  workflow_dispatch:
  push:
    branches:
      - 'release/production-recovery-*'
    paths:
      - 'Dockerfile.marketing'
      - 'Dockerfile.northflank-lms'
      - 'Dockerfile.northflank-admin'
      - 'apps/marketing/**'
      - 'apps/admin/**'
      - 'apps/lms/**'
      - 'packages/**'
      - 'scripts/northflank/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/consolidation-docker-northflank.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'Dockerfile.marketing'
      - 'Dockerfile.northflank-lms'
      - 'Dockerfile.northflank-admin'
      - 'apps/marketing/**'
      - 'apps/admin/**'
      - 'apps/lms/**'
      - 'packages/**'
      - 'scripts/northflank/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/consolidation-docker-northflank.yml'

permissions:
  contents: read

concurrency:
  group: canonical-docker-northflank-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docker-northflank:
    name: ${{ matrix.service }} canonical container
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: marketing
            dockerfile: Dockerfile.marketing
          - service: lms
            dockerfile: Dockerfile.northflank-lms
          - service: admin
            dockerfile: Dockerfile.northflank-admin
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      RUNTIME_PORT: '3000'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Recovery hardening regression check
        run: node scripts/verify-recovery-gate-hardening.mjs
      - name: Validate required build configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${NEXT_PUBLIC_SUPABASE_URL}" || { echo 'NEXT_PUBLIC_SUPABASE_URL is not configured'; exit 1; }
          test -n "${NEXT_PUBLIC_SUPABASE_ANON_KEY}" || { echo 'NEXT_PUBLIC_SUPABASE_ANON_KEY is not configured'; exit 1; }
      - name: Build canonical production container
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            -f "${{ matrix.dockerfile }}" \
            --build-arg NEXT_PUBLIC_SITE_URL=https://www.elevateforhumanity.org \
            --build-arg NEXT_PUBLIC_APP_URL=https://app.elevateforhumanity.org \
            --build-arg NEXT_PUBLIC_ADMIN_URL=https://admin.elevateforhumanity.org \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="${NEXT_PUBLIC_SUPABASE_URL}" \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="${NEXT_PUBLIC_SUPABASE_ANON_KEY}" \
            --build-arg NF_GIT_SHA="${GITHUB_SHA}" \
            --build-arg GITHUB_SHA="${GITHUB_SHA}" \
            --build-arg GIT_SHA="${GITHUB_SHA}" \
            --build-arg NEXT_PUBLIC_GIT_SHA="${GITHUB_SHA}" \
            --build-arg BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t "elevate-${{ matrix.service }}:${GITHUB_SHA}" .
      - name: Verify canonical port and health endpoints
        shell: bash
        run: |
          set -euo pipefail
          name="elevate-${{ matrix.service }}-canonical"
          docker run -d \
            --name "$name" \
            -e PORT="$RUNTIME_PORT" \
            -e HOSTNAME=0.0.0.0 \
            -e NEXT_PUBLIC_SUPABASE_URL="${NEXT_PUBLIC_SUPABASE_URL}" \
            -e NEXT_PUBLIC_SUPABASE_ANON_KEY="${NEXT_PUBLIC_SUPABASE_ANON_KEY}" \
            -p "$RUNTIME_PORT:$RUNTIME_PORT" \
            "elevate-${{ matrix.service }}:${GITHUB_SHA}"
          trap 'docker logs "$name" || true; docker rm -f "$name" || true' EXIT
          for attempt in $(seq 1 30); do
            ping_status=$(curl -sS -o /tmp/ping.json -w '%{http_code}' "http://127.0.0.1:${RUNTIME_PORT}/api/ping" || true)
            health_status=$(curl -sS -o /tmp/health.json -w '%{http_code}' "http://127.0.0.1:${RUNTIME_PORT}/api/health" || true)
            if [ "$ping_status" = "200" ] && [ "$health_status" = "200" ]; then
              cat /tmp/ping.json
              cat /tmp/health.json
              docker rm -f "$name" >/dev/null
              trap - EXIT
              exit 0
            fi
            sleep 5
          done
          echo "${{ matrix.service }} failed canonical health on PORT=${RUNTIME_PORT}"
          docker logs "$name"
          exit 1
