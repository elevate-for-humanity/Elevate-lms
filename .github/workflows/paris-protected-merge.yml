name: PARIS protected merge
# Merges a validated PARIS repair under the actual protected-branch policy.
# A positive review requirement retains the independent verifier identity;
# an explicit zero-review policy never causes an approval submission.
# It only merges when the exact validated head still satisfies the protected
# branch policy (required check + no outstanding authorized change request).
# The Admin authority remains the sole owner of repair state.
on:
  workflow_dispatch:
    inputs:
      repair_id:
        description: Durable PARIS repair ID
        required: true
        type: string
      pr_number:
        description: Pull request number to merge
        required: true
        type: string
      expected_head_sha:
        description: Exact validated PR head SHA that must be merged
        required: true
        type: string
      check_only:
        description: Verify exact-head readiness without GitHub writes
        required: false
        default: false
        type: boolean
permissions:
  contents: write
  pull-requests: write
  id-token: write
  actions: write
concurrency:
  # Serialize merges so two repairs cannot race protected main.
  group: paris-protected-merge
  cancel-in-progress: false
jobs:
  merge:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Obtain short-lived PARIS workflow identity
        env:
          AUDIENCE: elevate-paris-code-repair
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          (async()=>{
            const url=new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
            url.searchParams.set('audience',process.env.AUDIENCE);
            const response=await fetch(url,{headers:{Authorization:'Bearer '+process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}});
            if(!response.ok)throw Error('Workflow identity issuance failed: HTTP '+response.status);
            const token=(await response.json()).value;
            if(!token || token.split('.').length!==3)throw Error('Invalid workflow identity');
            process.stdout.write('::add-mask::'+token+'\n');
            fs.appendFileSync(process.env.GITHUB_ENV,'PARIS_ID_TOKEN='+token+'\n');
          })().catch(err=>{console.error(err.message);process.exitCode=1});
          NODE
      - name: Verify policy and merge the validated repair PR
        env:
          PARIS_VERIFIER_TOKEN: ${{ secrets.PARIS_VERIFIER_TOKEN }}
          PARIS_POLICY_TOKEN: ${{ secrets.PARIS_POLICY_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          REPAIR_ID: ${{ inputs.repair_id }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          REPAIR_REPOSITORY: ${{ github.repository }}
          ADMIN_URL: https://admin.elevateforhumanity.org
          PARIS_MERGE_CHECK_ONLY: ${{ inputs.check_only }}
        run: node scripts/paris-protected-merge.mjs
