name: Portal Media Dedupe

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  dedupe:
    if: ${{ github.head_ref == 'fix/portal-contract-recovery' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Force replace duplicate route media
        run: node scripts/force-replace-duplicate-media.mjs

      - name: Commit replacements
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No media replacements required."
            exit 0
          fi
          git config user.name "elevate-autopilot"
          git config user.email "actions@users.noreply.github.com"
          git add apps components docs/audits
          git commit -m "fix(media): force unique route hero assets"
          git push origin HEAD:${{ github.head_ref }}
