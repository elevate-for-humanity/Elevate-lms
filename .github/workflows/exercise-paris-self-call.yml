name: Verify PARIS greeting with one authorized business self-call
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Inspect a prior self-call, or place exactly one new greeting test
        type: choice
        options: [inspect, greeting-call]
        default: inspect
      inspect_call_sid:
        description: Prior self-call SID to inspect; required in inspect mode
        type: string
        default: ''
permissions: {contents: read, id-token: write}
concurrency:
  group: google-pbx-infrastructure
  cancel-in-progress: false
jobs:
  self-call:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test scripts/gcp/exercise-paris-self-call.test.mjs
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        with: {skip_install: true}
      - name: Verify current PARIS configuration and real speech readiness
        run: gcloud compute ssh elevate-pbx --project=elegant-racer-299721 --zone=us-central1-a --quiet --command='sudo python3 -' < scripts/gcp/audit-live-phone-configuration.py
      - name: Place one bounded self-call and verify saved greeting and a spoken response
        env:
          AUTHORIZED_SELF_TEST_DID: '+14632401404'
          SELF_CALL_MODE: '${{ inputs.mode }}'
          INSPECT_SELF_CALL_SID: '${{ inputs.inspect_call_sid }}'
        run: node scripts/gcp/exercise-paris-self-call.mjs
      - name: Inspect redacted PBX media and gateway failure signals
        if: always()
        run: gcloud compute ssh elevate-pbx --project=elegant-racer-299721 --zone=us-central1-a --quiet --command='sudo python3 -' < scripts/gcp/audit-paris-call-signals.py
