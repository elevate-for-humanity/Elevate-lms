name: Deploy Google Marketing on trigger

# Production is an explicitly approved release, never a side effect of each push.
# Automatically deploy only after the full release has been validated.
on:
  push:
    branches: [main]
    paths:
      - 'apps/marketing/**'
      - 'components/**'
      - 'lib/marketing/**'
      - 'lib/programs/**'
      - 'lib/apprenticeship-programs/**'
      - 'lib/navigation/**'
      - 'public/images/**'
      - 'content/heroBanners.ts'
      - 'lib/video/registry.ts'
      - 'public/data/hero-banners.json'
      - 'config/paris-release-source.json'
      - 'Dockerfile.marketing'
      - 'next.config.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-google-marketing-trigger.yml'
      - '.deploy-google-marketing'
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  id-token: write
  deployments: write

concurrency:
  group: google-runtime-operations
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'schedule' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 120
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify immutable main revision
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=50 origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Configure pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies and validate before expensive build
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --strict-peer-dependencies=false
          pnpm exec tsc --noEmit --project apps/marketing/tsconfig.json
          node scripts/audit-geo-claims.mjs
          node scripts/check-public-claims.mjs
          node scripts/check-public-address-integrity.mjs

      - name: Verify PARIS source bundle and private API behavior
        run: |
          set -euo pipefail
          node scripts/verify-paris-release-source.mjs
          node scripts/test-tax-calculation-failures.mjs apps/marketing/app/api/tax/returns/calculate/route.ts
          node scripts/test-tax-w2-validation.mjs apps/marketing/app/api/tax/w2/confirm/route.ts

      - name: Preflight homepage release content and image assets
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {readFileSync,existsSync} from 'node:fs';
          const page=readFileSync('apps/marketing/app/page.tsx','utf8');
          const cards=readFileSync('components/home/HomeCareerPathways.tsx','utf8');
          const shops=readFileSync('components/home/HomeFeaturedHostShop.tsx','utf8');
          const trust=readFileSync('components/home/HomeTrustBar.tsx','utf8');
          const required=['Esthetics Apprenticeship','Nail Technician Apprenticeship','Find or become a Host Shop'];
          for(const name of required) if(!shops.includes(name)) throw new Error('Missing homepage content: '+name);
          for(const name of ['HVAC Technician','CDL Training','Bookkeeping','Business & Entrepreneurship']) if(!cards.includes(name)) throw new Error('Missing program: '+name);
          if(page.includes('<HomeNetworks') || trust.includes('Workforce systems and public-sector alignment')) throw new Error('Retired homepage section still enabled');
          const imagePattern = new RegExp("image: '(/images/[^']+)'", 'g');
          for(const src of [...cards.matchAll(imagePattern),...shops.matchAll(imagePattern)]) {
            if(!existsSync('public'+src[1])) throw new Error('Missing image: '+src[1]);
          }
          NODE

      - name: Refuse active course execution
        uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v3
        with:
          skip_install: true

      - name: Guard shared regional capacity
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { assertNoActiveExecutions } from './scripts/gcp/execute-course-job.mjs';
          const executions=JSON.parse(execFileSync('gcloud',['run','jobs','executions','list','--job=elevate-course-builder','--project=elegant-racer-299721','--region=us-central1','--format=json'],{encoding:'utf8',stdio:['ignore','pipe','pipe']}));
          assertNoActiveExecutions(executions);
          NODE

      - name: Build Marketing image
        shell: bash
        run: |
          set -euo pipefail
          test "$NEXT_PUBLIC_SUPABASE_URL" = "https://cuxzzpsyufcewtmicszk.supabase.co"
          test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY"
          docker build -f Dockerfile.marketing -t "elevate-marketing:$GITHUB_SHA" \
            --build-arg "NF_GIT_SHA=$GITHUB_SHA" \
            --build-arg "BUILD_TIMESTAMP=$(date -u +%FT%TZ)" \
            --build-arg NEXT_PUBLIC_SUPABASE_URL \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY .

      - name: Push Marketing image
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
          IMAGE="us-central1-docker.pkg.dev/elegant-racer-299721/elevate/marketing:$GITHUB_SHA"
          docker tag "elevate-marketing:$GITHUB_SHA" "$IMAGE"
          docker push "$IMAGE"

      - name: Deploy exact image to Google Cloud Run
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="us-central1-docker.pkg.dev/elegant-racer-299721/elevate/marketing"
          DIGEST="$(gcloud artifacts docker images describe "$IMAGE:$GITHUB_SHA" --project=elegant-racer-299721 --format='value(image_summary.digest)')"
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          gcloud run services update elevate-marketing-migration \
            --project=elegant-racer-299721 \
            --region=us-central1 \
            --image="$IMAGE@$DIGEST" \
            --quiet

      - name: Verify live Marketing revision
        shell: bash
        run: |
          set -euo pipefail
          URL="https://elevate-marketing-migration-aabnh2y32a-uc.a.run.app"
          for i in $(seq 1 24); do
            code="$(curl -sS --max-time 15 -o /tmp/health.json -w '%{http_code}' "$URL/api/health" || true)"
            if [ "$code" = "200" ] && grep -q '"healthy":true' /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 5
          done
          cat /tmp/health.json || true
          exit 1

      - name: Verify public website serves exact commit and requested homepage
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const root='https://www.elevateforhumanity.org';
          const required=['Esthetics Apprenticeship','Nail Technician Apprenticeship','HVAC Technician','CDL Training','Bookkeeping','Business & Entrepreneurship','Find or become a Host Shop'];
          const forbidden=['Workforce systems and public-sector alignment'];
          const deadline=Date.now()+180000;
          let last='';
          while(Date.now()<deadline) {
            try {
              const version=await fetch(root+'/api/version?release='+process.env.GITHUB_SHA,{cache:'no-store',signal:AbortSignal.timeout(15000)});
              const data=version.ok?await version.json():{};
              const sha=data.commitSha||data.commit||data.sha||'';
              const page=await fetch(root+'/?release='+process.env.GITHUB_SHA,{cache:'no-store',signal:AbortSignal.timeout(20000)});
              const html=await page.text();
              const normalizedHtml=html.replace(/&amp;/g,'&').replace(/&#0*38;/g,'&').replace(/&#x0*26;/gi,'&');
              const missing=required.filter(t=>!normalizedHtml.includes(t));
              const present=forbidden.filter(t=>html.includes(t));
              last=JSON.stringify({versionStatus:version.status,homepageStatus:page.status,sha,expected:process.env.GITHUB_SHA,missing,unwanted:present});
              console.log(last);
              if(version.ok && sha===process.env.GITHUB_SHA && page.ok && !missing.length && !present.length) {
                const paths=['/programs/esthetician-apprenticeship','/programs/barber-apprenticeship','/barber-beauty-network','/jobs','/partners/host-shops'];
                const results=await Promise.all(paths.map(async path => {
                  const response=await fetch(root+path+'?release='+process.env.GITHUB_SHA,{cache:'no-store',signal:AbortSignal.timeout(20000)});
                  return {path,status:response.status,html:await response.text()};
                }));
                for(const result of results) if(result.status!==200) throw new Error('Production route failed: '+result.path+' HTTP '+result.status);
                const esthetics=results.find(x=>x.path.includes('esthetician'))?.html||'';
                const barber=results.find(x=>x.path.includes('barber-apprenticeship'))?.html||'';
                for(const expected of ['$6,000','$5,400','OCT300','25 hrs/week']) {
                  if(!esthetics.includes(expected)) throw new Error('Missing esthetics production requirement: '+expected);
                }
                if(esthetics.includes('25–25 hrs/week')||esthetics.includes('25-25 hrs/week'))
                  throw new Error('Esthetics still shows duplicated weekly hours');
                if(barber.includes('50OFFOCT'))
                  throw new Error('Retired 50OFFOCT coupon is still published');
                if(!barber.includes('OCT300'))
                  throw new Error('Barber OCT300 coupon missing');
                console.log('Public content acceptance passed; checkout payment enforcement requires separate controlled test.');
                process.exit(0);
              }
            } catch(e) { last=String(e);console.log(last); }
            await new Promise(resolve=>setTimeout(resolve,10000));
          }
          throw new Error('Public website failed exact-revision/homepage acceptance: '+last);
          NODE

      - name: Publish verified live deployment status
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/$GITHUB_REPOSITORY/deployments"
          DEPLOYMENT="$(curl --fail-with-body -sS -X POST "$API" \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            -d "$(node -e 'console.log(JSON.stringify({ref:process.env.GITHUB_SHA,environment:"production-google-marketing",auto_merge:false,required_contexts:[],description:"Verified Google Cloud Run and public homepage"}))')")"
          ID="$(printf '%s' "$DEPLOYMENT" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).id||""))')"
          test -n "$ID"
          curl --fail-with-body -sS -X POST "$API/$ID/statuses" \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            -d '{"state":"success","environment_url":"https://www.elevateforhumanity.org","description":"Exact revision and homepage acceptance verified"}'
          {
            echo "## Google Marketing — VERIFIED LIVE"
            echo "Commit: \`$GITHUB_SHA\`"
            echo "Production: https://www.elevateforhumanity.org"
            echo "Cloud Run service: elevate-marketing-migration (us-central1)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify live PARIS entry and authenticated tax boundaries
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const root='https://www.elevateforhumanity.org';
          for(const path of ['/tax','/tax-software','/tax-software/features','/tax-software/pricing','/tax-software/about','/tax-software/bank-products','/tax-software/contact','/tax-software/professional','/tax-software/demo','/tax-software/login','/tax-software/self-file','/tax-software/self-file/return','/tax-software/self-file/w2/confirm']) {
            const res=await fetch(root+path,{cache:'no-store',signal:AbortSignal.timeout(20000)});
            assert.equal(res.status,200,path+' must be available');
          }
          const home=await (await fetch(root+'/',{cache:'no-store'})).text();
          assert.ok(home.includes('href="/tax"'),'Homepage must link to the tax page');
          const tax=await (await fetch(root+'/tax',{cache:'no-store'})).text();
          assert.ok(tax.includes('PARIS ASSISTANT'),'Tax landing page must render PARIS');
          for(const [path,method] of [['/api/tax/returns','GET'],['/api/tax/interview','GET'],['/api/tax/returns','POST'],['/api/tax/w2/confirm','POST'],['/api/tax/returns/calculate','POST']]) {
            const res=await fetch(root+path,{method,headers:method==='POST'?{'content-type':'application/json'}:{},...(method==='POST'?{body:'{}'}:{}),signal:AbortSignal.timeout(20000)});
            assert.equal(res.status,401,path+' must require authentication');
          }
          console.log('PARIS public pages, homepage link and private API boundaries verified.');
          NODE

      - name: Publish failed release notice
        if: ${{ failure() }}
        shell: bash
        run: |
          {
            echo "## Google Marketing — NOT VERIFIED LIVE"
            echo "Attempted commit: \`$GITHUB_SHA\`"
            echo "Deployment is NOT confirmed. Inspect the failed job; do not mark this release successful."
            echo "The previously serving revision may remain active; verify Cloud Run traffic separately."
          } >> "$GITHUB_STEP_SUMMARY"
