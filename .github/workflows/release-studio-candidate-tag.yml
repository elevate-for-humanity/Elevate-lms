name: Release unused Studio verification tag
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Exact non-serving Studio candidate revision whose temporary alias may be removed
        type: string
        required: true
permissions:
  contents: read
  id-token: write
jobs:
  cleanup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 5
    concurrency:
      group: google-runtime-us-central1
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: node --test scripts/gcp/release-studio-candidate-tag.test.mjs
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        with: {skip_install: true}
      - name: Remove only the exact unused verification alias and verify preserved production traffic
        env:
          STUDIO_CANDIDATE_REVISION: ${{ inputs.revision }}
        run: node scripts/gcp/release-studio-candidate-tag.mjs
