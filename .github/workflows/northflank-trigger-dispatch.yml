name: Dispatch Northflank Production Deploy

on:
  push:
    branches: [main]
    paths:
      - '.northflank-trigger'

permissions:
  actions: write
  contents: read

# A newer trigger supersedes an older trigger. The service-specific deployment
# workflows also cancel superseded runs and always resolve their own exact
# github.sha from the current main ref.
concurrency:
  group: northflank-trigger-dispatch
  cancel-in-progress: true

jobs:
  dispatch:
    name: Dispatch requested production services
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trigger request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse and validate deployment request
        id: request
        shell: bash
        run: |
          set -Eeuo pipefail

          REQUESTED_SHA="$(sed -n 's/^merge_sha=//p' .northflank-trigger | tail -n1 | tr -d '[:space:]')"
          SERVICES="$(sed -n 's/^services=//p' .northflank-trigger | tail -n1 | tr -d '[:space:]')"

          if [[ ! "$REQUESTED_SHA" =~ ^[a-fA-F0-9]{7,40}$ ]]; then
            echo "::error::Invalid or missing merge_sha in .northflank-trigger"
            exit 1
          fi

          git fetch origin main --depth=100
          RESOLVED_SHA="$(git rev-parse "$REQUESTED_SHA^{commit}" 2>/dev/null || true)"
          CURRENT_MAIN="$(git rev-parse origin/main)"
          if [[ -z "$RESOLVED_SHA" ]]; then
            echo "::error::Requested SHA cannot be resolved in repository history: $REQUESTED_SHA"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$RESOLVED_SHA" "$CURRENT_MAIN"; then
            echo "::error::Requested production SHA is not contained in current main: $RESOLVED_SHA"
            exit 1
          fi

          if [[ -z "$SERVICES" ]]; then
            echo "::error::No services requested in .northflank-trigger"
            exit 1
          fi
          IFS=',' read -ra SERVICE_LIST <<< "$SERVICES"
          for service in "${SERVICE_LIST[@]}"; do
            case "$service" in
              marketing|admin|lms|store|all) ;;
              *) echo "::error::Unsupported service: $service"; exit 1 ;;
            esac
          done

          echo "services=$SERVICES" >> "$GITHUB_OUTPUT"
          echo "current_main=$CURRENT_MAIN" >> "$GITHUB_OUTPUT"
          echo "Validated trigger request $SERVICES from $RESOLVED_SHA; production will converge on current main $CURRENT_MAIN"

      - name: Dispatch canonical service production workflows
        env:
          GH_TOKEN: ${{ github.token }}
          SERVICES: ${{ steps.request.outputs.services }}
        shell: bash
        run: |
          set -Eeuo pipefail

          dispatch_service() {
            local service="$1"
            local workflow
            case "$service" in
              marketing) workflow='deploy-marketing.yml' ;;
              admin) workflow='deploy-admin.yml' ;;
              lms) workflow='deploy-lms.yml' ;;
              store) workflow='deploy-store.yml' ;;
              *) echo "::error::Unsupported service: $service"; exit 1 ;;
            esac

            gh workflow run "$workflow" \
              --repo "${{ github.repository }}" \
              --ref main
            echo "Dispatched $workflow from current main"
          }

          if [[ "$SERVICES" == "all" ]]; then
            dispatch_service marketing
            dispatch_service admin
            dispatch_service lms
            dispatch_service store
          else
            IFS=',' read -ra SERVICE_LIST <<< "$SERVICES"
            for service in "${SERVICE_LIST[@]}"; do
              dispatch_service "$service"
            done
          fi
