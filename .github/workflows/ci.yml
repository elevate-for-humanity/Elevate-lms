name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, work]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # HARD BLOCKING GATE. Root tsconfig intentionally does not own the three
      # standalone Next applications, so each production project is checked
      # explicitly and sequentially to keep peak memory bounded.
      - name: TypeScript — shared/root
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
        run: pnpm exec tsc --noEmit -p tsconfig.json

      - name: TypeScript — Marketing
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
        run: pnpm exec tsc --noEmit -p apps/marketing/tsconfig.json

      - name: TypeScript — LMS
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
        run: pnpm exec tsc --noEmit -p apps/lms/tsconfig.json

      - name: TypeScript — Admin
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
        run: pnpm exec tsc --noEmit -p apps/admin/tsconfig.json

      - name: Lint
        run: pnpm lint
