name: Test Northflank apex verification

on:
  push:
    branches:
      - diagnose/northflank-apex-20260922
    paths:
      - '.github/workflows/test-northflank-apex-autoverify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
      NORTHFLANK_TEAM_ID: ${{ secrets.NORTHFLANK_TEAM_ID || 'elevates-team' }}
    steps:
      - name: Ask Northflank to verify apex
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NORTHFLANK_API_TOKEN"
          node <<'NODE'
          const base = 'https://api.northflank.com/v1';
          const token = process.env.NORTHFLANK_API_TOKEN;
          const team = process.env.NORTHFLANK_TEAM_ID;
          const domain = 'elevateforhumanity.org';
          const root = `/teams/${team}/domains/${encodeURIComponent(domain)}/subdomains`;

          async function request(label, path, init = {}) {
            const response = await fetch(base + path, {
              ...init,
              headers: {
                Authorization: `Bearer ${token}`,
                'Content-Type': 'application/json',
                ...(init.headers || {}),
              },
            });
            const text = await response.text();
            let body;
            try {
              body = text ? JSON.parse(text) : {};
            } catch {
              body = { raw: text.slice(0, 500) };
            }
            console.log(label, JSON.stringify({ status: response.status, body }, null, 2));
            return { ok: response.ok, status: response.status, body };
          }

          await request('before', `${root}/%40`);
          const verify = await request('verify', `${root}/%40/verify`, { method: 'POST' });
          const after = await request('after', `${root}/%40`);
          const data = after.body?.data ?? after.body;
          if (!verify.ok || data.verified !== true) {
            throw new Error(
              `Apex remains unverified (verify HTTP ${verify.status}; verified=${data.verified})`,
            );
          }
          NODE
