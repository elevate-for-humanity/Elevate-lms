name: Dispatch queued Google course work
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: read
  id-token: write
concurrency:
  group: google-runtime-operations
  cancel-in-progress: false
jobs:
  dispatch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/gcp/dispatch-course-job.test.mjs scripts/gcp/execute-course-job.test.mjs
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Dispatch only queued work without overlapping executions
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if node scripts/gcp/dispatch-course-job.mjs; then exit 0; fi
            if [ "$attempt" = 5 ]; then exit 1; fi
            sleep $((attempt * 15))
          done
