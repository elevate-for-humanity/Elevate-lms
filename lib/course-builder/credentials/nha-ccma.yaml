# NHA Certified Clinical Medical Assistant (CCMA)
# https://www.nhanow.com/certifications/ccma

name: NHA Certified Clinical Medical Assistant (CCMA)
slug: nha-ccma
provider: National Healthcareer Association (NHA)
category: healthcare
type: certification
description: The CCMA certification validates the knowledge and skills of medical assistants in clinical and administrative tasks.

# Exam details
examSections:
  - name: Foundational Knowledge
    questions: 15
    passingScore: 65
    domainWeight: 10
    topics:
      - Medical terminology
      - Anatomy and physiology
      - Psychology
  - name: Administrative Duties
    questions: 35
    passingScore: 65
    domainWeight: 23
    topics:
      - Patient intake
      - Medical records
      - Scheduling
      - Insurance
      - Billing
  - name: Clinical Duties
    questions: 80
    passingScore: 65
    domainWeight: 53
    topics:
      - Vital signs
      - Patient preparation
      - Specimen collection
      - Point-of-care testing
      - Injections
      - EKG
      - Wound care
  - name: Communication
    questions: 20
    passingScore: 65
    domainWeight: 13
    topics:
      - Professionalism
      - Patient communication
      - Cultural competency
  - name: Law and Ethics
    questions: 10
    passingScore: 65
    domainWeight: 7
    topics:
      - HIPAA
      - Patient rights
      - Scope of practice

totalQuestions: 150
passingScore: 65
examFormat: "150 questions, 3 hours, computer-based testing"
examFrequency: "By appointment at Pearson VUE centers"
retakePolicy: "After 15 days, max 3 attempts per year"

# Validity
validityPeriod: "2 years"
renewalHours: 10
renewalFrequency: "Every 2 years (10 continuing education hours)"

# Prerequisites
minimumAge: 18
educationRequirement: "High school diploma or GED"
experienceRequirement: "Completion of MA program or 1 year work experience"

# Costs
examFee: "$155"
studyMaterialsFee: "$50-$200"

# Compliance
states:
  - ALL (varies by state)
federalRequirements:
  - "HIPAA"
  - "OSHA Bloodborne Pathogens"
wioaEligible: true
dolRegistered: false

# O*NET mapping
socCodes:
  - 31-9092.00  # Medical Assistants
careerPathway: "MA → Lead MA → Office Manager → Practice Manager"

# Elevate integration
availableOnElevate: true
courseSlug: medical-assistant
instructorAvatar: medical-instructor

# Credentials aligned
certifications:
  - name: BLS/CPR
    required: true
  - name: Phlebotomy
    recommended: true
  - name: EKG
    recommended: true
