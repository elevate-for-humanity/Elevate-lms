name: Build Registered Beauty Courses

on:
  push:
    branches: [main]
    paths:
      - 'scripts/course-factory/build-registered-beauty-courses.ts'
      - '.github/workflows/build-registered-beauty-courses.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: true
  NODE_ENV: production
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

jobs:
  build-and-certify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile --strict-peer-dependencies=false

      - name: Require production credentials
        shell: bash
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          if [ -z "$OPENAI_API_KEY" ] && [ -z "$GROQ_API_KEY" ] && [ -z "$GEMINI_API_KEY" ] && [ -z "$ANTHROPIC_API_KEY" ]; then
            echo 'At least one AI provider credential is required.'
            exit 1
          fi

      - name: Build canonical Esthetician and Nail courses
        run: pnpm tsx scripts/course-factory/build-registered-beauty-courses.ts

      - name: Verify one canonical course per occupation
        run: pnpm tsx scripts/audit-apprenticeship-architecture.ts
