name: Design Repair Verification
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'apps/**'
      - 'components/**'
      - 'styles/**'
      - 'scripts/visual/**'
      - 'scripts/audit-visual-layout.mjs'
      - 'scripts/verify-playwright-runtime.mjs'
      - 'tests/unit/playwright-ci-version-contract.test.ts'
      - 'scripts/audit-platform-media-duplicates.mjs'
      - 'tests/e2e/platform-design-repair.spec.ts'
      - 'tests/e2e/design-audit-public-pages.spec.ts'
      - 'playwright.design-repair.config.ts'
      - 'playwright.design-audit.config.ts'
      - 'docs/audits/design-repair-20261016/finding-dispositions.json'
      - '.github/workflows/design-repair-verification.yml'
permissions:
  contents: read
concurrency:
  group: design-repair-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  responsive-marketing:
    # Playwright 1.57.0 cannot install Chromium dependencies on Ubuntu 26.04.
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble@sha256:3bed4b1a12f2338642f3d8cba28e291deef3c66bd4a964bbeb3e57bbff511dbd
      options: --init --shm-size=1g
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:36871
      NEXT_PUBLIC_ADMIN_URL: https://admin.elevateforhumanity.org
      NEXT_PUBLIC_APP_URL: https://app.elevateforhumanity.org
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies=false
      - run: node --test scripts/visual/*.test.mjs
      - run: node scripts/verify-playwright-runtime.mjs chromium
      - run: pnpm exec playwright test --config playwright.design-repair.config.ts
      - name: Render original audit public pages at 320px
        run: pnpm exec playwright test --config playwright.design-audit.config.ts --project=320px
        env:
          DESIGN_AUDIT_EVIDENCE_DIR: artifacts/design-repair/original-public-mobile
      - name: Render original audit public pages at 1440px
        run: pnpm exec playwright test --config playwright.design-audit.config.ts --project=1440px
        env:
          DESIGN_AUDIT_EVIDENCE_DIR: artifacts/design-repair/original-public-desktop
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: design-repair-responsive-evidence
          path: |
            artifacts/design-repair/
            test-results/
          retention-days: 14
  learning-workspace:
    name: Learning workspace browser layout
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble@sha256:3bed4b1a12f2338642f3d8cba28e291deef3c66bd4a964bbeb3e57bbff511dbd
      options: --init --shm-size=1g
    defaults:
      run:
        shell: bash
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies=false
      - run: node scripts/verify-playwright-runtime.mjs chromium
      - run: node tests/browser/learning-workspace-layout.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: learning-workspace-browser-evidence
          path: artifacts/learning-workspace/
          retention-days: 14
