name: Diagnose LMS Runtime

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/diagnose-lms-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    env:
      NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
      NORTHFLANK_PROJECT_ID: ${{ secrets.NORTHFLANK_PROJECT_ID || 'elevate-platform' }}
      NORTHFLANK_LMS_SERVICE_ID: ${{ secrets.NORTHFLANK_LMS_SERVICE_ID || 'elevate-lms' }}
    steps:
      - name: Fetch service status and runtime logs
        shell: bash
        run: |
          set -Eeuo pipefail
          base="https://api.northflank.com/v1/projects/$NORTHFLANK_PROJECT_ID/services/$NORTHFLANK_LMS_SERVICE_ID"
          auth="Authorization: Bearer $NORTHFLANK_API_TOKEN"

          echo "=== SERVICE STATUS ==="
          curl -fsS -H "$auth" "$base" |
            jq '{id: (.data.id // .id), status: (.data.status // .status), deploymentStatus: (.data.deploymentStatus // .deploymentStatus), instances: (.data.deployment.instances // .deployment.instances), build: (.data.status.build // .status.build), deployment: (.data.status.deployment // .status.deployment)}'

          echo "=== CONTAINERS ==="
          curl -fsS -H "$auth" "$base/containers" |
            jq '(.data // .containers // .)'

          echo "=== RECENT RUNTIME LOGS ==="
          end_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          curl -fsS -G -H "$auth" "$base/logs"             --data-urlencode "type=runtime"             --data-urlencode "queryType=range"             --data-urlencode "endTime=$end_time"             --data-urlencode "duration=1800"             --data-urlencode "lineLimit=300"             --data-urlencode "direction=backward" |
            jq -r '(.data // .)[] | [.ts, .containerId, .log] | @tsv' |
            sed -E 's/((token|secret|password|authorization|api[_-]?key)[^=:[:space:]]*[=:])[^	 ]+/\1[redacted]/Ig'
