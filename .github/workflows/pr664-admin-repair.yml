name: PR 664 Admin Repair

on:
  push:
    branches:
      - fix/unified-course-factory-esb

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/unified-course-factory-esb
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies=false
      - name: Apply guarded source repairs
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrence(s), found {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new))

          publish = 'apps/admin/app/api/admin/courses/generate/publish/route.ts'
          replace_exact(publish,
          """    if (seen.has(key))
      return NextResponse.json({ error: 'Internal server error' }, { status: 500 });""",
          """    if (seen.has(key)) {
      throw new Error(`Duplicate lesson title: ${lesson.title}`);
    }""")
          replace_exact(publish,
          """      return NextResponse.json({ error: 'Internal server error' }, { status: 500 });""",
          """      throw new Error(`Invalid quiz answer index for lesson: ${lesson.title}`);""", expected=1)
          replace_exact(publish,
          """    if (!Number.isFinite(lesson.duration_minutes))
      return NextResponse.json({ error: 'Internal server error' }, { status: 500 });
    if ((lesson.duration_minutes ?? 0) < 0)
      return NextResponse.json({ error: 'Internal server error' }, { status: 500 });""",
          """    if (!Number.isFinite(lesson.duration_minutes)) {
      throw new Error(`Invalid lesson duration for: ${lesson.title}`);
    }
    if ((lesson.duration_minutes ?? 0) < 0) {
      throw new Error(`Negative lesson duration for: ${lesson.title}`);
    }""")
          replace_exact(publish,
          """  if (draft.program_id) {
    const coverageError = await checkCoverageGate(draft.program_id, draft.lessons);
    if (coverageError)
      return NextResponse.json({ error: 'Internal server error' }, { status: 500 });
  }""",
          """  if (draft.program_id) {
    const coverageError = await checkCoverageGate(draft.program_id, draft.lessons);
    if (coverageError) throw new Error(coverageError);
  }""")
          replace_exact(publish,
          """  if (courseErr || !courseRow)
    return NextResponse.json({ error: 'Internal server error' }, { status: 500 });""",
          """  if (courseErr || !courseRow) {
    throw new Error(courseErr?.message || 'Course publication did not return a course row');
  }""")

          chat = 'apps/admin/app/api/devstudio/chat/route.ts'
          replace_exact(chat, '${PLATFORM_DEFAULTS.orgName}', r'\${PLATFORM_DEFAULTS.orgName}')
          replace_exact(chat,
          "let messages: { role: string; content: string }[] = [];",
          "let messages: { role: 'user' | 'assistant' | 'system'; content: string }[] = [];")
          replace_exact(chat,
          """        for (const toolCall of firstToolCalls) {
          const handler = toolHandlers[toolCall.function.name];""",
          """        for (const toolCall of firstToolCalls) {
          if (toolCall.type !== 'function') continue;
          const handler = toolHandlers[toolCall.function.name];""")

          gitroute = 'apps/admin/app/api/devstudio/git/route.ts'
          replace_exact(gitroute,
          ".filter((entry): entry is { status: string; path: string; oldPath?: string } => !!entry.path);",
          ".filter((entry) => !!entry.path) as Array<{ status: string; path: string; oldPath?: string }>;")

          builder = 'lib/curriculum/builders/buildCanonicalCourseFromBlueprint.ts'
          replace_exact(builder,
          'findSocByCode(input.blueprint.socCode)',
          'findSocByCode(String(input.blueprint.socCode))')
          replace_exact(builder,
          "logger.error('[Canonical Course Builder] RPC error:', error.message, error.details);",
          "logger.error('[Canonical Course Builder] RPC error:', error.message, { details: error.details });")

          ellie = 'lib/ellie/executor.ts'
          replace_exact(ellie,
          """      .update({ status: 'at_risk' } as any)
      .in('id', enrollmentIds)
      .select('id', { count: 'exact', head: true } as any);""",
          """      .update({ status: 'at_risk' } as any, { count: 'exact' })
      .in('id', enrollmentIds);""")
          replace_exact(ellie,
          """      .delete()
      .in('id', enrollmentIds)
      .select('id', { count: 'exact', head: true } as any);""",
          """      .delete({ count: 'exact' })
      .in('id', enrollmentIds);""")
          PY
      - name: Verify Admin TypeScript
        run: pnpm run typecheck:admin
      - name: Commit verified repairs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/app/api/admin/courses/generate/publish/route.ts \
                  apps/admin/app/api/devstudio/chat/route.ts \
                  apps/admin/app/api/devstudio/git/route.ts \
                  lib/curriculum/builders/buildCanonicalCourseFromBlueprint.ts \
                  lib/ellie/executor.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix(admin): clear release-gate type errors"
          git push origin HEAD:fix/unified-course-factory-esb
