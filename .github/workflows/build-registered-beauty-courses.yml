name: Build Registered Beauty Courses

on:
  push:
    branches: [main]
    paths:
      - 'scripts/course-factory/build-registered-beauty-courses.ts'
      - '.github/workflows/build-registered-beauty-courses.yml'
      - 'lib/ai/ai-service.ts'
      - 'lib/supabase/admin.ts'
  issues:
    types: [opened, reopened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  CI: true
  NODE_ENV: production
  AI_CIRCUIT_RECOVERY_WAIT: '1'
  SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  NODE_OPTIONS: --conditions=react-server

jobs:
  build-and-certify:
    if: github.event_name != 'issues' || github.event.issue.title == 'RUN REGISTERED BEAUTY COURSE BUILD'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: registered-beauty-course-production-acceptance
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          clean: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile --strict-peer-dependencies=false

      - name: Require production Supabase credentials
        shell: bash
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"

      - name: Build canonical Esthetician and Nail courses
        id: build
        shell: bash
        run: |
          set +e
          pnpm tsx scripts/course-factory/build-registered-beauty-courses.ts > /tmp/beauty-build.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          tail -n 240 /tmp/beauty-build.log > /tmp/beauty-build-tail.log
          exit 0

      - name: Verify one canonical course per occupation
        id: audit
        if: steps.build.outputs.exit_code == '0'
        shell: bash
        run: |
          set +e
          node scripts/check-registered-apprenticeship-architecture.mjs >> /tmp/beauty-build.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          tail -n 240 /tmp/beauty-build.log > /tmp/beauty-build-tail.log
          exit 0

      - name: Post result to issue 687
        if: always()
        uses: actions/github-script@v7
        env:
          BUILD_EXIT: ${{ steps.build.outputs.exit_code }}
          AUDIT_EXIT: ${{ steps.audit.outputs.exit_code }}
        with:
          script: |
            const fs = require('fs');
            const buildCode = process.env.BUILD_EXIT || '1';
            const auditCode = process.env.AUDIT_EXIT || (buildCode === '0' ? '1' : 'skipped');
            const ok = buildCode === '0' && auditCode === '0';
            const tail = fs.existsSync('/tmp/beauty-build-tail.log')
              ? fs.readFileSync('/tmp/beauty-build-tail.log', 'utf8').slice(-24000)
              : 'Registered beauty course acceptance did not produce a log.';
            const body = `${ok ? 'REGISTERED BEAUTY COURSE BUILD PASS' : 'REGISTERED BEAUTY COURSE BUILD FAIL'}\n\nCommit: ${context.sha}\nBuild exit: ${buildCode}\nArchitecture audit exit: ${auditCode}\n\n\`\`\`text\n${tail}\n\`\`\``;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 687,
              body,
            });

      - name: Fail workflow when build or audit failed
        if: steps.build.outputs.exit_code != '0' || steps.audit.outputs.exit_code != '0'
        run: exit 1
