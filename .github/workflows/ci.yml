name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, work]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # HARD BLOCKING RELEASE GATE. Each standalone production application is
      # checked against its own dependency graph. Shared files imported by an
      # app are checked transitively by TypeScript. A green CI run therefore
      # certifies zero TypeScript errors in all deployed Marketing/LMS/Admin code.
      - name: TypeScript — Marketing
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
        run: pnpm exec tsc --noEmit -p apps/marketing/tsconfig.json

      - name: TypeScript — LMS
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
        run: pnpm exec tsc --noEmit -p apps/lms/tsconfig.json

      - name: TypeScript — Admin
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
        run: pnpm exec tsc --noEmit -p apps/admin/tsconfig.json

      - name: Lint
        run: pnpm lint
