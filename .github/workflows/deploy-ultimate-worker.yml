name: Deploy Ultimate Course Builder Worker
on:
  workflow_dispatch:
  issues:
    types: [opened, reopened]
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-ultimate-worker.yml'
      - 'Dockerfile.ultimate-worker'
      - 'packages/ultimate-course-worker/**'
      - 'lib/ultimate-course-builder/**'
      - 'scripts/northflank/**'
permissions:
  contents: read
  issues: write
concurrency:
  group: ultimate-course-builder-worker-deploy
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event_name == 'push' || github.event.issue.title == 'DEPLOY ULTIMATE COURSE BUILDER WORKER'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    env:
      NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
      NORTHFLANK_TEAM_ID: ${{ secrets.NORTHFLANK_TEAM_ID || 'elevates-team' }}
      NORTHFLANK_PROJECT_ID: ${{ secrets.NORTHFLANK_PROJECT_ID || 'elevate-platform' }}
      NORTHFLANK_ULTIMATE_WORKER_SERVICE_ID: elevate-ultimate-worker
      NORTHFLANK_GIT_BRANCH: main
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ONET_API_KEY: ${{ secrets.ONET_API_KEY }}
      USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
      USAJOBS_USER_AGENT_EMAIL: ${{ secrets.USAJOBS_USER_AGENT_EMAIL }}
      CAREERONESTOP_USER_ID: ${{ secrets.CAREERONESTOP_USER_ID }}
      CAREERONESTOP_API_KEY: ${{ secrets.CAREERONESTOP_API_KEY || secrets.CAREERONESTOP_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_AI_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout exact Ultimate source branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Resolve exact Ultimate branch SHA
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          sha="$(git rev-parse origin/main)"
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "ULTIMATE_SOURCE_SHA=$sha" >> "$GITHUB_ENV"
          echo "Deploying Ultimate source SHA $sha"
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.2 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Verify required Ultimate database migration (read-only)
        run: node scripts/verify-ultimate-media-schema.mjs
      - name: Install dedicated Ultimate worker dependencies
        run: pnpm install --filter @elevate/ultimate-course-worker... --no-frozen-lockfile --lockfile=false --strict-peer-dependencies=false
      - name: Require deployment credentials
        run: |
          set -euo pipefail
          test -n "$NORTHFLANK_API_TOKEN"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$NORTHFLANK_API_TOKEN"
          test -n "$ULTIMATE_SOURCE_SHA"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_AI_API_TOKEN"
          for key in ONET_API_KEY USAJOBS_API_KEY USAJOBS_USER_AGENT_EMAIL CAREERONESTOP_USER_ID CAREERONESTOP_API_KEY; do
            if [ -z "${!key:-}" ]; then echo "::warning::Ultimate workforce feed credential $key is unavailable"; fi
          done
      - name: Attach canonical production runtime secrets to Ultimate worker
        run: pnpm tsx scripts/northflank/attach-ultimate-secret-group.ts
      - name: Verify Ultimate worker parity
        run: pnpm tsx scripts/verify-ultimate-worker-parity.ts
      - name: Provision Ultimate worker
        run: pnpm tsx scripts/northflank/provision-ultimate-worker.ts --execute
      - name: Trigger or reuse exact worker build
        id: build
        env:
          GITHUB_SHA: ${{ steps.source.outputs.sha }}
          BUILD_SHA: ${{ steps.source.outputs.sha }}
        run: pnpm tsx scripts/northflank/trigger-build.ts "$NORTHFLANK_ULTIMATE_WORKER_SERVICE_ID"
      - name: Require concrete build id
        run: test -n "${{ steps.build.outputs.build_id }}"
      - name: Wait for exact worker build
        run: pnpm tsx scripts/northflank/wait-service.ts "$NORTHFLANK_ULTIMATE_WORKER_SERVICE_ID" --build-id "${{ steps.build.outputs.build_id }}" --timeout-ms 2400000
      - name: Verify exact worker build SHA
        run: pnpm tsx scripts/northflank/verify-build.ts "$NORTHFLANK_ULTIMATE_WORKER_SERVICE_ID" --build-id "${{ steps.build.outputs.build_id }}" --sha "${{ steps.source.outputs.sha }}"
      - name: Deploy exact worker build
        run: pnpm tsx scripts/northflank/trigger-deployment.ts "$NORTHFLANK_ULTIMATE_WORKER_SERVICE_ID" --build-id "${{ steps.build.outputs.build_id }}" --sha "${{ steps.source.outputs.sha }}"
      - name: Restart deployed Ultimate worker
        run: pnpm tsx scripts/northflank/restart-service.ts "$NORTHFLANK_ULTIMATE_WORKER_SERVICE_ID"
      - name: Verify deployed Ultimate worker claims queued work
        shell: bash
        run: |
          set -euo pipefail
          verify_after="$(date -u -d '2 minutes ago' +'%Y-%m-%dT%H:%M:%SZ')"
          for attempt in $(seq 1 45); do
            state="$(curl -fsS "${NEXT_PUBLIC_SUPABASE_URL}/rest/v1/ultimate_build_jobs?heartbeat_at=gte.${verify_after}&order=heartbeat_at.desc&limit=1&select=id,build_id,status,attempts,lease_owner,heartbeat_at,last_error" -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" || true)"
            echo "$state"
            # Claim RPC persists heartbeat and attempts. Bounded lesson jobs can
            # finish or yield before the next poll and release their lease;
            # requiring a currently-running job incorrectly fails a live worker.
            echo "$state" | grep -Eq '"attempts":[1-9]' && echo "$state" | grep -Eq '"heartbeat_at":"[^"]+"' && exit 0
            sleep 10
          done
          echo "::error::Ultimate worker did not claim an active queued build after deployment"
          exit 1
