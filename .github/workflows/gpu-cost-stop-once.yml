name: GPU Cost Stop Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gpu-cost-stop-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
      NORTHFLANK_TEAM_ID: ${{ secrets.NORTHFLANK_TEAM_ID || 'elevates-team' }}
      NORTHFLANK_GPU_PROJECT_ID: elevate-media-gpu
      NORTHFLANK_GPU_SERVICE_ID: elevate-media-gpu-worker
    steps:
      - name: Audit and remove unfinished GPU resources
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$NORTHFLANK_API_TOKEN"
          base="https://api.northflank.com/v1/teams/${NORTHFLANK_TEAM_ID}/projects/${NORTHFLANK_GPU_PROJECT_ID}"
          auth=(-H "Authorization: Bearer ${NORTHFLANK_API_TOKEN}" -H 'Content-Type: application/json')

          curl -fsS "${auth[@]}" "$base/services" > /tmp/services-before.json || echo '{"data":[]}' > /tmp/services-before.json
          curl -fsS "${auth[@]}" "$base/volumes" > /tmp/volumes-before.json || echo '{"data":[]}' > /tmp/volumes-before.json

          service_code=$(curl -sS -o /tmp/service.json -w '%{http_code}' "${auth[@]}" "$base/services/${NORTHFLANK_GPU_SERVICE_ID}" || true)
          service_deleted=false
          if [ "$service_code" = "200" ]; then
            curl -fsS -X DELETE "${auth[@]}" "$base/services/${NORTHFLANK_GPU_SERVICE_ID}?delete_child_objects=true"
            service_deleted=true
          fi

          curl -fsS "${auth[@]}" "$base/volumes" > /tmp/volumes-mid.json || echo '{"data":[]}' > /tmp/volumes-mid.json
          node - <<'NODE' > /tmp/orphans.txt
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/volumes-mid.json','utf8'));
          const d=Array.isArray(j.data)?j.data:(Array.isArray(j.data?.volumes)?j.data.volumes:[]);
          for (const v of d) {
            const id=String(v.id||'');
            const name=String(v.name||'').toLowerCase();
            const attached=Array.isArray(v.attachedObjects)?v.attachedObjects:[];
            if ((id==='elevate-gpu-models' || name==='elevate gpu models') && attached.length===0) console.log(id);
          }
          NODE

          orphan_deleted=0
          while IFS= read -r vid; do
            [ -z "$vid" ] && continue
            curl -fsS -X DELETE "${auth[@]}" "$base/volumes/$vid"
            orphan_deleted=$((orphan_deleted+1))
          done < /tmp/orphans.txt

          sleep 3
          curl -fsS "${auth[@]}" "$base/services" > /tmp/services-after.json || echo '{"data":[]}' > /tmp/services-after.json
          curl -fsS "${auth[@]}" "$base/volumes" > /tmp/volumes-after.json || echo '{"data":[]}' > /tmp/volumes-after.json

          node - "$service_deleted" "$orphan_deleted" <<'NODE' > /tmp/result.json
          const fs=require('fs');
          function rows(path,key){
            const j=JSON.parse(fs.readFileSync(path,'utf8'));
            if(Array.isArray(j.data)) return j.data;
            if(Array.isArray(j.data?.[key])) return j.data[key];
            return [];
          }
          const compact=x=>({id:x.id,name:x.name,status:x.status,plan:x.billing?.deploymentPlan,storageMB:x.spec?.storageSize,attachedObjects:x.attachedObjects||[]});
          const result={
            timestamp:new Date().toISOString(),
            project:process.env.NORTHFLANK_GPU_PROJECT_ID,
            targetService:process.env.NORTHFLANK_GPU_SERVICE_ID,
            serviceDeleted:process.argv[2]==='true',
            orphanVolumesDeleted:Number(process.argv[3]||0),
            servicesBefore:rows('/tmp/services-before.json','services').map(compact),
            volumesBefore:rows('/tmp/volumes-before.json','volumes').map(compact),
            servicesAfter:rows('/tmp/services-after.json','services').map(compact),
            volumesAfter:rows('/tmp/volumes-after.json','volumes').map(compact)
          };
          process.stdout.write(JSON.stringify(result,null,2));
          NODE
          cat /tmp/result.json

      - name: Commit cleanup evidence
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const content = Buffer.from(fs.readFileSync('/tmp/result.json','utf8')).toString('base64');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = 'ops/gpu-cost-stop-result.json';
            let sha;
            try {
              const existing = await github.rest.repos.getContent({owner, repo, path, ref:'main'});
              if (!Array.isArray(existing.data)) sha = existing.data.sha;
            } catch (e) {
              if (e.status !== 404) throw e;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch:'main',
              message:'ops(gpu): record Northflank cost cleanup evidence',
              content, ...(sha ? {sha} : {})
            });
