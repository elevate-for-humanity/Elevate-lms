name: Verify live Admin rendering
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-live-admin-rendering.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: write
  id-token: write
jobs:
  dispatch:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch trusted read-only verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/verify-live-admin-rendering.yml/dispatches" -f ref=main
  verify:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        with:
          skip_install: true
      - name: Inspect effective runtime and sanitized render failure categories
        run: |
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          const base=['--project=elegant-racer-299721','--format=json'];
          const service=JSON.parse(execFileSync('gcloud',['run','services','describe','elevate-admin-migration','--region=us-central1',...base],{encoding:'utf8'}));
          const spec=service.spec.template.spec;
          const env=Object.fromEntries((spec.containers[0].env||[]).filter(x=>typeof x.value==='string').map(x=>[x.name,x.value]));
          console.log(JSON.stringify({latestReadyRevision:service.status.latestReadyRevisionName,traffic:service.status.traffic,resources:spec.containers[0].resources,scaling:service.spec.template.metadata.annotations,narrationProvider:['kokoro','local','cloudflare'].includes(env.AI_NARRATION_PROVIDER)?env.AI_NARRATION_PROVIDER:'other',workerDisabled:env.DISABLE_ADMIN_VIDEO_WORKER==='true'}));
          try {
            const job=JSON.parse(execFileSync('gcloud',['run','jobs','describe','elevate-video-render','--region=us-central1',...base],{encoding:'utf8',stdio:['ignore','pipe','pipe']}));
            const task=job.spec.template.spec.template.spec;
            const videoContainer=task.containers[0];
            const videoEnv=Object.fromEntries((videoContainer.env||[]).filter(x=>typeof x.value==='string').map(x=>[x.name,x.value]));
            const safe=text=>String(text||'').replace(/https?:\/\/[^\s"']+/g,'[url]').replace(/Bearer\s+\S+/gi,'Bearer [redacted]').replace(/eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+/g,'[token]').slice(0,2000);
            const conditions=items=>(items||[]).map(x=>({type:x.type,status:x.status,reason:x.reason,message:safe(x.message)}));
            console.log(JSON.stringify({videoJobPresent:true,resources:videoContainer.resources,conditions:conditions(job.status?.conditions),videoJobImage:videoContainer.image,videoJobIdentity:task.serviceAccountName,videoJobRetries:task.maxRetries,videoJobTimeout:task.timeoutSeconds,command:videoContainer.command,args:(videoContainer.args||[]).map((x,i)=>i<2?x:{characters:x.length,hasMainCall:x.includes('await runFiniteVideoRender();')}),envPresent:Object.fromEntries(['SUPABASE_SERVICE_ROLE_KEY','CRON_SECRET','VIDEO_JOB_ID','VIDEO_COURSE_ID'].map(x=>[x,Boolean(videoEnv[x])])),expectedDatabase:videoEnv.NEXT_PUBLIC_SUPABASE_URL==='https://cuxzzpsyufcewtmicszk.supabase.co'}));
            const executions=JSON.parse(execFileSync('gcloud',['run','jobs','executions','list','--job=elevate-video-render','--region=us-central1',...base],{encoding:'utf8',stdio:['ignore','pipe','pipe']}));
            console.log(JSON.stringify({videoExecutions:executions.slice(0,3).map(x=>({name:x.metadata.name,started:x.status?.startTime,completed:x.status?.completionTime,running:x.status?.runningCount,succeeded:x.status?.succeededCount,failed:x.status?.failedCount,conditions:conditions(x.status?.conditions)}))}));
            for(const execution of executions.slice(0,2)) {
              const name=execution.metadata.name;
              const tasks=JSON.parse(execFileSync('gcloud',['run','jobs','executions','tasks','list','--execution='+name,'--region=us-central1',...base],{encoding:'utf8',stdio:['ignore','pipe','pipe']}));
              console.log(JSON.stringify({execution:name,tasks:tasks.map(t=>({name:t.metadata.name,started:t.status?.startTime,completed:t.status?.completionTime,conditions:conditions(t.status?.conditions),lastAttemptResult:t.status?.lastAttemptResult,retried:t.status?.retried,resources:t.spec?.containers?.map(c=>c.resources)}))}));
            }
            const jobFilter='resource.type="cloud_run_job" AND resource.labels.job_name="elevate-video-render" AND severity>=WARNING';
            const logs=JSON.parse(execFileSync('gcloud',['logging','read',jobFilter,'--freshness=3d','--limit=30',...base],{encoding:'utf8',stdio:['ignore','pipe','pipe']}));
            for(const row of logs) {
              let message=row.textPayload||row.jsonPayload?.message||row.protoPayload?.status?.message||'';
              for(const value of Object.values(videoEnv))if(value.length>=8)message=message.split(value).join('[runtime-value]');
              console.log(JSON.stringify({jobLog:true,timestamp:row.timestamp,severity:row.severity,execution:row.labels?.['run.googleapis.com/execution_name'],message:safe(message)}));
            }
            const revisions=JSON.parse(execFileSync('gcloud',['run','revisions','list','--service=elevate-admin-migration','--region=us-central1','--limit=5',...base],{encoding:'utf8',stdio:['ignore','pipe','pipe']}));
            console.log(JSON.stringify({adminImages:revisions.map(r=>({name:r.metadata.name,image:r.spec.containers[0].image,digest:r.status?.imageDigest,conditions:conditions(r.status?.conditions)}))}));
          } catch(error) {console.log(JSON.stringify({videoJobInspectionSucceeded:false,exitStatus:error.status}));throw new Error('Video job diagnostics failed; inspect Google access before retrying');}
          const filter='resource.type="cloud_run_revision" AND resource.labels.service_name="elevate-admin-migration"';
          let rows;
          try {rows=JSON.parse(execFileSync('gcloud',['logging','read',filter,'--freshness=30m','--limit=500',...base],{encoding:'utf8',stdio:['ignore','pipe','pipe']}));}
          catch (error) {
            const stderr=String(error.stderr||'');
            const category=/PERMISSION_DENIED|permission.*denied/i.test(stderr)?'PERMISSION_DENIED':/unrecognized arguments|Invalid choice/i.test(stderr)?'SDK_ARGUMENT_ERROR':/RESOURCE_EXHAUSTED/i.test(stderr)?'RESOURCE_EXHAUSTED':'OTHER';
            console.log(JSON.stringify({logReadSucceeded:false,category,exitStatus:error.status}));
            throw new Error('Runtime log read did not succeed: '+category);
          }
          const patterns={out_of_memory:/memory limit|out of memory|OOM|SIGKILL/i,terminated:/SIGTERM|terminated|shutting down/i,model_loading:/kokoro|onnx|model.*load|download.*model/i,render_failure:/render.*fail|compositor.*error|narration.*fail/i,quality_failure:/quality.*fail|quality.*reject/i,worker_failure:/trigger loop error|Processor failed|Automated course finalization failed/i,render_complete:/markComplete|render.*complete|video.*complete/i};
          const counts={};
          for(const row of rows) {
            const message=row.textPayload||JSON.stringify(row.jsonPayload||{});
            const categories=Object.entries(patterns).filter(([,pattern])=>pattern.test(message)).map(([key])=>key);
            for(const category of categories)counts[category]=(counts[category]||0)+1;
            if(categories.length)console.log(JSON.stringify({timestamp:row.timestamp,severity:row.severity,revision:row.resource?.labels?.revision_name,categories}));
          }
          console.log(JSON.stringify({logEntriesRead:rows.length,categories:counts}));
          NODE
