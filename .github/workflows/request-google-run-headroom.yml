name: Request Google Cloud Run deployment quota
on:
  workflow_dispatch:
    inputs:
      request_maximum:
        description: Request unlimited CPU/memory preferences; Google decides the approved limits
        type: boolean
        required: false
        default: false
permissions:
  contents: read
  id-token: write
concurrency:
  group: google-run-quota-request
  cancel-in-progress: false
jobs:
  request:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node --test scripts/gcp/request-run-headroom.test.mjs
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        with:
          skip_install: true
      - run: node scripts/gcp/request-run-headroom.mjs
        env:
          REQUEST_MAXIMUM: ${{ inputs.request_maximum }}
