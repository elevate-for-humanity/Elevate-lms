name: Strict TypeScript Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - '**/*.ts'
      - '**/*.tsx'
      - '**/tsconfig*.json'
      - '.github/workflows/strict-typescript-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [marketing, admin, lms]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies=false
      # The application tsconfigs are the production contract and remain
      # blocking. Enhanced flags below expose the historical migration backlog
      # without making every unrelated deployment fail on inherited debt.
      - name: Canonical TypeScript gate
        shell: bash
        run: |
          set -o pipefail
          pnpm run typecheck:${{ matrix.app }} 2>&1 | tee canonical-typescript-${{ matrix.app }}.log
      - name: Enhanced strict debt audit
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @elevate/${{ matrix.app }} exec tsc --noEmit --pretty false --strict --strictNullChecks true --exactOptionalPropertyTypes --noUncheckedIndexedAccess 2>&1 | tee strict-enhanced-${{ matrix.app }}.log
      - name: Upload line-level diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strict-typescript-${{ matrix.app }}
          path: |
            canonical-typescript-*.log
            strict-enhanced-*.log
          retention-days: 14
