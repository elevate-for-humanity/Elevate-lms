name: Publish protected HVAC workbook master
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-hvac-workbook.yml'
      - 'lib/lms/hvac-workbook-content.json'
      - 'lib/lms/hvac-practice-bank.json'
      - 'scripts/curriculum/build-hvac-workbook-pdf.py'
      - 'scripts/gcp/verify-hvac-instructional-audio.mjs'
      - 'public/images/courses/epa608-*-20261102.webp'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
  id-token: write
concurrency:
  group: protected-hvac-workbook-master
  cancel-in-progress: false
jobs:
  dispatch:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch through the existing Google-trusted event
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/publish-hvac-workbook.yml/dispatches" -f ref=main
  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate authored workbook and practice bank
        run: node --test scripts/curriculum/hvac-workbook.test.mjs scripts/curriculum/hvac-store-bundle.test.mjs
      - name: Build protected PDF master
        run: |
          python -m pip install reportlab==4.4.9
          python scripts/curriculum/build-hvac-workbook-pdf.py --content lib/lms/hvac-workbook-content.json --bank lib/lms/hvac-practice-bank.json --output output/pdf/HVAC-Illustrated-Practice-Workbook.pdf
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Upload and verify the exact private workbook master
        run: node scripts/curriculum/publish-hvac-workbook.mjs

      - name: Verify all 17 narrated instructional videos
        run: |
          command -v ffprobe >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y ffmpeg; }
          node scripts/gcp/verify-hvac-instructional-audio.mjs
