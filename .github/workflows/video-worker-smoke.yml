name: Video Worker Scheduler

# Queue checkpoint: restart stalled barber instructional candidate after worker recovery

# Canonical Course Builder render-queue trigger. Keep this workflow thin: the Admin runtime owns rendering.
# A main-branch workflow update also performs an immediate bounded queue check.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/video-worker-smoke.yml'

permissions:
  contents: read

concurrency:
  group: canonical-video-worker-scheduler
  cancel-in-progress: false

env:
  ADMIN_URL: ${{ secrets.ADMIN_URL }}
  CRON_SECRET: ${{ secrets.CRON_SECRET }}

jobs:
  process-next-video:
    name: Process next canonical video job
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Require scheduler credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET" || { echo '::error::CRON_SECRET is not configured'; exit 1; }
          if [ -z "$ADMIN_URL" ]; then
            echo 'ADMIN_URL=https://admin.elevateforhumanity.org' >> "$GITHUB_ENV"
          fi

      - name: Call Admin-owned video queue worker
        shell: bash
        run: |
          set -euo pipefail
          # The Admin worker intentionally keeps this request attached while a
          # render is running (up to its 30-minute maxDuration). Keep the
          # scheduler's client timeout inside the 35-minute job timeout so the
          # runner does not abandon a valid lease and cause a costly retry.
          status=$(curl -sS --connect-timeout 30 --max-time 1800 \
            -o /tmp/video-worker.json -w '%{http_code}' \
            -X POST "$ADMIN_URL/api/internal/videos/process-queue" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H 'Content-Type: application/json' \
            --data '{"courseId":"3fb5ce19-1cde-434c-a8c6-f138d7d7aa17","jobId":"4ba64728-c520-4570-800a-0d5546ce229a","maxJobs":1,"queueOneDraft":true}' || true)
          cat /tmp/video-worker.json 2>/dev/null || true
          case "$status" in
            200|202) ;;
            *) echo "::error::Video worker returned HTTP $status"; exit 1 ;;
          esac
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('/tmp/video-worker.json','utf8')); if(p.ok!==true) process.exit(1); console.log('Video worker contract accepted:', p);"
