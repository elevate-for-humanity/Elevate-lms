<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Straight razor and safety handling</title>
  <desc id="desc">Educational diagram showing the parts of a straight razor and safe handling zones.</desc>
  <rect width="1200" height="675" fill="#f8fafc"/>
  <rect x="48" y="48" width="1104" height="579" rx="32" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>
  <text x="92" y="118" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#0f172a">Straight Razor Safety</text>
  <text x="92" y="160" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#475569">Identify the blade, tang, pivot and handle before service.</text>
  <g transform="translate(95 230)">
    <path d="M70 160 L585 92 Q650 82 702 115 L726 132 L668 167 Q620 195 548 202 L70 230 Z" fill="#e2e8f0" stroke="#334155" stroke-width="6"/>
    <path d="M545 111 Q610 101 670 128 L698 142 L652 165 Q603 188 548 188 Z" fill="#cbd5e1"/>
    <circle cx="724" cy="147" r="20" fill="#0f172a"/>
    <path d="M741 132 Q875 66 1000 90 Q1056 102 1043 154 Q1031 206 969 220 Q864 239 752 173 Z" fill="#1e293b" stroke="#0f172a" stroke-width="6"/>
    <path d="M97 217 L535 188" stroke="#dc2626" stroke-width="6" stroke-linecap="round"/>
    <text x="95" y="285" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#b91c1c">Cutting edge — never touch or test with a finger</text>
    <line x1="390" y1="205" x2="390" y2="260" stroke="#b91c1c" stroke-width="4"/>
    <text x="610" y="45" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#0f172a">Tang / safe control area</text>
    <line x1="690" y1="58" x2="704" y2="119" stroke="#0f172a" stroke-width="4"/>
    <text x="844" y="286" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#0f172a">Handle / scales</text>
    <line x1="895" y1="250" x2="900" y2="207" stroke="#0f172a" stroke-width="4"/>
  </g>
  <g transform="translate(92 552)">
    <rect width="1016" height="52" rx="12" fill="#ecfeff" stroke="#67e8f9"/>
    <text x="22" y="34" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#155e75">Safety rule: use a fresh/disinfected setup, maintain skin tension, use controlled strokes, and dispose of replaceable blades correctly.</text>
  </g>
</svg>