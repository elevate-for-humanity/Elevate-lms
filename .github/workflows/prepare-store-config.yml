name: Prepare independent Store configuration
on:
  pull_request:
    paths: ['scripts/gcp/prepare-store-config*', 'scripts/gcp/stage-web*', '.github/workflows/prepare-store-config.yml']
  workflow_dispatch:
    inputs:
      apply:
        description: 'Archive validated bootstrap subset under Store config; no deployment or inheritance removal'
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
concurrency:
  group: google-store-config-preparation
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node --test scripts/gcp/prepare-store-config.test.mjs scripts/gcp/stage-web.test.mjs
  prepare:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node --test scripts/gcp/prepare-store-config.test.mjs scripts/gcp/stage-web.test.mjs
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        with: { skip_install: true }
      - name: Validate and optionally prepare Store-owned configuration
        env:
          STORE_CONFIG_PREPARE: ${{ inputs.apply == true && 'true' || 'false' }}
        run: node scripts/gcp/prepare-store-config.mjs
