name: Auto-repair safe formatting on main
on:
  push:
    branches: [main]
    paths:
      - 'apps/marketing/**'
      - 'components/home/**'
      - 'components/programs/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: main-safe-repair
  cancel-in-progress: false
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies=false
      - name: Identify eligible files changed by latest commit
        run: |
          set -euo pipefail
          git diff --name-only --diff-filter=ACM HEAD^ HEAD -- apps/marketing components/home components/programs |
            grep -E '\\.(ts|tsx|js|jsx|json|css)$' > /tmp/eligible || true
      - name: Repair formatting only
        run: |
          set -euo pipefail
          if [ -s /tmp/eligible ]; then
            xargs -r -d '\\n' pnpm exec prettier --write < /tmp/eligible
          fi
      - name: Recheck original formatting gate
        run: |
          if [ -s /tmp/eligible ]; then
            xargs -r -d '\\n' pnpm exec prettier --check < /tmp/eligible
          fi
      - name: Push validated safe repairs directly to main
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "elevate-safe-repair[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          xargs -r -d '\\n' git add -- < /tmp/eligible
          git diff --cached --quiet && exit 0
          git commit -m "style: auto-repair formatting on main [skip ci]"
          git push origin HEAD:main
