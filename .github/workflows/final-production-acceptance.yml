name: Final platform production acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/gcp/final-production-acceptance.mjs'
      - '.github/workflows/final-production-acceptance.yml'
permissions:
  contents: read
  id-token: write
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Execute production acceptance against exact release
        env:
          IMAGE_SHA: ${{ github.sha }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/gcp/final-production-acceptance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-acceptance-${{ github.sha }}
          path: audit-output/production-acceptance.json
          if-no-files-found: warn
          retention-days: 30
