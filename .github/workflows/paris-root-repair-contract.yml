name: PARIS root repair contract
on:
  pull_request:
    paths:
      - 'lib/ai/runtime/code-repair.ts'
      - 'lib/ai/runtime/code-repair-policy.mjs'
      - 'lib/ai/runtime/course-repair-policy.mjs'
      - 'lib/devstudio/repair-checkpoint-recovery.mjs'
      - 'lib/devstudio/browser-prompt-budget.mjs'
      - 'tests/worker/browser-prompt-budget.test.mjs'
      - 'lib/ultimate-course-builder/release/recovered-source-policy.mjs'
      - 'scripts/gcp/reconcile-draft-source-pool.mjs'
      - 'tests/worker/paris-recovery-admission.test.mjs'
      - 'tests/worker/draft-source-reconciliation.test.mjs'
      - 'lib/ai/runtime/paris-attempt-contract.test.mjs'
      - 'supabase/migrations/*paris_bounded_context_retry_contract.sql'
      - '.github/workflows/paris-root-repair-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify PARIS repair budget and existing repair policy
        run: node --test lib/ai/runtime/paris-attempt-contract.test.mjs lib/ai/runtime/code-repair-policy.test.mjs lib/ai/runtime/course-repair-policy.test.mjs tests/worker/paris-recovery-admission.test.mjs tests/worker/draft-source-reconciliation.test.mjs tests/worker/browser-prompt-budget.test.mjs
