name: Registered Apprenticeship E2E

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/registered-apprenticeship-e2e.yml'
      - 'playwright.config.ts'
      - 'tests/e2e/registered-apprenticeship-authenticated.spec.ts'
      - 'tests/e2e/portal-responsive-design.spec.ts'
      - 'scripts/check-registered-apprenticeship-architecture.mjs'
      - 'scripts/qa/provision-apprenticeship-e2e.mjs'
      - 'scripts/qa/provision-learner-program-holder-e2e.mjs'
  workflow_run:
    workflows:
      - Deploy LMS
    types:
      - completed

permissions:
  contents: read
  issues: write

concurrency:
  group: registered-apprenticeship-e2e
  cancel-in-progress: false

jobs:
  production-authenticated-e2e:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: Portal authenticated persistence and responsive design
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 55
    env:
      PLAYWRIGHT_BASE_URL: https://app.elevateforhumanity.org
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Verify production LMS is ready
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            ping_status=$(curl -sS --max-time 10 -o /tmp/lms-ping.json -w "%{http_code}" https://app.elevateforhumanity.org/api/ping || true)
            health_status=$(curl -sS --max-time 10 -o /tmp/lms-health.json -w "%{http_code}" https://app.elevateforhumanity.org/api/health || true)
            if [[ "$ping_status" == "200" && "$health_status" == "200" ]] \
              && grep -q '"ok":true' /tmp/lms-ping.json \
              && grep -q '"ready":true' /tmp/lms-health.json; then
              exit 0
            fi
            echo "LMS not ready yet (ping=$ping_status health=$health_status), retry $i/20"
            sleep 15
          done
          echo "::error::Production LMS never reached ready state"
          cat /tmp/lms-ping.json 2>/dev/null || true
          cat /tmp/lms-health.json 2>/dev/null || true
          exit 1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies=false
      - name: Require Supabase QA provisioning authority
        shell: bash
        run: |
          set -euo pipefail
          test -n "${NEXT_PUBLIC_SUPABASE_URL:-}" || { echo '::error::NEXT_PUBLIC_SUPABASE_URL is not configured'; exit 1; }
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}" || { echo '::error::SUPABASE_SERVICE_ROLE_KEY is not configured'; exit 1; }
      - name: Provision disposable Host Shop + Apprentice identities
        run: node scripts/qa/provision-apprenticeship-e2e.mjs provision
      - name: Provision isolated Learner + Program Holder identities
        run: node scripts/qa/provision-learner-program-holder-e2e.mjs provision
      - name: Install Chromium and WebKit
        run: pnpm exec playwright install chromium webkit --with-deps
      - name: Run registered-apprenticeship architecture gate
        run: node scripts/check-registered-apprenticeship-architecture.mjs
      - name: Run authenticated production functional E2E
        run: pnpm exec playwright test tests/e2e/registered-apprenticeship-authenticated.spec.ts --config playwright.config.ts --project=desktop-chrome
      - name: Run authenticated cross-device responsive design certification
        run: pnpm exec playwright test tests/e2e/portal-responsive-design.spec.ts --config playwright.config.ts --project=desktop-chrome --project=laptop-chrome --project=tablet-chrome --project=iphone-webkit --project=android-chrome
      - name: Clean isolated Learner + Program Holder identities
        if: always()
        run: node scripts/qa/provision-learner-program-holder-e2e.mjs cleanup
      - name: Clean disposable Host Shop + Apprentice identities
        if: always()
        run: node scripts/qa/provision-apprenticeship-e2e.mjs cleanup
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-responsive-e2e-results
          path: |
            test-results/
            playwright-report/
          retention-days: 14
          if-no-files-found: ignore
      - name: Publish production QA evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          QA_STATUS: ${{ job.status }}
          QA_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          QA_EVENT: ${{ github.event_name }}
          QA_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue comment 791 --repo "$GITHUB_REPOSITORY" --body "### Portal production QA: ${QA_STATUS^^}\n\n- SHA: \`${QA_SHA}\`\n- Trigger: \`${QA_EVENT}\`\n- Run: ${QA_RUN_URL}\n- Fixtures: disposable Host Shop, Apprentice, Learner, and isolated Program Holder identities; mutable fixture rows are cleaned and Auth identities are soft-deleted to preserve immutable audit history.\n- Functional scope: Apprentice dashboard/hours/RTI/competencies/documents/attendance/profile/handbook; Host Shop dashboard/apprentices/pending-hours/documents/competencies/attendance/wages/reports/profile; competency persistence + restore; Apprentice-to-Host-Shop RBAC denial.\n- Responsive design scope: Host Shop, Apprentice, Learner, and Program Holder on desktop 1440x900, laptop 1280x720, iPad-class tablet, iPhone WebKit, and Pixel-class Android Chromium. Checks page overflow, clipped critical controls, zero-size primary content, mobile control sizing, login/authorization regressions, and HTTP 5xx responses.\n- Evidence: Playwright traces/screenshots/report artifact retained for 14 days."
