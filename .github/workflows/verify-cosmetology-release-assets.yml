name: Verify cosmetology release assets
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/ops/verify-cosmetology-release-assets.mjs
      - .github/workflows/verify-cosmetology-release-assets.yml
permissions:
  contents: read
concurrency:
  group: verify-cosmetology-release-assets
  cancel-in-progress: false
jobs:
  cover:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Render only the existing workbook cover
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/ops/verify-cosmetology-release-assets.mjs cover
      - uses: actions/upload-artifact@v4
        with:
          name: prestige-cosmetology-original-cover
          path: cosmetology-release-evidence
          retention-days: 30
          if-no-files-found: error
  mail:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Deliver already-authorized messages through existing outbox processor
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/ops/verify-cosmetology-release-assets.mjs mail
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cosmetology-announcement-receipt
          path: cosmetology-release-evidence
          retention-days: 30
