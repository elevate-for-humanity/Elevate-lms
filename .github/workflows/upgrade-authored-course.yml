name: Upgrade Authored Course Experience

on:
  push:
    branches: [main]
    paths: ['.github/workflows/upgrade-authored-course.yml']
  workflow_dispatch:
    inputs:
      course_slug:
        type: choice
        default: barber-apprenticeship
        options: [barber-apprenticeship, cosmetology-apprenticeship]

permissions:
  contents: read

concurrency:
  group: authored-course-media-launch
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      NODE_ENV: production
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ADMIN_URL: 'https://elevate-admin-migration-aabnh2y32a-uc.a.run.app'
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      COURSE_SLUG: ${{ inputs.course_slug || 'barber-apprenticeship' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          clean: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Require production database credentials
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$CRON_SECRET"

      - name: Resolve the current canonical course identity
        run: |
          node --test scripts/course-factory/resolve-course-id.test.mjs
          COURSE_ID="$(node scripts/course-factory/resolve-course-id.mjs "$COURSE_SLUG")"
          echo "COURSE_ID=$COURSE_ID" >> "$GITHUB_ENV"

      - name: Install locked dependencies
        run: pnpm install --ignore-scripts --frozen-lockfile --strict-peer-dependencies=false --prod=false

      - name: Prove the complete Barber blueprint compiles
        run: pnpm vitest run tests/unit/course-factory/authored-content-compiler.test.ts

      - name: Upgrade the exact authored course and enqueue missing media
        run: node --conditions=react-server --import tsx scripts/course-factory/upgrade-authored-course.ts --course-id "$COURSE_ID"

      - name: Run the exact course media queue to completion
        shell: bash
        run: |
          set -euo pipefail
          while true; do
            status=$(curl -sS --connect-timeout 30 --max-time 1800 \
              -o /tmp/video-worker.json -w '%{http_code}' \
              -X POST "$ADMIN_URL/api/internal/videos/process-queue" \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H "Content-Type: application/json" \
              --data "{\"courseId\":\"$COURSE_ID\",\"maxJobs\":4}")
            cat /tmp/video-worker.json
            case "$status" in
              200|202) ;;
              *) echo "::error::Video worker returned HTTP $status"; exit 1 ;;
            esac
            outcome=$(node -e "const p=require('/tmp/video-worker.json'); if(p.ok!==true) process.exit(1); process.stdout.write(String(p.reason || (p.started ? 'started' : 'queue-empty')))")
            case "$outcome" in
              course-builder-generation-paused|course-generation-paused)
                echo "::error::Media generation is paused: $outcome"; exit 1 ;;
              render-capacity-full)
                sleep 30; continue ;;
              queue-empty)
                break ;;
              *)
                sleep 5 ;;
            esac
          done

      - name: Verify every required lesson video is playable
        run: node --conditions=react-server --import tsx scripts/course-factory/verify-course-media.ts --course-id "$COURSE_ID"

      - name: Publish only after the automated procurement gate passes
        run: node --conditions=react-server --import tsx scripts/course-factory/publish-verified-course.ts --course-id "$COURSE_ID"
