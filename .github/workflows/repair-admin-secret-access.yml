name: Repair scoped Admin Secret Manager access
on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair-admin-secret-access.yml', 'scripts/gcp/repair-admin-secret-access.mjs']
  workflow_dispatch:
permissions: {contents: read, actions: write, id-token: write}
concurrency:
  group: admin-secret-access-repair
  cancel-in-progress: false
jobs:
  dispatch:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - env: {GH_TOKEN: '${{ github.token }}'}
        run: gh api --method POST repos/$GITHUB_REPOSITORY/actions/workflows/repair-admin-secret-access.yml/dispatches -f ref=main
  repair:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        with: {skip_install: true}
      - run: node --test scripts/gcp/repair-admin-secret-access.test.mjs
      - run: node scripts/gcp/repair-admin-secret-access.mjs --apply
