name: Branch Protection & Cleanup

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: branch-protection-cleanup
  cancel-in-progress: false

jobs:
  cleanup-stale-branches:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch remote branches
        run: git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Delete branches older than 30 days without open PRs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          owner="${REPO%%/*}"
          current_time=$(date +%s)

          mapfile -t branches < <(
            git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin \
              | grep -v '^HEAD$' \
              | grep -v '^main$' \
              | grep -v '^dependabot/' \
              | sort
          )

          for branch in "${branches[@]}"; do
            last_commit=$(git log -1 --format=%ct "origin/${branch}")
            days_old=$(( (current_time - last_commit) / 86400 ))

            if [ "$days_old" -le 30 ]; then
              continue
            fi

            open_prs=$(gh api -X GET search/issues \
              -f q="repo:${REPO} is:pr is:open head:${owner}:${branch}" \
              --jq '.total_count' 2>/dev/null || echo 0)

            if [ "$open_prs" -gt 0 ]; then
              echo "Keeping $branch: open pull request exists."
              continue
            fi

            echo "Deleting stale branch: $branch (${days_old} days old)"
            git push origin --delete "$branch" || echo "GitHub refused deletion of $branch"
          done

      - name: Report cleanup
        run: |
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          remaining=$(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin \
            | grep -v '^HEAD$' \
            | grep -v '^main$' \
            | wc -l)
          echo "Branch cleanup complete. Remaining non-main branches: $remaining"
