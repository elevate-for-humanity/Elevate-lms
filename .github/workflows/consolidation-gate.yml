name: Unified Platform Consolidation Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - 'apps/**'
      - 'components/**'
      - 'lib/**'
      - 'packages/**'
      - 'supabase/**'
      - 'consolidation/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/consolidation-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: consolidation-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-safety:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'release/production-recovery-20260813' || github.head_ref == 'consolidation/unified-platform'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies=false

      - name: Validate consolidation manifests
        run: |
          node -e "JSON.parse(require('fs').readFileSync('consolidation/feature-preservation.json','utf8')); JSON.parse(require('fs').readFileSync('consolidation/supervisor-tasks.json','utf8')); console.log('Consolidation manifests valid')"

      - name: Guard navigation service URLs
        run: node scripts/check-navigation-hardcoding.mjs

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Guard client/server boundaries
        run: |
          if [ -f scripts/check-client-node-globals.mjs ]; then
            node scripts/check-client-node-globals.mjs
          fi

      - name: Redirect conflict check
        run: |
          if [ -f scripts/check-redirect-conflicts.mjs ]; then
            node scripts/check-redirect-conflicts.mjs
          fi

      - name: Confirm protected integration policy
        run: |
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          case "$branch" in
            release/production-recovery-20260813|consolidation/unified-platform)
              echo "Static consolidation safety gate passed for $branch"
              ;;
            *)
              echo "This gate is restricted to an approved integration branch: $branch"
              exit 1
              ;;
          esac
