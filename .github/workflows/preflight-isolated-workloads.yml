name: Preflight isolated Google workloads
on:
  pull_request:
    paths: ['scripts/gcp/preflight-isolated-workloads*', '.github/workflows/preflight-isolated-workloads.yml']
  push:
    branches: [main]
    paths: ['scripts/gcp/preflight-isolated-workloads*', '.github/workflows/preflight-isolated-workloads.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/gcp/preflight-isolated-workloads.test.mjs
  dispatch:
    if: github.event_name == 'push'
    needs: test
    permissions:
      actions: write
    runs-on: ubuntu-24.04
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/preflight-isolated-workloads.yml/dispatches" -f ref=main
  inspect:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: test
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        with:
          skip_install: true
      - run: node scripts/gcp/preflight-isolated-workloads.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-google-workload-preflight
          path: reports/isolated-workloads/preflight.json
          if-no-files-found: warn
          retention-days: 7
