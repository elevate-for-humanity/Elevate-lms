name: Upgrade Authored Course Experience

on:
  workflow_dispatch:
    inputs:
      course_id:
        description: Existing canonical course UUID to upgrade in place
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - 'lib/course-factory/authored-content-compiler.ts'
      - 'lib/course-factory/persisted-authored-upgrade.ts'
      - 'lib/course-factory/experience-contract.ts'
      - 'lib/curriculum/blueprints/barber/**'
      - 'scripts/course-factory/upgrade-authored-course.ts'
      - 'supabase/migrations/20260825123000_atomic_authored_course_experience_upgrade.sql'
      - '.github/workflows/upgrade-authored-course.yml'

permissions:
  contents: read

concurrency:
  group: authored-course-upgrade-${{ github.event_name == 'workflow_dispatch' && inputs.course_id || 'prestige-barber' }}
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: production
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      COURSE_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.course_id || '3fb5ce19-1cde-434c-a8c6-f138d7d7aa17' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          clean: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Require production database credentials
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies=false --prod=false

      - name: Prove the complete Barber blueprint compiles
        run: pnpm vitest run tests/unit/course-factory/authored-content-compiler.test.ts

      - name: Upgrade the exact authored course without changing publication or media ownership
        run: node --import tsx scripts/course-factory/upgrade-authored-course.ts --course-id "$COURSE_ID"
