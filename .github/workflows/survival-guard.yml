name: Survival Guard

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: survival-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reliability:
    name: Reliability & Critical Route Guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies=false
      - name: Recovery hardening regression check
        run: node scripts/verify-recovery-gate-hardening.mjs
      - name: Reliability guard (fake-success / silent-failure patterns)
        run: pnpm lint:reliability
      - name: Critical route guard (enrollment / booking / payment / signout)
        run: pnpm lint:critical-routes
