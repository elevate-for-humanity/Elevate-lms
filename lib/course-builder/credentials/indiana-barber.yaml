      - Chemical services
      - Safety and infection control
      - Indiana laws and rules
  - name: Practical Examination
    questions: 0
    passingScore: 75
    topics:
      - Haircut (men's)
      - Clipper cut
      - Razor cut
      - Beard trim
      - Hot towel treatment
      - Chemical relaxer

