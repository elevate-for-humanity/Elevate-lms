name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, work]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies=false
      - name: Recovery hardening regression check
        run: node scripts/verify-recovery-gate-hardening.mjs
      - name: TypeScript — Marketing
        run: pnpm run typecheck:marketing
      - name: TypeScript — LMS
        run: pnpm run typecheck:lms
      - name: TypeScript — Admin
        run: pnpm run typecheck:admin
      - name: Lint
        run: pnpm lint
