name: Registered Apprenticeship E2E

on:
  pull_request:
    paths:
      - '.github/workflows/registered-apprenticeship-e2e.yml'
      - 'components/programs/HvacTrainingShowcase.tsx'
      - 'public/videos/hvac-recruitment-20261029.mp4'
      - 'tests/e2e/hvac-hero-playback.spec.ts'
  workflow_dispatch:
    inputs:
      deployed_sha:
        description: Exact live commit from a completed deployment
        type: string
      deployment_run_id:
        description: Source deployment run to verify before accepting its commit
        type: string
      component:
        description: Deployed component whose public revision must match
        type: string
  push:
    branches:
      - main
    paths:
      - '.github/workflows/registered-apprenticeship-e2e.yml'
      - 'playwright.config.ts'
      - 'tests/e2e/registered-apprenticeship-authenticated.spec.ts'
      - 'tests/e2e/portal-responsive-design.spec.ts'
      - 'tests/e2e/public-runtime-acceptance.spec.ts'
      - 'tests/e2e/hvac-hero-playback.spec.ts'
      - 'scripts/gcp/production-acceptance.*'
      - 'scripts/qa/require-portal-e2e-identities.*'
      - 'scripts/qa/portal-acceptance-concurrency.test.mjs'
      - 'components/home/ScrollNarrator.tsx'
      - 'components/voice/useNaturalVoice.ts'
      - 'components/marketing/HeroVideo.tsx'
      - 'components/pwa/**'
      - 'scripts/check-registered-apprenticeship-architecture.mjs'
      - 'scripts/qa/provision-apprenticeship-e2e.mjs'
      - 'scripts/qa/provision-learner-program-holder-e2e.mjs'
      - 'scripts/qa/provision-remaining-portal-e2e.mjs'
  workflow_run:
    workflows:
      - Deploy repaired Google services
      - Deploy Admin
      - Repair Google Studio browser runtime
      - Deploy LMS automatically on Google
      - Deploy Google Marketing on trigger
    types:
      - completed

permissions:
  contents: read
  actions: read

jobs:
  hvac-public-playback:
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        device: [desktop-chrome, tablet-chrome, iphone-webkit, android-chrome]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      PLAYWRIGHT_BASE_URL: https://www.elevateforhumanity.org
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.2 }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: pnpm }
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies=false --ignore-scripts
      - run: pnpm exec playwright install chromium webkit --with-deps
      - name: Verify public HVAC film on desktop, tablet, iPhone and Android
        run: pnpm exec playwright test tests/e2e/hvac-hero-playback.spec.ts --config playwright.config.ts --reporter=line,html --output=test-results/hvac-hero --project=${{ matrix.device }}
      - name: Preserve playback samples, screenshots and browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hvac-hero-playback-${{ github.run_id }}-${{ matrix.device }}
          path: |
            test-results/hvac-hero/
            playwright-report/
          retention-days: 14
  production-authenticated-e2e:
    # Dispatch-only success proves the deployment ran, not just that it was queued.
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.head_branch == 'main'))
    # Acquire concurrency only after this job is admitted. Workflow-level locks
    # let skipped push-dispatch notifications cancel real production acceptance.
    # Keep source regression and exact deployed-SHA certification independent.
    concurrency:
      group: registered-apprenticeship-e2e-${{ (github.event_name == 'workflow_run' || inputs.deployment_run_id != '') && 'deployment' || 'source' }}
      cancel-in-progress: true
    name: Full portal authenticated persistence and responsive design
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 70
    env:
      PLAYWRIGHT_BASE_URL: https://app.elevateforhumanity.org
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify skipped notifications cannot cancel production acceptance
        run: node --test scripts/qa/portal-acceptance-concurrency.test.mjs
      - name: Verify explicit deployment handoff before checking out its tested commit
        if: inputs.deployment_run_id != '' || inputs.deployed_sha != '' || inputs.component != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPTANCE_COMPONENT: ${{ inputs.component }}
          ACCEPTANCE_SHA: ${{ inputs.deployed_sha }}
          ACCEPTANCE_RUN_ID: ${{ inputs.deployment_run_id }}
        run: |
          node --test scripts/gcp/production-acceptance.test.mjs
          node scripts/gcp/production-acceptance.mjs verify
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.deployed_sha || (github.event_name == 'workflow_run' && github.event.workflow_run.head_sha) || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Verify runtime Studio browser URL precedence
        run: node --test scripts/test-studio-browser-configuration.mjs
      - name: Verify production LMS is ready
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            ping_status=$(curl -sS --max-time 10 -o /tmp/lms-ping.json -w "%{http_code}" https://app.elevateforhumanity.org/api/ping || true)
            health_status=$(curl -sS --max-time 10 -o /tmp/lms-health.json -w "%{http_code}" https://app.elevateforhumanity.org/api/health || true)
            if [[ "$ping_status" == "200" && "$health_status" == "200" ]] && grep -q '"ok":true' /tmp/lms-ping.json && grep -q '"ready":true' /tmp/lms-health.json; then exit 0; fi
            echo "LMS not ready yet (ping=$ping_status health=$health_status), retry $i/20"
            sleep 15
          done
          echo "::error::Production LMS never reached ready state"
          exit 1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies=false
      - name: Require Supabase QA provisioning authority
        shell: bash
        run: |
          set -euo pipefail
          test -n "${NEXT_PUBLIC_SUPABASE_URL:-}" || { echo '::error::NEXT_PUBLIC_SUPABASE_URL is not configured'; exit 1; }
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}" || { echo '::error::SUPABASE_SERVICE_ROLE_KEY is not configured'; exit 1; }
      - name: Provision disposable Host Shop + Apprentice identities
        run: node scripts/qa/provision-apprenticeship-e2e.mjs provision
      - name: Provision isolated Learner + Program Holder identities
        run: node scripts/qa/provision-learner-program-holder-e2e.mjs provision
      - name: Provision Employer + Instructor + Staff + Case Manager + Admin identities
        run: node scripts/qa/provision-remaining-portal-e2e.mjs provision
      - name: Require all nine roles so authenticated tests cannot silently skip
        run: |
          node --test scripts/qa/require-portal-e2e-identities.test.mjs
          node scripts/qa/require-portal-e2e-identities.mjs
      - name: Install Chromium and WebKit
        run: pnpm exec playwright install chromium webkit --with-deps
      - name: Run registered-apprenticeship architecture gate
        run: node scripts/check-registered-apprenticeship-architecture.mjs
      - name: Verify public hydration, startup stability and audible-media exclusivity
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/public-runtime
        run: pnpm exec playwright test tests/e2e/public-runtime-acceptance.spec.ts tests/e2e/hvac-hero-playback.spec.ts --config playwright.config.ts --output=test-results/public-runtime --project=desktop-chrome --project=tablet-chrome --project=iphone-webkit --project=android-chrome
      - name: Certify Studio sign-in and fonts on all devices
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/studio
        run: pnpm exec playwright test tests/e2e/portal-responsive-design.spec.ts --grep "Admin session opens Studio and optional external browser tools remain usable on the active device" --config playwright.config.ts --output=test-results/studio --trace retain-on-failure --project=desktop-chrome --project=laptop-chrome --project=tablet-chrome --project=iphone-webkit --project=android-chrome
      - name: Run authenticated production functional E2E
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/functional
        run: pnpm exec playwright test tests/e2e/registered-apprenticeship-authenticated.spec.ts --config playwright.config.ts --output=test-results/functional --project=desktop-chrome
      - name: Run authenticated cross-device responsive design certification
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/responsive
        run: pnpm exec playwright test tests/e2e/portal-responsive-design.spec.ts --config playwright.config.ts --output=test-results/responsive --project=desktop-chrome --project=laptop-chrome --project=tablet-chrome --project=iphone-webkit --project=android-chrome
      - name: Require the attested release to remain live through acceptance
        if: ${{ !cancelled() && inputs.deployment_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPTANCE_COMPONENT: ${{ inputs.component }}
          ACCEPTANCE_SHA: ${{ inputs.deployed_sha }}
          ACCEPTANCE_RUN_ID: ${{ inputs.deployment_run_id }}
        run: node scripts/gcp/production-acceptance.mjs verify
      - name: Clean Employer + Instructor + Staff + Case Manager + Admin identities
        if: always()
        run: node scripts/qa/provision-remaining-portal-e2e.mjs cleanup
      - name: Clean isolated Learner + Program Holder identities
        if: always()
        run: node scripts/qa/provision-learner-program-holder-e2e.mjs cleanup
      - name: Clean disposable Host Shop + Apprentice identities
        if: always()
        run: node scripts/qa/provision-apprenticeship-e2e.mjs cleanup
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-portal-responsive-e2e-results
          path: |
            test-results/
            playwright-report/
          retention-days: 14
          if-no-files-found: ignore
      - name: Preserve production QA result in this run
        if: always()
        env:
          QA_STATUS: ${{ job.status }}
          QA_SHA: ${{ inputs.deployed_sha || (github.event_name == 'workflow_run' && github.event.workflow_run.head_sha) || github.sha }}
        run: |
          python3 - <<'PYTHON'
          import os
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as report:
              report.write('Production portal acceptance: ' + os.environ['QA_STATUS'] + '\n\n')
              report.write('Test source commit: `' + os.environ['QA_SHA'] + '`\n\n')
              report.write('Inspect the test steps and attached Playwright evidence for individual results. A queued run is not acceptance.\n')
          PYTHON
