name: Deploy LMS

on:
  push:
    branches:
      - main
      - 'fix/**'
      - 'chore/**'
    paths:
      - 'app/**'
      - '!app/admin/**'
      - 'apps/admin/**'
      - 'apps/lms/**'
      - 'Dockerfile.lms'
      - 'components/**'
      - 'lib/**'
      - 'public/**'
      - 'packages/**'
      - 'styles/**'
      - 'data/**'
      - 'types/**'
      - 'hooks/**'
      - 'contexts/**'
      - 'config/**'
      - 'content/**'
      - 'utils/**'
      - 'proxy.ts'
      - 'next.config.mjs'
      - 'tailwind.config.js'
      - 'tsconfig.json'
      - 'Dockerfile.northflank-lms'
      - 'scripts/northflank/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - '.github/workflows/deploy-lms.yml'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy (defaults to main)'
        required: false
        default: ''

permissions:
  contents: read

# FIXED: Use separate concurrency group - LMS deploys INDEPENDENTLY
concurrency:
  group: northflank-lms-deploy
  cancel-in-progress: true

jobs:
  deploy-lms:
    name: Build and deploy LMS on Northflank
    runs-on: ubuntu-latest
    # Wait for CI/CD Pipeline to complete and upload artifacts first
    needs: []
    # Set to: needs: [ci-cd-pipeline-id] once CI/CD is fixed to upload artifacts
    env:
      NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
      NORTHFLANK_TEAM_ID: ${{ secrets.NORTHFLANK_TEAM_ID || 'elevates-team' }}
      NORTHFLANK_PROJECT_ID: ${{ secrets.NORTHFLANK_PROJECT_ID || 'elevate-platform' }}
      NORTHFLANK_LMS_SERVICE_ID: ${{ secrets.NORTHFLANK_LMS_SERVICE_ID || 'elevate-lms' }}
      NORTHFLANK_TARGET_SERVICE: lms
      DEPLOY_BRANCH: main
      NORTHFLANK_EPHEMERAL_STORAGE_MB: '32768'
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_FACEBOOK_PIXEL_ID: ${{ secrets.NEXT_PUBLIC_FACEBOOK_PIXEL_ID }}
      ONET_API_KEY: ${{ secrets.ONET_API_KEY }}
      CAREERONESTOP_USER_ID: ${{ secrets.CAREERONESTOP_USER_ID }}
      CAREERONESTOP_TOKEN: ${{ secrets.CAREERONESTOP_TOKEN }}
      USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          clean: true

      - name: Verify source commit SHA
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          EXPECTED_SHA="${{ github.sha }}"
          echo "Expected SHA: $EXPECTED_SHA"
          echo "Actual SHA:   $ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          test "$(git status --porcelain)" = ""
          echo "SHA verification passed"

      - name: Generate version file
        run: |
          cat > public/version.json <<EOF
          {
            "service": "lms",
            "commit": "${{ github.sha }}",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Configure Northflank LMS service only
        run: pnpm tsx scripts/northflank/configure-services.ts "$NORTHFLANK_LMS_SERVICE_ID" --execute

      - name: Patch LMS build ephemeral storage
        run: pnpm tsx scripts/northflank/patch-ephemeral-storage.ts "$NORTHFLANK_LMS_SERVICE_ID" --execute

      # Skip pre-build health check - containers may be down during fresh deployment
      # Health check happens AFTER deployment in "Smoke LMS" step

      - name: Point LMS service at main
        run: pnpm tsx scripts/northflank/set-service-branch.ts "$NORTHFLANK_LMS_SERVICE_ID" "$DEPLOY_BRANCH"

      - name: Trigger LMS build
        id: trigger_lms_build
        run: pnpm tsx scripts/northflank/trigger-build.ts "$NORTHFLANK_LMS_SERVICE_ID"

      - name: Wait for LMS build to complete
        run: pnpm tsx scripts/northflank/wait-service.ts "$NORTHFLANK_LMS_SERVICE_ID" --build-id "${{ steps.trigger_lms_build.outputs.build_id }}" --timeout-ms 3600000

      - name: Roll out latest LMS image
        run: pnpm tsx scripts/northflank/trigger-deployment.ts "$NORTHFLANK_LMS_SERVICE_ID"

      - name: Wait for LMS deployment
        run: pnpm tsx scripts/northflank/wait-service.ts "$NORTHFLANK_LMS_SERVICE_ID" --timeout-ms 600000

      - name: Verify deployed SHA matches main
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          # If deploy is stale due to concurrent workflows, trust SUCCESS/COMPLETED status
          pnpm tsx scripts/northflank/verify-deployed-sha.ts elevate-lms --trust-deploy-status

      - name: Smoke LMS
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            status=$(curl -sk --max-time 10 -o /tmp/lms-health.json -w "%{http_code}" https://app.elevateforhumanity.org/api/ping || true)
            body=$(cat /tmp/lms-health.json 2>/dev/null || true)
            if [ "$status" = "200" ] && echo "$body" | grep -qE '"ok":true|"status":"(ok|healthy)"'; then
              echo "LMS liveness passed."
              exit 0
            fi
            echo "LMS liveness not ready yet: HTTP ${status}. Retry ${i}/20."
            sleep 15
          done
          echo "LMS liveness failed after deploy."
          cat /tmp/lms-health.json 2>/dev/null || true
          exit 1
