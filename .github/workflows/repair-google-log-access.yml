name: Repair and verify Google runtime log access
on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair-google-log-access.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: write
  id-token: write
jobs:
  dispatch:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch trusted IAM repair
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/repair-google-log-access.yml/dispatches" -f ref=main
  repair:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    concurrency:
      group: google-project-iam-repair
      cancel-in-progress: false
    steps:
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        with:
          skip_install: true
      - name: Repair observed logging permission and verify actual read
        shell: bash
        run: |
          set -euo pipefail
          FILTER='resource.type="cloud_run_revision" AND resource.labels.service_name="elevate-admin-migration"'
          if ! gcloud logging read "$FILTER" --project=elegant-racer-299721 --freshness=30m --limit=1 --format='value(timestamp)' >/tmp/log-access-result 2>/tmp/log-access-error; then
            if ! grep -Eqi 'PERMISSION_DENIED|permission.*denied' /tmp/log-access-error; then
              echo '::error::Runtime log read failed for a reason other than missing IAM permission'
              exit 1
            fi
            gcloud projects add-iam-policy-binding elegant-racer-299721               --member=serviceAccount:elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com               --role=roles/logging.viewer --condition=None --format='value(etag)' --quiet
          fi
          for attempt in 1 2 3 4 5 6; do
            if gcloud logging read "$FILTER" --project=elegant-racer-299721 --freshness=30m --limit=1 --format='value(timestamp)' >/tmp/log-access-result 2>/tmp/log-access-error; then
              echo 'Google runtime log read verified; no log payloads exported.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo '::error::Runtime log read remains denied after scoped repair'
          exit 1
      - name: Run the actual live rendering verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/verify-live-admin-rendering.yml/dispatches" -f ref=main
