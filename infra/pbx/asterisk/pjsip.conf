; Elevate-owned PBX foundation.
; Runtime provisioning writes authenticated PWA endpoints separately.
[global]
type=global
user_agent=Elevate Communications

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0:8089

; Telnyx is an external PSTN/SMS gateway only. Credentials and the live
; endpoint are rendered from Google Secret Manager during PBX provisioning.
