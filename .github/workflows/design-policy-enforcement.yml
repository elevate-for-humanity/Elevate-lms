name: Design Policy Enforcement

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/**'
      - 'app-legacy/**'
      - 'apps/marketing/**'
      - 'apps/lms/**'
      - 'apps/admin/**'
      - 'components/**'
      - 'public/**'
      - 'scripts/design-enforcer.mjs'
      - 'scripts/image-contract.mjs'
      - '.github/workflows/design-policy-enforcement.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'app-legacy/**'
      - 'apps/marketing/**'
      - 'apps/lms/**'
      - 'apps/admin/**'
      - 'components/**'
      - 'public/**'

concurrency:
  group: design-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  enforce-design-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies=false
      - name: Recovery hardening regression check
        run: node scripts/verify-recovery-gate-hardening.mjs
      - name: Design policy strict audit
        run: node scripts/design-enforcer.mjs --strict
      - name: Image contract strict audit
        run: node scripts/image-contract.mjs --strict
      - name: Canonical hero audit
        run: pnpm run audit:hero-banners
