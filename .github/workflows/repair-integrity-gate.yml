name: Repair Integrity Gate

on:
  push:
    paths:
      - '.github/workflows/repair-integrity-gate.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Repair deterministic public UX/media blockers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_nth(text, old, new, n):
              start = -1
              for _ in range(n):
                  start = text.find(old, start + 1)
                  if start < 0:
                      return text
              return text[:start] + new + text[start + len(old):]

          for path in [
              'apps/marketing/app/privacy/page.tsx',
              'apps/marketing/app/store/testing/page.tsx',
          ]:
              text = read(path)
              text2 = re.sub(
                  r'(<Image\b(?:(?!/>)[\s\S])*?\bfill\b)(?=(?:(?!/>)[\s\S])*?/>)',
                  lambda m: m.group(1) if 'sizes=' in m.group(0) else m.group(1) + '\n          sizes="100vw"',
                  text,
                  count=1,
              )
              write(path, text2)

          path = 'apps/marketing/app/how-it-works/page.tsx'
          text = read(path)
          if 'const HOW_IT_WORKS_HERO' not in text:
              text = text.replace("'/images/pages/how-it-works-hero.webp'", 'HOW_IT_WORKS_HERO')
              anchor = 'export const revalidate = 3600;\n'
              text = text.replace(anchor, anchor + "\nconst HOW_IT_WORKS_HERO = '/images/pages/how-it-works-hero.webp';\n", 1)
          text = text.replace("image: HOW_IT_WORKS_HERO,\n                cta: 'View Programs'", "image: '/images/pages/certifications-page-1.webp',\n                cta: 'View Programs'", 1)
          write(path, text)

          path = 'apps/marketing/app/testing/page.tsx'
          text = read(path)
          text = replace_nth(text, '/images/pages/career-services-page-1.webp', '/images/pages/career-counseling-page-1.webp', 1)
          text = replace_nth(text, '/images/pages/career-services-page-1.webp', '/images/pages/certifications-page-1.webp', 2)
          write(path, text)

          path = 'apps/marketing/app/funding/page.tsx'
          text = read(path)
          if 'const FUNDING_HERO' not in text:
              text = text.replace("'/images/pages/funding-page-5.webp'", 'FUNDING_HERO')
              anchor = "import { PLATFORM_DEFAULTS } from '@/lib/config/platform-config';\n"
              text = text.replace(anchor, anchor + "\nconst FUNDING_HERO = '/images/pages/funding-page-5.webp';\n", 1)
          text = replace_nth(text, '/images/pages/funding-page-3.webp', '/images/pages/certifications-page-1.webp', 2)
          write(path, text)

          path = 'apps/marketing/app/success-stories/page.tsx'
          text = read(path)
          text = replace_nth(text, '/images/pages/career-counseling.jpg', '/images/pages/healthcare-grad.jpg', 2)
          write(path, text)

          path = 'apps/marketing/app/blog/page.tsx'
          text = read(path)
          text = replace_nth(text, '/images/pages/admin-campaigns-hero.webp', '/images/pages/certifications-page-1.webp', 2)
          write(path, text)

          path = 'apps/marketing/app/hire-graduates/page.tsx'
          text = read(path)
          text = text.replace('/images/pages/comp-home-highlight-health.webp', '/images/pages/about-employer-partners.webp')
          write(path, text)

          path = 'apps/marketing/app/funding/wioa/page.tsx'
          text = read(path)
          text = text.replace('/images/pages/funding-page-5.webp', '/images/pages/career-counseling-page-1.webp')
          write(path, text)

          path = 'components/store/GuidedProductInterview.tsx'
          text = read(path)
          text = text.replace(
              'mt-6 rounded-2xl border border-white/10 bg-white/5 p-6 text-slate-300',
              'mt-6 rounded-2xl border border-slate-700 bg-slate-950 p-6 text-slate-100',
              1,
          )
          write(path, text)
          PY

          git config user.name "elevateforhumanity"
          git config user.email "Elizabethpowell6262@gmail.com"
          git add apps/marketing/app/privacy/page.tsx \
                  apps/marketing/app/store/testing/page.tsx \
                  apps/marketing/app/how-it-works/page.tsx \
                  apps/marketing/app/testing/page.tsx \
                  apps/marketing/app/funding/page.tsx \
                  apps/marketing/app/success-stories/page.tsx \
                  apps/marketing/app/blog/page.tsx \
                  apps/marketing/app/hire-graduates/page.tsx \
                  apps/marketing/app/funding/wioa/page.tsx \
                  components/store/GuidedProductInterview.tsx
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No source changes needed"
            exit 0
          fi
          git commit -m "fix(integrity): resolve public UX and media acceptance blockers"
          git push origin main
