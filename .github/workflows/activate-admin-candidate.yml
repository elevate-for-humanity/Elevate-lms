name: Activate an existing Admin candidate
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Exact existing Admin revision to health-check and activate
        required: true
        type: string
      image_sha:
        description: Full main-branch commit embedded in the candidate image
        required: true
        type: string
permissions:
  contents: read
  id-token: write
jobs:
  activate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    concurrency:
      group: google-admin-runtime-operations
      cancel-in-progress: false
    env:
      CANDIDATE_SERVICE: elevate-admin-migration
      CANDIDATE_REVISION: ${{ inputs.revision }}
      IMAGE_SHA: ${{ inputs.image_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify candidate commit belongs to main
        shell: bash
        run: |
          set -euo pipefail
          [[ "$IMAGE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$CANDIDATE_REVISION" =~ ^elevate-admin-migration-[a-z0-9-]+$ ]]
          git merge-base --is-ancestor "$IMAGE_SHA" HEAD
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        with:
          skip_install: true
      - run: node scripts/gcp/activate-tested-public-revision.mjs
      - name: Verify exact live Admin commit and Supabase health
        shell: bash
        run: |
          set -euo pipefail
          export GITHUB_SHA="$IMAGE_SHA"
          export GOOGLE_ADMIN_URL="$(gcloud run services describe elevate-admin-migration --project=elegant-racer-299721 --region=us-central1 --format='value(status.url)')"
          node scripts/gcp/verify-admin-revision.mjs
