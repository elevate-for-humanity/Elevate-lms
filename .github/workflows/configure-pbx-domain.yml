name: Verify Elevate PBX domain (Durable DNS)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/configure-pbx-domain.yml'
  schedule:
    - cron: '23 * * * *'
permissions:
  contents: read
jobs:
  verify-domain:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 5
    steps:
      - name: Verify externally managed DNS and HTTPS
        shell: bash
        run: |
          set -euo pipefail
          host=phone.elevateforhumanity.org
          expected=107.178.216.162
          resolved="$(dig +short A "$host" | grep -E '^[0-9]+(\.[0-9]+){3}$' || true)"
          echo "A records: $resolved"
          if ! printf '%s\n' "$resolved" | grep -Fxq "$expected"; then
            echo "::error::Durable DNS A record for $host must point to $expected"
            exit 1
          fi
          echo "DNS verified. Checking TLS and HTTPS without modifying phone service."
          curl --silent --show-error --fail --max-time 15 --output /dev/null "https://$host/healthz"

      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify strict SIP WebSocket acceptance without placing a call
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { verifySipUpgrade } from './scripts/gcp/verify-pbx-transport.mjs';
          const result = await verifySipUpgrade();
          console.log(JSON.stringify(result));
          if (result.result !== 'PASS') process.exit(1);
          NODE
