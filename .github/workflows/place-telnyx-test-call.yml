name: Place Authorized Telnyx Test Call

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  call:
    name: Call 317-760-7908 from 317-999-9620
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        with: {skip_install: true}
      - name: Place authorized switchboard test call
        run: node .github/scripts/place-telnyx-test-call.mjs
