name: One-time Admin root canonicalization

on:
  push:
    branches:
      - fix/admin-root-links-release-gate

permissions:
  contents: write

jobs:
  canonicalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-root-links-release-gate
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Canonicalize retired Admin UI prefixes
        shell: python
        run: |
          from pathlib import Path

          roots = [Path('apps/admin/app'), Path('apps/lms/app'), Path('components'), Path('lib/routes')]
          extensions = {'.ts', '.tsx', '.js', '.jsx', '.mjs'}
          replacements = [
              ('"/admin/', '"/'),
              ("'/admin/", "'/"),
              ('`/admin/', '`/'),
              ('"/admin"', '"/"'),
              ("'/admin'", "'/'"),
              ('`/admin`', '`/`'),
          ]

          changed = []
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob('*'):
                  if not path.is_file() or path.suffix not in extensions:
                      continue
                  original = path.read_text(encoding='utf-8')
                  updated = original
                  for old, new in replacements:
                      updated = updated.replace(old, new)
                  if updated != original:
                      path.write_text(updated, encoding='utf-8')
                      changed.append(str(path))

          print(f'Canonicalized {len(changed)} source files')
          for path in changed:
              print(path)
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies=false
      - name: Verify Admin route consolidation unit test
        run: pnpm exec vitest run tests/unit/course-builder-route-consolidation.test.ts
      - name: Remove one-time workflow and commit canonical source
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-time-admin-root-canonicalization.yml
          if git diff --quiet; then
            echo 'No source changes were required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/admin/app apps/lms/app components lib/routes .github/workflows/one-time-admin-root-canonicalization.yml
          git commit -m 'fix(admin): canonicalize root-level UI links'
          git push origin HEAD:fix/admin-root-links-release-gate
