name: Dispatch Northflank Production Deploy

on:
  push:
    branches: [main]
    paths:
      - '.northflank-trigger'

permissions:
  actions: write
  contents: read

concurrency:
  group: northflank-trigger-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch requested production services
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trigger request
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Parse deployment request
        id: request
        shell: bash
        run: |
          set -Eeuo pipefail

          REQUESTED_SHA="$(sed -n 's/^merge_sha=//p' .northflank-trigger | tail -n1 | tr -d '[:space:]')"
          SERVICES="$(sed -n 's/^services=//p' .northflank-trigger | tail -n1 | tr -d '[:space:]')"

          if [[ ! "$REQUESTED_SHA" =~ ^[a-fA-F0-9]{7,40}$ ]]; then
            echo "::error::Invalid or missing merge_sha in .northflank-trigger"
            exit 1
          fi

          if [[ -z "$SERVICES" ]]; then
            echo "::error::No services requested in .northflank-trigger"
            exit 1
          fi

          echo "sha=$REQUESTED_SHA" >> "$GITHUB_OUTPUT"
          echo "services=$SERVICES" >> "$GITHUB_OUTPUT"
          echo "Deploy request: $SERVICES @ $REQUESTED_SHA"

      - name: Dispatch canonical production workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ steps.request.outputs.sha }}
          SERVICES: ${{ steps.request.outputs.services }}
        shell: bash
        run: |
          set -Eeuo pipefail

          dispatch_service() {
            local service="$1"
            case "$service" in
              marketing|admin|lms)
                echo "Dispatching $service production deployment for $REQUESTED_SHA"
                gh workflow run elevate-production-deploy.yml \
                  --repo "${{ github.repository }}" \
                  --ref main \
                  -f service="$service" \
                  -f environment=production \
                  -f git_sha="$REQUESTED_SHA"
                ;;
              all)
                echo "Dispatching all production services for $REQUESTED_SHA"
                gh workflow run elevate-production-deploy.yml \
                  --repo "${{ github.repository }}" \
                  --ref main \
                  -f service=all \
                  -f environment=production \
                  -f git_sha="$REQUESTED_SHA"
                ;;
              *)
                echo "::error::Unsupported service in .northflank-trigger: $service"
                exit 1
                ;;
            esac
          }

          if [[ "$SERVICES" == "all" ]]; then
            dispatch_service all
          else
            IFS=',' read -ra SERVICE_LIST <<< "$SERVICES"
            for service in "${SERVICE_LIST[@]}"; do
              dispatch_service "$service"
            done
          fi
