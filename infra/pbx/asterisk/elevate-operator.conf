; Managed Elevate operator fallback
; Generated on the PBX by scripts/gcp/configure-owned-voicemail.py from
; phone_systems.admin_extension (100 at the time of this alignment): the
; caller-facing operator entry stays digit 0 in [internal], while the ring
; target and the voicemail box follow the configured admin extension.
; This checked-in copy mirrors the generated shape; the live file is owned
; by that configuration flow, not by hand edits.
[internal]
exten => 0,1,Gosub(elevate-operator,s,1)
 same => n,Hangup()
[elevate-operator]
exten => s,1,GotoIf($[${DIALPLAN_EXISTS(elevate-pwa-extensions,100,1)}=0]?voicemail)
 same => n,Gosub(elevate-pwa-extensions,100,1)
 same => n,GotoIf($["${DIALSTATUS}"="ANSWER"]?done)
 same => n(voicemail),VoiceMail(100@elevate,u)
 same => n(done),Return()
