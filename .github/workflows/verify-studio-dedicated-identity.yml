name: Verify owner-prepared Studio identity
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node --test scripts/gcp/verify-studio-service-identity.test.mjs
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - run: node scripts/gcp/verify-studio-service-identity.mjs
      - name: Read back the latest ready Studio revision and actual serving traffic
        run: |
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          try {
            const read=(args,format)=>JSON.parse(execFileSync('gcloud',[...args,'--project=elegant-racer-299721','--region=us-central1','--format='+format],{encoding:'utf8',timeout:30000,stdio:['ignore','pipe','pipe']}));
            const service=read(['run','services','describe','elevate-studio-browser'],'json(status.latestReadyRevisionName,status.traffic)');
            const name=service.status?.latestReadyRevisionName;
            if(!/^elevate-studio-browser-[a-z0-9-]+$/.test(name||''))throw Error('invalid_revision');
            const revision=read(['run','revisions','describe',name],'json(metadata.name,spec.serviceAccountName,spec.containers.image,spec.containers.resources.limits)');
            if(revision.spec?.serviceAccountName!=='elevate-studio-runtime@elegant-racer-299721.iam.gserviceaccount.com')throw Error('dedicated_identity_not_attached');
            console.log(JSON.stringify({readOnly:true,latestReadyRevision:name,runtimeIdentity:revision.spec.serviceAccountName,containers:revision.spec.containers.map(c=>({image:c.image,resources:c.resources?.limits})),traffic:(service.status?.traffic||[]).map(t=>({revision:t.revisionName,percent:t.percent||0,tag:t.tag||null})),productionTrafficChanged:false}));
          } catch {console.error('STUDIO_RUNTIME_READBACK_UNVERIFIED');process.exitCode=1;}
          NODE
