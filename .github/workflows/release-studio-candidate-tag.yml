name: Release unused Studio verification tag
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-studio-candidate-tag.yml']
  workflow_dispatch:
    inputs:
      revision:
        description: Exact non-serving Studio candidate revision whose temporary alias may be removed
        type: string
        required: true
      tag:
        description: Exact unused verification tag; serving and Admin-bound tags are protected
        type: string
        default: studio-verify
permissions:
  contents: read
jobs:
  dispatch-cleanup:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.GOOGLE_RELEASE_HOLD != 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    timeout-minutes: 5
    steps:
      - name: Request the bounded cleanup through the trusted dispatch identity
        env:
          GH_TOKEN: ${{ github.token }}
        # Google trusts workflow_dispatch for this production identity. The push
        # job only dispatches; it never requests a Google token or changes IAM.
        run: >-
          gh api --method POST
          "repos/$GITHUB_REPOSITORY/actions/workflows/release-studio-candidate-tag.yml/dispatches"
          -f ref=main
          -f 'inputs[revision]=elevate-studio-browser-00063-buj'
          -f 'inputs[tag]=sc-2aba3de5-c8976733'
  cleanup:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    environment: production
    timeout-minutes: 5
    concurrency:
      # Releasing an unused alias allocates no CPU/memory and must not wait
      # behind deployments that are blocked by the capacity it is retaining.
      group: google-studio-browser-runtime-operations
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: node --test scripts/gcp/release-studio-candidate-tag.test.mjs
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        with: {skip_install: true}
      - name: Remove only the exact unused verification alias and verify preserved production traffic
        env:
          STUDIO_CANDIDATE_REVISION: ${{ inputs.revision }}
          STUDIO_CANDIDATE_TAG: ${{ inputs.tag }}
        run: node scripts/gcp/release-studio-candidate-tag.mjs
