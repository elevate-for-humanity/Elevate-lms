name: GPU Worker Build, Provision and Acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'services/media-gpu-worker/**'
      - 'lib/video/gpu-video-client.ts'
      - 'lib/video/process-video-job.ts'
      - 'scripts/northflank/provision-gpu-worker.ts'
      - '.github/workflows/gpu-worker.yml'

concurrency:
  group: gpu-worker-production
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  validate-and-provision:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
      NORTHFLANK_PROJECT_ID: elevate-platform
      NORTHFLANK_GPU_PROJECT_ID: elevate-platform
      NORTHFLANK_ADMIN_SERVICE_ID: elevate-admin
      NORTHFLANK_GPU_REGION: us-east1
      NORTHFLANK_GPU_SERVICE_ID: elevate-gpu-worker
      NORTHFLANK_GPU_MODEL_VOLUME_ID: elevate-gpu-models
      NORTHFLANK_GPU_MODEL_VOLUME_MB: '153600'
      NORTHFLANK_GPU_COUNT: '1'
      GPU_VIDEO_PROVIDER: wan
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Mark GPU acceptance pending
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"pending\",\"context\":\"GPU Media Acceptance\",\"description\":\"Provisioning NVIDIA L4/Wan worker and real MP4 acceptance\",\"target_url\":\"${RUN_URL}\"}" >/dev/null

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies=false

      - name: Validate GPU worker sources
        run: |
          python -m py_compile services/media-gpu-worker/worker.py
          python -m py_compile services/media-gpu-worker/bootstrap_models.py

      - name: Validate canonical GPU provisioner
        run: pnpm exec tsx scripts/northflank/provision-gpu-worker.ts

      # Northflank builds the CUDA image from this exact GITHUB_SHA below. That
      # production image build is the authoritative Docker/CUDA build gate.
      - name: Verify Northflank credential
        run: test -n "$NORTHFLANK_API_TOKEN"

      - name: Provision worker, model volume, exact-SHA CUDA build, secrets, and real Wan acceptance
        run: pnpm exec tsx scripts/northflank/provision-gpu-worker.ts --execute

      - name: Report GPU acceptance status
        if: always()
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ "${{ job.status }}" = "success" ]; then
            STATE=success
            DESC="L4/Wan worker provisioned; model volume ready; real MP4 accepted"
          else
            STATE=failure
            DESC="GPU provisioning or real MP4 acceptance failed; inspect workflow logs"
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"${STATE}\",\"context\":\"GPU Media Acceptance\",\"description\":\"${DESC}\",\"target_url\":\"${RUN_URL}\"}" >/dev/null
