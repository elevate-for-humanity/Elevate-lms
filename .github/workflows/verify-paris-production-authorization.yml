name: Verify PARIS Admin production authorization
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact deployed main SHA to verify
        required: false
        type: string
      credential_source:
        description: Explicit runtime credential to verify; no workflow-token override
        type: choice
        options: [runtime-token, github-app-installation]
        default: runtime-token
        required: false
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: paris-production-readonly-verification
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        with:
          skip_install: true
      - name: Verify actual Admin 100-percent traffic and merged diagnostic revision
        run: |
          python3 - <<'PY'
          import json,subprocess,os,sys
          cmd=['gcloud','run','services','describe','elevate-admin-migration','--project=elegant-racer-299721','--region=us-central1','--format=json']
          service=json.loads(subprocess.check_output(cmd,text=True))
          traffic=service.get('status',{}).get('traffic',[])
          serving=[t for t in traffic if int(t.get('percent',0))>0]
          if len(serving)!=1 or int(serving[0].get('percent',0))!=100:
            raise SystemExit('ADMIN_TRAFFIC_NOT_EXACTLY_ONE_REVISION_AT_100_PERCENT')
          revision=serving[0].get('revisionName')
          if not revision: raise SystemExit('ADMIN_SERVING_REVISION_MISSING')
          details=json.loads(subprocess.check_output(['gcloud','run','revisions','describe',revision,'--project=elegant-racer-299721','--region=us-central1','--format=json'],text=True))
          labels=details.get('metadata',{}).get('labels',{})
          print(json.dumps({'type':'admin_traffic','revision':revision,'percent':100,'labels':{k:v for k,v in labels.items() if 'commit' in k or 'sha' in k}}))
          # Actual revision health/commit is verified separately through public health.
          PY
      - name: Verify public serving Admin commit matches the requested release
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha || github.sha }}
        run: |
          python3 - <<'PY'
          import json,urllib.request,subprocess,os,re
          from urllib.parse import urlencode
          url='https://admin.elevateforhumanity.org/api/health?'+urlencode({'verification':'paris-auth-20261017','run':os.environ['GITHUB_RUN_ID']})
          req=urllib.request.Request(url,headers={'Cache-Control':'no-store, no-cache','Pragma':'no-cache'})
          with urllib.request.urlopen(req,timeout=25) as response:
            body=json.load(response)
            if response.status != 200 or body.get('service')!='admin' or body.get('healthy') is not True:
              raise SystemExit('ADMIN_PRODUCTION_HEALTH_FAILED')
          sha=body.get('commit') or body.get('commitSha')
          if not isinstance(sha,str) or not re.fullmatch('[a-f0-9]{40}',sha):
            raise SystemExit('ADMIN_PRODUCTION_COMMIT_MISSING')
          if sha!=os.environ['EXPECTED_SHA']:
            raise SystemExit('ADMIN_PRODUCTION_COMMIT_DIFFERS_FROM_REQUESTED_RELEASE')
          print(json.dumps({'type':'admin_live_version','commit':sha,'exactRequestedRelease':True}))
          PY
      - name: Obtain short-lived PARIS workflow identity
        env:
          AUDIENCE: elevate-paris-code-repair
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          (async()=>{
            const url=new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
            url.searchParams.set('audience',process.env.AUDIENCE);
            const response=await fetch(url,{headers:{Authorization:'Bearer '+process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}});
            if(!response.ok)throw Error('Workflow identity issuance failed: HTTP '+response.status);
            const token=(await response.json()).value;
            if(!token || token.split('.').length!==3)throw Error('Invalid workflow identity');
            process.stdout.write('::add-mask::'+token+'\n');
            fs.appendFileSync(process.env.GITHUB_ENV,'PARIS_ID_TOKEN='+token+'\n');
          })().catch(err=>{console.error(err.message);process.exitCode=1});
          NODE
      - name: Verify the runtime credential through the protected read-only diagnostic
        env:
          # OIDC authorizes this read-only request. No job token is forwarded.
          VERIFICATION_SOURCE: ${{ inputs.credential_source || 'runtime-token' }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error,sys
          secret=os.environ.get('PARIS_ID_TOKEN','')
          if not secret: raise SystemExit('PARIS_WORKFLOW_IDENTITY_UNAVAILABLE')
          endpoint='https://admin.elevateforhumanity.org/api/cron/paris-code-repair'
          source=os.environ['VERIFICATION_SOURCE']
          if source not in ['runtime-token','github-app-installation']: raise SystemExit('INVALID_CREDENTIAL_SOURCE')
          phase='app-auth-diagnostic' if source=='github-app-installation' else 'auth-diagnostic'
          req=urllib.request.Request(endpoint,data=json.dumps({'phase':phase}).encode(),headers={'Authorization':'Bearer '+secret,'Content-Type':'application/json','Cache-Control':'no-store'},method='POST')
          try:
            with urllib.request.urlopen(req,timeout=30) as response:
              body=json.load(response)
              if response.status!=200: raise SystemExit('PARIS_DIAGNOSTIC_HTTP_NOT_200')
          except urllib.error.HTTPError as e:
            # Never print upstream error response text or request credentials.
            print(json.dumps({'type':'paris_diagnostic','httpStatus':e.code,'ok':False}))
            raise SystemExit('PARIS_DIAGNOSTIC_HTTP_FAILURE')
          repo=body.get('repository',{})
          contents=body.get('contents',{})
          workflow=body.get('workflow',{})
          safe={'type':'paris_diagnostic','diagnostic_version':body.get('diagnosticVersion'),'repo_status':repo.get('status'),'repo_ok':repo.get('ok') is True,'contents_ok':contents.get('ok') is True,'workflow_ok':workflow.get('ok') is True,'write_authority':'not_exercised'}
          print(json.dumps(safe))
          source_ok=source=='runtime-token' or body.get('credentialSource')=='github-app-installation'
          if not source_ok or safe['diagnostic_version']!=2 or not safe['repo_ok'] or not safe['contents_ok'] or not safe['workflow_ok']:
            raise SystemExit('PARIS_GITHUB_CONNECTIVITY_CHECK_FAILED')
          PY
