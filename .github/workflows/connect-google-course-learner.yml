name: Connect Course Builder learner checks to Google
on:
  pull_request:
    paths:
      - 'scripts/gcp/connect-course-learner-google*'
      - 'scripts/gcp/runtime-config*'
      - '.github/workflows/connect-google-course-learner.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/gcp/connect-course-learner-google*'
      - '.github/workflows/connect-google-course-learner.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node --test scripts/gcp/connect-course-learner-google.test.mjs scripts/gcp/runtime-config.test.mjs scripts/gcp/deploy-course-job.test.mjs
  dispatch:
    if: github.event_name == 'push'
    needs: test
    permissions: {actions: write}
    runs-on: ubuntu-24.04
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/connect-google-course-learner.yml/dispatches" -f ref=main
  connect:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: test
    permissions: {contents: read, id-token: write}
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency: {group: google-course-runtime-operations, cancel-in-progress: false}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        with: {skip_install: true}
      - name: Verify Google browser and replace only the learner endpoint
        run: node scripts/gcp/connect-course-learner-google.mjs
