name: Verify integration connections
on:
  push:
    branches: [main]
    paths: ['scripts/gcp/verify-integration-connections*', '.github/workflows/integration-connection-acceptance.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: write
  id-token: write
concurrency:
  group: integration-connection-acceptance
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test scripts/gcp/verify-integration-connections.test.mjs
  dispatch:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST repos/$GITHUB_REPOSITORY/actions/workflows/integration-connection-acceptance.yml/dispatches -f ref=main
          gh api --method POST repos/$GITHUB_REPOSITORY/actions/workflows/audit-google-oauth-locations.yml/dispatches -f ref=main
  verify:
    needs: test
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        with: {skip_install: true}
      - name: Verify live connections without messages, charges or resource creation
        run: node scripts/gcp/verify-integration-connections.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-connections-${{ github.sha }}
          path: integration-connections.json
          if-no-files-found: warn
