name: Marketing Staging Gate

on:
  pull_request:
    branches: [main]
    # Skip the container build only when every change is unrelated to Marketing.
    paths-ignore:
      - 'docs/**'
      - 'internal-docs/**'
      - 'tests/e2e/**'
      - '.github/workflows/deploy-admin.yml'
      - '.github/workflows/deploy-google-lms-trigger.yml'
      - '.github/workflows/deploy-google-store-runtime.yml'
      - 'scripts/test-github-authorization-contract.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketing-staging-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.28.2'
  # Dependency updates use only the isolated public build configuration.
  NEXT_PUBLIC_SUPABASE_URL: >-
    ${{ (github.event.pull_request.user.login == 'dependabot[bot]' && secrets.E2E_SUPABASE_URL)
        || (github.event.pull_request.user.login != 'dependabot[bot]' && (secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL)) || '' }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: >-
    ${{ (github.event.pull_request.user.login == 'dependabot[bot]' && secrets.E2E_SUPABASE_ANON_KEY)
        || (github.event.pull_request.user.login != 'dependabot[bot]' && (secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY)) || '' }}

jobs:
  marketing-staging:
    name: Deploy Marketing → staging
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies deterministically
        run: node scripts/run-bounded-build.mjs -- pnpm install --frozen-lockfile --strict-peer-dependencies=false

      - name: Verify public claim integrity
        run: node scripts/check-public-claims.mjs

      - name: Verify Marketing CSS dependency scope
        run: node --test scripts/marketing-tailwind-content.test.mjs scripts/build-marketing-css.test.mjs

      - name: Verify canonical hero media registry
        run: pnpm tsx scripts/verify-hero-video-registry.ts

      - name: Verify automatic container memory policy
        run: node scripts/check-build-memory-policy.mjs --source-only
      - name: Build Marketing container
        run: |
          docker build \
            --file Dockerfile.marketing \
            --tag elevate-marketing:staging-gate \
            --build-arg NF_GIT_SHA=${{ github.sha }} \
            --build-arg GITHUB_SHA=${{ github.sha }} \
            --build-arg GIT_SHA=${{ github.sha }} \
            --build-arg NEXT_PUBLIC_GIT_SHA=${{ github.sha }} \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="${NEXT_PUBLIC_SUPABASE_URL}" \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="${NEXT_PUBLIC_SUPABASE_ANON_KEY}" \
            .

      - name: Smoke Marketing container
        env:
          HEALTH_PATH: /api/ready
        run: |
          chmod +x scripts/smoke-test-container.sh
          HEALTH_PATH=/api/ready scripts/smoke-test-container.sh elevate-marketing:staging-gate marketing-staging-smoke 3100
