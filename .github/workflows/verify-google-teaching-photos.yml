name: Verify Google teaching photographs
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-google-teaching-photos.yml', 'scripts/gcp/probe-course-photo-provider.mjs', 'lib/ultimate-course-builder/adapters/google-teaching-photo.mjs']
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * *'
permissions:
  contents: read
  id-token: write
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    concurrency:
      group: google-course-photo-provider-probe
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        with:
          skip_install: true
      - run: node scripts/gcp/probe-course-photo-provider.mjs
      - name: Read sanitized image-provider evidence
        if: always()
        run: gcloud logging read 'resource.type="cloud_run_job" AND resource.labels.job_name="elevate-course-photo-probe"' --project=elegant-racer-299721 --limit=16 --format='value(textPayload)'
