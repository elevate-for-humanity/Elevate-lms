name: Dispatch queued Google Course Builder work
on:
  schedule:
    - cron: '11 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: google-course-queue-dispatch
  cancel-in-progress: false
jobs:
  dispatch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        with:
          skip_install: true
      - name: Dispatch only claimable jobs with quota and overlap checks
        env:
          COURSE_WORKER_PARALLELISM: '1'
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/gcp/dispatch-course-job.mjs
