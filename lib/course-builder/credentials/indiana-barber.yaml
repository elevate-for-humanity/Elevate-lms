# Indiana Barber License
# https://www.in.gov/pla/professions/barber-examination

name: Indiana Barber License
slug: indiana-barber
provider: Indiana Professional Licensing Agency
category: beauty
type: licensure
description: Indiana barber license for professionals who cut hair, trim beards, and provide grooming services.

# Exam details
examSections:
  - name: Theory Examination
    questions: 100
    passingScore: 75
    topics:
      - Sanitation and sterilization
      - Anatomy and physiology
      - Hair treatment
      - Shaving
      - Chemical services
      - Safety and infection control
      - Indiana laws and rules
  - name: Practical Examination
    questions: 0
    passingScore: 75
    topics:
      - Haircut (men's)
      - Clipper cut
      - Razor cut
      - Beard trim
      - Hot towel treatment
      - Chemical relaxer

totalQuestions: 100
passingScore: 75
examFormat: "Written theory exam + Practical demonstration"
examFrequency: "By appointment at testing center"
retakePolicy: "After 30 days"

# Validity
validityPeriod: "2 years"
renewalHours: 0
renewalFrequency: "Every 2 years (license renewal fee)"

# Prerequisites
minimumAge: 18
educationRequirement: "High school diploma or GED"
experienceRequirement: "Completion of approved barber school (1500 hours)"

# Costs
examFee: "$55"
studyMaterialsFee: "$8,000-$15,000 (barber school)"
licenseFee: "$50 biennially"

