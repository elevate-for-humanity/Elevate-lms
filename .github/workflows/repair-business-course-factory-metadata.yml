name: Repair Business Course Factory Metadata

on:
  workflow_dispatch:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

jobs:
  repair:
    if: github.event_name != 'issues' || github.event.issue.title == 'RUN BUSINESS COURSE FACTORY REPAIR'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          clean: true
      - name: Patch canonical Course Factory metadata normalization
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'lib/course-factory/factory.ts';
          let text = fs.readFileSync(file, 'utf8');
          const needle = `    const published = await publishCourse({
      blueprint: enriched.blueprint,
      courseTitle,
      programId: input.programId,
      contentSource: input.contentSource ?? 'ai',
      mode: input.mode ?? 'refresh',
      evidence,
    });

    let videosQueued = 0;`;
          const replacement = `    const published = await publishCourse({
      blueprint: enriched.blueprint,
      courseTitle,
      programId: input.programId,
      contentSource: input.contentSource ?? 'ai',
      mode: input.mode ?? 'refresh',
      evidence,
    });

    if (!published.success || !published.courseId) {
      throw new Error(
        \`Canonical course persistence failed: \${published.errors.join('; ') || 'unknown persistence error'}\`,
      );
    }

    const totalDurationMinutes = enriched.blueprint.modules.reduce(
      (moduleTotal, courseModule) =>
        moduleTotal +
        (courseModule.lessons ?? []).reduce(
          (lessonTotal, lesson) => lessonTotal + Number(lesson.durationMinutes ?? 0),
          0,
        ),
      0,
    );
    const courseDurationHours = totalDurationMinutes / 60;
    const courseDescription =
      String(enriched.blueprint.description ?? '').trim() ||
      \`Workforce training course for \${courseTitle}.\`;
    const passingScore = Number(
      enriched.blueprint.generationRules?.passingScore ??
        enriched.blueprint.finalExam?.passingScore ??
        80,
    );
    const metadataDb = await requireAdminClient();
    const { error: metadataError } = await metadataDb
      .from('courses')
      .update({
        description: courseDescription,
        duration_hours: courseDurationHours,
        passing_score: passingScore,
        generation_status: 'completed',
        generation_progress: 100,
        total_lessons: published.lessonCount,
        review_status: 'draft',
        reviewed_by: null,
        reviewed_at: null,
      })
      .eq('id', published.courseId);
    if (metadataError) {
      throw new Error(\`Unable to normalize canonical course metadata: \${metadataError.message}\`);
    }

    let videosQueued = 0;`;
          if (!text.includes(needle)) throw new Error('Expected post-persistence Course Factory block not found');
          text = text.replace(needle, replacement);
          fs.writeFileSync(file, text);
          NODE
      - name: Commit repair to protected-branch fix branch
        id: commit
        shell: bash
        env:
          FIX_BRANCH: fix/business-course-factory-metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$FIX_BRANCH"
          git add lib/course-factory/factory.ts
          git diff --cached --check
          git commit -m "fix(course-factory): normalize canonical course metadata"
          git push --force origin "$FIX_BRANCH"
          echo "branch=$FIX_BRANCH" >> "$GITHUB_OUTPUT"
      - name: Report result
        if: always() && github.event_name == 'issues'
        uses: actions/github-script@v7
        env:
          FIX_BRANCH: ${{ steps.commit.outputs.branch }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `BUSINESS COURSE FACTORY REPAIR PASS\n\nBranch: ${process.env.FIX_BRANCH || 'fix/business-course-factory-metadata'}\nThe branch was built from current main and contains only the canonical Course Factory metadata normalization repair.`
            });
