name: PARIS verified code repair
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/paris-code-repair.yml'
      - 'lib/ai/runtime/code-repair.ts'
      - 'lib/devstudio/paris-code-engineer.ts'
      - 'lib/ai/runtime/supervision.ts'
      - 'lib/ai/runtime/code-repair-policy.mjs'
      - 'lib/ai/providers/**'
      - 'lib/devstudio/paris-inspection-budget.mjs'
      - 'lib/devstudio/repair-inference-budget.mjs'
      - 'lib/devstudio/paris-repair-deliverables.mjs'
      - 'lib/devstudio/paris-workflow-evidence.mjs'
      - 'lib/paris-workflow-identity.ts'
      - 'supabase/migrations/*paris*.sql'
  schedule:
    - cron: '*/10 * * * *'
  workflow_run:
    workflows: ['Deploy Admin', 'Deploy LMS automatically on Google', 'Deploy Google Marketing on trigger', 'Deploy Google Course Builder on source changes', 'Deploy Google Store runtime identity', 'CI', 'Integrity Gate', 'Pre-deploy Check', 'Course Factory Authority Gate', 'Lockfile Integrity', 'Registered Apprenticeship E2E', 'Verify PARIS Admin production authorization']
    types: [completed]
  workflow_dispatch:
    inputs:
      repair_id:
        description: Durable owner-authorized PARIS repair ID
        required: false
        type: string
permissions:
  contents: read
  id-token: write
  actions: write
# Monitor observations are coalescible; explicit per-repair dispatches are not.
# Keep the protected source-release transaction serialized by its durable
# active-repair DB claim, while leaving a fresh monitor runnable during
# independent repair validation/deployment.
jobs:
  monitor:
    concurrency:
      group: paris-code-repair-monitor
      cancel-in-progress: false
      queue: single
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.repair_id == '') || (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main' && (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'success')))
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Obtain short-lived PARIS workflow identity
        env:
          AUDIENCE: elevate-paris-code-repair
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          (async()=>{
            const url=new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
            url.searchParams.set('audience',process.env.AUDIENCE);
            const response=await fetch(url,{headers:{Authorization:'Bearer '+process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}});
            if(!response.ok)throw Error('Workflow identity issuance failed: HTTP '+response.status);
            const token=(await response.json()).value;
            if(!token || token.split('.').length!==3)throw Error('Invalid workflow identity');
            process.stdout.write('::add-mask::'+token+'\n');
            fs.appendFileSync(process.env.GITHUB_ENV,'PARIS_ID_TOKEN='+token+'\n');
          })().catch(err=>{console.error(err.message);process.exitCode=1});
          NODE
      - name: Tick PARIS and dispatch the claimed repair with workflow-owned identity
        id: tick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYCODE'
          import os,json,re,urllib.request,urllib.error
          # Require the deployed control plane, not unrelated UI/browser commit identity.
          health_req=urllib.request.Request('https://admin.elevateforhumanity.org/api/ready',headers={'Cache-Control':'no-store'})
          health=json.load(urllib.request.urlopen(health_req,timeout=30))
          runtime_sha=health.get('commitSha') or health.get('commit')
          compatible=health.get('ready') is True and health.get('agenticExecutorReady') is True and isinstance(runtime_sha,str) and re.fullmatch(r'[a-f0-9]{40}',runtime_sha)
          def affects_control_plane(path):
            # These exact modules are imported only by public Marketing routing.
            # Public navigation updates must not hold an unchanged repair runtime.
            if path in ('lib/navigation/student-support.ts','lib/routing/public-entry-aliases.mjs'):
              return False
            return path.startswith(('lib/','apps/admin/app/api/','packages/'))
          if compatible and runtime_sha!=os.environ['GITHUB_SHA']:
            compare_url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/compare/'+runtime_sha+'...'+os.environ['GITHUB_SHA']
            compare_req=urllib.request.Request(compare_url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
            comparison=json.load(urllib.request.urlopen(compare_req,timeout=20))
            files=comparison.get('files')
            # GitHub returns at most 300 changed files. A full page cannot prove
            # the absence of an omitted control-plane change; defer safely.
            unchanged_control_plane=comparison.get('status') in ('ahead','identical') and isinstance(files,list) and len(files)<300 and all(
              isinstance(item,dict) and isinstance(item.get('filename'),str) and
              not affects_control_plane(item['filename']) and
              not affects_control_plane(str(item.get('previous_filename','')))
              for item in files)
            compatible=unchanged_control_plane
            if comparison.get('status')=='behind':
              # A queued monitor may run after a newer main release is live.
              # The authenticated comparison proves runtime_sha contains this
              # workflow commit. Require its exact completed Admin release;
              # readiness alone must not authorize an unverified descendant.
              releases_url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs?head_sha='+runtime_sha+'&event=workflow_dispatch&status=completed&per_page=100'
              releases_req=urllib.request.Request(releases_url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              releases=json.load(urllib.request.urlopen(releases_req,timeout=20))
              runs=releases.get('workflow_runs')
              compatible=isinstance(runs,list) and any(
                run.get('head_sha')==runtime_sha and run.get('head_branch')=='main' and
                run.get('path')=='.github/workflows/deploy-admin.yml' and
                run.get('event')=='workflow_dispatch' and run.get('status')=='completed' and
                run.get('conclusion')=='success'
                for run in runs if isinstance(run,dict))
          if not compatible:
            print('Repair monitor deferred until compatible Admin control-plane source is serving.')
            if os.environ.get('GITHUB_OUTPUT'):
              with open(os.environ['GITHUB_OUTPUT'],'a') as output:
                output.write('recovery_blocked=admin_source\n')
            raise SystemExit(0)
          endpoint='https://admin.elevateforhumanity.org/api/cron/paris-code-repair'
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
            output.write('runtime_sha='+runtime_sha+'\n')
          headers={'Authorization':'Bearer '+os.environ['PARIS_ID_TOKEN'],'X-Paris-GitHub-Token':os.environ['GH_TOKEN'],'Content-Type':'application/json'}
          preflight=urllib.request.Request(endpoint,data=json.dumps({'phase':'auth-diagnostic'}).encode(),headers=headers)
          capability=json.load(urllib.request.urlopen(preflight,timeout=60))
          if capability.get('workflowAuthorization')!='temporary-job-v1' or capability.get('diagnosticVersion')!=2 or capability.get('plannerContinuation')!='durable-turn-v1':
            print('Repair monitor deferred until the compatible Admin runtime is deployed.')
            with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('recovery_blocked=admin_capability\n')
            raise SystemExit(0)
          if not all(capability.get(key,{}).get('ok') is True for key in ['repository','contents','workflow']):
            raise SystemExit('PARIS_GITHUB_CONNECTIVITY_CHECK_FAILED')
          req=urllib.request.Request(endpoint,data=json.dumps({'phase':'tick'}).encode(),headers=headers)
          try:
            result=json.load(urllib.request.urlopen(req,timeout=120))
            print(json.dumps(result))
            if result.get('dispatchRequired'):
              repair_id=result['repairId']
              import subprocess
              try:
                subprocess.run(['gh','api','--method','POST','repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/workflows/paris-code-repair.yml/dispatches','-f','ref=main','-f','inputs[repair_id]='+repair_id],check=True)
              except subprocess.CalledProcessError:
                # A failed API call may still have reached GitHub. Block with a
                # durable unconfirmed receipt; do not retry an ambiguous POST.
                failure_req=urllib.request.Request(endpoint,data=json.dumps({'phase':'dispatch-failure','repairId':repair_id}).encode(),headers=headers)
                urllib.request.urlopen(failure_req,timeout=30).read()
                raise
          except urllib.error.HTTPError as error:
            print(error.read().decode()[:1000])
            raise
          PYCODE
      - name: Report blocked recovery as an unsuccessful monitor
        if: steps.tick.outputs.recovery_blocked != ''
        env:
          RECOVERY_BLOCKER: ${{ steps.tick.outputs.recovery_blocked }}
        run: |
          echo "::error::PARIS recovery did not execute: $RECOVERY_BLOCKER requires a compatible Admin deployment."
          echo "PARIS recovery blocked: $RECOVERY_BLOCKER. No repair was dispatched." >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Verify serving authorization after compatible control-plane updates
        if: github.event_name == 'push' && steps.tick.outputs.runtime_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.tick.outputs.runtime_sha }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/verify-paris-production-authorization.yml/dispatches" -f ref=main -f "inputs[expected_sha]=$EXPECTED_SHA" -f 'inputs[credential_source]=runtime-token'
  prepare:
    # A manual repair_id is durable and must not be discarded by a later
    # workflow_run monitor event; keep all requested prepares serialized.
    concurrency:
      group: paris-code-repair-prepare
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      actions: read
      id-token: write
    if: github.event_name == 'workflow_dispatch' && inputs.repair_id != '' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      sha: ${{ steps.patch.outputs.sha }}
      base: ${{ steps.patch.outputs.base }}
    steps:
      - name: Obtain short-lived PARIS workflow identity
        env:
          AUDIENCE: elevate-paris-code-repair
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          (async()=>{
            const url=new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
            url.searchParams.set('audience',process.env.AUDIENCE);
            const response=await fetch(url,{headers:{Authorization:'Bearer '+process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}});
            if(!response.ok)throw Error('Workflow identity issuance failed: HTTP '+response.status);
            const token=(await response.json()).value;
            if(!token || token.split('.').length!==3)throw Error('Invalid workflow identity');
            process.stdout.write('::add-mask::'+token+'\n');
            fs.appendFileSync(process.env.GITHUB_ENV,'PARIS_ID_TOKEN='+token+'\n');
          })().catch(err=>{console.error(err.message);process.exitCode=1});
          NODE
      - name: Stage the PARIS patch
        id: patch
        env:
          GH_TOKEN: ${{ github.token }}
          ADMIN_URL: https://admin.elevateforhumanity.org
          REPAIR_ID: ${{ inputs.repair_id }}
        run: |
          python - <<'PY'
          import json,os,re,urllib.request,urllib.parse,urllib.error
          if not re.fullmatch(r'[a-f0-9-]{36}',os.environ['REPAIR_ID']): raise SystemExit('Invalid repair ID')
          body=json.dumps({'phase':'prepare','repairId':os.environ['REPAIR_ID'],'runId':int(os.environ['GITHUB_RUN_ID'])}).encode()
          def fresh_identity():
            parts=urllib.parse.urlsplit(os.environ['ACTIONS_ID_TOKEN_REQUEST_URL'])
            query=[(key,value) for key,value in urllib.parse.parse_qsl(parts.query,keep_blank_values=True) if key!='audience']
            query.append(('audience','elevate-paris-code-repair'))
            url=urllib.parse.urlunsplit(parts._replace(query=urllib.parse.urlencode(query)))
            request=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
            token=json.load(urllib.request.urlopen(request,timeout=30)).get('value')
            if not isinstance(token,str) or len(token.split('.'))!=3: raise SystemExit('Invalid fresh workflow identity')
            print('::add-mask::'+token,flush=True)
            return token
          # Each request advances one durable planner turn. Do not retry an
          # ambiguous failed mutation; the failure report keeps it blocked.
          for turn in range(15):
            # A planner continuation can outlive the initial five-minute JWT.
            # Renew authority before every mutation; never replay an ambiguous POST.
            token=fresh_identity()
            req=urllib.request.Request(os.environ['ADMIN_URL']+'/api/cron/paris-code-repair',data=body,headers={'Authorization':'Bearer '+token,'X-Paris-GitHub-Token':os.environ['GH_TOKEN'],'Content-Type':'application/json'})
            try:
              result=json.load(urllib.request.urlopen(req,timeout=285))
            except urllib.error.HTTPError as error:
              # The Admin route emits a bounded, allow-listed failure code.
              # Preserve the failed mutation without retrying an ambiguous POST.
              raw=error.read(1024)
              try: code=json.loads(raw).get('errorCode','PARIS_REPAIR_PHASE_FAILED')
              except (ValueError,TypeError): code='PARIS_REPAIR_PHASE_FAILED'
              if not isinstance(code,str) or not re.fullmatch(r'[A-Z0-9_]{5,64}',code):
                code='PARIS_REPAIR_PHASE_FAILED'
              print('PARIS_PREPARE_REJECTED HTTP '+str(error.code)+' '+code,flush=True)
              raise
            if result.get('pending') is True:
              print('Saved PARIS planner turn',result.get('turn'),flush=True)
              continue
            break
          else:
            raise SystemExit('PARIS planner exceeded its bounded continuation limit')
          if not all(re.fullmatch(r'[a-f0-9]{40}',result.get(k,'')) for k in ['sha','baseSha']): raise SystemExit('Missing candidate evidence')
          with open(os.environ['GITHUB_OUTPUT'],'a') as out: out.write('sha='+result['sha']+'\nbase='+result['baseSha']+'\n')
          PY
  validate:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with: {version: 10.28.2}
      - uses: actions/setup-node@v4
        with: {node-version: '22',cache: pnpm}
      - name: Require an application patch and a new regression test
        env:
          BASE_SHA: ${{ needs.prepare.outputs.base }}
          PATCH_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          python - <<'PY'
          import os,re,subprocess,json
          changes=subprocess.check_output(['git','diff','--name-status',os.environ['BASE_SHA'],os.environ['PATCH_SHA']],text=True).splitlines()
          tests=[]
          for line in changes:
            status,path=line.split('\t',1)
            infrastructure = re.fullmatch(r'(?:\.github/workflows/[\w-]+\.ya?ml|Dockerfile\.(?:admin|lms|marketing)|scripts/gcp/[\w-]+\.(?:mjs|py))',path)
            if status not in ['A','M'] or not (re.match(r'^(lib|components|apps|remotion-src|workers|tests)/',path) or infrastructure): raise SystemExit('Repair outside authorized source scope')
            if re.search(r'(^|/)(auth|rbac|payments|billing|stripe|security)(/|\.)|secret|credential|quality-gate|approved-delivery|lesson-contract|AGENTS\.md|code-repair|repair-events|control-plane|course-repair-policy|workflow-github-context|github-token|github-app-token|paris-code-engineer|infrastructure-repair|main-release|api-auth|guards|role-matrix',path,re.I): raise SystemExit('Protected repair boundary')
            if re.search(r'\.(test|spec)\.[cm]?[jt]sx?$',path) and status != 'A': raise SystemExit('Existing tests must remain unchanged')
            if path.startswith('tests/'):
              if status!='A': raise SystemExit('Existing tests must remain unchanged')
              if re.search(r'\.test\.(tsx?|mjs)$',path): tests.append(path)
          if not tests: raise SystemExit('A new regression test is required')
          open('/tmp/paris-tests.json','w').write(json.dumps(tests))
          PY
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Validate deployment repairs with the trusted base validator
        env:
          BASE_SHA: ${{ needs.prepare.outputs.base }}
          PATCH_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          # Earlier application repairs predate the infrastructure validator.
          # Their immutable base remains valid without a workflow-source change.
          if git diff --quiet "$BASE_SHA" "$PATCH_SHA" -- .github/workflows 'Dockerfile.*' scripts/gcp; then
            exit 0
          fi
          git show "$BASE_SHA:scripts/gcp/validate-infrastructure-repair.mjs" > "$RUNNER_TEMP/paris-deployment-validator.mjs"
          node "$RUNNER_TEMP/paris-deployment-validator.mjs" "$BASE_SHA" "$PATCH_SHA"
      - name: Run regression and shared PARIS checks
        run: |
          python - <<'PY'
          import json,subprocess
          tests=json.load(open('/tmp/paris-tests.json'))
          for args in [['pnpm','exec','vitest','run']+[p for p in tests if not p.endswith('.mjs')],['node','--test']+[p for p in tests if p.endswith('.mjs')]]:
            if len(args)>(4 if args[0]=='pnpm' else 2): subprocess.run(args,check=True)
          subprocess.run(['pnpm','exec','vitest','run','tests/unit/course-builder-live-preview.test.tsx','tests/unit/course-builder-assessment-preview.test.tsx','tests/unit/paris-course-integration.test.ts'],check=True)
          subprocess.run(['node','--test','lib/ai/runtime/code-repair-policy.test.mjs','tests/worker/approved-picture-timeline.test.mjs','lib/video/render-checkpoint-contract.test.mjs'],check=True)
          PY
      - name: Type-check production applications
        run: |
          pnpm exec tsc -p apps/admin/tsconfig.json --noEmit --incremental false
          pnpm exec tsc -p apps/lms/tsconfig.json --noEmit --incremental false
          pnpm exec tsc -p apps/marketing/tsconfig.json --noEmit --incremental false
      - name: Enforce production application and runtime repair gates
        run: |
          node scripts/check-course-factory-authority.mjs
          node scripts/check-studio-architecture.mjs
          node --test lib/ai/runtime/code-repair-policy.test.mjs
      - name: Record exact validated candidate
        env:
          PATCH_SHA: ${{ needs.prepare.outputs.sha }}
          REPAIR_ID: ${{ inputs.repair_id }}
        run: |
          python - <<'PYCODE'
          import json,os
          open('/tmp/paris-validation.json','w').write(json.dumps({'sha':os.environ['PATCH_SHA'],'repairId':os.environ['REPAIR_ID'],'runId':os.environ['GITHUB_RUN_ID']}))
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: paris-validated-${{ inputs.repair_id }}-${{ needs.prepare.outputs.sha }}
          path: /tmp/paris-validation.json
          retention-days: 7
  publish:
    permissions:
      contents: write
      actions: write
      id-token: write
    needs: [prepare,validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Obtain short-lived PARIS workflow identity
        env:
          AUDIENCE: elevate-paris-code-repair
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          (async()=>{
            const url=new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
            url.searchParams.set('audience',process.env.AUDIENCE);
            const response=await fetch(url,{headers:{Authorization:'Bearer '+process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}});
            if(!response.ok)throw Error('Workflow identity issuance failed: HTTP '+response.status);
            const token=(await response.json()).value;
            if(!token || token.split('.').length!==3)throw Error('Invalid workflow identity');
            process.stdout.write('::add-mask::'+token+'\n');
            fs.appendFileSync(process.env.GITHUB_ENV,'PARIS_ID_TOKEN='+token+'\n');
          })().catch(err=>{console.error(err.message);process.exitCode=1});
          NODE
      - name: Publish only the independently validated immutable patch
        env:
          GH_TOKEN: ${{ github.token }}
          REPAIR_ID: ${{ inputs.repair_id }}
        run: |
          python - <<'PY'
          import os,json,urllib.request
          data=json.dumps({'phase':'publish','repairId':os.environ['REPAIR_ID'],'runId':int(os.environ['GITHUB_RUN_ID'])}).encode()
          req=urllib.request.Request('https://admin.elevateforhumanity.org/api/cron/paris-code-repair',data=data,headers={'Authorization':'Bearer '+os.environ['PARIS_ID_TOKEN'],'X-Paris-GitHub-Token':os.environ['GH_TOKEN'],'Content-Type':'application/json'})
          result=json.load(urllib.request.urlopen(req,timeout=120))
          print(json.dumps({'status':result.get('status'),'sha':result.get('sha'),'verifiedLive':False}))
          PY
  report:
    if: always() && github.event_name == 'workflow_dispatch' && inputs.repair_id != '' && (needs.prepare.result != 'success' || needs.validate.result != 'success' || needs.publish.result != 'success')
    needs: [prepare,validate,publish]
    runs-on: ubuntu-24.04
    steps:
      - name: Obtain short-lived PARIS workflow identity
        env:
          AUDIENCE: elevate-paris-code-repair
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          (async()=>{
            const url=new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
            url.searchParams.set('audience',process.env.AUDIENCE);
            const response=await fetch(url,{headers:{Authorization:'Bearer '+process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}});
            if(!response.ok)throw Error('Workflow identity issuance failed: HTTP '+response.status);
            const token=(await response.json()).value;
            if(!token || token.split('.').length!==3)throw Error('Invalid workflow identity');
            process.stdout.write('::add-mask::'+token+'\n');
            fs.appendFileSync(process.env.GITHUB_ENV,'PARIS_ID_TOKEN='+token+'\n');
          })().catch(err=>{console.error(err.message);process.exitCode=1});
          NODE
      - env:
          REPAIR_ID: ${{ inputs.repair_id }}
        run: |
          python - <<'PY'
          import os,json,urllib.request
          data=json.dumps({'phase':'failure','repairId':os.environ['REPAIR_ID'],'runId':int(os.environ['GITHUB_RUN_ID'])}).encode()
          req=urllib.request.Request('https://admin.elevateforhumanity.org/api/cron/paris-code-repair',data=data,headers={'Authorization':'Bearer '+os.environ['PARIS_ID_TOKEN'],'Content-Type':'application/json'})
          urllib.request.urlopen(req,timeout=30).read()
          PY
