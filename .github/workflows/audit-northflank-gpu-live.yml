name: Audit Northflank GPU Live State

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  audit:
    if: startsWith(github.event.issue.title, '[GPU LIVE AUDIT]')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
      NORTHFLANK_TEAM_ID: ${{ secrets.NORTHFLANK_TEAM_ID || 'elevates-team' }}
      NORTHFLANK_GPU_PROJECT_ID: elevate-media-gpu
    steps:
      - name: Read live Northflank GPU state
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$NORTHFLANK_API_TOKEN"
          base="https://api.northflank.com/v1/teams/${NORTHFLANK_TEAM_ID}/projects/${NORTHFLANK_GPU_PROJECT_ID}"
          auth=(-H "Authorization: Bearer ${NORTHFLANK_API_TOKEN}" -H 'Content-Type: application/json')
          curl -fsS "${auth[@]}" "$base/services" > /tmp/services.json
          curl -fsS "${auth[@]}" "$base/volumes" > /tmp/volumes.json
          curl -fsS "${auth[@]}" "$base/services/elevate-gpu-worker/build?per_page=5" > /tmp/builds.json
          node <<'NODE' > /tmp/audit.txt
          const fs=require('fs');
          const rows=(p,k)=>{const j=JSON.parse(fs.readFileSync(p,'utf8'));return Array.isArray(j.data)?j.data:(Array.isArray(j.data?.[k])?j.data[k]:[])};
          const services=rows('/tmp/services.json','services');
          const gpu=services.filter(s=>/gpu/i.test(String(s.id||s.name||'')));
          const vols=rows('/tmp/volumes.json','volumes').filter(v=>/gpu/i.test(String(v.id||v.name||'')));
          const builds=rows('/tmp/builds.json','builds');
          console.log('GPU SERVICES');
          for(const s of gpu) console.log(JSON.stringify({id:s.id,name:s.name,status:s.status,disabledCI:s.disabledCI,instances:s.deployment?.instances??s.deployment?.spec?.instances??null,plan:s.billing?.deploymentPlan??null,buildStatus:s.status?.build?.status??null,deploymentStatus:s.status?.deployment?.status??null}));
          console.log('GPU VOLUMES');
          for(const v of vols) console.log(JSON.stringify({id:v.id,name:v.name,storageMB:v.spec?.storageSize??null,status:v.status??null}));
          console.log('LATEST GPU BUILDS');
          for(const b of builds.slice(0,5)) console.log(JSON.stringify({id:b.id,status:b.status,sha:b.sha,success:b.success,message:b.message,createdAt:b.createdAt}));
          NODE
          cat /tmp/audit.txt
      - name: Post audit result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            let body='No audit output captured.';
            try { body=fs.readFileSync('/tmp/audit.txt','utf8'); } catch {}
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:`Northflank GPU live audit: **${{ job.status }}**\n\n\`\`\`text\n${body}\n\`\`\``});
