name: Rebuild ESB Course

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-esb.yml'
      - 'lib/curriculum/blueprints/entrepreneurship.ts'
      - 'lib/course-builder/assessment-generator.ts'
      - 'lib/video/edge-tts.ts'
      - 'scripts/course-builder/run.ts'
      - 'lib/course-factory/**'
      - 'lib/course-builder/**'
      - 'apps/admin/app/api/admin/course-builder/**'
      - 'apps/admin/app/api/admin/lms/courses/generate/**'

permissions:
  contents: read

env:
  CI: true
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

jobs:
  rebuild-esb:
    name: Replace Entrepreneurship with ESB v2
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies=false

      - name: Require runtime credentials
        shell: bash
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "SUPABASE_SERVICE_ROLE_KEY is required to persist the rebuilt course."
            exit 1
          fi
          if [ -z "$SUPABASE_URL" ] && [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            echo "A Supabase project URL is required."
            exit 1
          fi
          if [ -z "$OPENAI_API_KEY" ] && [ -z "$GROQ_API_KEY" ] && [ -z "$GEMINI_API_KEY" ] && [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "At least one AI provider credential is required."
            exit 1
          fi

      - name: Rebuild ESB v2 course through canonical Course Factory
        run: pnpm tsx scripts/course-builder/run.ts --course entrepreneurship --mode replace

      - name: Validate ESB blueprint after rebuild
        run: pnpm tsx scripts/course-builder/run.ts --course entrepreneurship --validate
