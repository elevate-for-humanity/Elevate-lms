name: Recover expired-only PBX quarantine
on:
  pull_request:
    paths:
      - '.github/workflows/recover-pbx-expired-quarantine.yml'
      - 'scripts/gcp/recover-pbx-expired-quarantine.py'
      - 'scripts/gcp/test-recover-pbx-expired-quarantine.py'
  workflow_dispatch:
    inputs:
      expected_state_sha256:
        description: 'Leave empty for preview. Apply only with the reviewed preview SHA256.'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'google-pbx-infrastructure' || format('google-pbx-checks-{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: false
  queue: max
jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 scripts/gcp/test-recover-pbx-expired-quarantine.py
      - run: python3 -m py_compile scripts/gcp/recover-pbx-expired-quarantine.py scripts/gcp/test-recover-pbx-expired-quarantine.py
  recovery:
    needs: contract
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        with:
          skip_install: true
      - name: Verify VM identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(gcloud compute instances describe elevate-pbx --project=elegant-racer-299721 --zone=us-central1-a --format='value(status)')" = RUNNING
          test "$(gcloud compute instances describe elevate-pbx --project=elegant-racer-299721 --zone=us-central1-a --format='value(networkInterfaces[0].accessConfigs[0].natIP)')" = 107.178.216.162
      - name: Preview or apply reviewed expired-only recovery
        shell: bash
        env:
          EXPECTED_STATE: ${{ inputs.expected_state_sha256 }}
        run: |
          set -euo pipefail
          [[ -z "$EXPECTED_STATE" || "$EXPECTED_STATE" =~ ^[a-f0-9]{64}$ ]]
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          PROBE="/tmp/elevate-recovery-probe-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.py"
          gcloud compute scp scripts/gcp/probe-operator-provisioning.py "elevate-pbx:$PROBE" --project=elegant-racer-299721 --zone=us-central1-a --quiet
          COMMAND="sudo python3 - --probe $PROBE"
          if [[ -n "$EXPECTED_STATE" ]]; then
            COMMAND="$COMMAND --expected-state-sha256 $EXPECTED_STATE"
          fi
          gcloud compute ssh elevate-pbx --project=elegant-racer-299721 --zone=us-central1-a --quiet \
            --command="$COMMAND" < scripts/gcp/recover-pbx-expired-quarantine.py
