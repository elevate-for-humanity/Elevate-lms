name: Registered Apprenticeship E2E

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Deploy LMS
    types:
      - completed

concurrency:
  group: registered-apprenticeship-e2e
  cancel-in-progress: false

jobs:
  production-authenticated-e2e:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    name: Apprentice + Host Shop authenticated persistence
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PLAYWRIGHT_BASE_URL: https://app.elevateforhumanity.org
      E2E_APPRENTICE_EMAIL: ${{ secrets.E2E_APPRENTICE_EMAIL }}
      E2E_APPRENTICE_PASSWORD: ${{ secrets.E2E_APPRENTICE_PASSWORD }}
      E2E_HOST_SHOP_EMAIL: ${{ secrets.E2E_HOST_SHOP_EMAIL }}
      E2E_HOST_SHOP_PASSWORD: ${{ secrets.E2E_HOST_SHOP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Require dedicated E2E identities
        shell: bash
        run: |
          set -euo pipefail
          for name in E2E_APPRENTICE_EMAIL E2E_APPRENTICE_PASSWORD E2E_HOST_SHOP_EMAIL E2E_HOST_SHOP_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is not configured. Authenticated apprenticeship certification cannot be skipped."
              exit 1
            fi
          done
      - name: Verify production LMS is ready
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            ping_status=$(curl -sS --max-time 10 -o /tmp/lms-ping.json -w "%{http_code}" https://app.elevateforhumanity.org/api/ping || true)
            health_status=$(curl -sS --max-time 10 -o /tmp/lms-health.json -w "%{http_code}" https://app.elevateforhumanity.org/api/health || true)
            if [[ "$ping_status" == "200" && "$health_status" == "200" ]] \
              && grep -q '"ok":true' /tmp/lms-ping.json \
              && grep -q '"ready":true' /tmp/lms-health.json; then
              exit 0
            fi
            echo "LMS not ready yet (ping=$ping_status health=$health_status), retry $i/20"
            sleep 15
          done
          echo "::error::Production LMS never reached ready state"
          cat /tmp/lms-ping.json 2>/dev/null || true
          cat /tmp/lms-health.json 2>/dev/null || true
          exit 1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies=false
      - name: Install Chromium
        run: pnpm exec playwright install chromium --with-deps
      - name: Run registered-apprenticeship architecture gate
        run: node scripts/check-registered-apprenticeship-architecture.mjs
      - name: Run authenticated production E2E
        run: pnpm exec playwright test tests/e2e/registered-apprenticeship-authenticated.spec.ts --config playwright.config.ts --project=chromium
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: registered-apprenticeship-e2e-results
          path: |
            test-results/
            playwright-report/
          retention-days: 14
