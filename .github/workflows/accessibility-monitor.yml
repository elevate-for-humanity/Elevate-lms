name: Accessibility Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '17 13 * * 1'

concurrency:
  group: accessibility-monitor
  cancel-in-progress: true

jobs:
  production-accessibility:
    name: Production WCAG 2.2 Regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10.28.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies=false
      - name: Install Playwright
        run: pnpm exec playwright install chromium --with-deps
      - name: Run production accessibility journeys
        env:
          PLAYWRIGHT_BASE_URL: https://www.elevateforhumanity.org
          CI: 'true'
        run: pnpm exec playwright test tests/e2e/accessibility.spec.ts --config playwright.config.ts
      - name: Upload accessibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-monitor-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 30
