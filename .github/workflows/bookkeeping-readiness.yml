name: Bookkeeping workbook and narration regression checks
on:
  pull_request:
    paths:
      - 'lib/ultimate-course-builder/instructional/narration-numbers.mjs'
      - 'lib/ultimate-course-builder/instructional/picture-timeline.mjs'
      - 'scripts/curriculum/bookkeeping-workbook*'
      - 'data/courses/intuit-bookkeeping*'
      - 'tests/worker/bookkeeping-number-cues.test.mjs'
      - '.github/workflows/bookkeeping-readiness.yml'
  push:
    branches: [main]
    paths:
      - 'lib/ultimate-course-builder/instructional/narration-numbers.mjs'
      - 'lib/ultimate-course-builder/instructional/picture-timeline.mjs'
      - 'scripts/curriculum/bookkeeping-workbook*'
      - 'data/courses/intuit-bookkeeping*'
      - 'tests/worker/bookkeeping-number-cues.test.mjs'
      - '.github/workflows/bookkeeping-readiness.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test scripts/curriculum/bookkeeping-workbook.test.mjs tests/worker/bookkeeping-number-cues.test.mjs tests/worker/approved-picture-timeline.test.mjs tests/worker/scene-construction-repair.test.mjs
