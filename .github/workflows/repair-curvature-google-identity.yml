name: Repair dedicated Curvature Google identity
on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair-curvature-google-identity.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: write
  id-token: write
jobs:
  dispatch:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch through approved Google identity event
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/repair-curvature-google-identity.yml/dispatches" -f ref=main
  repair:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    concurrency:
      group: google-project-iam-repair
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          repository: elevate-for-humanity/curvature-body-sculpting
          ref: d57324e5b6ad49aa41a22e877db75c36f945e86b
          persist-credentials: false
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        with: { skip_install: true }
      - name: Restore only the dedicated Curvature repository identity
        run: bash scripts/authorize-curvature-google.sh
