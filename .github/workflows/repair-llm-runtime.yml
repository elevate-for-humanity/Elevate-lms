name: Repair Elevate LLM Runtime

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: elevate-llm-runtime-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.title == 'REPAIR ELEVATE LLM RUNTIME'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
    steps:
      - name: Patch launch command and restart existing worker
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$NORTHFLANK_API_TOKEN"
          node <<'NODE'
          const token = process.env.NORTHFLANK_API_TOKEN;
          const base = 'https://api.northflank.com/v1/projects/elevate-media-gpu';
          const command = [
            'exec python3 -m vllm.entrypoints.openai.api_server',
            '--model "$LLM_MODEL"',
            '--served-model-name elevate-local',
            '--api-key "$LLM_WORKER_SECRET"',
            '--host 0.0.0.0',
            '--port "$PORT"',
            '--gpu-memory-utilization "${GPU_MEMORY_UTILIZATION:-0.90}"',
            '--max-model-len "${MAX_MODEL_LEN:-8192}"',
            '--download-dir "$HF_HOME"',
            '${VLLM_EXTRA_ARGS:-}',
          ].join(' ');

          async function request(path, options = {}) {
            const response = await fetch(base + path, {
              ...options,
              headers: {
                authorization: `Bearer ${token}`,
                accept: 'application/json',
                'content-type': 'application/json',
                ...options.headers,
              },
            });
            const text = await response.text();
            if (!response.ok) throw new Error(`${response.status} ${options.method || 'GET'} ${path}: ${text.slice(0, 1200)}`);
            return text ? JSON.parse(text) : {};
          }

          await request('/services/deployment/elevate-llm-worker', {
            method: 'PATCH',
            body: JSON.stringify({
              deployment: {
                docker: {
                  configType: 'customEntrypointCustomCommand',
                  customEntrypoint: '/bin/sh -c',
                  customCommand: `'${command}'`,
                },
              },
            }),
          });
          await request('/services/elevate-llm-worker/restart', {
            method: 'POST',
            body: '{}',
          });
          console.log('Runtime command patched and existing worker restarted.');
          NODE

      - name: Post repair result
        if: always() && github.event_name == 'issues'
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `ELEVATE LLM RUNTIME REPAIR ${process.env.JOB_STATUS === 'success' ? 'PASS' : 'FAIL'}\n\nMain SHA: ${context.sha}`,
            })
