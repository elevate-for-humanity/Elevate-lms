name: Deployment Notifications
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.deployment.id || github.run_id }}
  cancel-in-progress: false

on:
  workflow_dispatch:
  deployment_status:

permissions:
  contents: read
  pull-requests: write

jobs:
  # Skip non-terminal deployment states gracefully
  check-state:
    runs-on: ubuntu-latest
    outputs:
      should_notify: ${{ steps.check.outputs.should_notify }}
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment state
        id: check
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { classifyDeploymentEvent } from './scripts/deployment-notification-event.mjs';
          const result = classifyDeploymentEvent(JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8')));
          appendFileSync(process.env.GITHUB_OUTPUT, `should_notify=${result.notify}\n`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, result.reason + '\n');
          NODE

  notify:
    runs-on: ubuntu-latest
    needs: check-state
    if: ${{ needs.check-state.outputs.should_notify == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get deployment info
        id: deployment
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { classifyDeploymentEvent } from './scripts/deployment-notification-event.mjs';
          const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const result = classifyDeploymentEvent(event);
          for (const [key, value] of Object.entries({environment: event.deployment.environment,
            url: result.origin, state: event.deployment_status.state, commit: event.deployment.sha})) {
            if (/[\r\n]/.test(String(value))) throw new Error('Invalid deployment metadata');
            appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${value}\n`);
          }
          NODE

      - name: Run health check
        if: github.event.deployment_status.state == 'success'
        id: health
        run: |
          HEALTH_URL="${{ steps.deployment.outputs.url }}/api/health"
          echo "Checking: $HEALTH_URL"

          status_code=$(curl --fail-with-body --silent --show-error --max-time 20 \
            --output /tmp/deployment-health.json --write-out "%{http_code}" "$HEALTH_URL" || true)
          echo "status=${status_code:-000}" >> $GITHUB_OUTPUT

          if [ "$status_code" = "200" ] && grep -Eq '"(healthy|ready|ok)"[[:space:]]*:[[:space:]]*true' /tmp/deployment-health.json; then
            echo "result=✅ HEALTHY" >> $GITHUB_OUTPUT
          else
            echo "result=❌ UNHEALTHY" >> $GITHUB_OUTPUT
            cat /tmp/deployment-health.json 2>/dev/null || true
            exit 1
          fi

      - name: Create deployment summary
        run: |
          cat << EOF > $GITHUB_STEP_SUMMARY
          # Deployment ${{ steps.deployment.outputs.state == 'success' && '✅ Successful' || '❌ Failed' }}

          **Environment:** ${{ steps.deployment.outputs.environment }}
          **URL:** ${{ steps.deployment.outputs.url }}
          **Commit:** \`${{ steps.deployment.outputs.commit }}\`
          **Time:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")

          ## Health Check
          ${{ steps.health.outputs.result || 'Skipped' }}

          ## Quick Links
          - [View Deployment](${{ steps.deployment.outputs.url }})
          - [View Commit](https://github.com/${{ github.repository }}/commit/${{ steps.deployment.outputs.commit }})
          - [View Workflow](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          EOF

      - name: Comment on associated PR
        if: github.event.deployment_status.state == 'success' && steps.deployment.outputs.commit != ''
        uses: actions/github-script@v7
        env:
          HEALTH_RESULT: ${{ steps.health.outputs.result || 'Skipped' }}
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.url }}
          DEPLOYMENT_ENVIRONMENT: ${{ steps.deployment.outputs.environment }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            // Ported from fix PR #3 (acde0ac): deployment_status events carry no
            // github.event.pull_request, so resolve the PR from the deployment SHA.
            const { owner, repo } = context.repo;
            const { data: pulls } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner, repo, commit_sha: '${{ steps.deployment.outputs.commit }}',
            });
            if (pulls.length !== 1) {
              core.info(`Skipping PR comment: found ${pulls.length} associated PRs.`);
              return;
            }
            const issue_number = pulls[0].number;
            const marker = '<!-- deployment-notification -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number,
            });
            const existing = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' &&
              comment.body?.startsWith(marker));
            const body = [
              marker,
              '## Deployment Status: Success',
              `**Environment:** ${process.env.DEPLOYMENT_ENVIRONMENT}`,
              `**Health check:** ${process.env.HEALTH_RESULT}`,
              process.env.DEPLOYMENT_URL ? `[View deployment](${process.env.DEPLOYMENT_URL})` : '',
              `[View workflow](${process.env.RUN_URL})`,
            ].filter(Boolean).join('\n\n');
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Send Slack notification
        if: ${{ !cancelled() && env.SLACK_WEBHOOK_URL != '' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          HEALTH_RESULT: ${{ steps.health.outputs.result || 'Skipped' }}
          DEPLOYMENT_STATE: ${{ steps.deployment.outputs.state }}
          DEPLOYMENT_ENVIRONMENT: ${{ steps.deployment.outputs.environment }}
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Ported from fix PR #3 (acde0ac): encode the Slack payload with jq
          # instead of interpolating values into a JSON string.
          payload=$(jq -n --arg state "$DEPLOYMENT_STATE" \
            --arg environment "$DEPLOYMENT_ENVIRONMENT" --arg health "$HEALTH_RESULT" \
            --arg deployment "$DEPLOYMENT_URL" --arg run "$RUN_URL" '
              {text: ("Deployment " + $state + "\nEnvironment: " + $environment +
                "\nHealth: " + $health +
                (if $deployment == "" then "" else "\nDeployment: " + $deployment end) +
                "\nWorkflow: " + $run)}')
          curl --fail --silent --show-error --connect-timeout 5 --max-time 15 \
            --output /dev/null --json "$payload" -- "$SLACK_WEBHOOK_URL"
