name: E2E desktop-chrome

# Runs the full monorepo browser suite (Marketing :3000, Admin :3001, LMS :3002)
# on the desktop-chrome project. Playwright starts all three dev servers from
# playwright.config.ts. Triage and required environment:
# docs/audits/e2e-desktop-chrome-triage.md
on:
  workflow_dispatch:
    inputs:
      exhaustive:
        description: Run focused regressions in addition to the normal four browser shards
        type: boolean
        default: false
  pull_request:
    branches: [main]

concurrency:
  group: e2e-desktop-chrome-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop-chrome-shard:
    name: E2E desktop-chrome shard ${{ matrix.shard }}/4
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble@sha256:3bed4b1a12f2338642f3d8cba28e291deef3c66bd4a964bbeb3e57bbff511dbd
      options: --init --shm-size=1g
    defaults:
      run:
        shell: bash
    timeout-minutes: 120
    env:
      PLAYWRIGHT_HTML_OPEN: never
      NODE_OPTIONS: '--max-old-space-size=6144'
      EXPECTED_LMS_SHA: ${{ github.sha }}
      QA_PORTAL_E2E_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
      # Isolated QA only: the full local-dev suite includes service-role
      # writes. Never use the production learner database or its service key.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
      TEST_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      TEST_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      TEST_STUDENT_EMAIL: ${{ secrets.E2E_LEARNER_EMAIL }}
      TEST_STUDENT_PASSWORD: ${{ secrets.E2E_LEARNER_PASSWORD }}
      E2E_LEARNER_EMAIL: ${{ secrets.E2E_LEARNER_EMAIL }}
      E2E_LEARNER_PASSWORD: ${{ secrets.E2E_LEARNER_PASSWORD }}
      TEST_PROGRAM_HOLDER_EMAIL: ${{ secrets.E2E_PROGRAM_HOLDER_EMAIL }}
      TEST_PROGRAM_HOLDER_PASSWORD: ${{ secrets.E2E_PROGRAM_HOLDER_PASSWORD }}
      E2E_PROGRAM_HOLDER_EMAIL: ${{ secrets.E2E_PROGRAM_HOLDER_EMAIL }}
      E2E_PROGRAM_HOLDER_PASSWORD: ${{ secrets.E2E_PROGRAM_HOLDER_PASSWORD }}
      E2E_APPRENTICE_EMAIL: ${{ secrets.E2E_APPRENTICE_EMAIL }}
      E2E_APPRENTICE_PASSWORD: ${{ secrets.E2E_APPRENTICE_PASSWORD }}
      E2E_EMPLOYER_EMAIL: ${{ secrets.E2E_EMPLOYER_EMAIL }}
      E2E_EMPLOYER_PASSWORD: ${{ secrets.E2E_EMPLOYER_PASSWORD }}
      E2E_INSTRUCTOR_EMAIL: ${{ secrets.E2E_INSTRUCTOR_EMAIL }}
      E2E_INSTRUCTOR_PASSWORD: ${{ secrets.E2E_INSTRUCTOR_PASSWORD }}
      E2E_STAFF_EMAIL: ${{ secrets.E2E_STAFF_EMAIL }}
      E2E_STAFF_PASSWORD: ${{ secrets.E2E_STAFF_PASSWORD }}
      E2E_CASE_MANAGER_EMAIL: ${{ secrets.E2E_CASE_MANAGER_EMAIL }}
      E2E_CASE_MANAGER_PASSWORD: ${{ secrets.E2E_CASE_MANAGER_PASSWORD }}
      # Only a designated disposable Host Shop identity may certify authenticated
      # shop dashboard geometry; never borrow Admin or Program Holder credentials.
      E2E_HOST_SHOP_EMAIL: ${{ secrets.E2E_HOST_SHOP_EMAIL }}
      E2E_HOST_SHOP_PASSWORD: ${{ secrets.E2E_HOST_SHOP_PASSWORD }}
      TEST_MODE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies=false
      - name: Verify isolated QA database and three-service E2E configuration
        run: node scripts/qa/verify-e2e-service-config.mjs
      - name: Verify Website Builder authorization with disposable QA sessions
        if: ${{ matrix.shard == 1 }}
        run: node scripts/qa/test-builder-authorization.mjs
      - name: Provision disposable Employer, Instructor, Staff, Case Manager and Admin QA identities
        run: node scripts/qa/provision-remaining-portal-e2e.mjs provision
      - name: Provision disposable Learner and Program Holder QA identities
        run: node scripts/qa/provision-learner-program-holder-e2e.mjs provision
      - name: Provision disposable Apprentice and Host Shop QA identities
        run: node scripts/qa/provision-apprenticeship-e2e.mjs provision
      - name: Verify preinstalled Playwright browsers
        run: node scripts/verify-playwright-runtime.mjs chromium
      - name: Verify published marketing artwork through Next image loader
        run: node --test scripts/marketing-image-config.test.mjs
      - name: Verify Course Builder chat controls in short and landscape panels
        run: node scripts/test-course-chat-layout.mjs
      # The broad test:e2e command runs desktop-chrome only. Certify the same
      # dedicated Host Shop identity on tablet and phone when configured.
      # A missing identity does NOT certify the Host Shop release.
      - name: Authenticated Host Shop desktop, tablet and mobile geometry
        if: ${{ matrix.shard == 1 && env.E2E_HOST_SHOP_EMAIL != '' && env.E2E_HOST_SHOP_PASSWORD != '' }}
        run: >-
          pnpm exec playwright test tests/e2e/portal-responsive-design.spec.ts
          --grep "critical Host Shop surfaces fit the active device viewport"
          --project=desktop-chrome --project=tablet-chrome
          --project=android-chrome --project=iphone-webkit
      - name: Certify repaired authenticated portal dependencies
        if: ${{ matrix.shard == 1 }}
        id: portal_certification
        continue-on-error: true
        run: >-
          pnpm exec playwright test
          tests/e2e/employer-onboarding.spec.ts
          tests/e2e/hvac-live-lesson-playback.spec.ts
          tests/e2e/portal-responsive-design.spec.ts
          --grep "Employer setup|Authenticated live HVAC lesson media|critical (Program Holder|Employer|Case Manager) surfaces"
          --project=desktop-chrome
      - name: Verify the corrected browser assertions
        id: focused
        if: ${{ success() && inputs.exhaustive && matrix.shard == 1 }}
        continue-on-error: true
        run: >-
          pnpm exec playwright test tests/e2e/application-flow.spec.ts
          tests/e2e/canonical-application-flow.spec.ts tests/e2e/complete-platform.spec.ts
          --project=desktop-chrome --retries=0
          --grep 'should navigate from homepage to apply page|should display application form fields|should show validation errors for empty form|should submit valid application|Host Shop application provides resume access|login, onboarding and tracking routes exist|homepage loads with all sections|eligibility quiz works end-to-end|programs page lists the published QA programs|individual program page has its title and application link|standard intake page loads with form|register page loads|should have no console errors'
          --max-failures=0 --output=test-results-focused --reporter=line
      - name: Run all cases in this desktop-chrome shard
        if: ${{ success() }}
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: browser-shard.json
          EXHAUSTIVE_BROWSER_RUN: ${{ inputs.exhaustive }}
        run: |
          args=()
          if [[ "$EXHAUSTIVE_BROWSER_RUN" == true ]]; then args+=(--max-failures=0); fi
          # The registered-apprenticeship authenticated spec runs in its own
          # job (e2e-apprenticeship-authenticated) so it executes exactly once.
          # Playwright matches --grep-invert against the test title path,
          # which includes the spec file name.
          pnpm test:e2e --shard=${{ matrix.shard }}/4 --reporter=line,html,json --grep-invert registered-apprenticeship-authenticated "${args[@]}"
      - name: Upload early shard artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-desktop-chrome-shard-${{ matrix.shard }}-early
          path: |
            browser-shard.json
            test-results/
          retention-days: 14
      - name: Enforce authenticated portal certification
        if: ${{ !cancelled() && matrix.shard == 1 && steps.portal_certification.outcome != 'success' }}
        run: |
          echo "Authenticated portal certification failed; broad E2E still ran for complete evidence."
          exit 1
      - name: Enforce focused exhaustive regression result
        if: ${{ !cancelled() && inputs.exhaustive && matrix.shard == 1 && steps.focused.outcome != 'success' }}
        run: |
          echo "Focused exhaustive browser regression failed; all shard evidence was retained."
          exit 1
      - name: Clean up disposable Apprentice and Host Shop QA identities
        if: always()
        run: node scripts/qa/provision-apprenticeship-e2e.mjs cleanup
      - name: Clean up disposable Learner and Program Holder QA identities
        if: always()
        run: node scripts/qa/provision-learner-program-holder-e2e.mjs cleanup
      - name: Clean up disposable Employer, Instructor, Staff, Case Manager and Admin QA identities
        if: always()
        run: node scripts/qa/provision-remaining-portal-e2e.mjs cleanup
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-desktop-chrome-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
            test-results-focused/
            browser-shard.json
          retention-days: 14

  # Runs ONLY tests/e2e/registered-apprenticeship-authenticated.spec.ts, using
  # the same container, environment, setup and provisioning steps as the
  # desktop-chrome shards. The shard pool excludes this spec with
  # --grep-invert, so it runs exactly once across this workflow.
  e2e-apprenticeship-authenticated:
    name: E2E apprenticeship authenticated
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble@sha256:3bed4b1a12f2338642f3d8cba28e291deef3c66bd4a964bbeb3e57bbff511dbd
      options: --init --shm-size=1g
    defaults:
      run:
        shell: bash
    timeout-minutes: 120
    env:
      PLAYWRIGHT_HTML_OPEN: never
      NODE_OPTIONS: '--max-old-space-size=6144'
      EXPECTED_LMS_SHA: ${{ github.sha }}
      QA_PORTAL_E2E_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-apprenticeship-authenticated
      # Isolated QA only: the full local-dev suite includes service-role
      # writes. Never use the production learner database or its service key.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
      TEST_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      TEST_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      TEST_STUDENT_EMAIL: ${{ secrets.E2E_LEARNER_EMAIL }}
      TEST_STUDENT_PASSWORD: ${{ secrets.E2E_LEARNER_PASSWORD }}
      E2E_LEARNER_EMAIL: ${{ secrets.E2E_LEARNER_EMAIL }}
      E2E_LEARNER_PASSWORD: ${{ secrets.E2E_LEARNER_PASSWORD }}
      TEST_PROGRAM_HOLDER_EMAIL: ${{ secrets.E2E_PROGRAM_HOLDER_EMAIL }}
      TEST_PROGRAM_HOLDER_PASSWORD: ${{ secrets.E2E_PROGRAM_HOLDER_PASSWORD }}
      E2E_PROGRAM_HOLDER_EMAIL: ${{ secrets.E2E_PROGRAM_HOLDER_EMAIL }}
      E2E_PROGRAM_HOLDER_PASSWORD: ${{ secrets.E2E_PROGRAM_HOLDER_PASSWORD }}
      E2E_APPRENTICE_EMAIL: ${{ secrets.E2E_APPRENTICE_EMAIL }}
      E2E_APPRENTICE_PASSWORD: ${{ secrets.E2E_APPRENTICE_PASSWORD }}
      E2E_EMPLOYER_EMAIL: ${{ secrets.E2E_EMPLOYER_EMAIL }}
      E2E_EMPLOYER_PASSWORD: ${{ secrets.E2E_EMPLOYER_PASSWORD }}
      E2E_INSTRUCTOR_EMAIL: ${{ secrets.E2E_INSTRUCTOR_EMAIL }}
      E2E_INSTRUCTOR_PASSWORD: ${{ secrets.E2E_INSTRUCTOR_PASSWORD }}
      E2E_STAFF_EMAIL: ${{ secrets.E2E_STAFF_EMAIL }}
      E2E_STAFF_PASSWORD: ${{ secrets.E2E_STAFF_PASSWORD }}
      E2E_CASE_MANAGER_EMAIL: ${{ secrets.E2E_CASE_MANAGER_EMAIL }}
      E2E_CASE_MANAGER_PASSWORD: ${{ secrets.E2E_CASE_MANAGER_PASSWORD }}
      # Only a designated disposable Host Shop identity may certify authenticated
      # shop dashboard geometry; never borrow Admin or Program Holder credentials.
      E2E_HOST_SHOP_EMAIL: ${{ secrets.E2E_HOST_SHOP_EMAIL }}
      E2E_HOST_SHOP_PASSWORD: ${{ secrets.E2E_HOST_SHOP_PASSWORD }}
      TEST_MODE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies=false
      - name: Verify isolated QA database and three-service E2E configuration
        run: node scripts/qa/verify-e2e-service-config.mjs
      - name: Provision disposable Employer, Instructor, Staff, Case Manager and Admin QA identities
        run: node scripts/qa/provision-remaining-portal-e2e.mjs provision
      - name: Provision disposable Learner and Program Holder QA identities
        run: node scripts/qa/provision-learner-program-holder-e2e.mjs provision
      - name: Provision disposable Apprentice and Host Shop QA identities
        run: node scripts/qa/provision-apprenticeship-e2e.mjs provision
      - name: Verify preinstalled Playwright browsers
        run: node scripts/verify-playwright-runtime.mjs chromium
      - name: Run registered apprenticeship authenticated spec
        if: ${{ success() }}
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: browser-shard.json
        run: pnpm test:e2e tests/e2e/registered-apprenticeship-authenticated.spec.ts --reporter=line,html,json
      - name: Clean up disposable Apprentice and Host Shop QA identities
        if: always()
        run: node scripts/qa/provision-apprenticeship-e2e.mjs cleanup
      - name: Clean up disposable Learner and Program Holder QA identities
        if: always()
        run: node scripts/qa/provision-learner-program-holder-e2e.mjs cleanup
      - name: Clean up disposable Employer, Instructor, Staff, Case Manager and Admin QA identities
        if: always()
        run: node scripts/qa/provision-remaining-portal-e2e.mjs cleanup
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-apprenticeship-authenticated
          path: |
            playwright-report/
            test-results/
            browser-shard.json
          retention-days: 14

  # Preserve the exact required job name. The matrix result is successful
  # only when every shard succeeds; skipped, canceled and failed all fail closed.
  desktop-chrome:
    name: E2E desktop-chrome
    runs-on: ubuntu-24.04
    needs: [desktop-chrome-shard, e2e-apprenticeship-authenticated]
    if: ${{ !cancelled() }}
    steps:
      - name: Require successful desktop results from the full matrix
        env:
          SHARD_RESULT: ${{ needs.desktop-chrome-shard.result }}
          APPRENTICESHIP_AUTHENTICATED_RESULT: ${{ needs.e2e-apprenticeship-authenticated.result }}
        run: test "$SHARD_RESULT" = success && test "$APPRENTICESHIP_AUTHENTICATED_RESULT" = success

  # An isolated, public-only regression must finish even if the broad
  # cross-app E2E suite runs into unrelated Course Builder/Program Holder failures.
  # Keep the full E2E job intact: this supplements, never bypasses, its result.
  public-host-shop-category:
    name: Public Host Shop navigation and application (five devices)
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble@sha256:3bed4b1a12f2338642f3d8cba28e291deef3c66bd4a964bbeb3e57bbff511dbd
      options: --init --shm-size=1g
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    env:
      PLAYWRIGHT_HTML_OPEN: never
      PLAYWRIGHT_APPS: marketing
      PLAYWRIGHT_BASE_URL: https://www.elevateforhumanity.org
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies=false
      - name: Verify browser engines for desktop and mobile
        run: node scripts/verify-playwright-runtime.mjs chromium firefox webkit
      - name: Certify deployed Host Shop navigation and invalid-submit flow
        run: >-
          pnpm exec playwright test
          tests/e2e/public-runtime-acceptance.spec.ts
          tests/e2e/canonical-application-flow.spec.ts
          --grep 'navigation destination /partners/host-shops(?:/[^:]+)?:|Host Shop application provides resume access'
          --project=desktop-chrome --project=laptop-chrome
          --project=tablet-chrome --project=android-chrome --project=iphone-webkit
      - name: Upload focused Host Shop browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: public-host-shop-category
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  email-device-browsers:
    name: Email device browsers
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble@sha256:3bed4b1a12f2338642f3d8cba28e291deef3c66bd4a964bbeb3e57bbff511dbd
      options: --init --shm-size=1g
    defaults:
      run:
        shell: bash
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies=false
      - name: Verify all three browser engines
        run: node scripts/verify-playwright-runtime.mjs chromium firefox webkit
      - name: Test real email component across desktop, tablet, and phone browsers
        # Firefox refuses to launch as root when HOME belongs to the container's pwuser.
        # Scope this to browser execution; do not relax test coverage or checks.
        env:
          HOME: /root
        run: pnpm exec playwright test --config playwright.email.config.ts
      - name: Upload email device evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: email-device-browsers
          path: |
            playwright-email-report/
            test-results/
          retention-days: 14
