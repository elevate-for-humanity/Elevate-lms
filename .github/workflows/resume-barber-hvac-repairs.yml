# Legacy one-off image SHA gates are retired. The verified Course Builder
# deployment requests dispatch-google-course-job.yml automatically after its
# five-worker digest readback. Manual recovery uses that same guarded lane.
# Never reset attempt history, cancel active leases or launch legacy workers.
name: Resume barber and HVAC repairs (canonical dispatch)
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  route-to-canonical-dispatch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Request guarded Course Builder coordination
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/dispatch-google-course-job.yml/dispatches" -f ref=main
          echo 'Canonical dispatch requested; separate worker lease and checkpoint evidence is required for completion.' >> "$GITHUB_STEP_SUMMARY"
