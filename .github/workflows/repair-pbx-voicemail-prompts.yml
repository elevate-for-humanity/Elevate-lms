name: Restore missing owned PBX voicemail prompts
# Also restore a missing sounds directory within the verified persistent data volume.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/repair-pbx-voicemail-prompts.yml']
permissions: {contents: read, actions: write, id-token: write}
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'google-pbx-infrastructure' || format('voicemail-prompts-dispatch-{0}', github.ref) }}
  cancel-in-progress: false
  queue: max
jobs:
  dispatch:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - env:
          GH_TOKEN: '${{ github.token }}'
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/repair-pbx-voicemail-prompts.yml/dispatches" -f ref=main
  repair:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        with: {skip_install: true}
      - name: Verify preservation and rollback guards
        run: python3 scripts/gcp/test-repair-pbx-voicemail-prompts.py
      - name: Verify owned VM identity
        run: test "$(gcloud compute instances describe elevate-pbx --project=elegant-racer-299721 --zone=us-central1-a --format='value(networkInterfaces[0].accessConfigs[0].natIP)')" = 107.178.216.162
      - name: Restore missing pinned official prompts while idle
        run: gcloud compute ssh elevate-pbx --project=elegant-racer-299721 --zone=us-central1-a --quiet --command='sudo python3 -' < scripts/gcp/repair-pbx-voicemail-prompts.py
      - name: Read back mailbox prerequisites
        run: gcloud compute ssh elevate-pbx --project=elegant-racer-299721 --zone=us-central1-a --quiet --command='sudo python3 -' < scripts/gcp/phone-voicemail-diagnostics.py
