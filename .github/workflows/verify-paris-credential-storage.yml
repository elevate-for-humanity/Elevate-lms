name: Verify PARIS credential storage
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-paris-credential-storage.yml']
  workflow_dispatch:
permissions: {contents: read, actions: write, id-token: write}
jobs:
  dispatch:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - env: {GH_TOKEN: '${{ github.token }}'}
        run: gh api --method POST repos/$GITHUB_REPOSITORY/actions/workflows/verify-paris-credential-storage.yml/dispatches -f ref=main
  verify:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        with: {skip_install: true}
      - name: Inspect existing credential locations without exposing values
        env:
          EXISTING_APP_KEY: ${{ secrets.GITHUB_APP_PRIVATE_KEY }}
          EXISTING_PARIS_APP_KEY: ${{ secrets.PARIS_GITHUB_APP_PRIVATE_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import {google,PROJECT,loadGoogleConfig} from './scripts/gcp/runtime-config.mjs';
          console.log(JSON.stringify({repositoryAppKeyPresent:Boolean(process.env.EXISTING_APP_KEY),repositoryParisAppKeyPresent:Boolean(process.env.EXISTING_PARIS_APP_KEY)}));
          for(const component of ['admin','ultimate-worker','studio-browser']){
            try{
              const config=loadGoogleConfig(component);
              const env=config.runtimeEnvironment;
              console.log(JSON.stringify({component,appId:env.GITHUB_APP_ID||null,
                appKeyPresent:Boolean(env.GITHUB_APP_PRIVATE_KEY),appKeyFile:env.GITHUB_APP_PRIVATE_KEY_FILE||null,
                runtimeFilePaths:Object.keys(config.runtimeFiles||{}).filter(x=>/github|paris|key\.pem/i.test(x))}));
            }catch(e){console.log(JSON.stringify({component,readError:e.code||'unavailable'}));}
          }
          try{
            const names=JSON.parse(google(['secrets','list','--project',PROJECT,'--format=json(name)']));
            console.log(JSON.stringify({matchingSecrets:names.map(x=>x.name).filter(x=>/github|paris|secret-group/i.test(x))}));
          }catch(e){console.log(JSON.stringify({inventoryError:e.code||'unavailable'}));}
          try{
            const token=google(['secrets','versions','access','latest','--secret','elevate-admin-github-token','--project',PROJECT]).trim();
            const response=await fetch('https://api.github.com/repos/elevate-for-humanity/Elevate-lms',{headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json'},redirect:'error',signal:AbortSignal.timeout(15000)});
            console.log(JSON.stringify({existingAdminTokenHttp:response.status,oauthScopes:response.headers.get('x-oauth-scopes'),tokenExpiry:response.headers.get('github-authentication-token-expiration')}));
          }catch(e){console.log(JSON.stringify({existingAdminTokenCheck:e.code||'unavailable'}));}
          try{
            const env=loadGoogleConfig('admin').runtimeEnvironment;
            const base=env.NEXT_PUBLIC_SUPABASE_URL||env.SUPABASE_URL;
            const key=env.SUPABASE_SERVICE_ROLE_KEY;
            if(!base||!key)throw Error('missing_bootstrap');
            const stored=await fetch(base.replace(/\/$/,'')+'/rest/v1/rpc/get_platform_secret',{method:'POST',headers:{apikey:key,Authorization:'Bearer '+key,'Content-Type':'application/json'},body:JSON.stringify({p_key:'GITHUB_TOKEN'}),signal:AbortSignal.timeout(15000)});
            if(!stored.ok)throw Error('canonical_read_failed');
            const token=await stored.json();
            if(typeof token!=='string'||!token.trim())throw Error('canonical_token_missing');
            const response=await fetch('https://api.github.com/repos/elevate-for-humanity/Elevate-lms',{headers:{Authorization:'Bearer '+token.trim(),Accept:'application/vnd.github+json'},redirect:'error',signal:AbortSignal.timeout(15000)});
            console.log(JSON.stringify({canonicalAdminTokenHttp:response.status,oauthScopes:response.headers.get('x-oauth-scopes')}));
          }catch{console.log(JSON.stringify({canonicalAdminTokenCheck:'unavailable'}));}
          NODE
      - name: Audit exact App key lookup, aliases, versions and identity (read only)
        env:
          CONFIGURED_APP_SECRET: ${{ vars.PARIS_GITHUB_APP_SECRET }}
          AUDIT_GITHUB_APP_PRIVATE_KEY: ${{ secrets.GITHUB_APP_PRIVATE_KEY }}
          AUDIT_PARIS_GITHUB_APP_PRIVATE_KEY: ${{ secrets.PARIS_GITHUB_APP_PRIVATE_KEY }}
          AUDIT_GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
          AUDIT_GITHUB_PRIVATE_KEY: ${{ secrets.GITHUB_PRIVATE_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import {createPrivateKey,sign} from 'node:crypto';
          import {google,PROJECT,loadGoogleConfig} from './scripts/gcp/runtime-config.mjs';
          const expectedAppId='5477907';
          const configured=process.env.CONFIGURED_APP_SECRET?.trim()||'paris-engineer-github-private-key';
          const safeName=value=>typeof value==='string'&&/^[a-zA-Z0-9_./:-]{1,255}$/.test(value)?value:'invalid_reference';
          const out=value=>console.log(JSON.stringify(value));
          const category=error=>['permission_denied','not_found','authentication_failed','api_disabled','quota_exceeded'].includes(error?.code)?error.code:'unavailable';
          out({audit:'github_app_key_lookup_v2',readOnly:true,project:PROJECT,configuredSecret:safeName(configured),expectedAppId});
          try {out({activeGoogleAccounts:JSON.parse(google(['auth','list','--filter=status:ACTIVE','--format=json(account)'])).map(x=>x.account)});}catch(error){out({identityReadError:category(error)});}
          async function verifyKey(source,pem){
            if(typeof pem!=='string'||!pem.trim()){out({source,present:false});return;}
            let key;
            try{key=createPrivateKey(pem.replace(/\\n/g,'\n'));if(key.asymmetricKeyType!=='rsa')throw Error();}
            catch{out({source,present:true,rsaPrivateKeyValid:false});return;}
            try{
              const now=Math.floor(Date.now()/1000),encode=v=>Buffer.from(JSON.stringify(v)).toString('base64url');
              const unsigned=encode({alg:'RS256',typ:'JWT'})+'.'+encode({iat:now-60,exp:now+120,iss:expectedAppId});
              const jwt=unsigned+'.'+sign('RSA-SHA256',Buffer.from(unsigned),key).toString('base64url');
              const response=await fetch('https://api.github.com/app',{headers:{Authorization:'Bearer '+jwt,Accept:'application/vnd.github+json'},redirect:'error',signal:AbortSignal.timeout(15000)});
              const body=await response.json().catch(()=>null);
              out({source,present:true,rsaPrivateKeyValid:true,appAuthenticationHttp:response.status,expectedAppConfirmed:response.ok&&String(body?.id)===expectedAppId});
            }catch{out({source,present:true,rsaPrivateKeyValid:true,appAuthentication:'unavailable'});}
          }
          for(const name of ['GITHUB_APP_PRIVATE_KEY','PARIS_GITHUB_APP_PRIVATE_KEY','GH_APP_PRIVATE_KEY','GITHUB_PRIVATE_KEY'])await verifyKey('github-actions:'+name,process.env['AUDIT_'+name]);
          const projects=new Set([PROJECT]);
          try{
            for(const row of JSON.parse(google(['projects','list','--format=json(projectId)'])))if(/elevate|elegant/i.test(row.projectId||'')&&projects.size<10)projects.add(row.projectId);
          }catch(error){out({projectInventoryError:category(error)});}
          for(const project of projects){
            let names=[];
            try{names=JSON.parse(google(['secrets','list','--project',project,'--format=json(name)'])).map(x=>x.name.split('/').pop());out({project,matchingSecretNames:names.filter(n=>/github|paris/i.test(n))});}
            catch(error){out({project,secretInventoryError:category(error)});}
            const candidates=[...new Set([configured,...names.filter(n=>/github.*(?:private|app.*key)|(?:private.*github)|paris.*key/i.test(n))])].slice(0,12);
            for(const name of candidates){
              if(!/^[a-zA-Z0-9_-]{1,255}$/.test(name)){out({project,secret:safeName(name),unsupportedSecretReference:true});continue;}
              try{const metadata=JSON.parse(google(['secrets','describe',name,'--project',project,'--format=json(name)']));out({project,secret:name,metadataExists:Boolean(metadata.name)});}
              catch(error){out({project,secret:name,metadataReadError:category(error)});}
              try{const versions=JSON.parse(google(['secrets','versions','list',name,'--project',project,'--format=json(name,state)']));out({project,secret:name,versions:versions.map(x=>({version:x.name.split('/').pop(),state:x.state}))});}
              catch(error){out({project,secret:name,versionInventoryError:category(error)});}
              try{const pem=google(['secrets','versions','access','latest','--secret',name,'--project',project]);await verifyKey('google:'+project+':'+name+':latest',pem);}
              catch(error){out({project,secret:name,latestAccessError:category(error)});}
            }
          }
          try{
            const resource=JSON.parse(google(['run','services','describe','elevate-admin-migration','--project',PROJECT,'--region=us-central1','--format=json']));
            const spec=resource.spec?.template?.spec||{};
            out({liveAdminServiceAccount:spec.serviceAccountName||null,appEnvironmentBindings:(spec.containers||[]).flatMap(c=>c.env||[]).filter(e=>/^GITHUB_APP_/.test(e.name||'')).map(e=>({name:e.name,literalPresent:Boolean(e.value),secret:e.valueFrom?.secretKeyRef?.name||null,version:e.valueFrom?.secretKeyRef?.key||null})),appSecretVolumes:(spec.volumes||[]).filter(v=>v.secret&&/github|paris/i.test(v.name+' '+v.secret.secretName)).map(v=>({name:v.name,secret:v.secret.secretName}))});
          }catch(error){out({liveAdminBindingReadError:category(error)});}
          NODE
