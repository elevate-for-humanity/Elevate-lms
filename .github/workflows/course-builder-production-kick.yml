# Canonical production continuation: Barber + Cosmetology media checkpoints
name: Course Builder Production Kick

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/course-builder-production-kick.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: course-builder-production-kick
  cancel-in-progress: false

jobs:
  kick-canonical-runs:
    name: Keep Barber and Cosmetology canonical media workers active
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      ADMIN_URL: ${{ secrets.ADMIN_URL || 'https://admin.elevateforhumanity.org' }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Require production worker credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET"
          test -n "$ADMIN_URL"

      - name: Continue canonical media workers for one hour
        shell: bash
        run: |
          set -euo pipefail
          for pass in $(seq 1 12); do
            echo "=== media continuation pass $pass/12 ==="
            echo "Barber:"
            curl -fsS -X POST "$ADMIN_URL/api/internal/videos/process-queue" \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H "Content-Type: application/json" \
              --data '{"courseId":"3fb5ce19-1cde-434c-a8c6-f138d7d7aa17","maxJobs":1}' \
              --max-time 60 || echo '{"ok":false,"reason":"barber-worker-request-failed"}'
            echo
            echo "Cosmetology:"
            curl -fsS -X POST "$ADMIN_URL/api/internal/videos/process-queue" \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H "Content-Type: application/json" \
              --data '{"courseId":"9ca9fb50-7119-46ea-ab81-9b0193c29c31","maxJobs":1}' \
              --max-time 60 || echo '{"ok":false,"reason":"cosmetology-worker-request-failed"}'
            echo
            if [ "$pass" -lt 12 ]; then
              sleep 300
            fi
          done
