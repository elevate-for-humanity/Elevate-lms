name: Audit Admin Kokoro narration logs
on:
  workflow_dispatch:
    inputs:
      freshness:
        description: Log window (gcloud --freshness)
        required: false
        default: 14d
permissions:
  contents: read
  id-token: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 8
    steps:
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Read Admin Kokoro narration worker errors
        env:
          FRESHNESS: ${{ inputs.freshness }}
        run: |
          case "$FRESHNESS" in ''|*[!0-9dhm]*) echo "Invalid freshness: $FRESHNESS"; exit 1;; esac
          FILTER='resource.type="cloud_run_revision" AND resource.labels.service_name="elevate-admin-migration" AND (textPayload:"kokoro-narration-worker" OR textPayload:"KOKORO_" OR jsonPayload.message:"kokoro-narration-worker" OR jsonPayload.message:"KOKORO_")'
          gcloud logging read "$FILTER" --project=elegant-racer-299721 --freshness="$FRESHNESS" --limit=40 \
            --format='value(timestamp,resource.labels.revision_name,textPayload,jsonPayload.message)' | cut -c1-400 | tee /tmp/kokoro-log
          echo "Matching entries: $(grep -c . /tmp/kokoro-log || true)"
          echo "Baked /workspace path failures: $(grep -c '/workspace/lib/video/kokoro-narration-worker.mjs' /tmp/kokoro-log || true)"
