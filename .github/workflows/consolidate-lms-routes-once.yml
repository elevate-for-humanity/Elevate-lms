name: Consolidate LMS Routes Once

on:
  push:
    branches: [main]
    paths:
      - 'scripts/consolidate-lms-routes-once.mjs'
      - '.github/workflows/consolidate-lms-routes-once.yml'

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Consolidate LMS routes
        run: node scripts/consolidate-lms-routes-once.mjs

      - name: Verify retired LMS route literals are gone
        run: |
          ! grep -R --line-number --include='*.ts' --include='*.tsx' "/portal/apprentice" apps/lms/app components lib
          ! grep -R --line-number --include='*.ts' --include='*.tsx' "'/learner/dashboard'\|\"/learner/dashboard\"" apps/lms/app components lib
          ! grep -R --line-number --include='*.ts' --include='*.tsx' "'/lms/login'\|\"/lms/login\"" apps/lms/app components lib

      - name: Commit consolidation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "refactor(lms): consolidate canonical portal routes"
            git push origin HEAD:main
          fi
