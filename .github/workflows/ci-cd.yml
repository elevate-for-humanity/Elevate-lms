name: CI/CD Pipeline

on:
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  NODE_OPTIONS: '--max-old-space-size=6144'

jobs:
  quality:
    name: Release diagnostic — ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: system-invariants
            command: pnpm run verify:system
          - name: unit-tests
            command: pnpm run test
          - name: smoke-tests
            command: bash scripts/smoke-test.sh
          - name: production-typecheck
            command: pnpm run typecheck:all
          - name: route-governance
            command: pnpm run route:audit:strict
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || 'https://www.elevateforhumanity.org' }}
      SSN_SALT: ${{ secrets.SSN_SALT }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      SKIP_ENV_VALIDATION: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies=false
      - name: Verify source commit
        run: |
          echo "Checked out SHA: $(git rev-parse HEAD)"
          test "$(git status --porcelain)" = ""
      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}

  build:
    name: Production build — ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: marketing
            command: pnpm --filter @elevate/marketing build
          - app: admin
            command: pnpm --filter @elevate/admin build
          - app: lms
            command: pnpm run build:lms:phased
    env:
      GENERATE_SOURCEMAP: 'false'
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || 'https://www.elevateforhumanity.org' }}
      NEXT_PUBLIC_ADMIN_URL: ${{ secrets.NEXT_PUBLIC_ADMIN_URL || 'https://admin.elevateforhumanity.org' }}
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL || 'https://app.elevateforhumanity.org' }}
      SSN_SALT: ${{ secrets.SSN_SALT }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      SKIP_ENV_VALIDATION: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies=false
      - name: Clear Next.js caches
        run: rm -rf .next apps/*/.next
      - name: Build ${{ matrix.app }}
        run: ${{ matrix.command }}

  changed-file-lint:
    name: Changed-file lint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies=false
      - name: Lint changed files only
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="HEAD~1"
          fi
          CHANGED=$(git diff --name-only "$BASE" HEAD -- '*.ts' '*.tsx' '*.js' '*.jsx' | grep -v node_modules | grep -v '\.next' || true)
          if [ -z "$CHANGED" ]; then
            echo "No TS/JS files changed."
            exit 0
          fi
          EXISTING_FILES=$(echo "$CHANGED" | while IFS= read -r file; do [ -f "$file" ] && echo "$file"; done)
          if [ -z "$EXISTING_FILES" ]; then
            echo "No existing TS/JS files to lint."
            exit 0
          fi
          echo "$EXISTING_FILES" | xargs pnpm exec eslint --max-warnings=0 --no-error-on-unmatched-pattern --no-warn-ignored

  release-gate:
    name: Production Release Gate
    runs-on: ubuntu-latest
    needs: [quality, build, changed-file-lint]
    if: always()
    steps:
      - name: Require every release diagnostic to pass
        shell: bash
        run: |
          echo "quality=${{ needs.quality.result }}"
          echo "build=${{ needs.build.result }}"
          echo "changed-file-lint=${{ needs.changed-file-lint.result }}"
          test "${{ needs.quality.result }}" = "success"
          test "${{ needs.build.result }}" = "success"
          test "${{ needs.changed-file-lint.result }}" = "success"

  post-deployment-check:
    name: Production post-deployment verification
    runs-on: ubuntu-latest
    needs: [release-gate]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refuse to certify a failed release gate
        run: test "${{ needs.release-gate.result }}" = "success"
      - name: Wait for production deployment
        run: sleep 120
      - name: Check Marketing, Admin and LMS health
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            https://www.elevateforhumanity.org/api/health \
            https://admin.elevateforhumanity.org/api/health \
            https://app.elevateforhumanity.org/api/health; do
            echo "Checking $url"
            ok=false
            for attempt in 1 2 3; do
              code=$(curl -sS -o /tmp/health-body -w '%{http_code}' --max-time 15 "$url" || true)
              echo "Attempt $attempt: HTTP $code"
              if [ "$code" = "200" ]; then ok=true; break; fi
              sleep 20
            done
            if [ "$ok" != "true" ]; then
              echo "FAILED: $url"
              cat /tmp/health-body || true
              exit 1
            fi
          done
      - name: Run production portal smoke tests
        run: bash scripts/smoke-test-portal.sh https://www.elevateforhumanity.org

  notify-on-failure:
    name: Release failure report
    runs-on: ubuntu-latest
    needs: [release-gate]
    if: always() && needs.release-gate.result != 'success'
    steps:
      - name: Report release failure
        run: |
          echo "Required release validation failed."
          echo "No downstream required gate is being treated as successful because an earlier job failed."
          echo "Check ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
