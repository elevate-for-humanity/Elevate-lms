; Merge into the RUNNING pjsip.conf after inspecting its current transports.
; Caddy terminates trusted public WSS and forwards only over VM loopback.
; Asterisk HTTP must remain bound to 127.0.0.1:8088, never public plaintext WS.
; Reuse an existing protocol=ws transport if present. Do not duplicate it.
[elevate-loopback-ws]
type=transport
protocol=ws
bind=127.0.0.1

