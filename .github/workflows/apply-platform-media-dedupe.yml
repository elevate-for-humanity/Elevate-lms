name: Platform Media Dedupe Audit (supervised)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-media-dedupe-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout selected audit ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify duplicate media without mutating source
        run: node scripts/audit-platform-media-duplicates.mjs

      - name: Recovery policy
        run: |
          echo 'This workflow audits media only; corrections require semantic review.'
          echo 'Submit verified corrections through a pull request targeting main.'
