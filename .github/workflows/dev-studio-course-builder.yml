name: Dev Studio Course Builder Control Plane

on:
  workflow_dispatch:
    inputs:
      program:
        description: Course package to build through Dev Studio -> Course Builder
        required: true
        type: string
        default: business-administration
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

env:
  CI: true
  NODE_ENV: production
  AI_CIRCUIT_RECOVERY_WAIT: '1'
  AI_PROVIDER: cloudflare
  SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GOOGLE_CLOUD_API_KEY: ${{ secrets.GOOGLE_CLOUD_API_KEY }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_AI_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_API_TOKEN }}
  CLOUDFLARE_AI_MODEL: '@cf/meta/llama-4-scout-17b-16e-instruct'
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
  ADMIN_URL: ${{ secrets.ADMIN_URL }}
  CRON_SECRET: ${{ secrets.CRON_SECRET }}

jobs:
  dev-studio-course-builder:
    if: >-
      github.event_name != 'issues' ||
      github.event.issue.title == 'RUN BUSINESS COURSE BUILDER ACCEPTANCE' ||
      github.event.issue.title == 'RUN ESB COURSE BUILDER ACCEPTANCE' ||
      github.event.issue.title == 'RUN HVAC COURSE BUILDER ACCEPTANCE' ||
      github.event.issue.title == 'RUN BARBER COURSE BUILDER ACCEPTANCE' ||
      github.event.issue.title == 'RUN COSMETOLOGY COURSE BUILDER ACCEPTANCE'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: dev-studio-course-builder-${{ github.event_name == 'workflow_dispatch' && inputs.program || github.event.issue.title || 'push' }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          clean: true

      - name: Record canonical control-plane revision
        id: tested
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          test -f lib/devstudio/course-builder-controller.ts

      - name: Post Dev Studio start evidence
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        env:
          TESTED_SHA: ${{ steps.tested.outputs.sha }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `DEV STUDIO -> COURSE BUILDER STARTED\n\nExact checked-out main SHA: ${process.env.TESTED_SHA}`,
            });

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies deterministically
        run: pnpm install --frozen-lockfile --strict-peer-dependencies=false

      - name: Enforce Studio as control plane and Course Builder as orchestration authority
        run: |
          node scripts/check-course-factory-authority.mjs
          node scripts/check-studio-architecture.mjs
          node scripts/audit-course-builder-procurement.mjs
          pnpm typecheck:studio
          pnpm exec eslint lib/devstudio/course-builder-controller.ts lib/course-builder lib/course-factory --quiet
          pnpm exec vitest run tests/unit/course-factory/lesson-contract-normalization.test.ts

      - name: Require production persistence and canonical Cloudflare Workers AI
        shell: bash
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test "$AI_PROVIDER" = "cloudflare"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_AI_API_TOKEN"
          case "$CLOUDFLARE_AI_MODEL" in
            @cf/*) ;;
            *) exit 1 ;;
          esac

      - name: Resolve requested package
        id: target
        shell: bash
        run: |
          target="business-administration"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            target="${{ inputs.program }}"
          elif [ "${{ github.event_name }}" = "issues" ] && [ "${{ github.event.issue.title }}" = "RUN ESB COURSE BUILDER ACCEPTANCE" ]; then
            target="esb"
          fi
          if [ "${{ github.event_name }}" = "issues" ] && [ "${{ github.event.issue.title }}" = "RUN HVAC COURSE BUILDER ACCEPTANCE" ]; then
            target="hvac-technician"
          elif [ "${{ github.event_name }}" = "issues" ] && [ "${{ github.event.issue.title }}" = "RUN BARBER COURSE BUILDER ACCEPTANCE" ]; then
            target="barber-apprenticeship"
          elif [ "${{ github.event_name }}" = "issues" ] && [ "${{ github.event.issue.title }}" = "RUN COSMETOLOGY COURSE BUILDER ACCEPTANCE" ]; then
            target="cosmetology-apprenticeship"
          fi
          echo "program=$target" >> "$GITHUB_OUTPUT"

      - name: Authorize one-time ESB media run for issue 923
        if: github.event_name == 'issues' && github.event.issue.number == 923 && github.event.issue.title == 'RUN ESB COURSE BUILDER ACCEPTANCE'
        shell: bash
        run: rm -f .github/COURSE_MEDIA_PAUSED

      - name: Build through canonical Dev Studio controlled Course Builder
        env:
          NODE_OPTIONS: --conditions=react-server
        shell: bash
        run: |
          if [ "${{ steps.target.outputs.program }}" = "esb" ]; then
            pnpm tsx scripts/course-factory/build-esb-acceptance.ts
          elif [ "${{ steps.target.outputs.program }}" = "hvac-technician" ]; then
            # Rebuild the canonical authored source first so Course Builder never
            # republishes stale refrigerant classifications or static penalty data.
            pnpm tsx scripts/backfill-hvac-script-text.ts --force
            pnpm tsx scripts/course-builder/run.ts --course hvac-technician --mode refresh
            pnpm tsx scripts/check-hvac-content.ts
          elif [ "${{ steps.target.outputs.program }}" = "business-administration" ]; then
            pnpm tsx scripts/course-factory/build-business-program.ts
          else
            pnpm tsx scripts/course-builder/run.ts --course "${{ steps.target.outputs.program }}" --mode refresh
          fi

      - name: Verify Admin and LMS consumers after governed publication
        run: |
          pnpm exec eslint apps/admin/app/api/admin/course-builder apps/lms/app/lms/courses apps/lms/app/api/learner/interactions --quiet
          pnpm build:admin
          pnpm build:lms

      - name: Post Dev Studio completion evidence
        if: always() && github.event_name == 'issues'
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          TESTED_SHA: ${{ steps.tested.outputs.sha }}
          PROGRAM: ${{ steps.target.outputs.program }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `DEV STUDIO -> COURSE BUILDER ${process.env.JOB_STATUS === 'success' ? 'PASS' : 'FAIL'}\n\nProgram: ${process.env.PROGRAM || 'unresolved'}\nTested main SHA: ${process.env.TESTED_SHA || 'unknown'}`,
            });
