name: E2E desktop-chrome

# Runs the full monorepo browser suite (Marketing :3000, Admin :3001, LMS :3002)
# on the desktop-chrome project. Playwright starts all three dev servers from
# playwright.config.ts. Triage and required environment:
# docs/audits/e2e-desktop-chrome-triage.md
on:
  workflow_dispatch:
  pull_request:
    branches: [main]

concurrency:
  group: e2e-desktop-chrome-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop-chrome:
    name: E2E desktop-chrome
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble@sha256:3bed4b1a12f2338642f3d8cba28e291deef3c66bd4a964bbeb3e57bbff511dbd
      options: --init --shm-size=1g
    defaults:
      run:
        shell: bash
    timeout-minutes: 120
    env:
      PLAYWRIGHT_HTML_OPEN: never
      NODE_OPTIONS: '--max-old-space-size=6144'
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL || secrets.E2E_ADMIN_EMAIL }}
      TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD || secrets.E2E_ADMIN_PASSWORD }}
      TEST_STUDENT_EMAIL: ${{ secrets.TEST_STUDENT_EMAIL || secrets.E2E_STUDENT_EMAIL }}
      TEST_STUDENT_PASSWORD: ${{ secrets.TEST_STUDENT_PASSWORD || secrets.E2E_STUDENT_PASSWORD }}
      TEST_PROGRAM_HOLDER_EMAIL: ${{ secrets.TEST_PROGRAM_HOLDER_EMAIL }}
      TEST_PROGRAM_HOLDER_PASSWORD: ${{ secrets.TEST_PROGRAM_HOLDER_PASSWORD }}
      TEST_MODE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies=false
      - name: Verify preinstalled Playwright browsers
        run: node scripts/verify-playwright-runtime.mjs chromium
      - name: Run desktop-chrome E2E (marketing, admin, lms)
        run: pnpm test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-desktop-chrome
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  email-device-browsers:
    name: Email device browsers
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble@sha256:3bed4b1a12f2338642f3d8cba28e291deef3c66bd4a964bbeb3e57bbff511dbd
      options: --init --shm-size=1g
    defaults:
      run:
        shell: bash
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies=false
      - name: Verify all three browser engines
        run: node scripts/verify-playwright-runtime.mjs chromium firefox webkit
      - name: Test real email component across desktop, tablet, and phone browsers
        run: pnpm exec playwright test --config playwright.email.config.ts
      - name: Upload email device evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: email-device-browsers
          path: |
            playwright-email-report/
            test-results/
          retention-days: 14
