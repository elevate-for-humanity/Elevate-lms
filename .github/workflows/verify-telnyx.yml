name: Verify Telnyx Production

on:
  push:
    branches: [main]
    paths:
      - 'scripts/northflank/reconcile-telnyx.ts'
      - '.github/workflows/verify-telnyx.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telnyx-production-reconcile
  cancel-in-progress: true

jobs:
  verify:
    name: Reconcile and verify Telnyx
    runs-on: ubuntu-latest
    environment: production
    env:
      NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
      NORTHFLANK_PROJECT_ID: ${{ secrets.NORTHFLANK_PROJECT_ID || 'elevate-platform' }}
      NORTHFLANK_SECRET_GROUP_ID: ${{ secrets.NORTHFLANK_SECRET_GROUP_ID || 'elevate-production-env' }}
      TELNYX_API_KEY: ${{ secrets.TELNYX_API_KEY }}
      TELNYX_PUBLIC_KEY: ${{ secrets.TELNYX_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.2 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies deterministically
        run: pnpm install --frozen-lockfile --strict-peer-dependencies=false
      - name: Reconcile and verify production number
        run: pnpm tsx scripts/northflank/reconcile-telnyx.ts
