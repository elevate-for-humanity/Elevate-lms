name: Build Cosmetology Course
# Paid production runner. It is manual-only so an unrelated source push can
# never start or resume course generation without an explicit operator action.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: true
  NODE_ENV: production
  # Course generation uses serverless Workers AI. The always-on L4 LLM worker
  # is intentionally excluded so idle course authoring cannot consume GPU credit.
  AI_PROVIDER: cloudflare
  AI_PROVIDER_ORDER: cloudflare
  AI_CIRCUIT_RECOVERY_WAIT: '1'
  COURSE_FACTORY_LESSON_MAX_TOKENS: '4000'
  COURSE_FACTORY_LESSON_MAX_ATTEMPTS: '2'
  ELEVATE_LLM_TIMEOUT_MS: '600000'
  # A long-running batch must wait out transient Data API latency instead of
  # sharing the short-fail circuit policy used by interactive web requests.
  SUPABASE_FETCH_TIMEOUT_MS: '30000'
  SUPABASE_READ_MAX_ATTEMPTS: '2'
  SUPABASE_CIRCUIT_BREAKER_ENABLED: 'false'
  COURSE_FACTORY_CHECKPOINT_DIR: .course-build-cache/cosmetology
  NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_AI_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_API_TOKEN }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_AI_MODEL: ${{ secrets.CLOUDFLARE_AI_MODEL }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  ONET_API_KEY: ${{ secrets.ONET_API_KEY }}
  CAREERONESTOP_USER_ID: ${{ secrets.CAREERONESTOP_USER_ID }}
  # Older deployments named this secret TOKEN; accept it while API_KEY is canonicalized.
  CAREERONESTOP_API_KEY: ${{ secrets.CAREERONESTOP_API_KEY || secrets.CAREERONESTOP_TOKEN }}
  # Public project URL is repository-owned configuration, not a credential.
  # Pin it here so a stale generic SUPABASE_URL secret cannot route this
  # production-only workflow to another project or an unreachable endpoint.
  SUPABASE_URL: https://cuxzzpsyufcewtmicszk.supabase.co
  NEXT_PUBLIC_SUPABASE_URL: https://cuxzzpsyufcewtmicszk.supabase.co
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  NODE_OPTIONS: --conditions=react-server

jobs:
  build:
    runs-on: ubuntu-latest
    # Full regulated-course generation can exceed three hours when the provider
    # repairs individual lesson or exam contracts. GitHub-hosted jobs allow six.
    timeout-minutes: 360
    concurrency:
      group: cosmetology-course-production-build
      # A canceled runner cannot reliably write its terminal database ledger.
      # Queue production builds so a config push never strands an active lock.
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          clean: true

      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Restore durable Cosmetology generation journal
        uses: actions/cache@v5
        with:
          path: .course-build-cache/cosmetology
          key: cosmetology-generation-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            cosmetology-generation-v1-

      - run: pnpm install --frozen-lockfile --strict-peer-dependencies=false

      - name: Require production database credentials
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"

      - name: Wait for authenticated production database readiness
        run: node scripts/course-factory/wait-for-cosmetology-database.mjs

      - name: Build canonical cosmetology course and queue media
        run: pnpm tsx scripts/course-factory/build-cosmetology-course.ts

      - name: Verify apprenticeship architecture
        run: node scripts/check-registered-apprenticeship-architecture.mjs
