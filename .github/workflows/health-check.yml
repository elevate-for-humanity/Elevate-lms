name: Health Check
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: read
concurrency:
  group: google-public-health-check
  cancel-in-progress: false
jobs:
  google-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/gcp/audit-runtime-parity.test.mjs scripts/gcp/verify-public-health.test.mjs
      - name: Verify public Google liveness, readiness, Supabase and QuickBooks
        run: node scripts/gcp/verify-public-health.mjs
