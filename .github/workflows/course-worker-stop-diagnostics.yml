name: Read course worker stop diagnostics
on:
  push:
    branches: [main]
    paths: ['.github/workflows/course-worker-stop-diagnostics.yml', 'scripts/gcp/course-worker-stop-diagnostics.mjs']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dispatch:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch authenticated diagnostics from protected main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/course-worker-stop-diagnostics.yml/dispatches" -f ref=main
  diagnose:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    concurrency:
      group: google-runtime-us-central1
      cancel-in-progress: false
      queue: max
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        with:
          skip_install: true
      - run: node --test scripts/gcp/authoring-probe-policy.test.mjs
      - run: node scripts/gcp/course-worker-stop-diagnostics.mjs
