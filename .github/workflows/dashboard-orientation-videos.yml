name: Publish visual dashboard orientation videos
on:
  push:
    branches: [main]
    paths:
      - 'lib/orientation/**'
      - 'scripts/gcp/render-dashboard-orientations.mjs'
      - '.github/workflows/dashboard-orientation-videos.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
  id-token: write
concurrency:
  group: dashboard-orientation-media
  cancel-in-progress: false
jobs:
  request-publication:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Request the existing Google-trusted main dispatch event
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/dashboard-orientation-videos.yml/dispatches" -f ref=main
  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        with:
          skip_install: true
      - name: Validate orientation content and protected media keys
        run: node --test tests/worker/dashboard-orientations.test.mjs
      - name: Render and verify captioned orientation films with the existing speech runtime
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
          node --input-type=module <<'NODE'
          import {writeFileSync} from 'node:fs';
          import {loadGoogleConfig,google} from './scripts/gcp/runtime-config.mjs';
          const vars=loadGoogleConfig('ultimate-worker').runtimeEnvironment;
          const canonical=Boolean(vars.ELEVATE_MEDIA_ENDPOINT);
          const fields={ELEVATE_MEDIA_ENDPOINT:canonical?vars.ELEVATE_MEDIA_ENDPOINT:vars.S3_ENDPOINT,
            ELEVATE_MEDIA_ACCESS_KEY_ID:canonical?vars.ELEVATE_MEDIA_ACCESS_KEY_ID:vars.S3_ACCESS_KEY_ID,
            ELEVATE_MEDIA_SECRET_ACCESS_KEY:canonical?vars.ELEVATE_MEDIA_SECRET_ACCESS_KEY:vars.S3_SECRET_ACCESS_KEY,
            ELEVATE_MEDIA_BUCKET:canonical?vars.ELEVATE_MEDIA_BUCKET:vars.S3_BUCKET};
          if(Object.values(fields).some(v=>typeof v!=='string'||!v||/[\r\n]/.test(v)))throw Error('ORIENTATION_STORAGE_CONFIG_REQUIRED');
          fields.ELEVATE_MEDIA_REGION=new URL(fields.ELEVATE_MEDIA_ENDPOINT).hostname.split('.')[1];
          writeFileSync(process.env.RUNNER_TEMP+'/orientation-storage.env',Object.entries(fields).map(([k,v])=>k+'='+v).join('\n'),{mode:0o600});
          const job=JSON.parse(google(['run','jobs','describe','elevate-course-builder','--project=elegant-racer-299721','--region=us-central1','--format=json']));
          const image=job.spec.template.spec.template.spec.containers[0].image;
          if(!/^us-central1-docker.pkg.dev\/elegant-racer-299721\/elevate\/ultimate-worker@sha256:[a-f0-9]{64}$/.test(image))throw Error('IMMUTABLE_SPEECH_RUNTIME_REQUIRED');
          writeFileSync(process.env.RUNNER_TEMP+'/orientation-image',image);
          NODE
          trap 'rm -f "$RUNNER_TEMP/orientation-storage.env" "$RUNNER_TEMP/orientation-image"' EXIT
          image=$(cat "$RUNNER_TEMP/orientation-image")
          docker run --rm --cpus=2 --memory=6g --entrypoint node \
            --env-file "$RUNNER_TEMP/orientation-storage.env" \
            -v "$PWD:/source:ro" \
            -v "$PWD/lib/orientation:/app/lib/orientation:ro" \
            -v "$PWD/scripts/gcp/render-dashboard-orientations.mjs:/app/scripts/gcp/render-dashboard-orientations.mjs:ro" \
            "$image" --import=tsx /app/scripts/gcp/render-dashboard-orientations.mjs
      - name: Record publication boundary
        run: echo 'All configured captioned role orientation films uploaded and storage readback verified. This workflow does not claim any user completed orientation or training.' >> "$GITHUB_STEP_SUMMARY"
