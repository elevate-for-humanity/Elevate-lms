name: PR 664 Admin Repair

on:
  push:
    branches:
      - fix/unified-course-factory-esb

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/unified-course-factory-esb
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies=false
      - name: Apply guarded source repairs
        run: python3 .github/scripts/pr664_admin_repair.py
      - name: Verify Admin TypeScript
        run: pnpm run typecheck:admin
      - name: Commit verified repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/app/api/admin/courses/generate/publish/route.ts apps/admin/app/api/devstudio/chat/route.ts apps/admin/app/api/devstudio/git/route.ts lib/curriculum/builders/buildCanonicalCourseFromBlueprint.ts lib/ellie/executor.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(admin): clear release-gate type errors"
          git push origin HEAD:fix/unified-course-factory-esb
