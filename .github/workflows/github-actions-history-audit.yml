name: Historical GitHub Actions Skip Audit
on:
  workflow_dispatch:
    inputs:
      start:
        description: 'Inclusive UTC start (ISO 8601). Defaults to repository creation.'
        required: false
        type: string
      end:
        description: 'Exclusive UTC end (ISO 8601). Defaults to current time.'
        required: false
        type: string
      status:
        description: 'Audit skipped runs first; use all for broader incident coverage'
        type: choice
        options: [skipped, all]
        default: skipped
      max_requests:
        description: 'Read-only GitHub request budget, at most 500'
        required: false
        default: '500'
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/github-actions-history-audit.yml'
      - 'scripts/audits/github-actions-history-audit.mjs'
      - 'scripts/audits/github-actions-history-audit.test.mjs'
      - 'scripts/audits/ci-independent-steps.test.mjs'
      - 'scripts/audits/github-workflow-gates.mjs'
      - 'scripts/audits/github-workflow-gates.test.mjs'
  schedule:
    # New runs are checked daily; older history is segmented by explicit dates.
    - cron: '13 4 * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: historical-actions-audit-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate the historical scan and independent CI execution guards
        run: |
          node --test scripts/audits/github-actions-history-audit.test.mjs scripts/audits/ci-independent-steps.test.mjs
      - name: Audit historical GitHub Actions runs and skipped jobs without production writes
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_START: ${{ inputs.start }}
          AUDIT_END: ${{ inputs.end }}
          AUDIT_STATUS: ${{ inputs.status || 'skipped' }}
          AUDIT_MAX_REQUESTS: ${{ inputs.max_requests || '500' }}
          AUDIT_MAX_JOB_REQUESTS: '75'
        run: |
          set -euo pipefail
          if ! [[ "$AUDIT_MAX_REQUESTS" =~ ^[0-9]+$ ]] || (( AUDIT_MAX_REQUESTS < 1 || AUDIT_MAX_REQUESTS > 500 )); then
            echo '::error::Invalid GitHub request limit'; exit 1
          fi
          if [ -z "$AUDIT_START" ] && [ "$GITHUB_EVENT_NAME" != 'schedule' ]; then
            AUDIT_START='2025-11-14T11:36:18Z'
            export AUDIT_START
          fi
          node scripts/audits/github-actions-history-audit.mjs
      - name: Inventory every checked-in workflow and its skip/routing conditions
        if: always()
        run: |
          node --test scripts/audits/github-workflow-gates.test.mjs
          node scripts/audits/github-workflow-gates.mjs
      - name: Preserve historical evidence regardless of incomplete scan or failing checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-actions-skip-evidence-${{ github.run_id }}
          path: |
            audit-output/actions-history.json
            audit-output/actions-history.md
            audit-output/workflow-source-gates.json
            audit-output/workflow-source-gates.md
          if-no-files-found: warn
          retention-days: 30
      - name: Record exact audit coverage and missing pages
        if: always()
        shell: bash
        run: |
          if [ -f audit-output/actions-history.md ]; then
            cat audit-output/actions-history.md >> "$GITHUB_STEP_SUMMARY"
            if [ -f audit-output/workflow-source-gates.md ]; then cat audit-output/workflow-source-gates.md >> "$GITHUB_STEP_SUMMARY"; fi
          else
            echo 'Audit artifact missing; no historical coverage verified.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
