name: Regenerate Barber and Cosmetology Courses

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/regenerate-barber-cosmetology.yml'
      - 'scripts/course-factory/regenerate-barber-cosmetology.ts'
  issues:
    types: [reopened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  CI: true
  NODE_ENV: production
  AI_CIRCUIT_RECOVERY_WAIT: '1'
  SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  NODE_OPTIONS: --conditions=react-server

jobs:
  regenerate:
    if: >-
      github.event_name != 'issues' ||
      (github.event.issue.number == 928 &&
       github.event.issue.title == 'RUN BARBER COSMETOLOGY COURSE REGENERATION')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: barber-cosmetology-course-regeneration
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          clean: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile --strict-peer-dependencies=false

      - name: Require production database credentials
        id: credentials
        shell: bash
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"

      - name: Regenerate both courses through canonical Course Factory
        id: regenerate
        shell: bash
        run: |
          set +e
          set -o pipefail
          pnpm tsx scripts/course-factory/regenerate-barber-cosmetology.ts 2>&1 | tee /tmp/course-regeneration.log
          code=${PIPESTATUS[0]}
          stage="$(grep 'COURSE_REGENERATION_FAILURE_STAGE' /tmp/course-regeneration.log | tail -n 1 | awk '{print $2}')"
          echo "failure_stage=${stage:-none}" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Verify apprenticeship architecture
        id: audit
        run: pnpm tsx scripts/audit-apprenticeship-architecture.ts

      - name: Report sanitized stage outcomes
        if: always() && github.event_name == 'issues'
        uses: actions/github-script@v7
        env:
          CREDENTIALS_OUTCOME: ${{ steps.credentials.outcome }}
          REGENERATION_OUTCOME: ${{ steps.regenerate.outcome }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          FAILURE_STAGE: ${{ steps.regenerate.outputs.failure_stage }}
        with:
          script: |
            const ok = process.env.REGENERATION_OUTCOME === 'success' && process.env.AUDIT_OUTCOME === 'success';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                `BARBER + COSMETOLOGY REGENERATION ${ok ? 'PASS' : 'FAIL'}`,
                '',
                `Credentials gate: ${process.env.CREDENTIALS_OUTCOME || 'not-run'}`,
                `Course Factory: ${process.env.REGENERATION_OUTCOME || 'not-run'}`,
                `Architecture audit: ${process.env.AUDIT_OUTCOME || 'not-run'}`,
                `Failure stage: ${process.env.FAILURE_STAGE || 'none'}`,
              ].join('\n'),
            });
