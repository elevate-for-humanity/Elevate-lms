name: Verify live public CTA destinations
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/gcp/verify-public-cta-endpoints.mjs'
      - '.github/workflows/verify-public-cta-endpoints.yml'
permissions:
  contents: read
jobs:
  public-cta-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate endpoint smoke script
        run: node --check scripts/gcp/verify-public-cta-endpoints.mjs
      - name: Verify public CTA endpoints with real HTTPS responses
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/gcp/verify-public-cta-endpoints.mjs
