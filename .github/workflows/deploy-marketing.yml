name: Deploy Marketing (www)

on:
  push:
    branches:
      - main
    paths:
      - 'apps/marketing/**'
      - 'components/marketing/**'
      - 'components/site/**'
      - 'lib/navigation/**'
      - 'lib/secrets.ts'
      - 'lib/supabase/**'
      - 'public/sw.js'
      - 'public/manifest.webmanifest'
      - 'middleware.ts'
      - 'next.config.mjs'
      - 'tailwind.config.js'
      - 'tsconfig.json'
      - 'Dockerfile.marketing'
      - 'scripts/northflank/configure-services.ts'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy-marketing.yml'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy (defaults to main)'
        required: false
        default: ''
      apply_config:
        description: 'Apply canonical Northflank Marketing service configuration'
        required: false
        default: false
        type: boolean
      sync_secrets:
        description: 'Synchronize shared production secret group to all three services'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: northflank-marketing-deploy
  cancel-in-progress: true

env:
  EXPECTED_SHA: ${{ github.sha }}

jobs:
  deploy-marketing:
    name: Build and deploy Marketing (www) on Northflank
    runs-on: ubuntu-latest
    env:
      NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
      NORTHFLANK_TEAM_ID: ${{ secrets.NORTHFLANK_TEAM_ID || 'elevates-team' }}
      NORTHFLANK_PROJECT_ID: ${{ secrets.NORTHFLANK_PROJECT_ID || 'elevate-platform' }}
      NORTHFLANK_MARKETING_SERVICE_ID: ${{ secrets.NORTHFLANK_MARKETING_SERVICE_ID || 'elevate-marketing' }}
      NORTHFLANK_LMS_SERVICE_ID: ${{ secrets.NORTHFLANK_LMS_SERVICE_ID || 'elevate-lms' }}
      NORTHFLANK_ADMIN_SERVICE_ID: ${{ secrets.NORTHFLANK_ADMIN_SERVICE_ID || 'elevate-admin' }}
      NORTHFLANK_SECRET_GROUP_ID: ${{ secrets.NORTHFLANK_SECRET_GROUP_ID || 'elevate-production-env' }}
      FORCE_FRESH_BUILD: 'true'
      DEPLOY_BRANCH: main

      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}

      NEXT_PUBLIC_SITE_URL: https://www.elevateforhumanity.org
      NEXT_PUBLIC_PUBLIC_SITE_URL: https://www.elevateforhumanity.org
      NEXT_PUBLIC_WWW_URL: https://www.elevateforhumanity.org
      NEXT_PUBLIC_APP_URL: https://app.elevateforhumanity.org
      NEXT_PUBLIC_LMS_URL: https://app.elevateforhumanity.org
      NEXT_PUBLIC_ADMIN_URL: https://admin.elevateforhumanity.org
      NEXT_PUBLIC_FACEBOOK_PIXEL_ID: ${{ secrets.NEXT_PUBLIC_FACEBOOK_PIXEL_ID }}

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          clean: true

      - name: Set build environment variables
        run: |
          echo "GITHUB_SHA=${{ github.sha }}" >> "$GITHUB_ENV"
          echo "GIT_SHA=${{ github.sha }}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_GIT_SHA=${{ github.sha }}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_BUILD_ID=marketing-${{ github.sha }}" >> "$GITHUB_ENV"
          echo "BUILD_SHA=${{ github.sha }}" >> "$GITHUB_ENV"
          echo "BUILD_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Verify source commit SHA
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          EXPECTED_SHA="${{ github.sha }}"
          echo "Expected SHA: $EXPECTED_SHA"
          echo "Actual SHA:   $ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          test "$(git status --porcelain)" = ""
          echo "SHA verification passed"

      - name: Generate version file
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const payload = {
            service: 'marketing',
            commit: process.env.GITHUB_SHA,
            builtAt: process.env.BUILD_TIMESTAMP,
          };
          fs.writeFileSync('public/version.json', JSON.stringify(payload, null, 2) + '\n');
          NODE
          cat public/version.json

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Verify production deployment credentials
        run: |
          set -euo pipefail
          required=(
            NORTHFLANK_API_TOKEN
            NEXT_PUBLIC_SUPABASE_URL
            NEXT_PUBLIC_SUPABASE_ANON_KEY
          )
          for name in "${required[@]}"; do
            test -n "${!name:-}" || { echo "$name GitHub secret is missing"; exit 1; }
          done
          echo "Marketing deployment credentials are configured"

      # Secret synchronization is intentionally independent from service
      # configuration. A secret-group update can recycle every attached runtime,
      # so normal deploys and rollout-strategy changes must not rewrite it.
      - name: Verify shared production secrets for explicit secret sync
        if: (github.event_name == 'workflow_dispatch' && inputs.sync_secrets == true) || contains(github.event.head_commit.message, '[sync-production-env]')
        run: |
          set -euo pipefail
          required=(
            SUPABASE_SERVICE_ROLE_KEY
            NEXTAUTH_SECRET
            STRIPE_SECRET_KEY
            SENDGRID_API_KEY
          )
          for name in "${required[@]}"; do
            test -n "${!name:-}" || { echo "$name GitHub secret is missing"; exit 1; }
          done
          echo "Shared production secrets are configured"

      - name: Sync production env to Marketing + LMS + Admin
        if: (github.event_name == 'workflow_dispatch' && inputs.sync_secrets == true) || contains(github.event.head_commit.message, '[sync-production-env]')
        run: pnpm tsx scripts/northflank/sync-env.ts --execute

      # Canonical config sets disabledCI=true, port 3000, healthy probes, and a
      # zero-unavailable rollout. It does NOT modify the shared secret group.
      - name: Configure Northflank Marketing service
        if: (github.event_name == 'workflow_dispatch' && inputs.apply_config == true) || contains(github.event.head_commit.message, '[apply-northflank-config]')
        run: pnpm tsx scripts/northflank/configure-services.ts "$NORTHFLANK_MARKETING_SERVICE_ID" --execute

      - name: Require healthy upstream before starting a rollout
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            status=$(curl -sk --max-time 10 -o /tmp/predeploy-health.json -w "%{http_code}" https://www.elevateforhumanity.org/api/health || true)
            if [ "$status" = "200" ]; then
              echo "Existing Marketing upstream is healthy before rollout."
              exit 0
            fi
            echo "Existing Marketing upstream is not healthy: HTTP $status ($i/12)"
            sleep 5
          done
          echo "Refusing to deploy while Marketing has no healthy upstream."
          cat /tmp/predeploy-health.json 2>/dev/null || true
          exit 1

      # A burst of commits can leave an older workflow alive long enough to
      # trigger a Northflank build. Refuse to start a build unless this workflow
      # still represents the current main SHA.
      - name: Confirm this is still the latest main commit
        id: latest_before_build
        run: |
          set -euo pipefail
          git fetch --no-tags origin main --depth=1
          LATEST_SHA="$(git rev-parse origin/main)"
          if [ "$LATEST_SHA" = "${{ github.sha }}" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
            echo "This workflow is still current: $LATEST_SHA"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale Marketing deployment. workflow=${{ github.sha }} latest=$LATEST_SHA"
          fi

      - name: Trigger Marketing build
        if: steps.latest_before_build.outputs.is_latest == 'true'
        id: trigger_build
        run: pnpm tsx scripts/northflank/trigger-build.ts "$NORTHFLANK_MARKETING_SERVICE_ID"

      - name: Require a concrete Northflank build id
        if: steps.latest_before_build.outputs.is_latest == 'true'
        run: |
          set -euo pipefail
          BUILD_ID="${{ steps.trigger_build.outputs.build_id }}"
          test -n "$BUILD_ID" || { echo "Northflank trigger returned no build_id"; exit 1; }
          echo "Northflank build id: $BUILD_ID"

      - name: Wait for Marketing build to complete
        if: steps.latest_before_build.outputs.is_latest == 'true'
        run: pnpm tsx scripts/northflank/wait-service.ts "$NORTHFLANK_MARKETING_SERVICE_ID" --build-id "${{ steps.trigger_build.outputs.build_id }}" --timeout-ms 3600000

      - name: Verify exact Marketing build succeeded
        if: steps.latest_before_build.outputs.is_latest == 'true'
        run: |
          pnpm tsx scripts/northflank/verify-build.ts \
            "$NORTHFLANK_MARKETING_SERVICE_ID" \
            --build-id "${{ steps.trigger_build.outputs.build_id }}" \
            --sha "${{ github.sha }}"

      # Re-check main after the potentially long build. An old build may finish,
      # but it must never replace a newer live deployment.
      - name: Confirm build is still the latest main commit
        if: steps.latest_before_build.outputs.is_latest == 'true'
        id: latest_before_deploy
        run: |
          set -euo pipefail
          git fetch --no-tags origin main --depth=1
          LATEST_SHA="$(git rev-parse origin/main)"
          if [ "$LATEST_SHA" = "${{ github.sha }}" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
            echo "Build remains current: $LATEST_SHA"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
            echo "Build completed but will not deploy because main advanced. build=${{ github.sha }} latest=$LATEST_SHA"
          fi

      # Keep probing the public upstream throughout the actual replacement. A
      # zero-downtime rollout must never expose a 503/no-healthy-upstream window.
      - name: Deploy exact Marketing build with availability guard
        if: steps.latest_before_build.outputs.is_latest == 'true' && steps.latest_before_deploy.outputs.is_latest == 'true'
        run: |
          set -euo pipefail
          rm -f /tmp/marketing-downtime.log

          (
            while true; do
              code=$(curl -sk --max-time 5 -o /tmp/rollout-health.json -w "%{http_code}" https://www.elevateforhumanity.org/api/health || true)
              if [ "$code" != "200" ]; then
                printf '%s HTTP %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$code" >> /tmp/marketing-downtime.log
              fi
              sleep 2
            done
          ) &
          WATCH_PID=$!
          trap 'kill "$WATCH_PID" 2>/dev/null || true' EXIT

          pnpm tsx scripts/northflank/trigger-deployment.ts \
            "$NORTHFLANK_MARKETING_SERVICE_ID" \
            --build-id "${{ steps.trigger_build.outputs.build_id }}" \
            --sha "${{ github.sha }}"

          pnpm tsx scripts/northflank/wait-service.ts "$NORTHFLANK_MARKETING_SERVICE_ID" --timeout-ms 3600000

          kill "$WATCH_PID" 2>/dev/null || true
          wait "$WATCH_PID" 2>/dev/null || true
          trap - EXIT

          if [ -s /tmp/marketing-downtime.log ]; then
            echo "ZERO-DOWNTIME VIOLATION: Marketing returned non-200 health responses during rollout:"
            cat /tmp/marketing-downtime.log
            exit 1
          fi

          echo "Zero-downtime guard passed: no unhealthy-upstream window observed."

      - name: Verify Northflank deployment SHA
        if: steps.latest_before_build.outputs.is_latest == 'true' && steps.latest_before_deploy.outputs.is_latest == 'true'
        run: |
          set -euo pipefail
          pnpm tsx scripts/northflank/verify-sha.ts "$NORTHFLANK_MARKETING_SERVICE_ID" --sha "${{ github.sha }}"

      - name: Smoke Marketing and require exact live SHA
        if: steps.latest_before_build.outputs.is_latest == 'true' && steps.latest_before_deploy.outputs.is_latest == 'true'
        run: |
          set -euo pipefail
          EXPECTED_SHA="${{ github.sha }}"
          MAX_RETRIES=30
          RETRY_INTERVAL=20

          echo "Expected live SHA: $EXPECTED_SHA"

          for i in $(seq 1 $MAX_RETRIES); do
            health_status=$(curl -sk --max-time 10 -o /tmp/www-health.json -w "%{http_code}" "https://www.elevateforhumanity.org/api/health?deploy=${EXPECTED_SHA}" || true)
            version_status=$(curl -sk --max-time 10 -o /tmp/www-version.json -w "%{http_code}" "https://www.elevateforhumanity.org/api/version?deploy=${EXPECTED_SHA}" || true)
            page_status=$(curl -sk --max-time 10 -o /tmp/www-page.html -w "%{http_code}" "https://www.elevateforhumanity.org/?deploy=${EXPECTED_SHA}" || true)

            LIVE_SHA="$(node -e "try{const d=require('/tmp/www-version.json');process.stdout.write(d.commitSha||d.commit||'')}catch(e){}")"

            echo "Attempt $i/$MAX_RETRIES: health=$health_status version=$version_status page=$page_status live_sha=${LIVE_SHA:-missing}"

            if [ "$health_status" = "200" ] \
              && [ "$version_status" = "200" ] \
              && [ "$page_status" = "200" ] \
              && [ "$LIVE_SHA" = "$EXPECTED_SHA" ] \
              && grep -q "Elevate" /tmp/www-page.html; then
              echo "MARKETING DEPLOYMENT VERIFIED: live SHA matches $EXPECTED_SHA"
              exit 0
            fi

            sleep "$RETRY_INTERVAL"
          done

          echo "DEPLOYMENT FAILED: live site did not converge to expected SHA $EXPECTED_SHA"
          echo "Last health response:"
          cat /tmp/www-health.json 2>/dev/null || true
          echo "Last version response:"
          cat /tmp/www-version.json 2>/dev/null || true
          exit 1

      - name: Verify trial API is no longer infrastructure-unavailable
        if: steps.latest_before_build.outputs.is_latest == 'true' && steps.latest_before_deploy.outputs.is_latest == 'true'
        run: |
          set -euo pipefail
          status=$(curl -sk --max-time 15 \
            -o /tmp/trial-check.json \
            -w "%{http_code}" \
            -X POST \
            -H 'content-type: application/json' \
            --data '{"orgName":"x","adminName":"x","adminEmail":"invalid"}' \
            https://www.elevateforhumanity.org/api/trial/start-managed || true)
          echo "Trial API validation probe HTTP $status"
          cat /tmp/trial-check.json || true
          test "$status" = "400"
