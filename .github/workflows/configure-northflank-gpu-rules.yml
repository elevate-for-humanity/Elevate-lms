name: Configure Northflank GPU Rules

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/configure-northflank-gpu-rules.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: configure-northflank-gpu-rules
  cancel-in-progress: false

jobs:
  configure:
    name: Enforce GPU CI rules and instance
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
      NORTHFLANK_TEAM_ID: ${{ secrets.NORTHFLANK_TEAM_ID || 'elevates-team' }}
      NORTHFLANK_GPU_PROJECT_ID: elevate-media-gpu
      NORTHFLANK_GPU_SERVICE_ID: elevate-gpu-worker
    steps:
      - name: Verify required secret
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$NORTHFLANK_API_TOKEN"

      - name: Configure build rules and one deployment instance
        shell: bash
        run: |
          set -Eeuo pipefail
          base="https://api.northflank.com/v1/teams/${NORTHFLANK_TEAM_ID}/projects/${NORTHFLANK_GPU_PROJECT_ID}"
          auth=(-H "Authorization: Bearer ${NORTHFLANK_API_TOKEN}" -H 'Content-Type: application/json')

          code=$(curl -sS -o /tmp/gpu-before.json -w '%{http_code}' "${auth[@]}" "$base/services/${NORTHFLANK_GPU_SERVICE_ID}" || true)
          if [ "$code" != "200" ]; then
            echo "GPU service ${NORTHFLANK_GPU_SERVICE_ID} does not exist (HTTP $code)."
            cat /tmp/gpu-before.json || true
            exit 1
          fi

          cat >/tmp/gpu-rules.json <<'JSON'
          {
            "disabledCI": false,
            "vcsData": {
              "projectUrl": "https://github.com/elevate-for-humanity/Elevate-lms",
              "projectType": "github",
              "projectBranch": "main"
            },
            "buildConfiguration": {
              "pathIgnoreRules": [
                "services/media-gpu-worker/**",
                "scripts/northflank/provision-gpu-worker.ts"
              ],
              "isAllowList": true,
              "ciIgnoreFlagsEnabled": true,
              "ciIgnoreFlags": [
                "[skip ci]",
                "[ci skip]",
                "[no ci]",
                "[skip nf]",
                "[nf skip]",
                "[northflank skip]",
                "[skip northflank]"
              ]
            },
            "deployment": {
              "type": "deployment",
              "instances": 1,
              "strategy": { "type": "recreate" },
              "gracePeriodSeconds": 180
            }
          }
          JSON

          curl -fsS -X PATCH "${auth[@]}" \
            --data-binary @/tmp/gpu-rules.json \
            "$base/services/combined/${NORTHFLANK_GPU_SERVICE_ID}" > /tmp/gpu-patch.json

      - name: Verify rules and instance persisted
        shell: bash
        run: |
          set -Eeuo pipefail
          base="https://api.northflank.com/v1/teams/${NORTHFLANK_TEAM_ID}/projects/${NORTHFLANK_GPU_PROJECT_ID}"
          auth=(-H "Authorization: Bearer ${NORTHFLANK_API_TOKEN}" -H 'Content-Type: application/json')
          curl -fsS "${auth[@]}" "$base/services/${NORTHFLANK_GPU_SERVICE_ID}" > /tmp/gpu-after.json

          node <<'NODE'
          const fs = require('fs');
          const raw = JSON.parse(fs.readFileSync('/tmp/gpu-after.json', 'utf8'));
          const s = raw.data || raw;
          const rules = s.buildConfiguration?.pathIgnoreRules || [];
          const expected = ['services/media-gpu-worker/**', 'scripts/northflank/provision-gpu-worker.ts'];
          const instances = Number(s.deployment?.instances ?? s.deployment?.spec?.instances ?? 0);
          const ciEnabled = s.disabledCI === false;
          const allowList = s.buildConfiguration?.isAllowList === true;
          const rulesOk = expected.every((r) => rules.includes(r));
          console.log(JSON.stringify({
            service: s.id || s.name,
            disabledCI: s.disabledCI,
            instances,
            isAllowList: s.buildConfiguration?.isAllowList,
            pathIgnoreRules: rules,
            buildStatus: s.status?.build?.status || null,
            deploymentStatus: s.status?.deployment?.status || null
          }, null, 2));
          if (!ciEnabled) throw new Error('Northflank CI is still disabled');
          if (!allowList) throw new Error('GPU build rules are not configured as an allow-list');
          if (!rulesOk) throw new Error('GPU path build rules did not persist');
          if (instances !== 1) throw new Error(`Expected exactly 1 GPU deployment instance; got ${instances}`);
          NODE
