name: Configure Canonical GPU Worker

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

concurrency:
  group: northflank-canonical-gpu-config
  cancel-in-progress: false

jobs:
  configure:
    if: startsWith(github.event.issue.title, '[GPU CONFIGURE]')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 180
    env:
      NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
      NORTHFLANK_TEAM_ID: ${{ secrets.NORTHFLANK_TEAM_ID || 'elevates-team' }}
      NORTHFLANK_PROJECT_ID: ${{ secrets.NORTHFLANK_PROJECT_ID || 'elevate-platform' }}
      NORTHFLANK_ADMIN_SERVICE_ID: ${{ secrets.NORTHFLANK_ADMIN_SERVICE_ID || 'elevate-admin' }}
      NORTHFLANK_GPU_PROJECT_ID: elevate-media-gpu
      NORTHFLANK_GPU_REGION: us-central
      NORTHFLANK_GPU_SERVICE_ID: elevate-gpu-worker
      NORTHFLANK_GPU_TYPE: l4-24
      NORTHFLANK_GPU_COUNT: '1'
      NORTHFLANK_GPU_DEPLOYMENT_PLAN: nf-gpu-l4-24-1g
      NORTHFLANK_GPU_BUILD_PLAN: nf-compute-800-16
      NORTHFLANK_GPU_MODEL_VOLUME_ID: elevate-gpu-models
      NORTHFLANK_GPU_MODEL_VOLUME_MB: '153600'
      NORTHFLANK_GPU_EPHEMERAL_MB: '256000'
      NORTHFLANK_GPU_BUILD_EPHEMERAL_MB: '32768'
      GPU_VIDEO_PROVIDER: wan
      GPU_MAX_CONCURRENCY: '1'
      WAN_MIN_VRAM_GB: '22'
      GITHUB_SHA: ${{ github.sha }}
      BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies=false
      - name: Validate worker source
        run: |
          set -Eeuo pipefail
          test -n "$NORTHFLANK_API_TOKEN"
          python -m py_compile services/media-gpu-worker/worker.py
          python -m py_compile services/media-gpu-worker/bootstrap_models.py
          pnpm tsx scripts/northflank/provision-gpu-worker.ts
      - name: Configure and deploy canonical GPU worker
        id: configure
        run: |
          set -Eeuo pipefail
          pnpm tsx scripts/northflank/provision-gpu-worker.ts --execute 2>&1 | tee /tmp/gpu-config.log
      - name: Capture final inventory
        if: always()
        run: |
          set +e
          base="https://api.northflank.com/v1/teams/${NORTHFLANK_TEAM_ID}/projects/${NORTHFLANK_GPU_PROJECT_ID}"
          curl -sS -H "Authorization: Bearer ${NORTHFLANK_API_TOKEN}" "$base/services" > /tmp/services.json
          curl -sS -H "Authorization: Bearer ${NORTHFLANK_API_TOKEN}" "$base/volumes" > /tmp/volumes.json
          node <<'NODE' > /tmp/inventory.txt
          const fs=require('fs');
          const rows=(p,k)=>{try{const j=JSON.parse(fs.readFileSync(p,'utf8'));return Array.isArray(j.data)?j.data:(Array.isArray(j.data?.[k])?j.data[k]:[])}catch{return[]}};
          const services=rows('/tmp/services.json','services').filter(x=>String(x.id||'').includes('gpu'));
          const volumes=rows('/tmp/volumes.json','volumes').filter(x=>String(x.id||'').includes('gpu'));
          console.log('gpu_services='+JSON.stringify(services.map(x=>({id:x.id,name:x.name,status:x.status,plan:x.billing?.deploymentPlan}))));
          console.log('gpu_volumes='+JSON.stringify(volumes.map(x=>({id:x.id,name:x.name,storageMB:x.spec?.storageSize}))));
          NODE
          cat /tmp/inventory.txt
      - name: Post configuration result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            let log=''; let inv='';
            try { log=fs.readFileSync('/tmp/gpu-config.log','utf8').slice(-12000); } catch {}
            try { inv=fs.readFileSync('/tmp/inventory.txt','utf8'); } catch {}
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Canonical GPU configuration: **${{ job.status }}**\n\n\`\`\`text\n${inv}\n${log}\n\`\`\``
            });
