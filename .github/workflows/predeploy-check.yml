name: Pre-deploy Check

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: predeploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  platform-doctor:
    name: Platform Doctor
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies=false

      - name: Run full Platform Doctor report (PR advisory baseline)
        id: full-doctor-pr
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          pnpm platform:doctor
          status=$?
          if [ -f artifacts/platform-doctor-report.json ]; then
            cp artifacts/platform-doctor-report.json artifacts/platform-doctor-full-report.json
          fi
          exit "$status"
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder' }}
          SKIP_ENV_VALIDATION: 'true'

      - name: Enforce strict Platform Doctor on recovery PR
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/production-recovery-')
        run: node scripts/run-platform-doctor-strict.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder' }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || 'https://www.elevateforhumanity.org' }}
          SKIP_ENV_VALIDATION: 'true'

      - name: Scan PR static criticals
        if: github.event_name == 'pull_request'
        run: node scripts/platform-doctor-static.mjs --out artifacts/platform-doctor-pr-static-report.json

      - name: Scan base static criticals
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          rm -rf /tmp/platform-doctor-base
          git worktree add --detach /tmp/platform-doctor-base "$BASE_SHA"
          cp "$GITHUB_WORKSPACE/scripts/platform-doctor-static.mjs" /tmp/platform-doctor-base/scripts/platform-doctor-static.mjs
          cd /tmp/platform-doctor-base
          node scripts/platform-doctor-static.mjs --out "$GITHUB_WORKSPACE/artifacts/platform-doctor-base-static-report.json"
          cd "$GITHUB_WORKSPACE"
          git worktree remove --force /tmp/platform-doctor-base

      - name: Block newly introduced critical findings
        if: github.event_name == 'pull_request'
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const base = JSON.parse(fs.readFileSync('artifacts/platform-doctor-base-static-report.json', 'utf8'));
          const pr = JSON.parse(fs.readFileSync('artifacts/platform-doctor-pr-static-report.json', 'utf8'));
          const stableKey = (finding) => [finding.severity || 'CRITICAL', finding.code || '', finding.file || '.', finding.message || ''].join('|');
          const baseCritical = (base.findings || []).filter((f) => f.severity === 'CRITICAL');
          const prCritical = (pr.findings || []).filter((f) => f.severity === 'CRITICAL');
          const baseKeys = new Set(baseCritical.map(stableKey));
          const newCritical = prCritical.filter((finding) => !baseKeys.has(stableKey(finding)));
          const prKeys = new Set(prCritical.map(stableKey));
          const resolvedCritical = baseCritical.filter((finding) => !prKeys.has(stableKey(finding)));
          console.log(`Platform Doctor PR delta: base=${baseCritical.length} current=${prCritical.length} new=${newCritical.length} resolved=${resolvedCritical.length}`);
          if (newCritical.length) {
            for (const finding of newCritical.slice(0, 50)) {
              console.log(`::error file=${finding.file},line=${finding.line || 1}::${finding.code}: ${finding.message}`);
            }
            process.exit(1);
          }
          console.log('Platform Doctor delta gate passed: no new static CRITICAL findings.');
          NODE

      - name: Block Platform Doctor regressions on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/run-platform-doctor-strict.mjs
        env:
          PLATFORM_DOCTOR_BASE_SHA: ${{ github.event.before }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          SKIP_ENV_VALIDATION: 'true'

      - name: Summarize full Platform Doctor report
        if: always()
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const candidates = ['artifacts/platform-doctor-full-report.json', 'artifacts/platform-doctor-report.json'];
          const p = candidates.find((candidate) => fs.existsSync(candidate));
          if (!p) {
            console.log('Platform Doctor full report was not generated.');
            process.exit(0);
          }
          const report = JSON.parse(fs.readFileSync(p, 'utf8'));
          const counts = report.countsBySeverity || { CRITICAL: 0, STRICT: 0, REPORT: 0 };
          console.log(`Full repository report: CRITICAL=${counts.CRITICAL}, STRICT=${counts.STRICT}, REPORT=${counts.REPORT}`);
          NODE

      - name: Upload Platform Doctor artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-doctor-artifacts
          path: |
            artifacts/platform-doctor-report.json
            artifacts/platform-doctor-full-report.json
            artifacts/platform-doctor-pr-static-report.json
            artifacts/platform-doctor-base-static-report.json
            artifacts/design-enforcer-report.json
            artifacts/image-contract-report.json
            artifacts/program-template-audit-report.json
            reports/platform_polish_report.json
          retention-days: 14
