name: Platform Media Dedupe Audit (supervised)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-media-dedupe-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current supervised branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify duplicate media without mutating source
        run: node scripts/audit-platform-media-duplicates.mjs
        continue-on-error: true

      - name: Recovery policy
        run: |
          echo 'Automatic media replacement and competing-branch pushes are disabled during supervised production recovery.'
          echo 'Any verified media correction must be committed to release/production-recovery-20260813 after semantic review.'
