name: Deploy Admin

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build-memory-policy.*'
      - 'scripts/check-build-memory-policy.mjs'
      - 'scripts/run-bounded-build.*'
      - 'scripts/build-next-app.*'
      - 'scripts/container-build-policy.mjs'
      - 'components/**'
      - 'public/**'
      - 'content/**'
      - 'config/**'
      - 'next.config.mjs'
      - 'tsconfig.json'
      - 'tsconfig.*.json'
      - '.dockerignore'
      - 'workers/admin-speech-cache.mjs'
      - 'apps/admin/**'
      - 'lib/**'
      - 'remotion-src/**'
      - 'packages/**'
      - 'components/admin/**'
      - 'components/studio/**'
      - 'components/analytics/**'
      - 'instrumentation.ts'
      - 'Dockerfile.northflank-admin'
      - 'scripts/gcp/preflight-billing.mjs'
      - 'scripts/gcp/preflight-billing.test.mjs'
      - '.github/workflows/build-google-migration-images.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'scripts/gcp/activate-tested-public-revision.mjs'
      - 'scripts/gcp/cleanup-unused-candidate-tags.mjs'
      - 'scripts/test-public-revision-activation.mjs'
      - '.github/workflows/deploy-admin.yml'
  workflow_dispatch:
    inputs:
      requested_sha:
        description: Exact main commit requested by the trusted dispatch
        required: false
        type: string

permissions:
  contents: read
  actions: write
  id-token: write


jobs:
  dispatch:
    if: vars.GOOGLE_RELEASE_HOLD != 'true' && (github.event_name == 'push')
    concurrency:
      group: google-admin-dispatch-main
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch Google-trusted workflow event
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          # A delayed push still requires release of its changes. Dispatch the
          # current main containing them; the build retains exact-SHA checks.
          [[ "$latest" =~ ^[a-f0-9]{40}$ ]]
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-admin.yml/dispatches" -f ref=main -f "inputs[requested_sha]=$latest"
  deploy-admin:
    concurrency:
      group: google-runtime-us-central1
      cancel-in-progress: false
      queue: max
    name: Build and deploy Admin on Google
    if: vars.GOOGLE_RELEASE_HOLD != 'true' && (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 120
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Studio runtime cutover before building Admin
        run: |
          node --test lib/devstudio/main-release.test.mjs scripts/test-studio-browser-configuration.mjs scripts/test-phone-sending-number.mjs
          node --test scripts/test-public-revision-activation.mjs
          node scripts/audit-course-builder-procurement.mjs
      - name: Reject superseded deployment requests before building
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ inputs.requested_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if test -n "$REQUESTED_SHA" && ! [[ "$REQUESTED_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::Invalid requested_sha"
            exit 1
          fi
          latest="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if test "$latest" != "$GITHUB_SHA" || { test -n "$REQUESTED_SHA" && test "$REQUESTED_SHA" != "$GITHUB_SHA"; }; then
            echo "::error::Superseded release; do not deploy an older Admin revision."
            exit 1
          fi
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        with:
          skip_install: true
      - name: Verify Google SDK
        run: node scripts/gcp/verify-sdk.mjs
      - name: Verify automatic container memory policy
        run: node scripts/check-build-memory-policy.mjs --source-only
      - name: Build the Admin image
        shell: bash
        run: |
          set -euo pipefail
          test "$NEXT_PUBLIC_SUPABASE_URL" = 'https://cuxzzpsyufcewtmicszk.supabase.co'
          test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY"
          node --test workers/ultimate-source-teaching.test.mjs
          node --test scripts/test-independent-studio-diagnostics.mjs
          node scripts/verify-admin-instrumentation-boundary.mjs
          node scripts/verify-portal-production-contracts.mjs
          docker build -f Dockerfile.northflank-admin -t "elevate-admin:$GITHUB_SHA" \
            --build-arg "NF_GIT_SHA=$GITHUB_SHA" \
            --build-arg "BUILD_TIMESTAMP=$(date -u +%FT%TZ)" \
            --build-arg NEXT_PUBLIC_SUPABASE_URL \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY .
      - name: Upload and deploy the exact Admin image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE='us-central1-docker.pkg.dev/elegant-racer-299721/elevate/admin'
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
          docker tag "elevate-admin:$GITHUB_SHA" "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:$GITHUB_SHA"
          DIGEST="$(gcloud artifacts docker images describe "$IMAGE:$GITHUB_SHA" --project=elegant-racer-299721 --format='value(image_summary.digest)')"
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          CANDIDATE_SERVICE=elevate-admin-migration node scripts/gcp/cleanup-unused-candidate-tags.mjs
          # Image-only promotion preserves runtime capacity; an active course job
          # does not prohibit an Admin build. Cloud Run enforces actual quota
          # and revision readiness during update; failed promotion must fail here.
          # Keep the existing runtime identity, secrets, memory and scaling.
          # CPU must remain allocated while leased background renders execute.
          gcloud run services update elevate-admin-migration \
            --project=elegant-racer-299721 --region=us-central1 \
            --image="$IMAGE@$DIGEST" --no-cpu-boost --no-cpu-throttling --no-traffic \
            --update-env-vars=AI_NARRATION_PROVIDER=kokoro --quiet
      - name: Health-check and activate the exact Admin candidate
        shell: bash
        run: |
          set -euo pipefail
          export CANDIDATE_SERVICE=elevate-admin-migration
          export CANDIDATE_REVISION="$(gcloud run services describe "$CANDIDATE_SERVICE" --project=elegant-racer-299721 --region=us-central1 --format='value(status.latestCreatedRevisionName)')"
          node scripts/gcp/activate-tested-public-revision.mjs
      - name: Verify exact live Admin revision and Supabase health (read-only)
        shell: bash
        run: |
          set -euo pipefail
          export GOOGLE_ADMIN_URL="$(gcloud run services describe elevate-admin-migration --project=elegant-racer-299721 --region=us-central1 --format='value(status.url)')"
          node scripts/gcp/verify-admin-revision.mjs

