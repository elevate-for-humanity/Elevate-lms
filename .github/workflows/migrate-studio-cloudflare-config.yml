name: Migrate existing Studio provider configuration into Google
on:
  workflow_dispatch:
    inputs:
      apply:
        description: Copy only verified existing provider keys into Admin config (no deployment)
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
concurrency:
  group: google-runtime-us-central1
  queue: max
  cancel-in-progress: false
jobs:
  migrate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node --test scripts/gcp/migrate-studio-cloudflare-config.test.mjs
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        with: { skip_install: true }
      - name: Validate and migrate only the existing provider configuration
        env:
          STUDIO_CONFIG_APPLY: ${{ inputs.apply }}
        run: node scripts/gcp/migrate-studio-cloudflare-config.mjs
