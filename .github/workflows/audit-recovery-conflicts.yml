name: Audit Recovery Conflicts

on:
  push:
    branches:
      - fix/portal-contract-recovery

permissions:
  contents: read

jobs:
  conflicts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Identify exact conflicts with main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          rc=$?
          set -e
          echo "MERGE_RC=$rc"
          conflicts="$(git diff --name-only --diff-filter=U)"
          if [ -n "$conflicts" ]; then
            echo 'CONFLICT_FILES_BEGIN'
            printf '%s\n' "$conflicts"
            echo 'CONFLICT_FILES_END'
            exit 1
          fi
          echo 'NO_CONFLICTS'
          git merge --abort || true
