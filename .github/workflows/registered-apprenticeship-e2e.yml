name: Registered Apprenticeship E2E

on:
  pull_request:
    paths:
      - '.github/workflows/registered-apprenticeship-e2e.yml'
      - 'components/programs/HvacTrainingShowcase.tsx'
      - 'components/pwa/PwaInstallBanner.tsx'
      - 'public/videos/hvac-recruitment-20261029.mp4'
      - 'tests/e2e/hvac-hero-playback.spec.ts'
      - 'tests/e2e/hvac-live-lesson-playback.spec.ts'
      - 'tests/browser/lesson-player-pause-resume.mjs'
      - 'components/lms/LessonPlayer.tsx'
      - 'components/lms/InteractiveVideoPlayer.tsx'
      - 'tests/e2e/helpers/public-navigation-audit.ts'
  workflow_dispatch:
    inputs:
      employer_only:
        description: Run only the isolated employer workflow against an attested live release
        type: boolean
        default: false
      deployed_sha:
        description: Exact live commit from a completed deployment
        type: string
      deployment_run_id:
        description: Source deployment run to verify before accepting its commit
        type: string
      component:
        description: Deployed component whose public revision must match
        type: string
  push:
    branches:
      - main
    paths:
      - '.github/workflows/registered-apprenticeship-e2e.yml'
      - 'playwright.config.ts'
      - 'tests/e2e/registered-apprenticeship-authenticated.spec.ts'
      - 'tests/e2e/employer-onboarding.spec.ts'
      - 'tests/e2e/helpers/browser-runtime-errors.ts'
      - 'tests/e2e/portal-responsive-design.spec.ts'
      - 'tests/e2e/public-runtime-acceptance.spec.ts'
      - 'tests/e2e/hvac-hero-playback.spec.ts'
      - 'tests/e2e/hvac-live-lesson-playback.spec.ts'
      - 'tests/browser/lesson-player-pause-resume.mjs'
      - 'components/lms/LessonPlayer.tsx'
      - 'components/lms/InteractiveVideoPlayer.tsx'
      - 'scripts/gcp/production-acceptance.*'
      - 'scripts/qa/require-portal-e2e-identities.*'
      - 'scripts/qa/portal-acceptance-concurrency.test.mjs'
      - 'components/home/ScrollNarrator.tsx'
      - 'components/voice/useNaturalVoice.ts'
      - 'components/marketing/HeroVideo.tsx'
      - 'components/pwa/**'
      - 'scripts/check-registered-apprenticeship-architecture.mjs'
      - 'scripts/qa/provision-apprenticeship-e2e.mjs'
      - 'scripts/qa/provision-learner-program-holder-e2e.mjs'
      - 'scripts/qa/provision-remaining-portal-e2e.mjs'
  workflow_run:
    workflows:
      - Deploy repaired Google services
      - Deploy Admin
      - Repair Google Studio browser runtime
      - Deploy LMS automatically on Google
      - Deploy Google Marketing on trigger
    types:
      - completed

permissions:
  contents: read
  actions: read

jobs:
  # Employer regression is dispatched once by deploy-admin.yml acceptance,
  # after a successful attested Admin deployment. Do not duplicate the
  # workflow on main pushes or the completed-deployment notification.

  hvac-public-playback:
    if: (inputs.employer_only != true) && (github.event_name == 'pull_request' || (github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Deploy Google Marketing on trigger' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.head_branch == 'main') || (github.event_name == 'workflow_dispatch' && inputs.component == 'marketing'))))
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: desktop-chrome
            os: ubuntu-24.04
          - device: laptop-chrome
            os: ubuntu-24.04
          - device: tablet-chrome
            os: ubuntu-24.04
          - device: iphone-webkit
            os: macos-15
          - device: android-chrome
            os: ubuntu-24.04
    # Safari media uses Apple's decoder; Linux WebKit uses GStreamer instead.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      PLAYWRIGHT_BASE_URL: https://www.elevateforhumanity.org
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.2 }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: pnpm }
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies=false --ignore-scripts
      - if: matrix.device == 'iphone-webkit'
        run: pnpm exec playwright install webkit
      - if: matrix.device != 'iphone-webkit'
        run: pnpm exec playwright install chromium --with-deps
      - name: Verify shared lesson-player pause, resume and touch controls
        run: node tests/browser/lesson-player-pause-resume.mjs --project=${{ matrix.device }}
      - name: Capture the live Marketing release being tested
        env:
          EXPECTED_MARKETING_SHA: ${{ inputs.deployed_sha || (github.event_name == 'workflow_run' && github.event.workflow_run.head_sha) || '' }}
          HVAC_DEVICE: ${{ matrix.device }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { mkdirSync, writeFileSync } from 'node:fs';
          const response = await fetch('https://www.elevateforhumanity.org/api/version', {
            cache: 'no-store', signal: AbortSignal.timeout(20000),
          });
          assert.equal(response.status, 200);
          const version = await response.json();
          assert.match(version.commitSha, /^[a-f0-9]{40}$/);
          if (process.env.EXPECTED_MARKETING_SHA) assert.equal(version.commitSha, process.env.EXPECTED_MARKETING_SHA);
          mkdirSync('test-results', { recursive: true });
          writeFileSync('test-results/hvac-release-' + process.env.HVAC_DEVICE + '.json', JSON.stringify({
            checkedAt: new Date().toISOString(), device: process.env.HVAC_DEVICE,
            runnerOS: process.env.RUNNER_OS, website: 'https://www.elevateforhumanity.org/programs/hvac-technician', version,
          }, null, 2));
          NODE
      - name: Verify public HVAC film on desktop, tablet, iPhone and Android
        run: pnpm exec playwright test tests/e2e/hvac-hero-playback.spec.ts --config playwright.config.ts --reporter=line,html --output=test-results/hvac-hero --project=${{ matrix.device }}
      - name: Verify released homepage and canonical enrollment on every device
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/homepage-enrollment
        run: pnpm exec playwright test tests/e2e/home-config-leaks.spec.ts tests/e2e/canonical-application-flow.spec.ts --config playwright.config.ts --reporter=line,html --output=test-results/homepage-enrollment --project=${{ matrix.device }}
      - name: Verify Host Shop slideshow controls and images on every device
        if: github.event_name == 'pull_request'
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/host-shop-navigation
        run: pnpm exec playwright test tests/e2e/public-runtime-acceptance.spec.ts --grep 'navigation destination /partners/host-shops:' --config playwright.config.ts --reporter=line,html --output=test-results/host-shop-navigation --project=${{ matrix.device }}
      - name: Preserve playback samples, screenshots and browser report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hvac-hero-playback-${{ github.run_id }}-${{ matrix.device }}
          path: |
            artifacts/lesson-player-pause-resume/
            test-results/hvac-hero/
            test-results/homepage-enrollment/
            test-results/host-shop-navigation/
            test-results/hvac-release-*.json
            playwright-report/
          retention-days: 14
  production-authenticated-e2e:
    # Authenticated live checks require the explicit release receipt. The desktop
    # browser workflow exercises disposable identities against isolated QA.
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.deployment_run_id != '' && inputs.deployed_sha != '' && inputs.component != ''
    concurrency:
      group: registered-apprenticeship-e2e-deployment
      queue: max
    name: Full portal authenticated persistence and responsive design
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 70
    env:
      PLAYWRIGHT_BASE_URL: https://app.elevateforhumanity.org
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      E2E_APPRENTICE_EMAIL: ${{ secrets.PRODUCTION_E2E_APPRENTICE_EMAIL }}
      E2E_APPRENTICE_PASSWORD: ${{ secrets.PRODUCTION_E2E_APPRENTICE_PASSWORD }}
      E2E_HOST_SHOP_EMAIL: ${{ secrets.PRODUCTION_E2E_HOST_SHOP_EMAIL }}
      E2E_HOST_SHOP_PASSWORD: ${{ secrets.PRODUCTION_E2E_HOST_SHOP_PASSWORD }}
      E2E_LEARNER_EMAIL: ${{ secrets.PRODUCTION_E2E_LEARNER_EMAIL }}
      E2E_LEARNER_PASSWORD: ${{ secrets.PRODUCTION_E2E_LEARNER_PASSWORD }}
      E2E_PROGRAM_HOLDER_EMAIL: ${{ secrets.PRODUCTION_E2E_PROGRAM_HOLDER_EMAIL }}
      E2E_PROGRAM_HOLDER_PASSWORD: ${{ secrets.PRODUCTION_E2E_PROGRAM_HOLDER_PASSWORD }}
      E2E_EMPLOYER_EMAIL: ${{ secrets.PRODUCTION_E2E_EMPLOYER_EMAIL }}
      E2E_EMPLOYER_PASSWORD: ${{ secrets.PRODUCTION_E2E_EMPLOYER_PASSWORD }}
      E2E_INSTRUCTOR_EMAIL: ${{ secrets.PRODUCTION_E2E_INSTRUCTOR_EMAIL }}
      E2E_INSTRUCTOR_PASSWORD: ${{ secrets.PRODUCTION_E2E_INSTRUCTOR_PASSWORD }}
      E2E_STAFF_EMAIL: ${{ secrets.PRODUCTION_E2E_STAFF_EMAIL }}
      E2E_STAFF_PASSWORD: ${{ secrets.PRODUCTION_E2E_STAFF_PASSWORD }}
      E2E_CASE_MANAGER_EMAIL: ${{ secrets.PRODUCTION_E2E_CASE_MANAGER_EMAIL }}
      E2E_CASE_MANAGER_PASSWORD: ${{ secrets.PRODUCTION_E2E_CASE_MANAGER_PASSWORD }}
      E2E_ADMIN_EMAIL: ${{ secrets.PRODUCTION_E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.PRODUCTION_E2E_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify skipped notifications cannot cancel production acceptance
        run: node --test scripts/qa/portal-acceptance-concurrency.test.mjs
      - name: Verify explicit deployment handoff before checking out its tested commit
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPTANCE_COMPONENT: ${{ inputs.component }}
          ACCEPTANCE_SHA: ${{ inputs.deployed_sha }}
          ACCEPTANCE_RUN_ID: ${{ inputs.deployment_run_id }}
        run: |
          node --test scripts/gcp/production-acceptance.test.mjs
          node scripts/gcp/production-acceptance.mjs verify
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Focused black-box regressions use current trusted tests and attest
          # the deployed application separately. Full certification remains pinned.
          ref: ${{ (inputs.employer_only && github.sha) || inputs.deployed_sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Require dedicated live acceptance identities
        env:
          EMPLOYER_ONLY: ${{ inputs.employer_only }}
          PORTAL_E2E_SECRET_SCOPE: production
        run: |
          node --test scripts/qa/require-portal-e2e-identities.test.mjs
          node scripts/qa/require-portal-e2e-identities.mjs
      - name: Verify runtime Studio browser URL precedence
        run: node --test scripts/test-studio-browser-configuration.mjs
      - name: Verify production LMS is ready
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            ping_status=$(curl -sS --max-time 10 -o /tmp/lms-ping.json -w "%{http_code}" https://app.elevateforhumanity.org/api/ping || true)
            health_status=$(curl -sS --max-time 10 -o /tmp/lms-health.json -w "%{http_code}" https://app.elevateforhumanity.org/api/health || true)
            if [[ "$ping_status" == "200" && "$health_status" == "200" ]] && grep -q '"ok":true' /tmp/lms-ping.json && grep -q '"ready":true' /tmp/lms-health.json; then exit 0; fi
            echo "LMS not ready yet (ping=$ping_status health=$health_status), retry $i/20"
            sleep 15
          done
          echo "::error::Production LMS never reached ready state"
          exit 1
      - name: Install dependencies
        id: install-dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies=false
      - name: Install Chromium and WebKit
        run: pnpm exec playwright install chromium webkit --with-deps
      # LMS lesson media and public Marketing films are different acceptance
      # surfaces. The marketing-only hvac-public-playback matrix is deliberately
      # skipped on LMS releases; this independent test certifies REAL authenticated
      # playback of the published LMS video and learner full-screen layout.
      # Dedicated production test credentials are mandatory.
      # Never capture HTTP request-body traces while persistent production QA
      # identities are in scope; screenshots, assertions and HTML reports remain.
      - name: Verify authenticated HVAC course video playback and full-screen layout on devices
        if: ${{ success() && !inputs.employer_only && inputs.component == 'lms' }}
        env:
          PLAYWRIGHT_BASE_URL: https://lms.elevateforhumanity.org
          EXPECTED_LMS_SHA: ${{ inputs.deployed_sha }}
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/hvac-lms-playback
        run: pnpm exec playwright test tests/e2e/hvac-live-lesson-playback.spec.ts --reporter=line,html --config playwright.config.ts --output=test-results/hvac-lms-playback --project=desktop-chrome --project=laptop-chrome --project=tablet-chrome --project=iphone-webkit --project=android-chrome --trace off
      - name: Preserve authenticated LMS playback and full-screen acceptance evidence
        if: ${{ always() && !inputs.employer_only && inputs.component == 'lms' }}
        uses: actions/upload-artifact@v7
        with:
          name: hvac-authenticated-lms-playback-evidence
          path: |
            test-results/hvac-lms-playback/
            playwright-report/hvac-lms-playback/
          retention-days: 14
          if-no-files-found: ignore
      - name: Verify employer onboarding persistence and private documents after deployment
        env:
          PLAYWRIGHT_BASE_URL: https://lms.elevateforhumanity.org
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/employer-onboarding
        run: pnpm exec playwright test tests/e2e/employer-onboarding.spec.ts --reporter=html,github --config playwright.config.ts --output=test-results/employer-onboarding --project=desktop-chrome --project=iphone-webkit --trace off
      - name: Upload employer onboarding evidence immediately
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: employer-onboarding-e2e-results
          path: |
            test-results/employer-onboarding/
            playwright-report/employer-onboarding/
          retention-days: 14
          if-no-files-found: ignore
      - name: Run registered-apprenticeship architecture gate
        run: node scripts/check-registered-apprenticeship-architecture.mjs
      # The complete HVAC film runs in hvac-public-playback, where the iPhone
      # profile uses macOS media codecs. Keep portal and hydration checks here.
      - name: Verify public hydration, startup stability and audible-media exclusivity
        if: ${{ success() && !inputs.employer_only }}
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/public-runtime
        run: pnpm exec playwright test tests/e2e/public-runtime-acceptance.spec.ts --config playwright.config.ts --output=test-results/public-runtime --project=desktop-chrome --project=tablet-chrome --project=iphone-webkit --project=android-chrome --trace off
      - name: Certify Studio sign-in and fonts on all devices
        if: ${{ success() && !inputs.employer_only }}
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/studio
        run: pnpm exec playwright test tests/e2e/portal-responsive-design.spec.ts --grep "Admin session opens Studio and optional external browser tools remain usable on the active device" --config playwright.config.ts --output=test-results/studio --project=desktop-chrome --project=laptop-chrome --project=tablet-chrome --project=iphone-webkit --project=android-chrome --trace off
      - name: Run authenticated production functional E2E
        if: ${{ success() && !inputs.employer_only }}
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/functional
        run: pnpm exec playwright test tests/e2e/registered-apprenticeship-authenticated.spec.ts --config playwright.config.ts --output=test-results/functional --project=desktop-chrome --trace off
      - name: Run authenticated cross-device responsive design certification
        if: ${{ success() && !inputs.employer_only }}
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/responsive
        run: pnpm exec playwright test tests/e2e/portal-responsive-design.spec.ts --config playwright.config.ts --output=test-results/responsive --project=desktop-chrome --project=laptop-chrome --project=tablet-chrome --project=iphone-webkit --project=android-chrome --trace off
      - name: Require the attested release to remain live through acceptance
        if: ${{ !cancelled() && inputs.deployment_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPTANCE_COMPONENT: ${{ inputs.component }}
          ACCEPTANCE_SHA: ${{ inputs.deployed_sha }}
          ACCEPTANCE_RUN_ID: ${{ inputs.deployment_run_id }}
        run: node scripts/gcp/production-acceptance.mjs verify
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: full-portal-responsive-e2e-results
          path: |
            test-results/
            playwright-report/
          retention-days: 14
          if-no-files-found: ignore
      - name: Preserve production QA result in this run
        if: always()
        env:
          QA_STATUS: ${{ job.status }}
          QA_SHA: ${{ (inputs.employer_only && github.sha) || inputs.deployed_sha }}
          QA_DEPLOYED_SHA: ${{ inputs.deployed_sha }}
        run: |
          python3 - <<'PYTHON'
          import os
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as report:
              report.write('Production portal acceptance: ' + os.environ['QA_STATUS'] + '\n\n')
              report.write('Test source commit: `' + os.environ['QA_SHA'] + '`\n\n')
              if os.environ.get('QA_DEPLOYED_SHA'):
                  report.write('Attested deployed commit: `' + os.environ['QA_DEPLOYED_SHA'] + '`\n\n')
              report.write('Inspect the test steps and attached Playwright evidence for individual results. A queued run is not acceptance.\n')
          PYTHON
