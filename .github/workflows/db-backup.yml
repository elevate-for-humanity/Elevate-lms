name: Database Recovery Verification

on:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * *'

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Verify recovery metadata contract
        run: node --test scripts/gcp/check-database-recovery.test.mjs
      - name: Verify a recent provider recovery point
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: cuxzzpsyufcewtmicszk
        run: node scripts/gcp/check-database-recovery.mjs
