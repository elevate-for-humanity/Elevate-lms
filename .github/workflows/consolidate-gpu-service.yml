name: Consolidate GPU Service

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

concurrency:
  group: northflank-gpu-consolidation
  cancel-in-progress: false

jobs:
  consolidate:
    if: startsWith(github.event.issue.title, '[GPU CONSOLIDATE]')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
      NORTHFLANK_TEAM_ID: ${{ secrets.NORTHFLANK_TEAM_ID || 'elevates-team' }}
      NORTHFLANK_GPU_PROJECT_ID: elevate-media-gpu
      CANONICAL_GPU_SERVICE_ID: elevate-gpu-worker
      LEGACY_GPU_SERVICE_ID: elevate-media-gpu-worker
      MODEL_VOLUME_ID: elevate-gpu-models
    steps:
      - name: Consolidate to one canonical GPU service
        shell: bash
        run: |
          set -Eeuo pipefail
          : > /tmp/summary.txt
          echo "project=$NORTHFLANK_GPU_PROJECT_ID" >> /tmp/summary.txt
          echo "canonical=$CANONICAL_GPU_SERVICE_ID" >> /tmp/summary.txt
          echo "legacy=$LEGACY_GPU_SERVICE_ID" >> /tmp/summary.txt
          echo "team_id_present=$([ -n \"${NORTHFLANK_TEAM_ID:-}\" ] && echo true || echo false)" >> /tmp/summary.txt
          echo "api_token_present=$([ -n \"${NORTHFLANK_API_TOKEN:-}\" ] && echo true || echo false)" >> /tmp/summary.txt

          if [ -z "${NORTHFLANK_API_TOKEN:-}" ]; then
            echo "failure_reason=missing NORTHFLANK_API_TOKEN in production GitHub environment/repository secrets" >> /tmp/summary.txt
            cat /tmp/summary.txt
            exit 10
          fi
          if [ -z "${NORTHFLANK_TEAM_ID:-}" ]; then
            echo "failure_reason=missing NORTHFLANK_TEAM_ID" >> /tmp/summary.txt
            cat /tmp/summary.txt
            exit 11
          fi

          base="https://api.northflank.com/v1/teams/${NORTHFLANK_TEAM_ID}/projects/${NORTHFLANK_GPU_PROJECT_ID}"
          auth=(-H "Authorization: Bearer ${NORTHFLANK_API_TOKEN}" -H 'Content-Type: application/json')

          canonical_code=$(curl -sS -o /tmp/canonical.json -w '%{http_code}' "${auth[@]}" "$base/services/$CANONICAL_GPU_SERVICE_ID" || true)
          legacy_code=$(curl -sS -o /tmp/legacy.json -w '%{http_code}' "${auth[@]}" "$base/services/$LEGACY_GPU_SERVICE_ID" || true)
          echo "canonical_http_before=$canonical_code" >> /tmp/summary.txt
          echo "legacy_http_before=$legacy_code" >> /tmp/summary.txt

          if [ "$canonical_code" != "200" ]; then
            echo "failure_reason=canonical service lookup failed; refusing to delete legacy service" >> /tmp/summary.txt
            printf 'canonical_response=' >> /tmp/summary.txt
            cat /tmp/canonical.json >> /tmp/summary.txt 2>/dev/null || true
            printf '\n' >> /tmp/summary.txt
            cat /tmp/summary.txt
            exit 12
          fi

          if [ "$legacy_code" = "200" ]; then
            delete_code=$(curl -sS -o /tmp/delete.json -w '%{http_code}' -X DELETE "${auth[@]}" "$base/services/$LEGACY_GPU_SERVICE_ID?delete_child_objects=true" || true)
            echo "legacy_delete_http=$delete_code" >> /tmp/summary.txt
            if [ "$delete_code" != "200" ] && [ "$delete_code" != "202" ] && [ "$delete_code" != "204" ]; then
              echo "failure_reason=legacy deletion rejected by Northflank" >> /tmp/summary.txt
              printf 'delete_response=' >> /tmp/summary.txt
              cat /tmp/delete.json >> /tmp/summary.txt 2>/dev/null || true
              printf '\n' >> /tmp/summary.txt
              cat /tmp/summary.txt
              exit 13
            fi
            echo "legacy_deleted=true" >> /tmp/summary.txt
          elif [ "$legacy_code" = "404" ]; then
            echo "legacy_deleted=already_absent" >> /tmp/summary.txt
          else
            echo "failure_reason=legacy service lookup returned unexpected status" >> /tmp/summary.txt
            printf 'legacy_response=' >> /tmp/summary.txt
            cat /tmp/legacy.json >> /tmp/summary.txt 2>/dev/null || true
            printf '\n' >> /tmp/summary.txt
            cat /tmp/summary.txt
            exit 14
          fi

          sleep 8
          services_code=$(curl -sS -o /tmp/services-after.json -w '%{http_code}' "${auth[@]}" "$base/services" || true)
          echo "services_list_http=$services_code" >> /tmp/summary.txt
          if [ "$services_code" != "200" ]; then
            echo "failure_reason=final service inventory lookup failed" >> /tmp/summary.txt
            cat /tmp/summary.txt
            exit 15
          fi

          node <<'NODE' >> /tmp/summary.txt
          const fs = require('fs');
          const j = JSON.parse(fs.readFileSync('/tmp/services-after.json','utf8'));
          const rows = Array.isArray(j.data) ? j.data : (Array.isArray(j.data?.services) ? j.data.services : []);
          const gpu = rows.filter(s => ['elevate-gpu-worker','elevate-media-gpu-worker'].includes(String(s.id || '')));
          console.log(`gpu_services_after=${JSON.stringify(gpu.map(s => ({id:s.id,name:s.name,status:s.status,plan:s.billing?.deploymentPlan})))}`);
          if (gpu.length !== 1 || gpu[0].id !== 'elevate-gpu-worker') process.exit(2);
          NODE

          volume_code=$(curl -sS -o /tmp/volume.json -w '%{http_code}' "${auth[@]}" "$base/volumes/$MODEL_VOLUME_ID" || true)
          echo "model_volume_http=$volume_code" >> /tmp/summary.txt
          if [ "$volume_code" != "200" ]; then
            echo "failure_reason=model volume not confirmed" >> /tmp/summary.txt
            cat /tmp/summary.txt
            exit 16
          fi
          echo "consolidation_verified=true" >> /tmp/summary.txt
          cat /tmp/summary.txt

      - name: Post consolidation result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let summary = 'Consolidation step did not produce a summary.';
            try { summary = fs.readFileSync('/tmp/summary.txt','utf8'); } catch {}
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `GPU consolidation result: **${{ job.status }}**\n\n\`\`\`text\n${summary}\n\`\`\``
            });
