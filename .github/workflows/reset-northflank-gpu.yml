name: Reset Northflank GPU Resources

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  reset:
    if: startsWith(github.event.issue.title, '[GPU RESET]') && contains(github.event.issue.body, 'RESET_GPU')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
      NORTHFLANK_TEAM_ID: ${{ secrets.NORTHFLANK_TEAM_ID || 'elevates-team' }}
      NORTHFLANK_GPU_PROJECT_ID: elevate-media-gpu
      GPU_VOLUME_ID: elevate-gpu-models
    steps:
      - name: Delete stuck GPU volume only
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$NORTHFLANK_API_TOKEN"
          base="https://api.northflank.com/v1/teams/${NORTHFLANK_TEAM_ID}/projects/${NORTHFLANK_GPU_PROJECT_ID}"
          auth=(-H "Authorization: Bearer ${NORTHFLANK_API_TOKEN}" -H 'Content-Type: application/json')
          code=$(curl -sS -o /tmp/before.json -w '%{http_code}' "${auth[@]}" "$base/volumes/${GPU_VOLUME_ID}" || true)
          echo "before_http=$code" | tee /tmp/reset-summary.txt
          if [ "$code" = "200" ]; then
            dcode=$(curl -sS -o /tmp/delete.json -w '%{http_code}' -X DELETE "${auth[@]}" "$base/volumes/${GPU_VOLUME_ID}" || true)
            echo "delete_http=$dcode" | tee -a /tmp/reset-summary.txt
            if [ "$dcode" != "200" ] && [ "$dcode" != "202" ] && [ "$dcode" != "204" ]; then
              cat /tmp/delete.json || true
              exit 1
            fi
          elif [ "$code" = "404" ]; then
            echo "already_absent=true" | tee -a /tmp/reset-summary.txt
          else
            cat /tmp/before.json || true
            exit 1
          fi
          sleep 5
          fcode=$(curl -sS -o /tmp/after.json -w '%{http_code}' "${auth[@]}" "$base/volumes/${GPU_VOLUME_ID}" || true)
          echo "after_http=$fcode" | tee -a /tmp/reset-summary.txt
          if [ "$fcode" != "404" ]; then
            cat /tmp/after.json || true
            exit 1
          fi
          echo "deleted=true" | tee -a /tmp/reset-summary.txt
      - name: Post reset result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            let out='No reset summary.';
            try { out=fs.readFileSync('/tmp/reset-summary.txt','utf8'); } catch {}
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:`Northflank GPU reset: **${{ job.status }}**\n\n\`\`\`text\n${out}\n\`\`\``});
