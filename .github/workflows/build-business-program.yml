name: Build Business Program Acceptance

on:
  workflow_dispatch:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

env:
  CI: true
  NODE_ENV: production
  AI_CIRCUIT_RECOVERY_WAIT: '1'
  AI_PROVIDER: gemini
  SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GOOGLE_CLOUD_API_KEY: ${{ secrets.GOOGLE_CLOUD_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_AI_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_API_TOKEN }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}

jobs:
  build-audit-publish:
    if: github.event_name != 'issues' || github.event.issue.title == 'RUN BUSINESS COURSE BUILDER ACCEPTANCE'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: business-course-builder-production-acceptance
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          clean: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies deterministically
        id: install
        shell: bash
        run: |
          set +e
          pnpm install --frozen-lockfile --strict-peer-dependencies=false > /tmp/business-install.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          tail -n 120 /tmp/business-install.log > /tmp/business-install-tail.log || true
          exit 0

      - name: Require production Supabase credentials
        id: credentials
        shell: bash
        run: |
          set +e
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_SERVICE_ROLE_KEY"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build, audit, render, and publish business program
        id: acceptance
        shell: bash
        env:
          NODE_OPTIONS: --conditions=react-server
        run: |
          set +e
          if [ "${{ steps.install.outputs.exit_code }}" != "0" ] || [ "${{ steps.credentials.outputs.exit_code }}" != "0" ]; then
            echo "Preflight failed: install=${{ steps.install.outputs.exit_code }} credentials=${{ steps.credentials.outputs.exit_code }}" > /tmp/business-course-builder.log
            echo "exit_code=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pnpm tsx scripts/course-factory/build-business-program.ts > /tmp/business-course-builder.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          tail -n 320 /tmp/business-course-builder.log > /tmp/business-course-builder-tail.log || true
          exit 0

      - name: Post result to trigger issue
        if: always() && github.event_name == 'issues'
        uses: actions/github-script@v7
        env:
          INSTALL_EXIT_CODE: ${{ steps.install.outputs.exit_code }}
          CREDENTIAL_EXIT_CODE: ${{ steps.credentials.outputs.exit_code }}
          ACCEPTANCE_EXIT_CODE: ${{ steps.acceptance.outputs.exit_code }}
        with:
          script: |
            const fs = require('fs');
            const installCode = process.env.INSTALL_EXIT_CODE || '1';
            const credentialCode = process.env.CREDENTIAL_EXIT_CODE || '1';
            const acceptanceCode = process.env.ACCEPTANCE_EXIT_CODE || 'not-run';
            const ok = installCode === '0' && credentialCode === '0' && acceptanceCode === '0';
            const acceptanceTail = fs.existsSync('/tmp/business-course-builder-tail.log')
              ? fs.readFileSync('/tmp/business-course-builder-tail.log', 'utf8').slice(-30000)
              : fs.existsSync('/tmp/business-course-builder.log')
                ? fs.readFileSync('/tmp/business-course-builder.log', 'utf8').slice(-30000)
                : 'Course Builder did not produce a log.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `BUSINESS COURSE BUILDER ${ok ? 'PASS' : 'FAIL'}\n\nCommit: ${context.sha}\nInstall exit: ${installCode}\nCredential gate: ${credentialCode}\nAcceptance exit: ${acceptanceCode}\n\n\`\`\`text\n${acceptanceTail}\n\`\`\``
            });

      - name: Fail workflow when preflight or acceptance failed
        if: always()
        shell: bash
        run: |
          test "${{ steps.install.outputs.exit_code }}" = "0"
          test "${{ steps.credentials.outputs.exit_code }}" = "0"
          test "${{ steps.acceptance.outputs.exit_code }}" = "0"
