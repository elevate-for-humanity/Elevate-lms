name: Enable auto-merge for main
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, edited, converted_to_draft]

permissions: {}

concurrency:
  # Serialize all auto-merge mutations for each PR. The previous separate
  # arming/revocation groups permitted an in-flight arming request to execute
  # after a retarget run had found nothing to revoke. Never drop retarget or
  # draft transitions, and preserve ordinary staging-promotion edits.
  group: enable-main-auto-merge-${{ github.event.pull_request.number }}
  queue: max

jobs:
  enable:
    if: >-
      ${{ github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Use a repository-scoped App without branch-rule bypass. Its merges emit
      # the normal main push events that drive CI and the production workflows.
      # This job never checks out the pull request or evaluates its contents.
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.AUTO_MERGE_APP_ID }}
          private-key: ${{ secrets.AUTO_MERGE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: Disable only after transition out of automatic main eligibility
        # A generic edited event also includes title and description changes.
        # Keep manually armed staging promotion PRs intact on those edits.
        if: >-
          ${{ (github.event.action == 'edited' &&
                github.event.changes.base.ref.from == 'main' &&
                github.event.pull_request.base.ref != 'main' &&
                github.event.pull_request.head.ref != 'staging') ||
              (github.event.action == 'converted_to_draft' &&
                github.event.pull_request.base.ref == 'main' &&
                github.event.pull_request.head.ref != 'staging') }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TRANSITION_ACTION: ${{ github.event.action }}
        run: |
          # A newer webhook may have restored eligibility. Avoid cancelling its
          # newly armed auto-merge from stale event data.
          live=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json baseRefName,headRefName,isDraft,autoMergeRequest)
          base=$(jq -r '.baseRefName' <<<"$live")
          head=$(jq -r '.headRefName' <<<"$live")
          draft=$(jq -r '.isDraft' <<<"$live")
          [[ "$head" != staging ]] || exit 0
          if [[ "$TRANSITION_ACTION" == edited ]]; then
            [[ "$base" != main ]] || exit 0
          else
            [[ "$base" == main && "$draft" == true ]] || exit 0
          fi
          armed=$(jq -r '.autoMergeRequest != null' <<<"$live")
          # Retargeting away from main or drafting an eligible main PR must
          # revoke its stale auto-merge, regardless of who originally armed it.
          # Ordinary description edits and staging promotions never reach here.
          if [[ "$armed" == true ]]; then
            gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --disable-auto
          fi
      - name: Request squash auto-merge through the existing branch rules
        if: ${{ github.event.pull_request.base.ref == 'main' && !github.event.pull_request.draft && github.event.pull_request.head.ref != 'staging' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # Event contexts can be stale when a maintainer edits the PR base.
          # Recheck the live target and head before requesting auto-merge.
          live=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json baseRefName,headRefOid,isDraft)
          if [[ "$(jq -r '.baseRefName' <<<"$live")" != main ||
                "$(jq -r '.headRefOid' <<<"$live")" != "$PR_HEAD" ||
                "$(jq -r '.isDraft' <<<"$live")" != false ]]; then
            echo "PR target/head/draft changed; leave auto-merge disabled"
            exit 0
          fi
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash --match-head-commit "$PR_HEAD"
