name: Unified Course Builder Acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/course-factory/build-esb-acceptance.ts'
      - 'scripts/course-factory/build-business-program.ts'
      - 'scripts/check-course-factory-authority.mjs'
      - 'scripts/check-studio-architecture.mjs'
      - 'scripts/check-course-media-authority.mjs'
      - 'scripts/audit-course-builder-procurement.mjs'
      - 'tests/unit/course-factory/media-authority.test.ts'
      - 'tests/unit/course-builder-route-consolidation.test.ts'
      - '.github/workflows/build-esb-acceptance.yml'
      - 'lib/ai/ai-service.ts'
      - 'lib/ai/providers/**'
      - 'lib/curriculum/blueprints/**'
      - 'lib/curriculum/lesson-content-schema.ts'
      - 'lib/curriculum/normalize-lesson-content.ts'
      - 'lib/course-factory/**'
      - 'lib/course-builder/**'
      - 'lib/devstudio/course-builder-controller.ts'
      - 'lib/platform/launch-foundation.ts'
      - 'lib/video/**'
      - 'components/lms/**'
      - 'apps/lms/app/lms/courses/**'
      - 'apps/lms/app/api/learner/interactions/**'
      - 'apps/lms/app/api/onboarding/launch/route.ts'
      - 'apps/admin/app/api/admin/course-builder/**'
      - 'apps/admin/app/api/admin/lms/courses/generate/route.ts'
      - 'apps/admin/app/api/admin/courses/**'
      - 'apps/admin/app/api/admin/dev-studio/chat/route.ts'
      - 'apps/admin/app/api/internal/videos/process-queue/route.ts'
      - 'components/admin/course-builder/UnifiedCourseBuilder.tsx'
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

env:
  CI: true
  NODE_ENV: production
  AI_CIRCUIT_RECOVERY_WAIT: '1'
  AI_PROVIDER: cloudflare
  # This is a three-hour production batch, not a request-time route. Give safe
  # Supabase reads a bounded recovery budget while timed-fetch still refuses
  # to replay writes after an unknown network outcome.
  SUPABASE_FETCH_TIMEOUT_MS: '15000'
  SUPABASE_READ_MAX_ATTEMPTS: '3'
  SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GOOGLE_CLOUD_API_KEY: ${{ secrets.GOOGLE_CLOUD_API_KEY }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_AI_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_API_TOKEN }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
  ADMIN_URL: ${{ secrets.ADMIN_URL }}
  CRON_SECRET: ${{ secrets.CRON_SECRET }}
  COURSE_REVIEWER_ID: ${{ secrets.COURSE_REVIEWER_ID }}

jobs:
  build-audit-publish:
    if: "${{ github.event_name != 'issues' || github.event.issue.title == 'RUN ESB COURSE BUILDER ACCEPTANCE' || github.event.issue.title == 'RUN BUSINESS COURSE BUILDER ACCEPTANCE' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: unified-course-builder-production-acceptance
      # Only the newest exact-main acceptance may mutate production course state.
      # Cancel stale runs so an older renderer cannot keep processing after a fix.
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          clean: true
          fetch-depth: 0

      - name: Re-read latest main before any repair
        shell: bash
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Record exact tested commit
        id: tested
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Post acceptance start evidence
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        env:
          TESTED_SHA: ${{ steps.tested.outputs.sha }}
        with:
          script: |
            const label = context.payload.issue.title.includes('BUSINESS') ? 'BUSINESS COURSE BUILDER' : 'ESB ACCEPTANCE';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `${label} STARTED\n\nExact checked-out main SHA: ${process.env.TESTED_SHA}`,
            });

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enforce Studio, Course Builder, media, and procurement architecture
        id: architecture
        shell: bash
        run: |
          set +e
          node scripts/check-course-factory-authority.mjs > /tmp/course-architecture.log 2>&1
          code1=$?
          node scripts/check-studio-architecture.mjs >> /tmp/course-architecture.log 2>&1
          code2=$?
          node scripts/check-course-media-authority.mjs >> /tmp/course-architecture.log 2>&1
          code3=$?
          node scripts/audit-course-builder-procurement.mjs >> /tmp/course-architecture.log 2>&1
          code4=$?
          code=0
          if [ "$code1" != "0" ] || [ "$code2" != "0" ] || [ "$code3" != "0" ] || [ "$code4" != "0" ]; then code=1; fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          tail -n 360 /tmp/course-architecture.log
          exit 0

      - name: Install dependencies deterministically
        id: install
        shell: bash
        run: |
          set +e
          pnpm install --frozen-lockfile --strict-peer-dependencies=false --prod=false > /tmp/course-install.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          tail -n 120 /tmp/course-install.log > /tmp/course-install-tail.log || true
          exit 0

      - name: Require production Supabase; AI providers are optional enrichment
        id: credentials
        shell: bash
        run: |
          set +e
          code=0
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_SERVICE_ROLE_KEY" || code=1
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run targeted Course Builder validation before generation
        id: targeted
        shell: bash
        run: |
          set +e
          : > /tmp/course-targeted.log
          if [ "${{ steps.architecture.outputs.exit_code }}" != "0" ] || [ "${{ steps.install.outputs.exit_code }}" != "0" ] || [ "${{ steps.credentials.outputs.exit_code }}" != "0" ]; then
            echo "Pre-generation gate failed." >> /tmp/course-targeted.log
            echo "exit_code=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=0
          pnpm typecheck:studio >> /tmp/course-targeted.log 2>&1 || code=1
          pnpm exec eslint \
            apps/admin/app/api/admin/course-builder \
            lib/course-builder \
            lib/course-factory \
            lib/devstudio/course-builder-controller.ts \
            --quiet >> /tmp/course-targeted.log 2>&1 || code=1
          pnpm exec vitest run tests/unit/course-factory/media-authority.test.ts >> /tmp/course-targeted.log 2>&1 || code=1
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          tail -n 300 /tmp/course-targeted.log
          exit 0

      - name: Build and persist requested course draft through canonical Course Builder
        id: acceptance
        shell: bash
        env:
          NODE_OPTIONS: --conditions=react-server
        run: |
          set +e
          if [ "${{ steps.targeted.outputs.exit_code }}" != "0" ]; then
            echo "Pre-generation validation failed: architecture=${{ steps.architecture.outputs.exit_code }} install=${{ steps.install.outputs.exit_code }} credentials=${{ steps.credentials.outputs.exit_code }} targeted=${{ steps.targeted.outputs.exit_code }}" > /tmp/course-acceptance.log
            echo "exit_code=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A source push validates the builder but must never mutate production
          # course state or spend provider credits. Paid course generation is
          # issue-triggered and explicitly course-scoped.
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "Push validation passed; production course generation requires an approved issue trigger." > /tmp/course-acceptance.log
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
            cat /tmp/course-acceptance.log
            exit 0
          fi
          if [ "${{ github.event_name }}" = "issues" ] && [ "${{ github.event.issue.title }}" = "RUN ESB COURSE BUILDER ACCEPTANCE" ]; then
            pnpm tsx scripts/course-factory/build-esb-acceptance.ts > /tmp/course-acceptance.log 2>&1
          else
            pnpm tsx scripts/course-factory/build-business-program.ts > /tmp/course-acceptance.log 2>&1
          fi
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          tail -n 420 /tmp/course-acceptance.log > /tmp/course-acceptance-tail.log || true
          # Always expose the captured generator output in Actions. The command is
          # intentionally wrapped so later evidence steps can run, but hiding this
          # log made a real generator failure look like a false final-gate failure.
          cat /tmp/course-acceptance-tail.log
          exit 0

      - name: Verify full Admin and LMS applications after course build
        id: verification
        shell: bash
        run: |
          set +e
          : > /tmp/course-verification.log
          if [ "${{ steps.acceptance.outputs.exit_code }}" != "0" ]; then
            echo "Course Builder acceptance failed; full application verification deferred until the course defect is corrected." >> /tmp/course-verification.log
            echo "exit_code=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=0
          pnpm exec eslint \
            apps/admin/app/api/admin/dev-studio/chat/route.ts \
            apps/admin/app/api/internal/videos/process-queue/route.ts \
            lib/video \
            apps/lms/app/lms/courses \
            apps/lms/app/api/learner/interactions \
            --quiet >> /tmp/course-verification.log 2>&1 || code=1
          pnpm build:admin >> /tmp/course-verification.log 2>&1 || code=1
          pnpm build:lms >> /tmp/course-verification.log 2>&1 || code=1
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          tail -n 360 /tmp/course-verification.log
          exit 0

      - name: Post result to trigger issue
        if: always() && github.event_name == 'issues'
        uses: actions/github-script@v7
        env:
          TESTED_SHA: ${{ steps.tested.outputs.sha }}
          ARCHITECTURE_EXIT_CODE: ${{ steps.architecture.outputs.exit_code }}
          INSTALL_EXIT_CODE: ${{ steps.install.outputs.exit_code }}
          CREDENTIAL_EXIT_CODE: ${{ steps.credentials.outputs.exit_code }}
          TARGETED_EXIT_CODE: ${{ steps.targeted.outputs.exit_code }}
          ACCEPTANCE_EXIT_CODE: ${{ steps.acceptance.outputs.exit_code }}
          VERIFICATION_EXIT_CODE: ${{ steps.verification.outputs.exit_code }}
        with:
          script: |
            const fs = require('fs');
            const architectureCode = process.env.ARCHITECTURE_EXIT_CODE || 'not-run';
            const installCode = process.env.INSTALL_EXIT_CODE || 'not-run';
            const credentialCode = process.env.CREDENTIAL_EXIT_CODE || 'not-run';
            const targetedCode = process.env.TARGETED_EXIT_CODE || 'not-run';
            const acceptanceCode = process.env.ACCEPTANCE_EXIT_CODE || 'not-run';
            const verificationCode = process.env.VERIFICATION_EXIT_CODE || 'not-run';
            const ok = architectureCode === '0' && installCode === '0' && credentialCode === '0' && targetedCode === '0' && acceptanceCode === '0' && verificationCode === '0';
            const sensitiveNames = [
              'SUPABASE_SERVICE_ROLE_KEY',
              'OPENAI_API_KEY',
              'GROQ_API_KEY',
              'GEMINI_API_KEY',
              'GOOGLE_CLOUD_API_KEY',
              'CLOUDFLARE_AI_API_TOKEN',
              'CLOUDFLARE_API_TOKEN',
              'ANTHROPIC_API_KEY',
              'AZURE_OPENAI_API_KEY',
              'CRON_SECRET',
            ];
            const redact = (value) => sensitiveNames.reduce((text, name) => {
              const secret = process.env[name];
              return secret && secret.length >= 8 ? text.replaceAll(secret, '***') : text;
            }, value);
            const readTail = (path, fallback, limit = 6000) => redact(
              fs.existsSync(path) ? fs.readFileSync(path, 'utf8').slice(-limit) : fallback,
            );
            const architectureTail = readTail('/tmp/course-architecture.log', 'Architecture checks did not produce a log.');
            const installTail = readTail('/tmp/course-install-tail.log', 'Dependency installation did not produce a log.');
            const targetedTail = readTail('/tmp/course-targeted.log', 'Targeted Course Builder validation did not produce a log.');
            const verificationTail = readTail('/tmp/course-verification.log', 'Full application verification did not produce a log.');
            const tail = fs.existsSync('/tmp/course-acceptance-tail.log')
              ? readTail('/tmp/course-acceptance-tail.log', '', 8000)
              : readTail('/tmp/course-acceptance.log', 'Course Builder did not produce a log.', 8000);
            const label = context.payload.issue.title.includes('BUSINESS') ? 'BUSINESS COURSE BUILDER' : 'ESB ACCEPTANCE';
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: `${label} ${ok ? 'PASS' : 'FAIL'}\n\nTested checkout SHA: ${process.env.TESTED_SHA}\nArchitecture: ${architectureCode}\nInstall: ${installCode}\nCredentials: ${credentialCode}\nTargeted Course Builder validation: ${targetedCode}\nAcceptance: ${acceptanceCode}\nFull Admin/LMS verification: ${verificationCode}\n\nArchitecture:\n\`\`\`text\n${architectureTail}\n\`\`\`\n\nInstall:\n\`\`\`text\n${installTail}\n\`\`\`\n\nTargeted validation:\n\`\`\`text\n${targetedTail}\n\`\`\`\n\nAcceptance:\n\`\`\`text\n${tail}\n\`\`\`\n\nFull verification:\n\`\`\`text\n${verificationTail}\n\`\`\`` });

      - name: Fail workflow when any required gate failed
        if: always()
        shell: bash
        run: |
          test "${{ steps.architecture.outputs.exit_code }}" = "0"
          test "${{ steps.install.outputs.exit_code }}" = "0"
          test "${{ steps.credentials.outputs.exit_code }}" = "0"
          test "${{ steps.targeted.outputs.exit_code }}" = "0"
          test "${{ steps.acceptance.outputs.exit_code }}" = "0"
          test "${{ steps.verification.outputs.exit_code }}" = "0"
