name: Verify Authorized Telnyx Destination

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify 317-760-7908 by DTMF
    runs-on: ubuntu-latest
    environment: production
    env:
      NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
      NORTHFLANK_PROJECT_ID: ${{ secrets.NORTHFLANK_PROJECT_ID || 'elevate-platform' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Request authorized Telnyx verification call
        run: node .github/scripts/verify-telnyx-destination.mjs
