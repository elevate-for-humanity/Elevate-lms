name: Cloud spending warnings
on:
  push:
    branches: [main]
    paths: ['scripts/gcp/configure-cloud-budget.mjs', '.github/workflows/cloud-budget-alerts.yml']
  workflow_dispatch:
    inputs:
      configure:
        type: boolean
        default: false
        description: Configure the $90 Google spending warning and subscription
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
  actions: write
  id-token: write
concurrency:
  group: cloud-budget-alerts
  cancel-in-progress: false
jobs:
  dispatch:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/cloud-budget-alerts.yml/dispatches" -f ref=main -f 'inputs[configure]=true'
  configure:
    if: github.event_name == 'workflow_dispatch' && inputs.configure && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        with:
          skip_install: true
      - run: node scripts/gcp/configure-cloud-budget.mjs
  poll:
    if: always() && github.event_name != 'push' && (needs.configure.result == 'success' || needs.configure.result == 'skipped')
    needs: [configure]
    # Scheduled polls still run when configuration is skipped.
    runs-on: ubuntu-24.04
    steps:
      - name: Persist Google report and deduplicated Admin notifications
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET" || { echo '::error::CRON_SECRET is missing'; exit 1; }
          curl --fail --silent --show-error --max-time 90 -o /dev/null -H "Authorization: Bearer $CRON_SECRET" https://admin.elevateforhumanity.org/api/cron/cloud-budget
