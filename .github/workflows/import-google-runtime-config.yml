name: Import runtime configuration into Google ownership
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-google-runtime-config.yml']
  workflow_dispatch:
    inputs:
      component:
        required: true
        type: choice
        options: [all, marketing, admin, lms, store, ultimate-worker, studio-browser]
permissions:
  contents: read
  actions: write
  id-token: write
concurrency:
  group: google-runtime-operations
  cancel-in-progress: false
jobs:
  dispatch:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Start requested one-time Google configuration transfer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/import-google-runtime-config.yml/dispatches" -f ref=main -f 'inputs[component]=all'
  import:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/gcp/runtime-config.test.mjs
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        with:
          skip_install: true
      - run: node scripts/gcp/verify-sdk.mjs
      - name: Import once and verify encrypted Google configuration
        env:
          COMPONENT: ${{ inputs.component }}
          NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
          NORTHFLANK_PROJECT_ID: ${{ secrets.NORTHFLANK_PROJECT_ID }}
        run: |
          set -u
          components="$COMPONENT"
          if [ "$COMPONENT" = 'all' ]; then components='marketing admin lms store ultimate-worker studio-browser'; fi
          failed=0
          for component in $components; do
            echo "Verifying Google-owned configuration for $component"
            COMPONENT="$component" node scripts/gcp/import-runtime-config.mjs || failed=1
          done
          exit "$failed"
