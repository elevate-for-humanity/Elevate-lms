name: Purge All Northflank GPU Resources

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/purge-all-gpu-resources.yml'

permissions:
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
      NORTHFLANK_TEAM_ID: ${{ secrets.NORTHFLANK_TEAM_ID || 'elevates-team' }}
      WEB_PROJECT_ID: ${{ secrets.NORTHFLANK_PROJECT_ID || 'elevate-platform' }}
      GPU_PROJECT_ID: elevate-media-gpu
    steps:
      - name: Delete all GPU services and volumes
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$NORTHFLANK_API_TOKEN"
          auth=(-H "Authorization: Bearer ${NORTHFLANK_API_TOKEN}" -H 'Content-Type: application/json')
          api="https://api.northflank.com/v1/teams/${NORTHFLANK_TEAM_ID}/projects"

          delete_service() {
            project="$1"; id="$2"
            code=$(curl -sS -o /tmp/delete.json -w '%{http_code}' -X DELETE "${auth[@]}" "$api/$project/services/$id?deleteChildObjects=true" || true)
            echo "delete service $project/$id => $code"
            case "$code" in 200|202|204|404) ;; *) cat /tmp/delete.json; exit 1;; esac
          }

          delete_volume() {
            project="$1"; id="$2"
            code=$(curl -sS -o /tmp/delete-volume.json -w '%{http_code}' -X DELETE "${auth[@]}" "$api/$project/volumes/$id" || true)
            echo "delete volume $project/$id => $code"
            case "$code" in 200|202|204|404) ;; *) cat /tmp/delete-volume.json; exit 1;; esac
          }

          # Known legacy/main-project GPU resource.
          delete_service "$WEB_PROJECT_ID" "elevate-gpu-worker-build"

          # Canonical standalone GPU resources.
          delete_service "$GPU_PROJECT_ID" "elevate-gpu-worker"
          delete_volume "$GPU_PROJECT_ID" "elevate-gpu-models"

          sleep 15

          # Hard verification: no known GPU service/volume may remain.
          for target in \
            "$WEB_PROJECT_ID/services/elevate-gpu-worker-build" \
            "$GPU_PROJECT_ID/services/elevate-gpu-worker" \
            "$GPU_PROJECT_ID/volumes/elevate-gpu-models"; do
            code=$(curl -sS -o /tmp/verify.json -w '%{http_code}' "${auth[@]}" "$api/$target" || true)
            echo "verify $target => $code"
            if [ "$code" != "404" ]; then
              cat /tmp/verify.json
              echo "GPU resource still exists: $target"
              exit 1
            fi
          done

          echo 'All known GPU deployments and GPU volumes are absent.'
