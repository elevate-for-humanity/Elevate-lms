name: Bind verified Twilio runtime credentials in Google
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/bind-twilio-runtime.yml', 'scripts/gcp/bind-twilio-runtime.mjs', 'scripts/gcp/bind-twilio-runtime.test.mjs']
permissions:
  contents: read
  actions: write
  id-token: write
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'google-runtime-configuration' || format('twilio-bind-{0}', github.ref) }}
  cancel-in-progress: false
jobs:
  dispatch:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/bind-twilio-runtime.yml/dispatches" -f ref=main
  bind:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node --test scripts/gcp/bind-twilio-runtime.test.mjs
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        with:
          skip_install: true
      - name: Verify number ownership and bind existing credentials without emitting values
        run: node scripts/gcp/bind-twilio-runtime.mjs
