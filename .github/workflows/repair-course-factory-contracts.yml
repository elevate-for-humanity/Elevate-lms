name: Repair Course Factory Contracts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/trigger-course-factory-contract-repair.txt'
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

jobs:
  repair:
    if: github.event_name != 'issues' || github.event.issue.title == 'RUN COURSE FACTORY CONTRACT REPAIR'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          clean: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repair current contract drift
        id: repair
        shell: bash
        run: |
          set +e
          node <<'NODE' > /tmp/repair.log 2>&1
          const fs = require('fs');
          const file = 'lib/course-factory/factory.ts';
          let text = fs.readFileSync(file, 'utf8');
          const replace = (from, to) => {
            if (!text.includes(from)) throw new Error(`Expected factory pattern missing: ${from.slice(0, 100)}`);
            text = text.replace(from, to);
          };
          replace(
            "lesson.quizQuestions = finalExam.questions.map((question) => ({\n          question: question.question,",
            "lesson.quizQuestions = finalExam.questions.map((question, questionIndex) => ({\n          id: `${lesson.slug}-q-${questionIndex + 1}`,\n          question: question.question,"
          );
          replace(
            "lesson.quizQuestions = assessment.questions.map((question) => ({\n          question: question.question,",
            "lesson.quizQuestions = assessment.questions.map((question, questionIndex) => ({\n          id: `${lesson.slug}-q-${questionIndex + 1}`,\n          question: question.question,"
          );
          replace(
            "lesson.quizQuestions = generated.quiz_questions.map((question) => ({\n        question: question.question,",
            "lesson.quizQuestions = generated.quiz_questions.map((question, questionIndex) => ({\n        id: `${lesson.slug}-q-${questionIndex + 1}`,\n        question: question.question,"
          );
          replace(
            "const loaded = await loadBlueprintWithProgram(programSlug, input.programId);\n      blueprint = loaded.blueprint ? cloneBlueprint(loaded.blueprint) : null;\n      program = loaded.program;",
            "const db = await requireAdminClient();\n      const loaded = await loadBlueprintWithProgram(db, { programId: input.programId, programSlug });\n      blueprint = loaded?.blueprint ? cloneBlueprint(loaded.blueprint) : null;\n      program = loaded?.program ?? null;"
          );
          replace(
            "      programSlug,\n      program,\n      blueprint,",
            "      programSlug,\n      blueprint,"
          );
          replace(
            "evidence.sources.map((source) => source.kind).join(', ')",
            "evidence.sources.join(', ')"
          );
          text = text.replaceAll('errors: audit.errors,', 'errors: audit.errors.map((error) => error.message),');
          text = text.replaceAll('errors: packageAudit.errors,', 'errors: packageAudit.errors.map((error) => error.message),');
          fs.writeFileSync(file, text);

          const publisher = 'lib/course-factory/publisher.ts';
          let publisherText = fs.readFileSync(publisher, 'utf8');
          if (!publisherText.includes('  } catch {}')) throw new Error('Expected publisher catch pattern missing');
          publisherText = publisherText.replace('  } catch {}', '  } catch {\n    // Plain HTML/text lesson content is normalized below.\n  }');
          fs.writeFileSync(publisher, publisherText);
          NODE
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat /tmp/repair.log
          exit 0
      - name: Commit repaired contracts
        id: commit
        if: steps.repair.outputs.exit_code == '0'
        shell: bash
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/course-factory/factory.ts lib/course-factory/publisher.ts
          git diff --cached --check > /tmp/commit.log 2>&1
          code=$?
          if [ "$code" = "0" ] && ! git diff --cached --quiet; then
            git commit -m "fix(course-factory): align canonical contracts" >> /tmp/commit.log 2>&1 || code=$?
            if [ "$code" = "0" ]; then
              git pull --rebase origin main >> /tmp/commit.log 2>&1 || code=$?
            fi
            if [ "$code" = "0" ]; then
              git push origin HEAD:main >> /tmp/commit.log 2>&1 || code=$?
            fi
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat /tmp/commit.log
          exit 0
      - name: Report result to trigger issue
        if: always() && github.event_name == 'issues'
        uses: actions/github-script@v7
        env:
          REPAIR_EXIT: ${{ steps.repair.outputs.exit_code }}
          COMMIT_EXIT: ${{ steps.commit.outputs.exit_code }}
        with:
          script: |
            const fs = require('fs');
            const repair = process.env.REPAIR_EXIT || 'not-run';
            const commit = process.env.COMMIT_EXIT || 'not-run';
            const repairLog = fs.existsSync('/tmp/repair.log') ? fs.readFileSync('/tmp/repair.log', 'utf8').slice(-12000) : '';
            const commitLog = fs.existsSync('/tmp/commit.log') ? fs.readFileSync('/tmp/commit.log', 'utf8').slice(-12000) : '';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `COURSE FACTORY CONTRACT REPAIR ${repair === '0' && (commit === '0' || commit === 'not-run') ? 'PASS' : 'FAIL'}\n\nRepair: ${repair}\nCommit: ${commit}\n\n\`\`\`text\n${repairLog}\n${commitLog}\n\`\`\``
            });
      - name: Fail when repair failed
        if: always()
        run: |
          test "${{ steps.repair.outputs.exit_code }}" = "0"
          test "${{ steps.commit.outputs.exit_code }}" = "0" -o "${{ steps.commit.outputs.exit_code }}" = ""
