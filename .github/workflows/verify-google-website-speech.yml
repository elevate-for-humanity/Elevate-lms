name: Verify Google website speech
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-google-website-speech.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: write
  id-token: write
jobs:
  dispatch:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/verify-google-website-speech.yml/dispatches" -f ref=main
  verify:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        with:
          skip_install: true
      - name: Verify narration and inspect sanitized Google failure categories
        run: |
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          const response=await fetch('https://www.elevateforhumanity.org/api/voice/natural',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:'Welcome to Elevate for Humanity.'})});
          const bytes=await response.arrayBuffer();
          console.log(JSON.stringify({speechStatus:response.status,contentType:response.headers.get('content-type'),bytes:bytes.byteLength}));
          const rows=JSON.parse(execFileSync('gcloud',['logging','read','resource.type="cloud_run_revision" AND resource.labels.service_name="elevate-marketing-migration"','--freshness=15m','--limit=300','--project=elegant-racer-299721','--format=json'],{encoding:'utf8',stdio:['ignore','pipe','pipe']}));
          for(const row of rows){
            const message=row.textPayload||JSON.stringify(row.jsonPayload||{});
            if(!/natural-voice|Google Cloud speech/.test(message))continue;
            const status=message.match(/HTTP (\d{3})/)?.[1];
            console.log(JSON.stringify({timestamp:row.timestamp,revision:row.resource?.labels?.revision_name,providerStatus:status,notConfigured:/not configured/.test(message),timeout:/Timeout|abort/i.test(message)}));
          }
          if(response.status!==200||!response.headers.get('content-type')?.startsWith('audio/')||bytes.byteLength<100)throw new Error('Live Google narration acceptance failed');
          NODE
