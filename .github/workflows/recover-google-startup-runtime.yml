name: Recover verified Google startup runtime
on:
  push:
    branches: [main]
    paths: ['.github/workflows/recover-google-startup-runtime.yml', 'scripts/gcp/recover-startup-runtime.mjs']
  workflow_dispatch:
permissions:
  contents: read
  actions: write
  id-token: write
concurrency:
  group: google-runtime-operations
  cancel-in-progress: false
jobs:
  dispatch:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/recover-google-startup-runtime.yml/dispatches" -f ref=main
  recover:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        component: [marketing, admin]
    env:
      COMPONENT: ${{ matrix.component }}
      IMAGE_SHA: 4bc83a5833306f63145f97066c55ceb25c4c5eb1
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        with:
          skip_install: true
      - run: node scripts/gcp/verify-sdk.mjs
      - run: node scripts/gcp/recover-startup-runtime.mjs
