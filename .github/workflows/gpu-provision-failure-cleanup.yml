name: GPU Provision Failure Cleanup

on:
  workflow_run:
    workflows: ['Deploy GPU Video Worker']
    types: [completed]

permissions:
  contents: read

env:
  NORTHFLANK_GPU_PROJECT_ID: elevate-media-gpu
  NORTHFLANK_GPU_SERVICE_ID: elevate-gpu-worker
  NORTHFLANK_GPU_MODEL_VOLUME_ID: elevate-gpu-models

jobs:
  cleanup:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
    steps:
      - name: Remove only orphaned GPU model storage
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$NORTHFLANK_API_TOKEN"
          base="https://api.northflank.com/v1/projects/${NORTHFLANK_GPU_PROJECT_ID}"
          auth=(-H "Authorization: Bearer ${NORTHFLANK_API_TOKEN}" -H 'Content-Type: application/json')

          service_code=$(curl -sS -o /tmp/gpu-service.json -w '%{http_code}' "${auth[@]}" "$base/services/${NORTHFLANK_GPU_SERVICE_ID}" || true)
          if [ "$service_code" = "200" ]; then
            echo "GPU service exists; preserving model volume for investigation/retry."
            exit 0
          fi

          curl -fsS "${auth[@]}" "$base/volumes" > /tmp/gpu-volumes.json || echo '{"data":[]}' > /tmp/gpu-volumes.json
          node - <<'NODE' > /tmp/orphan-volume-ids.txt
          const fs = require('fs');
          const j = JSON.parse(fs.readFileSync('/tmp/gpu-volumes.json','utf8'));
          const rows = Array.isArray(j.data) ? j.data : (Array.isArray(j.data?.volumes) ? j.data.volumes : []);
          for (const v of rows) {
            const id = String(v.id || '');
            const name = String(v.name || '').toLowerCase();
            if (id === process.env.NORTHFLANK_GPU_MODEL_VOLUME_ID || name === 'elevate gpu models') console.log(id);
          }
          NODE

          while IFS= read -r volume_id; do
            [ -z "$volume_id" ] && continue
            echo "Removing orphaned GPU model volume $volume_id"
            code=$(curl -sS -o /tmp/delete-volume.json -w '%{http_code}' -X DELETE "${auth[@]}" "$base/volumes/$volume_id" || true)
            case "$code" in
              200|202|204|404) ;;
              *) cat /tmp/delete-volume.json || true; exit 1 ;;
            esac
          done < /tmp/orphan-volume-ids.txt
