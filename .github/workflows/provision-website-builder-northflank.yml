name: Provision Website Builder Northflank

on:
  workflow_dispatch:
  push:
    branches:
      - refactor/website-builder-standalone-20260814
    paths:
      - 'apps/website-builder/**'
      - 'Dockerfile.northflank-builder'
      - 'scripts/northflank/create-builder-service.mjs'
      - '.github/workflows/provision-website-builder-northflank.yml'

permissions:
  contents: read

concurrency:
  group: website-builder-northflank-bootstrap
  cancel-in-progress: true

env:
  NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
  NORTHFLANK_TEAM_ID: ${{ secrets.NORTHFLANK_TEAM_ID || 'elevates-team' }}
  NORTHFLANK_PROJECT_ID: ${{ secrets.NORTHFLANK_PROJECT_ID || 'elevate-platform' }}
  NORTHFLANK_BUILDER_SERVICE_ID: elevate-website-builder
  NORTHFLANK_GIT_BRANCH: refactor/website-builder-standalone-20260814

jobs:
  build-and-provision:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolation branch
        uses: actions/checkout@v4

      - name: Require Northflank credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${NORTHFLANK_API_TOKEN:-}" || { echo '::error::NORTHFLANK_API_TOKEN is missing'; exit 1; }
          test -n "${NORTHFLANK_PROJECT_ID:-}" || { echo '::error::NORTHFLANK_PROJECT_ID is missing'; exit 1; }

      - name: Build standalone Website Builder image locally
        run: |
          docker build \
            --build-arg NF_GIT_SHA="${GITHUB_SHA}" \
            -f Dockerfile.northflank-builder \
            -t elevate-website-builder:${GITHUB_SHA} .

      - name: Smoke-test isolated container
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --rm --name elevate-builder-smoke -p 3300:3000 elevate-website-builder:${GITHUB_SHA}
          trap 'docker stop elevate-builder-smoke >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3300/api/ping >/tmp/builder-ping.json; then
              cat /tmp/builder-ping.json
              curl -fsS http://127.0.0.1:3300/api/health
              exit 0
            fi
            sleep 2
          done
          docker logs elevate-builder-smoke || true
          exit 1

      - name: Create or update isolated Northflank service
        run: node scripts/northflank/create-builder-service.mjs --execute

      - name: Safety statement
        run: |
          echo 'Website Builder service provisioned without custom-domain attachment.'
          echo 'Marketing, Admin, LMS, and production customer traffic were not changed.'
