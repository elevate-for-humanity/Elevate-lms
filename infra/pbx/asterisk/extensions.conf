[general]
static=yes
writeprotect=yes

[internal]
; Operator 0 is a single-digit extension and does not match _X.
exten => 0,1,NoOp(Elevate operator zero)
 same => n,Dial(PJSIP/0,30)
 same => n,VoiceMail(0@elevate,u)
 same => n,Hangup()

; Extension-to-extension calls remain on Elevate infrastructure.
exten => _X.,1,NoOp(Elevate internal call to ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},30)
 same => n,VoiceMail(${EXTEN}@elevate,u)
 same => n,Hangup()

[pstn-out]
; E.164 destinations are the only calls eligible for the carrier trunk.
exten => _+X.,1,NoOp(External PSTN call)
 same => n,Dial(PJSIP/${EXTEN}@telnyx,60)
 same => n,Hangup()

[pstn-in]
; Traditional public-number calls enter Elevate here, then route internally.
exten => _X.,1,Goto(internal,0,1)
