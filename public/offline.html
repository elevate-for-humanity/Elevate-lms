<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline - Elevate for Humanity</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: linear-gradient(135deg, #1e3a5f 0%, #2d5a87 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        color: white;
      }
      .container {
        text-align: center;
        max-width: 400px;
      }
      .icon {
        font-size: 64px;
        margin-bottom: 24px;
      }
      h1 {
        font-size: 28px;
        margin-bottom: 16px;
      }
      p {
        font-size: 16px;
        opacity: 0.9;
        margin-bottom: 24px;
        line-height: 1.5;
      }
      button {
        background: #f97316;
        color: white;
        border: none;
        padding: 14px 28px;
        font-size: 16px;
        font-weight: 600;
        border-radius: 8px;
        cursor: pointer;
        transition: background 0.2s;
      }
      button:hover {
        background: #ea580c;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon">📡</div>
      <h1>You're Offline</h1>
      <p>
        It looks like you've lost your internet connection. Please check your connection and try
        again.
      </p>
      <button id="retry-button" type="button">Try Again</button>
    </div>
    <script>
      document.getElementById('retry-button').addEventListener('click', async function () {
        this.disabled = true;
        this.textContent = 'Reconnecting…';
        try {
          if ('serviceWorker' in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map((registration) => registration.unregister()));
          }
          if ('caches' in window) {
            const names = await caches.keys();
            await Promise.all(
              names.filter((name) => name.startsWith('elevate-')).map((name) => caches.delete(name)),
            );
          }
        } finally {
          const isPortal =
            window.location.hostname.startsWith('app.') ||
            window.location.hostname.startsWith('admin.');
          window.location.replace(isPortal ? '/login?pwa-recovered=1' : '/');
        }
      });
    </script>
  </body>
</html>
