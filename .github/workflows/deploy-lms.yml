name: Deploy LMS

on:
  push:
    branches:
      - main
    paths:
      - 'apps/lms/**'
      - 'lib/api/**'
      - 'lib/auth/**'
      - 'lib/rbac/**'
      - 'lib/rbac.ts'
      - 'lib/rate-limit.ts'
      - 'lib/resend.ts'
      - 'lib/portal/**'
      - 'lib/navigation/**'
      - 'lib/monitoring/**'
      - 'lib/health/**'
      - 'lib/supabase/**'
      - 'lib/llm/**'
      - 'lib/ai/**'
      - 'lib/embeddings/**'
      - 'lib/lms/**'
      - 'lib/course-factory/**'
      - 'lib/course-builder/**'
      - 'lib/curriculum/**'
      - 'lib/db/**'
      - 'lib/payments/**'
      - 'lib/programs/**'
      - 'lib/store/**'
      - 'lib/studio/**'
      - 'components/platform/**'
      - 'components/lms/**'
      - 'components/portal/**'
      - 'components/auth/**'
      - 'components/career/**'
      - 'components/pwa/**'
      - 'components/CalendarWidget.tsx'
      - 'components/SocialLearningCommunity.tsx'
      - 'components/careers/**'
      - 'packages/shared-utils/**'
      - 'Dockerfile.lms'
      - 'Dockerfile.northflank-lms'
      - 'scripts/northflank/**'
      - 'scripts/check-pwa-architecture.mjs'
      - 'public/sw-lms.js'
      - 'public/manifest-lms.json'
      - 'next.config.mjs'
      - 'tailwind.config.js'
      - 'tsconfig.json'
      - 'proxy.ts'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy-lms.yml'
  workflow_dispatch:

permissions:
  contents: read

# Production must converge on the newest eligible main revision. Superseded
# workflow runs are safe to cancel because Northflank only receives a deployment
# after the image build and exact-SHA verification succeed; the existing healthy
# deployment remains in service under the maxUnavailable=0 rollout contract.
concurrency:
  group: northflank-lms-deploy
  # Do not discard a production image after Northflank has already started
  # building it. GitHub still coalesces queued runs to the newest pending SHA.
  cancel-in-progress: false

jobs:
  deploy-lms:
    name: Build and deploy LMS on Northflank
    runs-on: ubuntu-latest
    environment: production
    env:
      NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
      NORTHFLANK_TEAM_ID: ${{ secrets.NORTHFLANK_TEAM_ID || 'elevates-team' }}
      NORTHFLANK_PROJECT_ID: ${{ secrets.NORTHFLANK_PROJECT_ID || 'elevate-platform' }}
      NORTHFLANK_LMS_SERVICE_ID: ${{ secrets.NORTHFLANK_LMS_SERVICE_ID || 'elevate-lms' }}
      NORTHFLANK_TARGET_SERVICE: lms
      DEPLOY_BRANCH: main
      NORTHFLANK_EPHEMERAL_STORAGE_MB: '32768'
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_GIT_SHA: ${{ github.sha }}
      NEXT_PUBLIC_FACEBOOK_PIXEL_ID: ${{ secrets.NEXT_PUBLIC_FACEBOOK_PIXEL_ID }}
      NEXT_PUBLIC_SITE_URL: https://www.elevateforhumanity.org
      NEXT_PUBLIC_WWW_URL: https://www.elevateforhumanity.org
      NEXT_PUBLIC_APP_URL: https://app.elevateforhumanity.org
      NEXT_PUBLIC_ADMIN_URL: https://admin.elevateforhumanity.org
      ONET_API_KEY: ${{ secrets.ONET_API_KEY }}
      CAREERONESTOP_USER_ID: ${{ secrets.CAREERONESTOP_USER_ID }}
      CAREERONESTOP_TOKEN: ${{ secrets.CAREERONESTOP_TOKEN }}
      USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Prove deployment SHA belongs to main
        shell: bash
        run: |
          set -Eeuo pipefail
          REQUESTED_SHA="${{ github.sha }}"
          git fetch origin main --depth=200
          RESOLVED_SHA="$(git rev-parse "$REQUESTED_SHA^{commit}" 2>/dev/null || true)"
          test -n "$RESOLVED_SHA" || { echo '::error::Deployment SHA cannot be resolved'; exit 1; }
          git merge-base --is-ancestor "$RESOLVED_SHA" origin/main || { echo "::error::Refusing production deploy of SHA not contained in main: $RESOLVED_SHA"; exit 1; }
          test "$RESOLVED_SHA" = "$(git rev-parse HEAD)" || { echo '::error::Checkout SHA mismatch'; exit 1; }
          test "$(git status --porcelain)" = ""
          echo "Verified production LMS SHA $RESOLVED_SHA"

      - name: Set build environment variables
        run: |
          echo "GITHUB_SHA=${{ github.sha }}" >> "$GITHUB_ENV"
          echo "BUILD_SHA=${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Generate version file
        run: |
          cat > public/version.json <<EOF
          {
            "service": "lms",
            "commit": "${{ github.sha }}",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies deterministically
        run: pnpm install --frozen-lockfile --strict-peer-dependencies=false

      - name: Enforce canonical Northflank LMS runtime configuration
        run: pnpm tsx scripts/northflank/configure-services.ts "$NORTHFLANK_LMS_SERVICE_ID" --execute

      - name: Verify LMS health-check contract
        run: pnpm tsx scripts/northflank/verify-health-checks.ts "$NORTHFLANK_LMS_SERVICE_ID"

      - name: Trigger LMS build
        id: trigger_lms_build
        run: pnpm tsx scripts/northflank/trigger-build.ts "$NORTHFLANK_LMS_SERVICE_ID"

      - name: Require concrete build id
        run: |
          set -euo pipefail
          test -n "${{ steps.trigger_lms_build.outputs.build_id }}" || { echo '::error::Northflank trigger returned no build_id'; exit 1; }

      - name: Wait for LMS build to complete
        run: pnpm tsx scripts/northflank/wait-service.ts "$NORTHFLANK_LMS_SERVICE_ID" --build-id "${{ steps.trigger_lms_build.outputs.build_id }}" --timeout-ms 3600000

      - name: Verify exact LMS build succeeded
        run: |
          pnpm tsx scripts/northflank/verify-build.ts \
            "$NORTHFLANK_LMS_SERVICE_ID" \
            --build-id "${{ steps.trigger_lms_build.outputs.build_id }}" \
            --sha "${{ github.sha }}"

      - name: Deploy exact LMS build
        run: |
          pnpm tsx scripts/northflank/trigger-deployment.ts \
            "$NORTHFLANK_LMS_SERVICE_ID" \
            --build-id "${{ steps.trigger_lms_build.outputs.build_id }}" \
            --sha "${{ github.sha }}"

      - name: Wait for LMS deployment
        run: pnpm tsx scripts/northflank/wait-service.ts "$NORTHFLANK_LMS_SERVICE_ID" --timeout-ms 3600000

      - name: Verify deployed SHA matches main
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: pnpm tsx scripts/northflank/verify-deployed-sha.ts elevate-lms --trust-deploy-status

      - name: Smoke LMS liveness, readiness, dependency health, and exact live SHA
        run: |
          set -euo pipefail
          EXPECTED_SHA="${{ github.sha }}"
          for i in $(seq 1 20); do
            ping_status=$(curl -sS --max-time 10 -o /tmp/lms-ping.json -w "%{http_code}" "https://app.elevateforhumanity.org/api/ping?deploy=${EXPECTED_SHA}" || true)
            ready_status=$(curl -sS --max-time 10 -o /tmp/lms-ready.json -w "%{http_code}" "https://app.elevateforhumanity.org/api/ready?deploy=${EXPECTED_SHA}" || true)
            health_status=$(curl -sS --max-time 10 -o /tmp/lms-health.json -w "%{http_code}" "https://app.elevateforhumanity.org/api/health?deploy=${EXPECTED_SHA}" || true)
            version_status=$(curl -sS --max-time 10 -o /tmp/lms-version.json -w "%{http_code}" "https://app.elevateforhumanity.org/api/version?deploy=${EXPECTED_SHA}" || true)
            ping_body=$(cat /tmp/lms-ping.json 2>/dev/null || true)
            ready_body=$(cat /tmp/lms-ready.json 2>/dev/null || true)
            health_body=$(cat /tmp/lms-health.json 2>/dev/null || true)
            LIVE_SHA="$(node -e "try{const d=require('/tmp/lms-version.json');process.stdout.write(d.commitSha||d.commit||'')}catch(e){}")"
            echo "Attempt $i/20: ping=$ping_status ready=$ready_status health=$health_status version=$version_status live_sha=${LIVE_SHA:-missing}"
            if [ "$ping_status" = "200" ] \
              && [ "$ready_status" = "200" ] \
              && [ "$health_status" = "200" ] \
              && [ "$version_status" = "200" ] \
              && echo "$ping_body" | grep -q '"ok":true' \
              && echo "$ready_body" | grep -q '"ready":true' \
              && echo "$health_body" | grep -q '"healthy":true' \
              && [ "$LIVE_SHA" = "$EXPECTED_SHA" ]; then
              echo "LMS DEPLOYMENT VERIFIED: $EXPECTED_SHA is live, ready, and dependency-healthy"
              exit 0
            fi
            sleep 15
          done
          echo "::error::LMS production did not converge to exact SHA $EXPECTED_SHA with healthy runtime contracts"
          cat /tmp/lms-ping.json 2>/dev/null || true
          cat /tmp/lms-ready.json 2>/dev/null || true
          cat /tmp/lms-health.json 2>/dev/null || true
          cat /tmp/lms-version.json 2>/dev/null || true
          exit 1

      - name: Smoke canonical learner route
        run: |
          set -euo pipefail
          status=$(curl -sS --max-time 15 -o /tmp/lms-dashboard.html -w "%{http_code}" https://app.elevateforhumanity.org/lms/dashboard || true)
          case "$status" in
            2*|3*) echo "Canonical learner route served HTTP ${status}." ;;
            *) echo "::error::Canonical learner route failed HTTP ${status}."; cat /tmp/lms-dashboard.html || true; exit 1 ;;
          esac
