name: Deploy GPU Video Worker

on:
  push:
    branches: [main]
    paths:
      - 'services/media-gpu-worker/**'
      - 'scripts/northflank/provision-gpu-worker.ts'
      - '.github/workflows/deploy-gpu-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: northflank-gpu-video-deploy
  cancel-in-progress: false

jobs:
  deploy-gpu-worker:
    name: Provision and verify canonical GPU worker
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 180
    env:
      NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
      NORTHFLANK_TEAM_ID: ${{ secrets.NORTHFLANK_TEAM_ID || 'elevates-team' }}
      NORTHFLANK_PROJECT_ID: ${{ secrets.NORTHFLANK_PROJECT_ID || 'elevate-platform' }}
      NORTHFLANK_ADMIN_SERVICE_ID: ${{ secrets.NORTHFLANK_ADMIN_SERVICE_ID || 'elevate-admin' }}
      NORTHFLANK_GPU_PROJECT_ID: elevate-media-gpu
      NORTHFLANK_GPU_REGION: us-central
      NORTHFLANK_GPU_SERVICE_ID: elevate-gpu-worker
      NORTHFLANK_GPU_TYPE: l4-24
      NORTHFLANK_GPU_COUNT: '1'
      NORTHFLANK_GPU_DEPLOYMENT_PLAN: nf-gpu-l4-24-1g
      NORTHFLANK_GPU_BUILD_PLAN: nf-compute-800-16
      NORTHFLANK_GPU_MODEL_VOLUME_ID: elevate-gpu-models
      NORTHFLANK_GPU_MODEL_VOLUME_MB: '153600'
      NORTHFLANK_GPU_EPHEMERAL_MB: '256000'
      NORTHFLANK_GPU_BUILD_EPHEMERAL_MB: '32768'
      GPU_VIDEO_PROVIDER: wan
      GPU_MAX_CONCURRENCY: '1'
      WAN_MIN_VRAM_GB: '22'
      GITHUB_SHA: ${{ github.sha }}
      BUILD_SHA: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Verify production credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$NORTHFLANK_API_TOKEN"
          test -n "$NORTHFLANK_TEAM_ID"

      - name: Delete legacy Northflank GPU services only
        shell: bash
        run: |
          set -Eeuo pipefail
          base="https://api.northflank.com/v1/teams/${NORTHFLANK_TEAM_ID}/projects/${NORTHFLANK_GPU_PROJECT_ID}"
          auth=(-H "Authorization: Bearer ${NORTHFLANK_API_TOKEN}" -H 'Content-Type: application/json')
          for sid in elevate-media-gpu-worker elevate-gpu-worker-build; do
            code=$(curl -sS -o "/tmp/${sid}.json" -w '%{http_code}' "${auth[@]}" "$base/services/$sid" || true)
            if [ "$code" = "200" ]; then
              echo "Deleting legacy GPU service: $sid"
              del=$(curl -sS -o "/tmp/${sid}-delete.json" -w '%{http_code}' -X DELETE "${auth[@]}" "$base/services/$sid?delete_child_objects=true" || true)
              if [ "$del" != "200" ] && [ "$del" != "202" ] && [ "$del" != "204" ]; then
                cat "/tmp/${sid}-delete.json" || true
                exit 1
              fi
            elif [ "$code" = "404" ]; then
              echo "$sid already absent"
            else
              echo "Unexpected HTTP $code checking $sid"
              cat "/tmp/${sid}.json" || true
              exit 1
            fi
          done

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pnpm install --frozen-lockfile --strict-peer-dependencies=false

      - name: Validate GPU worker source
        run: |
          python -m py_compile services/media-gpu-worker/worker.py
          python -m py_compile services/media-gpu-worker/bootstrap_models.py
          pnpm tsx scripts/northflank/provision-gpu-worker.ts

      - name: Provision, build, deploy, bootstrap and acceptance-test GPU worker
        run: pnpm tsx scripts/northflank/provision-gpu-worker.ts --execute

      - name: Enforce canonical Northflank build rules and one instance
        shell: bash
        run: |
          set -Eeuo pipefail
          base="https://api.northflank.com/v1/teams/${NORTHFLANK_TEAM_ID}/projects/${NORTHFLANK_GPU_PROJECT_ID}"
          auth=(-H "Authorization: Bearer ${NORTHFLANK_API_TOKEN}" -H 'Content-Type: application/json')
          cat >/tmp/gpu-rules.json <<'JSON'
          {
            "disabledCI": false,
            "vcsData": {
              "projectUrl": "https://github.com/elevate-for-humanity/Elevate-lms",
              "projectType": "github",
              "projectBranch": "main"
            },
            "buildConfiguration": {
              "pathIgnoreRules": [
                "services/media-gpu-worker/**",
                "scripts/northflank/provision-gpu-worker.ts"
              ],
              "isAllowList": true,
              "ciIgnoreFlagsEnabled": true,
              "ciIgnoreFlags": ["[skip ci]", "[ci skip]", "[northflank skip]", "[skip northflank]"]
            },
            "deployment": {
              "type": "deployment",
              "instances": 1,
              "strategy": {"type": "recreate"},
              "gracePeriodSeconds": 180
            }
          }
          JSON
          curl -fsS -X PATCH "${auth[@]}" --data-binary @/tmp/gpu-rules.json "$base/services/combined/${NORTHFLANK_GPU_SERVICE_ID}" >/tmp/gpu-patch.json

      - name: Verify canonical GPU service state
        shell: bash
        run: |
          set -Eeuo pipefail
          base="https://api.northflank.com/v1/teams/${NORTHFLANK_TEAM_ID}/projects/${NORTHFLANK_GPU_PROJECT_ID}"
          auth=(-H "Authorization: Bearer ${NORTHFLANK_API_TOKEN}" -H 'Content-Type: application/json')
          curl -fsS "${auth[@]}" "$base/services/${NORTHFLANK_GPU_SERVICE_ID}" >/tmp/gpu-final.json
          curl -fsS "${auth[@]}" "$base/services" >/tmp/gpu-services-final.json
          node <<'NODE'
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync('/tmp/gpu-final.json','utf8'));
          const s=raw.data||raw;
          const allRaw=JSON.parse(fs.readFileSync('/tmp/gpu-services-final.json','utf8'));
          const all=Array.isArray(allRaw.data)?allRaw.data:(Array.isArray(allRaw.data?.services)?allRaw.data.services:[]);
          const gpu=all.filter(x=>String(x.id||'').includes('gpu'));
          const rules=s.buildConfiguration?.pathIgnoreRules||[];
          const instances=Number(s.deployment?.instances ?? s.deployment?.spec?.instances ?? 0);
          const expected=['services/media-gpu-worker/**','scripts/northflank/provision-gpu-worker.ts'];
          console.log(JSON.stringify({canonical:s.id||s.name,instances,disabledCI:s.disabledCI,isAllowList:s.buildConfiguration?.isAllowList,pathIgnoreRules:rules,gpuServices:gpu.map(x=>x.id)},null,2));
          if ((s.id||s.name)!=='elevate-gpu-worker') throw new Error('Canonical GPU service missing');
          if (gpu.some(x=>['elevate-media-gpu-worker','elevate-gpu-worker-build'].includes(String(x.id)))) throw new Error('Legacy GPU service still exists');
          if (s.disabledCI!==false) throw new Error('GPU CI is disabled');
          if (s.buildConfiguration?.isAllowList!==true) throw new Error('GPU build rules are not allow-list mode');
          if (!expected.every(r=>rules.includes(r))) throw new Error('GPU path rules did not persist');
          if (instances!==1) throw new Error(`Expected exactly 1 GPU instance, got ${instances}`);
          NODE
