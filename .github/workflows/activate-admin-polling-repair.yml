name: Activate verified Admin polling repair
on:
  push:
    branches: [main]
    paths: ['.github/workflows/activate-admin-polling-repair.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: write
  id-token: write
jobs:
  dispatch:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/activate-admin-polling-repair.yml/dispatches" -f ref=main
  activate:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    concurrency:
      group: google-admin-runtime-operations
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        with:
          skip_install: true
      - name: Verify and activate the exact built image
        env:
          IMAGE_SHA: f8d13ddabd37e90a9d09712d5c9ca710d6dd2f08
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { activateTestedRevision } from './scripts/gcp/activate-tested-public-revision.mjs';
          const expected='us-central1-docker.pkg.dev/elegant-racer-299721/elevate/admin@sha256:2406f752dc811ac94f03f0c10bc1534f01ef45ea9151005223f7f80d16379a68';
          const rows=JSON.parse(execFileSync('gcloud',['run','revisions','list','--service=elevate-admin-migration','--region=us-central1','--project=elegant-racer-299721','--format=json'],{encoding:'utf8'}));
          const state=JSON.parse(execFileSync('gcloud',['run','services','describe','elevate-admin-migration','--region=us-central1','--project=elegant-racer-299721','--format=json'],{encoding:'utf8'}));
          console.log(JSON.stringify({serviceAnnotations:state.metadata.annotations,templateAnnotations:state.spec.template.metadata.annotations,resources:state.spec.template.spec.containers.map(c=>c.resources),traffic:state.status.traffic,revisions:rows.map(r=>({name:r.metadata.name,annotations:r.metadata.annotations,resources:r.spec.containers.map(c=>c.resources),ready:r.status.conditions?.find(c=>c.type==='Ready')}))}));
          const candidates=rows.filter(r=>r.spec?.containers?.[0]?.image===expected);
          if(candidates.length!==1)throw Error('Exactly one matching immutable Admin revision required');
          console.log(JSON.stringify(await activateTestedRevision({service:'elevate-admin-migration',revision:candidates[0].metadata.name,commit:process.env.IMAGE_SHA})));
          NODE
      - name: Verify live Admin repair
        env:
          GITHUB_SHA: f8d13ddabd37e90a9d09712d5c9ca710d6dd2f08
        run: |
          export GOOGLE_ADMIN_URL="$(gcloud run services describe elevate-admin-migration --region=us-central1 --project=elegant-racer-299721 --format='value(status.url)')"
          node scripts/gcp/verify-admin-revision.mjs
