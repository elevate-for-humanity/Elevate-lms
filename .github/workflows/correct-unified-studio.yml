name: Correct unified Studio architecture
on:
  push:
    branches: [unified-studio-production]
permissions:
  contents: write
jobs:
  correct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: unified-studio-production
          fetch-depth: 0
      - name: Apply verified correction
        env:
          PATCH_B64: 
        run: |
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/studio-correction.patch
          git apply --check /tmp/studio-correction.patch
          git apply /tmp/studio-correction.patch
          rm .github/workflows/correct-unified-studio.yml
          git config user.name "Elevate Release Automation"
          git config user.email "admin@elevateforhumanity.org"
          git add -A
          git commit -m "Correct unified Studio task route architecture"
          git push origin HEAD:unified-studio-production
