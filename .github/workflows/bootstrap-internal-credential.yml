name: Elevate internal credential bootstrap
on:
  workflow_dispatch:
    inputs:
      component:
        description: 'Approved runtime'
        type: choice
        options: [admin, lms, marketing, store]
        required: true
      key:
        description: 'Approved Elevate-owned key'
        type: choice
        options: [STUDIO_BROWSER_SECRET, CRON_SECRET, NEXTAUTH_SECRET]
        required: true
      apply:
        description: 'Create only when absent (requires protected production approval)'
        type: boolean
        default: false
        required: true
permissions:
  contents: read
  id-token: write
concurrency:
  group: elevate-internal-credential-bootstrap
  cancel-in-progress: false
jobs:
  bootstrap:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify bootstrap rules
        run: node --test scripts/gcp/bootstrap-internal-token.test.mjs
      - name: Validate request without external writes
        env:
          COMPONENT: ${{ inputs.component }}
          KEY: ${{ inputs.key }}
        run: node scripts/gcp/bootstrap-internal-token.mjs --component "$COMPONENT" --key "$KEY"
      - uses: google-github-actions/auth@v3
        if: inputs.apply
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        if: inputs.apply
      - name: Create nonexisting internal credential only
        if: inputs.apply
        env:
          COMPONENT: ${{ inputs.component }}
          KEY: ${{ inputs.key }}
        run: node scripts/gcp/bootstrap-internal-token.mjs --component "$COMPONENT" --key "$KEY" --apply
