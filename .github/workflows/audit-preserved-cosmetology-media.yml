name: Audit preserved cosmetology media
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/gcp/audit-preserved-cosmetology-media.mjs'
      - 'scripts/gcp/audit-preserved-cosmetology-media.test.mjs'
      - '.github/workflows/audit-preserved-cosmetology-media.yml'
      - 'scripts/gcp/transcribe-preserved-cosmetology-media.mjs'
      - 'scripts/gcp/transcribe-preserved-cosmetology-media.test.mjs'
      - 'scripts/gcp/repair-preserved-cosmetology-captions.mjs'
      - 'scripts/gcp/repair-preserved-cosmetology-captions.test.mjs'
      - 'scripts/gcp/repair-preserved-cosmetology-motion.mjs'
      - 'scripts/gcp/repair-preserved-cosmetology-motion.test.mjs'
permissions:
  contents: read
  actions: read
concurrency:
  group: audit-preserved-cosmetology-media
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/gcp/audit-preserved-cosmetology-media.test.mjs
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg tesseract-ocr
      - name: Measure exact preserved private film without modifying course records
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/gcp/audit-preserved-cosmetology-media.mjs
      - name: Reuse independently measured speech from the exact preserved recording
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 40681941351
          name: preserved-cosmetology-media-evidence
          path: measured-speech-checkpoint
      - name: Verify immutable measured speech checkpoint before reuse
        run: |
          echo '1f02fae170c09a6380a71dc37cddb10a5f21a40e45eaacd5c240409784062bc3  measured-speech-checkpoint/narration-evidence.json' | sha256sum -c -
          cp measured-speech-checkpoint/narration-evidence.json preserved-media-audit/narration-evidence.json
      - name: Build isolated caption-only candidate using measured speech
        run: |
          node --test scripts/gcp/repair-preserved-cosmetology-captions.test.mjs
          node scripts/gcp/repair-preserved-cosmetology-captions.mjs
      - name: Build bounded licensed-motion repair candidate without updating LMS
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node --test scripts/gcp/repair-preserved-cosmetology-motion.test.mjs
          node scripts/gcp/repair-preserved-cosmetology-motion.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preserved-cosmetology-media-evidence
          path: |
            preserved-media-audit/*.*
            preserved-media-audit/motion/measured-captions.*
          retention-days: 30
          if-no-files-found: error
