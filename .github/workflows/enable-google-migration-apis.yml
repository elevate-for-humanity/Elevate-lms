name: Enable Google migration foundation APIs
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: google-runtime-operations
  cancel-in-progress: false
jobs:
  enable:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        with: {skip_install: true}
      - run: node scripts/gcp/verify-sdk.mjs
      - name: Enable configuration, scheduling and billing inspection APIs
        run: gcloud services enable secretmanager.googleapis.com cloudscheduler.googleapis.com cloudbilling.googleapis.com --project=elegant-racer-299721 --quiet
      - name: Verify enabled API state
        run: |
          node --input-type=module <<'NODE'
          import { google, PROJECT } from './scripts/gcp/runtime-config.mjs';
          const enabled = new Set(JSON.parse(google(['services','list','--enabled','--project',PROJECT,'--format=json'])).map(s=>s.config?.name));
          for (const service of ['secretmanager.googleapis.com','cloudscheduler.googleapis.com','cloudbilling.googleapis.com']) {
            if (!enabled.has(service)) throw new Error('Required Google foundation API remains disabled');
          }
          console.log('Secret Manager, Cloud Scheduler and Cloud Billing APIs are enabled. Billing account assignment, plan, payment settings and IAM are unchanged.');
          NODE
      - name: Read linked billing metadata after enabling the API
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { inspectProjectBilling } from './scripts/gcp/preflight-isolated-workloads.mjs';
          const token = execFileSync('gcloud', ['auth', 'print-access-token'], {encoding: 'utf8', timeout: 30000, stdio: ['ignore', 'pipe', 'pipe']}).trim();
          const report = await inspectProjectBilling(token);
          console.log(JSON.stringify(report));
          if (report.reads.some(read => read.httpStatus !== 200)) process.exitCode = 1;
          NODE
