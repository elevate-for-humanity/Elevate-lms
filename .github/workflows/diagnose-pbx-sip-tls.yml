name: Diagnose PBX SIP TLS without changing routing
on:
  push:
    branches: [main]
    paths: ['scripts/gcp/probe-paris-audiosocket.py', 'scripts/gcp/probe-paris-local-media.py', 'scripts/gcp/audit-live-phone-configuration.py', 'scripts/gcp/audit-paris-call-signals.py', 'scripts/gcp/diagnose-pbx-sip-tls.py', '.github/workflows/diagnose-pbx-sip-tls.yml']
  workflow_dispatch:
    inputs:
      local_audiosocket_probe:
        description: Exercise owned loopback TCP audio channels without dialing
        type: boolean
        default: false
      local_media_probe:
        description: Exercise temporary owned loopback media channels without dialing
        type: boolean
        default: false
permissions: {contents: read, actions: write, id-token: write}
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'google-pbx-infrastructure' || format('paris-diagnostics-{0}', github.ref) }}
  cancel-in-progress: false
jobs:
  dispatch:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - env: {GH_TOKEN: '${{ github.token }}'}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/diagnose-pbx-sip-tls.yml/dispatches" -f ref=main
  diagnose:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        with: {skip_install: true}
      - name: Read transport listener and handshake evidence
        run: gcloud compute ssh elevate-pbx --project=elegant-racer-299721 --zone=us-central1-a --quiet --command='sudo python3 -' < scripts/gcp/diagnose-pbx-sip-tls.py
      - name: Exercise and clean up temporary private loopback media channels without dialing
        if: inputs.local_media_probe
        run: gcloud compute ssh elevate-pbx --project=elegant-racer-299721 --zone=us-central1-a --quiet --command='sudo python3 -' < scripts/gcp/probe-paris-local-media.py
      - name: Verify private TCP media with synthetic audio and clean up owned channels
        if: inputs.local_audiosocket_probe
        run: gcloud compute ssh elevate-pbx --project=elegant-racer-299721 --zone=us-central1-a --quiet --command='sudo python3 -' < scripts/gcp/probe-paris-audiosocket.py
      - name: Read redacted recent media failure reasons
        run: gcloud compute ssh elevate-pbx --project=elegant-racer-299721 --zone=us-central1-a --quiet --command='sudo python3 -' < scripts/gcp/audit-paris-call-signals.py
      - name: Verify the exact deployed private HTTPS greeting helper
        run: gcloud compute ssh elevate-pbx --project=elegant-racer-299721 --zone=us-central1-a --quiet --command='sudo python3 -' < scripts/gcp/audit-live-phone-configuration.py
