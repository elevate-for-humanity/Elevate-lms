name: Pin Next 15.5.15

on:
  push:
    branches:
      - fix/northflank-admin-webpack-20260815
    paths:
      - '.github/workflows/pin-next-15-5-15.yml'

permissions:
  contents: write

jobs:
  pin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/northflank-admin-webpack-20260815
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore proven Next.js runtime
        run: |
          python3 - <<'PY'
          import json
          files = ['package.json','apps/admin/package.json','apps/lms/package.json','apps/marketing/package.json']
          for file in files:
              with open(file, encoding='utf-8') as f:
                  pkg = json.load(f)
              if 'next' in pkg.get('dependencies', {}):
                  pkg['dependencies']['next'] = '15.5.15'
              with open(file, 'w', encoding='utf-8') as f:
                  json.dump(pkg, f, indent=2)
                  f.write('\n')
          PY
      - name: Regenerate frozen lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile --strict-peer-dependencies=false
      - name: Commit stable dependency graph
        run: |
          git config user.name elevate-production-recovery
          git config user.email actions@users.noreply.github.com
          git add package.json apps/admin/package.json apps/lms/package.json apps/marketing/package.json pnpm-lock.yaml
          git commit -m 'fix(deps): restore proven Next.js 15.5.15 runtime'
          git push origin HEAD:fix/northflank-admin-webpack-20260815
