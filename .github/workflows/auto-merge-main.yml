name: Enable auto-merge for main
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, edited, converted_to_draft]

permissions: {}

concurrency:
  group: enable-main-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enable:
    if: >-
      ${{ github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Use a repository-scoped App without branch-rule bypass. Its merges emit
      # the normal main push events that drive CI and the production workflows.
      # This job never checks out the pull request or evaluates its contents.
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.AUTO_MERGE_APP_ID }}
          private-key: ${{ secrets.AUTO_MERGE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: Disable auto-merge when a PR leaves main or becomes ineligible
        if: ${{ github.event.pull_request.base.ref != 'main' || github.event.pull_request.draft || github.event.pull_request.head.ref == 'staging' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          armed=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json autoMergeRequest --jq '.autoMergeRequest != null')
          if [[ "$armed" == true ]]; then
            gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --disable-auto
          fi
      - name: Request squash auto-merge through the existing branch rules
        if: ${{ github.event.pull_request.base.ref == 'main' && !github.event.pull_request.draft && github.event.pull_request.head.ref != 'staging' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # Event contexts can be stale when a maintainer edits the PR base.
          # Recheck the live target and head before requesting auto-merge.
          live=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json baseRefName,headRefOid,isDraft)
          if [[ "$(jq -r '.baseRefName' <<<"$live")" != main ||
                "$(jq -r '.headRefOid' <<<"$live")" != "$PR_HEAD" ||
                "$(jq -r '.isDraft' <<<"$live")" != false ]]; then
            echo "PR target/head/draft changed; leave auto-merge disabled"
            exit 0
          fi
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash --match-head-commit "$PR_HEAD"
