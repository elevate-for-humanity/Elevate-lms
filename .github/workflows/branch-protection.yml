name: Branch Protection & Cleanup

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/branch-protection.yml'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: branch-protection-cleanup
  cancel-in-progress: false

jobs:
  one-time-full-cleanup:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[cleanup-all-stale-branches]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch all remote refs
        run: git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Guard against active pull requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          open_count=$(gh pr list --state open --limit 100 --json number --jq 'length')
          echo "Open pull requests: $open_count"
          test "$open_count" -eq 0 || {
            echo 'Refusing full cleanup while an open pull request exists.'
            exit 1
          }

      - name: Side-by-side branch audit
        run: |
          set -euo pipefail
          {
            echo '## Full branch cleanup audit'
            echo
            echo '| Branch | Ahead of main | Behind main | Latest commit |'
            echo '|---|---:|---:|---|'
          } >> "$GITHUB_STEP_SUMMARY"

          mapfile -t branches < <(
            git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin \
              | grep -v '^HEAD$' \
              | grep -v '^main$' \
              | sort
          )

          for branch in "${branches[@]}"; do
            read -r behind ahead < <(git rev-list --left-right --count "origin/main...origin/${branch}")
            latest=$(git log -1 --format='%h %cs' "origin/${branch}")
            printf '| `%s` | %s | %s | %s |\n' "$branch" "$ahead" "$behind" "$latest" >> "$GITHUB_STEP_SUMMARY"
          done

          echo "AUDITED_BRANCH_COUNT=${#branches[@]}" >> "$GITHUB_ENV"

      - name: Bulk delete every non-main branch
        run: |
          set -u
          mapfile -t branches < <(
            git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin \
              | grep -v '^HEAD$' \
              | grep -v '^main$' \
              | sort
          )

          if [ "${#branches[@]}" -eq 0 ]; then
            echo 'No non-main branches remain.'
            exit 0
          fi

          echo "Deleting ${#branches[@]} non-main branches in one ref update batch."
          git push origin --delete "${branches[@]}" || true

          # Retry any refs GitHub refused in the batch, but never abort the whole sweep.
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          mapfile -t remaining < <(
            git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin \
              | grep -v '^HEAD$' \
              | grep -v '^main$' \
              | sort
          )

          for branch in "${remaining[@]}"; do
            echo "Retrying deletion: $branch"
            git push origin --delete "$branch" || echo "GitHub refused deletion of $branch"
          done

      - name: Verify canonical branch set
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          mapfile -t remaining < <(
            git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin \
              | grep -v '^HEAD$' \
              | grep -v '^main$' \
              | sort
          )

          {
            echo
            echo "Audited before cleanup: ${AUDITED_BRANCH_COUNT:-unknown}"
            echo "Remaining non-main branches: ${#remaining[@]}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${#remaining[@]}" -gt 0 ]; then
            printf 'Remaining: %s\n' "${remaining[@]}"
            exit 1
          fi

          echo 'Branch cleanup complete: main is the only remote branch.'

  scheduled-stale-cleanup:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete branches older than 30 days
        run: |
          set -u
          git fetch --all --prune

          for branch in $(git branch -r | grep -v 'main\|HEAD\|dependabot'); do
            branch_name=$(echo "$branch" | sed 's#origin/##')
            last_commit=$(git log -1 --format=%ct "origin/$branch_name")
            current_time=$(date +%s)
            days_old=$(( (current_time - last_commit) / 86400 ))

            if [ "$days_old" -gt 30 ]; then
              echo "Deleting stale branch: $branch_name (${days_old} days old)"
              git push origin --delete "$branch_name" || echo "Failed to delete $branch_name"
            fi
          done

      - name: Report cleanup
        run: |
          echo 'Branch cleanup complete.'
          git branch -r | grep -v 'main\|HEAD' | wc -l | xargs echo 'Remaining branches:'
