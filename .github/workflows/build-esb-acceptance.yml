name: Build ESB Course Acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/course-factory/build-esb-acceptance.ts'
      - '.github/workflows/build-esb-acceptance.yml'
      - 'lib/curriculum/blueprints/entrepreneurship.ts'
      - 'lib/curriculum/lesson-content-schema.ts'
      - 'lib/curriculum/normalize-lesson-content.ts'
      - 'lib/course-factory/**'
      - 'lib/course-builder/video-queue.ts'
      - 'lib/video/job-queue.ts'
      - 'lib/video/edge-tts.ts'
      - 'lib/video/process-video-job.ts'
      - 'lib/video/remotion-render.ts'
      - 'components/lms/CommercialLessonExperience.tsx'
      - 'components/lms/LessonContentRenderer.tsx'
      - 'apps/lms/app/lms/courses/**'
      - 'apps/admin/app/api/internal/videos/process-queue/route.ts'
      - 'supabase/migrations/20260820121500_harden_course_publish_completeness_gate.sql'
      - 'supabase/migrations/20260820174500_course_factory_experience_assets.sql'
      - 'supabase/migrations/20260820175500_course_factory_asset_trigger_idempotent.sql'
      - 'supabase/migrations/20260820181000_course_microvideo_jobs.sql'
      - 'supabase/migrations/20260820182500_course_domain_readiness.sql'
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

env:
  CI: true
  NODE_ENV: production
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  NODE_OPTIONS: --conditions=react-server

jobs:
  build-audit-publish:
    if: github.event_name != 'issues' || github.event.issue.title == 'RUN ESB COURSE BUILDER ACCEPTANCE'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: esb-course-builder-production-acceptance
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          clean: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile --strict-peer-dependencies=false

      - name: Require production Course Factory credentials
        shell: bash
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          if [ -z "$OPENAI_API_KEY" ] && [ -z "$GROQ_API_KEY" ] && [ -z "$GEMINI_API_KEY" ] && [ -z "$ANTHROPIC_API_KEY" ]; then
            echo 'At least one AI provider credential is required.'
            exit 1
          fi

      - name: Build, audit, render full media package, and publish Entrepreneurship course
        id: acceptance
        shell: bash
        run: |
          set +e
          pnpm tsx scripts/course-factory/build-esb-acceptance.ts > /tmp/esb-acceptance.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          tail -n 240 /tmp/esb-acceptance.log > /tmp/esb-acceptance-tail.log
          exit 0

      - name: Post result to issue 703
        if: always()
        uses: actions/github-script@v7
        env:
          EXIT_CODE: ${{ steps.acceptance.outputs.exit_code }}
        with:
          script: |
            const fs = require('fs');
            const code = process.env.EXIT_CODE || '1';
            const ok = code === '0';
            const tail = fs.existsSync('/tmp/esb-acceptance-tail.log')
              ? fs.readFileSync('/tmp/esb-acceptance-tail.log', 'utf8').slice(-24000)
              : 'Acceptance command did not produce a log.';
            const body = `${ok ? 'ESB ACCEPTANCE PASS' : 'ESB ACCEPTANCE FAIL'}\n\nCommit: ${context.sha}\nExit code: ${code}\n\n\`\`\`text\n${tail}\n\`\`\``;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 703,
              body,
            });

      - name: Fail workflow when acceptance failed
        if: steps.acceptance.outputs.exit_code != '0'
        run: exit 1
