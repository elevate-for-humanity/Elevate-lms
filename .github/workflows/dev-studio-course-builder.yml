name: Dev Studio Course Builder Control Plane

on:
  push:
    branches: [main]
    paths: [.github/workflows/dev-studio-course-builder.yml]
  issues:
    types: [edited]
  workflow_dispatch:
    inputs:
      program:
        description: Course package to build through Dev Studio -> Course Builder
        required: true
        type: string
        default: business-administration

permissions:
  contents: read
  issues: write

env:
  CI: true
  NODE_ENV: production
  AI_CIRCUIT_RECOVERY_WAIT: '1'
  AI_PROVIDER: cloudflare
  SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GOOGLE_CLOUD_API_KEY: ${{ secrets.GOOGLE_CLOUD_API_KEY }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_AI_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_API_TOKEN }}
  CLOUDFLARE_AI_MODEL: '@cf/meta/llama-4-scout-17b-16e-instruct'
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
  ADMIN_URL: ${{ secrets.ADMIN_URL }}
  CRON_SECRET: ${{ secrets.CRON_SECRET }}

jobs:
  hvac-one-lesson-canary:
    if: (github.event_name == 'issues' && github.event.issue.number == 1041 && github.event.issue.title == 'RUN HVAC ONE LESSON VIDEO CANARY') || (github.event_name == 'push' && github.event.head_commit.message == 'run(hvac): execute approved one-lesson canary 1041')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
    env:
      ADMIN_URL: ${{ secrets.ADMIN_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      HVAC_COURSE_ID: f0593164-55be-5867-98e7-8a86770a8dd0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          clean: true

      - name: Record exact canary revision
        id: tested
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate bounded Cloudflare canary configuration
        shell: bash
        run: |
          test -n "$ADMIN_URL"
          test -n "$CRON_SECRET"
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -f .github/COURSE_MEDIA_PAUSED
          grep -q "DEFAULT_CLOUDFLARE_TTS_MODEL" lib/video/edge-tts.ts
          grep -q "no provider bypass was attempted" lib/video/edge-tts.ts

      - name: Render exactly one paused-mode HVAC lesson
        id: canary
        shell: bash
        run: |
          response=$(curl --fail-with-body --silent --show-error \
            --max-time 1800 \
            -X POST "${ADMIN_URL%/}/api/internal/videos/process-queue" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            --data "{\"courseId\":\"$HVAC_COURSE_ID\",\"maxJobs\":1,\"queueOneDraft\":true}")
          printf '%s\n' "$response"
          test "$(jq -r '.started' <<<"$response")" = "1"
          test "$(jq -r '.jobs | length' <<<"$response")" = "1"
          job_id=$(jq -r '.jobs[0].jobId' <<<"$response")
          lesson_id=$(jq -r '.jobs[0].lessonId' <<<"$response")
          test -n "$job_id"
          test -n "$lesson_id"
          echo "job_id=$job_id" >> "$GITHUB_OUTPUT"
          echo "lesson_id=$lesson_id" >> "$GITHUB_OUTPUT"

      - name: Verify persisted video and playback
        id: verify
        shell: bash
        run: |
          api="${SUPABASE_URL%/}/rest/v1/video_jobs?id=eq.${{ steps.canary.outputs.job_id }}&select=id,lesson_id,lesson_title,status,video_url,duration_seconds,last_provider,last_provider_model,scene_count,review_status,error_message"
          record=$(curl --fail-with-body --silent --show-error "$api" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" | jq -c '.[0]')
          test "$(jq -r '.status' <<<"$record")" = "complete"
          test "$(jq -r '.review_status' <<<"$record")" = "approved"
          video_url=$(jq -r '.video_url' <<<"$record")
          test -n "$video_url"
          test "$video_url" != "null"
          content_type=$(curl --fail --silent --show-error --location --head "$video_url" | tr -d '\r' | awk -F': ' 'tolower($1)=="content-type"{print tolower($2); exit}')
          case "$content_type" in video/*) ;; *) echo "Unexpected content type: $content_type"; exit 1 ;; esac
          echo "record=$(printf '%s' "$record" | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Post canary evidence
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          TESTED_SHA: ${{ steps.tested.outputs.sha }}
          JOB_RECORD_B64: ${{ steps.verify.outputs.record }}
        with:
          script: |
            let record = {};
            try {
              record = JSON.parse(Buffer.from(process.env.JOB_RECORD_B64 || '', 'base64').toString('utf8') || '{}');
            } catch {}
            const body = [
              `HVAC ONE-LESSON VIDEO CANARY ${process.env.JOB_STATUS === 'success' ? 'PASS' : 'FAIL'}`,
              '',
              `Tested main SHA: ${process.env.TESTED_SHA || 'unknown'}`,
              `Lesson: ${record.lesson_title || 'unavailable'} (${record.lesson_id || '${{ steps.canary.outputs.lesson_id }}' || 'unavailable'})`,
              `Job: ${record.id || '${{ steps.canary.outputs.job_id }}' || 'unavailable'}`,
              `Provider/model: ${record.last_provider || 'unavailable'} / ${record.last_provider_model || 'unavailable'}`,
              `Duration/scenes: ${record.duration_seconds ?? 'unavailable'}s / ${record.scene_count ?? 'unavailable'}`,
              `Review: ${record.review_status || 'unavailable'}`,
              `Video: ${record.video_url || 'unavailable'}`,
              record.error_message ? `Error: ${record.error_message}` : '',
              '',
              'Bulk GPU generation remained paused. The HVAC course was not published by this canary.',
            ].filter(Boolean).join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1041,
              body,
            });

  dev-studio-course-builder:
    if: >-
      github.event_name != 'issues' ||
      github.event.issue.title == 'RUN BUSINESS COURSE BUILDER ACCEPTANCE' ||
      github.event.issue.title == 'RUN ESB COURSE BUILDER ACCEPTANCE' ||
      github.event.issue.title == 'RUN HVAC COURSE BUILDER ACCEPTANCE' ||
      github.event.issue.title == 'RUN BARBER COURSE BUILDER ACCEPTANCE' ||
      github.event.issue.title == 'RUN COSMETOLOGY COURSE BUILDER ACCEPTANCE' ||
      github.event.issue.title == 'RUN COSMETOLOGY UNIFIED COURSE REBUILD'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: dev-studio-course-builder-${{ github.event_name == 'workflow_dispatch' && inputs.program || github.event.issue.title || 'push' }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          clean: true

      - name: Record canonical control-plane revision
        id: tested
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          test -f lib/devstudio/course-builder-controller.ts

      - name: Post Dev Studio start evidence
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        env:
          TESTED_SHA: ${{ steps.tested.outputs.sha }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `DEV STUDIO -> COURSE BUILDER STARTED\n\nExact checked-out main SHA: ${process.env.TESTED_SHA}`,
            });

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies deterministically
        run: pnpm install --frozen-lockfile --strict-peer-dependencies=false

      - name: Enforce Studio as control plane and Course Builder as orchestration authority
        run: |
          node scripts/check-course-factory-authority.mjs
          node scripts/check-studio-architecture.mjs
          node scripts/audit-course-builder-procurement.mjs
          pnpm typecheck:studio
          pnpm exec eslint lib/devstudio/course-builder-controller.ts lib/course-builder lib/course-factory --quiet
          pnpm exec vitest run tests/unit/course-factory/lesson-contract-normalization.test.ts

      - name: Require production persistence and canonical Cloudflare Workers AI
        shell: bash
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test "$AI_PROVIDER" = "cloudflare"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_AI_API_TOKEN"
          case "$CLOUDFLARE_AI_MODEL" in
            @cf/*) ;;
            *) exit 1 ;;
          esac

      - name: Resolve requested package
        id: target
        shell: bash
        run: |
          target="business-administration"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            target="${{ inputs.program }}"
          elif [ "${{ github.event_name }}" = "issues" ] && [ "${{ github.event.issue.title }}" = "RUN ESB COURSE BUILDER ACCEPTANCE" ]; then
            target="esb"
          fi
          if [ "${{ github.event_name }}" = "issues" ] && [ "${{ github.event.issue.title }}" = "RUN HVAC COURSE BUILDER ACCEPTANCE" ]; then
            target="hvac-technician"
          elif [ "${{ github.event_name }}" = "issues" ] && [ "${{ github.event.issue.title }}" = "RUN BARBER COURSE BUILDER ACCEPTANCE" ]; then
            target="barber-apprenticeship"
          elif [ "${{ github.event_name }}" = "issues" ] && { [ "${{ github.event.issue.title }}" = "RUN COSMETOLOGY COURSE BUILDER ACCEPTANCE" ] || [ "${{ github.event.issue.title }}" = "RUN COSMETOLOGY UNIFIED COURSE REBUILD" ]; }; then
            target="cosmetology-apprenticeship"
          fi
          echo "program=$target" >> "$GITHUB_OUTPUT"

      - name: Authorize one-time ESB media run for issue 923
        if: github.event_name == 'issues' && github.event.issue.number == 923 && github.event.issue.title == 'RUN ESB COURSE BUILDER ACCEPTANCE'
        shell: bash
        run: rm -f .github/COURSE_MEDIA_PAUSED

      - name: Build through canonical Dev Studio controlled Course Builder
        env:
          NODE_OPTIONS: --conditions=react-server
        shell: bash
        run: |
          if [ "${{ steps.target.outputs.program }}" = "esb" ]; then
            pnpm tsx scripts/course-factory/build-esb-acceptance.ts
          elif [ "${{ steps.target.outputs.program }}" = "hvac-technician" ]; then
            # Rebuild the canonical authored source first so Course Builder never
            # republishes stale refrigerant classifications or static penalty data.
            pnpm tsx scripts/backfill-hvac-script-text.ts --force
            pnpm tsx scripts/course-builder/run.ts --course hvac-technician --mode refresh
            pnpm tsx scripts/check-hvac-content.ts
          elif [ "${{ steps.target.outputs.program }}" = "business-administration" ]; then
            pnpm tsx scripts/course-factory/build-business-program.ts
          else
            if [ "${{ github.event_name }}" = "issues" ] && [ "${{ github.event.issue.number }}" = "1030" ] && [ "${{ steps.target.outputs.program }}" = "cosmetology-apprenticeship" ]; then
              pnpm tsx scripts/course-builder/requeue-course-media.ts --course cosmetology-apprenticeship
            else
              pnpm tsx scripts/course-builder/run.ts --course "${{ steps.target.outputs.program }}" --mode refresh
            fi
          fi

      - name: Verify Admin and LMS consumers after governed publication
        run: |
          pnpm exec eslint apps/admin/app/api/admin/course-builder apps/lms/app/lms/courses apps/lms/app/api/learner/interactions --quiet
          pnpm build:admin
          pnpm build:lms

      - name: Post Dev Studio completion evidence
        if: always() && github.event_name == 'issues'
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          TESTED_SHA: ${{ steps.tested.outputs.sha }}
          PROGRAM: ${{ steps.target.outputs.program }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `DEV STUDIO -> COURSE BUILDER ${process.env.JOB_STATUS === 'success' ? 'PASS' : 'FAIL'}\n\nProgram: ${process.env.PROGRAM || 'unresolved'}\nTested main SHA: ${process.env.TESTED_SHA || 'unknown'}`,
            });
