name: Recover obsolete CPU course execution
on:
  push:
    branches: [main]
    paths: ['.github/workflows/recover-obsolete-cpu-execution.yml']
  workflow_run:
    workflows: ['Deploy Google Course Builder on source changes']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
  id-token: write
concurrency:
  # Cancellation of one verified execution cannot change the worker template.
  # The queue coordinator observes its terminal state before launching work.
  group: recover-exact-course-execution-x7tbr
  cancel-in-progress: false
jobs:
  dispatch:
    if: github.event_name == 'push' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch exact incident recovery through trusted main identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          released='${{ github.event.workflow_run.head_sha || github.sha }}'
          [[ "$released" =~ ^[a-f0-9]{40}$ ]] || exit 1
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/c2c2723daaf42e6d81256c33fd6183951dc20fb6...$released" --jq .status)
          [[ "$status" == identical || "$status" == ahead ]] || exit 1
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/recover-obsolete-cpu-execution.yml/dispatches" -f ref=main
  recover:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        with:
          skip_install: true
      - run: node scripts/gcp/verify-sdk.mjs
      - name: Verify exact image and pause only the requested execution
        env:
          COURSE_EXECUTION: elevate-course-builder-x7tbr
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { assertNoActiveExecutions } from './scripts/gcp/execute-course-job.mjs';
          const name=process.env.COURSE_EXECUTION;
          if(!/^elevate-course-builder-[a-z0-9]+$/.test(name)) throw new Error('EXACT_EXECUTION_REQUIRED');
          const scope=['--project=elegant-racer-299721','--region=us-central1'];
          const call=args=>execFileSync('gcloud',args,{encoding:'utf8',stdio:['ignore','pipe','pipe']});
          const describe=()=>JSON.parse(call(['run','jobs','executions','describe',name,...scope,'--format=json']));
          const image='us-central1-docker.pkg.dev/elegant-racer-299721/elevate/ultimate-worker';
          const template=JSON.parse(call(['run','jobs','describe','elevate-course-builder',...scope,'--format=json']));
          // Use Google's actual pinned job image. A previously deployed SHA is not
          // an authoritative template identifier after a Google Cloud migration.
          const templateImage=template.spec?.template?.spec?.template?.spec?.containers?.[0]?.image;
          if(!(templateImage ?? '').startsWith(image+'@sha256:') || !/^[a-f0-9]{64}$/.test((templateImage ?? '').slice((image+'@sha256:').length)))
            throw new Error('GOOGLE_WORKER_TEMPLATE_NOT_PINNED');
          const execution=describe();
          const executionImage=execution.spec?.template?.spec?.containers?.[0]?.image;
          if(executionImage!==templateImage)
            throw new Error('EXECUTION_IMAGE_MISMATCH: historical execution differs from current approved Google job; manual review required');
          const active=run=>{try{assertNoActiveExecutions([run]);return false;}catch(error){if(error.message==='COURSE_JOB_ALREADY_ACTIVE')return true;throw error;}};
          if(active(describe())) call(['run','jobs','executions','cancel',name,...scope,'--quiet']);
          for(let attempt=0;attempt<60;attempt++) {
            const run=describe();
            if(!active(run)) { console.log(JSON.stringify({execution:name,terminal:true,status:run.status,checkpointsRetained:true})); process.exit(0); }
            await new Promise(resolve=>setTimeout(resolve,5000));
          }
          throw new Error('EXECUTION_STOP_NOT_CONFIRMED');
          NODE
