# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json

description: Elevate Course Factory production-boundary AI regression gate

prompts:
  - |
      {{request}}

providers:
  - file://./provider.ts

defaultTest:
  options:
    runSerially: true

tests:
  - description: lesson generation preserves the canonical structured contract
    vars:
      request: |
        {
          "operation": "lesson",
          "input": {
            "lessonTitle": "Barber Infection Control",
            "lessonSlug": "barber-infection-control",
            "moduleTitle": "Safety and Infection Control",
            "courseTitle": "Barber Apprenticeship",
            "state": "Indiana"
          }
        }
    assert:
      - type: is-json
        value:
          type: object
          additionalProperties: false
          required: [objective, learning_points, scenario, content, quiz_questions]
          properties:
            objective: { type: string, minLength: 1 }
            learning_points:
              type: array
              minItems: 3
              maxItems: 5
              items: { type: string, minLength: 1 }
            scenario: { type: string, minLength: 80 }
            content: { type: string, minLength: 500 }
            quiz_questions:
              type: array
              minItems: 1
              items:
                type: object
                additionalProperties: false
                required: [question, options, correct, explanation]
                properties:
                  question: { type: string, minLength: 1 }
                  options:
                    type: array
                    minItems: 4
                    maxItems: 4
                    items: { type: string, minLength: 1 }
                  correct: { type: integer, minimum: 0, maximum: 3 }
                  explanation: { type: string, minLength: 1 }
      - type: javascript
        value: |
          const data = JSON.parse(output);
          const storedContent = JSON.parse(data.content);
          return Boolean(
            storedContent.html &&
            storedContent.html.includes('<') &&
            Array.isArray(storedContent.learning_points) &&
            storedContent.learning_points.length >= 3 &&
            storedContent.scenario
          );
      - type: llm-rubric
        provider: file://./grader-provider.ts
        value: The lesson is job-ready, specifically about barber infection control, and does not invent unrelated regulatory claims.

  - description: assessment generation returns bounded answer choices and indexes
    vars:
      request: |
        {
          "operation": "assessment",
          "input": {
            "lessonSlug": "barber-infection-control",
            "lessonTitle": "Barber Infection Control",
            "moduleTitle": "Safety and Infection Control",
            "courseTitle": "Barber Apprenticeship",
            "questionCount": 4
          }
        }
    assert:
      - type: is-json
        value:
          type: object
          additionalProperties: false
          required: [questions]
          properties:
            questions:
              type: array
              minItems: 4
              maxItems: 4
              items:
                type: object
                additionalProperties: false
                required: [question, options, correct, explanation]
                properties:
                  question: { type: string, minLength: 1 }
                  options:
                    type: array
                    minItems: 4
                    maxItems: 4
                    items: { type: string, minLength: 1 }
                  correct: { type: integer, minimum: 0, maximum: 3 }
                  explanation: { type: string, minLength: 1 }
      - type: javascript
        value: |
          const data = JSON.parse(output);
          return data.questions.every((q) => Number.isInteger(q.correct) && q.correct >= 0 && q.correct <= 3 && q.options.length === 4);

  - description: blueprint generation preserves canonical module lesson shape
    vars:
      request: |
        {
          "operation": "blueprint",
          "input": {
            "title": "Barber Safety Fundamentals",
            "topic": "barber workplace safety and infection control",
            "audience": "barber apprentices",
            "state": "Indiana",
            "moduleCount": 2,
            "lessonsPerModule": 2
          }
        }
    assert:
      - type: is-json
        value:
          type: object
          additionalProperties: false
          required: [title, description, modules]
          properties:
            title: { type: string, minLength: 1 }
            description: { type: string, minLength: 1 }
            modules:
              type: array
              minItems: 2
              maxItems: 2
              items:
                type: object
                additionalProperties: false
                required: [title, description, lessons]
                properties:
                  title: { type: string, minLength: 1 }
                  description: { type: string, minLength: 1 }
                  lessons:
                    type: array
                    minItems: 2
                    maxItems: 2
                    items:
                      type: object
                      additionalProperties: false
                      required: [title, slug, stepType]
                      properties:
                        title: { type: string, minLength: 1 }
                        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
                        stepType:
                          type: string
                          enum: [lesson, checkpoint, quiz, exam, lab, assignment]
      - type: javascript
        value: |
          const data = JSON.parse(output);
          return data.modules.length === 2 && data.modules.every((m) => m.lessons.length === 2);

commandLineOptions:
  maxConcurrency: 1
  share: false
  cache: false
