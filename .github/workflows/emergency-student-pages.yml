name: Emergency Student Portal
on:
  push:
    branches: [main]
    paths:
      - 'public/emergency/**'
      - '.github/workflows/emergency-student-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: emergency-student-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public/emergency
      - id: deployment
        uses: actions/deploy-pages@v4
