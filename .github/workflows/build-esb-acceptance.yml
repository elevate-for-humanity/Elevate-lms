name: Build ESB Course Acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/course-factory/build-esb-acceptance.ts'
      - '.github/workflows/build-esb-acceptance.yml'
      - 'lib/ai/ai-service.ts'
      - 'lib/curriculum/blueprints/entrepreneurship.ts'
      - 'lib/curriculum/lesson-content-schema.ts'
      - 'lib/curriculum/normalize-lesson-content.ts'
      - 'lib/course-factory/**'
      - 'lib/course-builder/video-queue.ts'
      - 'lib/video/job-queue.ts'
      - 'lib/video/edge-tts.ts'
      - 'lib/video/process-video-job.ts'
      - 'lib/video/remotion-render.ts'
      - 'components/lms/CommercialLessonExperience.tsx'
      - 'components/lms/LessonContentRenderer.tsx'
      - 'apps/lms/app/lms/courses/**'
      - 'apps/admin/app/api/internal/videos/process-queue/route.ts'
      - 'supabase/migrations/20260820121500_harden_course_publish_completeness_gate.sql'
      - 'supabase/migrations/20260820174500_course_factory_experience_assets.sql'
      - 'supabase/migrations/20260820175500_course_factory_asset_trigger_idempotent.sql'
      - 'supabase/migrations/20260820181000_course_microvideo_jobs.sql'
      - 'supabase/migrations/20260820182500_course_domain_readiness.sql'
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

env:
  CI: true
  NODE_ENV: production
  AI_CIRCUIT_RECOVERY_WAIT: '1'
  SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

jobs:
  build-audit-publish:
    if: github.event_name != 'issues' || github.event.issue.title == 'RUN ESB COURSE BUILDER ACCEPTANCE'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: esb-course-builder-production-acceptance
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          clean: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies deterministically
        id: install
        shell: bash
        run: |
          set +e
          pnpm install --frozen-lockfile --strict-peer-dependencies=false > /tmp/esb-install.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          tail -n 160 /tmp/esb-install.log > /tmp/esb-install-tail.log || true
          exit 0

      - name: Require production Supabase credentials
        id: credentials
        shell: bash
        run: |
          set +e
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_SERVICE_ROLE_KEY"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build, audit, render full media package, and publish Entrepreneurship course
        id: acceptance
        if: steps.install.outputs.exit_code == '0' && steps.credentials.outputs.exit_code == '0'
        shell: bash
        env:
          NODE_OPTIONS: --conditions=react-server
        run: |
          set +e
          pnpm tsx scripts/course-factory/build-esb-acceptance.ts > /tmp/esb-acceptance.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          tail -n 240 /tmp/esb-acceptance.log > /tmp/esb-acceptance-tail.log || true
          exit 0

      - name: Post result to issue 703
        if: always()
        uses: actions/github-script@v7
        env:
          INSTALL_EXIT_CODE: ${{ steps.install.outputs.exit_code }}
          CREDENTIAL_EXIT_CODE: ${{ steps.credentials.outputs.exit_code }}
          ACCEPTANCE_EXIT_CODE: ${{ steps.acceptance.outputs.exit_code }}
        with:
          script: |
            const fs = require('fs');
            const installCode = process.env.INSTALL_EXIT_CODE || '1';
            const credentialCode = process.env.CREDENTIAL_EXIT_CODE || '1';
            const acceptanceCode = process.env.ACCEPTANCE_EXIT_CODE || 'not-run';
            const ok = installCode === '0' && credentialCode === '0' && acceptanceCode === '0';
            const installTail = fs.existsSync('/tmp/esb-install-tail.log')
              ? fs.readFileSync('/tmp/esb-install-tail.log', 'utf8').slice(-12000)
              : 'Install step did not produce a log.';
            const acceptanceTail = fs.existsSync('/tmp/esb-acceptance-tail.log')
              ? fs.readFileSync('/tmp/esb-acceptance-tail.log', 'utf8').slice(-24000)
              : 'Acceptance step did not run.';
            const body = `${ok ? 'ESB ACCEPTANCE PASS' : 'ESB ACCEPTANCE FAIL'}\n\nCommit: ${context.sha}\nInstall exit: ${installCode}\nCredential gate: ${credentialCode}\nAcceptance exit: ${acceptanceCode}\n\nINSTALL\n\`\`\`text\n${installTail}\n\`\`\`\n\nACCEPTANCE\n\`\`\`text\n${acceptanceTail}\n\`\`\``;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 703,
              body,
            });

      - name: Fail workflow when preflight or acceptance failed
        if: steps.install.outputs.exit_code != '0' || steps.credentials.outputs.exit_code != '0' || steps.acceptance.outputs.exit_code != '0'
        run: exit 1
