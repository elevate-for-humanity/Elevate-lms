name: Verify Elevate PBX domain (Durable DNS)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-domain:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 5
    steps:
      - name: Verify externally managed DNS and HTTPS
        shell: bash
        run: |
          set -euo pipefail
          host=phone.elevateforhumanity.org
          expected=107.178.216.162
          resolved="$(dig +short A "$host" | grep -E '^[0-9]+(\.[0-9]+){3}$' || true)"
          echo "A records: $resolved"
          if ! printf '%s\n' "$resolved" | grep -Fxq "$expected"; then
            echo "::error::Durable DNS A record for $host must point to $expected"
            exit 1
          fi
          echo "DNS verified. Checking TLS and HTTPS without modifying phone service."
          curl --silent --show-error --fail --max-time 15 --output /dev/null "https://$host/healthz"
