name: Activate existing private phone services
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/activate-private-phone-services.yml']
permissions:
  contents: read
  actions: write
  id-token: write
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'google-pbx-infrastructure' || format('phone-activation-{0}', github.ref) }}
  cancel-in-progress: false
jobs:
  dispatch:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/activate-private-phone-services.yml/dispatches" -f ref=main
  activate:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate active call guard and rollback
        run: python3 scripts/gcp/test-activate-private-phone.py
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        with:
          skip_install: true
      - name: Verify existing VM identity
        run: |
          set -euo pipefail
          test "$(gcloud compute instances describe elevate-pbx --project=elegant-racer-299721 --zone=us-central1-a --format='value(networkInterfaces[0].accessConfigs[0].natIP)')" = 107.178.216.162
      - name: Start existing private services with rollback on failed health
        run: |
          set -euo pipefail
          gcloud compute ssh elevate-pbx --project=elegant-racer-299721 --zone=us-central1-a --quiet --command='sudo python3 -' < scripts/gcp/activate-private-phone.py | tee phone-private-activation-evidence.json
      - name: Read actual capabilities after activation
        if: always()
        run: |
          gcloud compute ssh elevate-pbx --project=elegant-racer-299721 --zone=us-central1-a --quiet --command='sudo python3 -' < scripts/gcp/audit-pbx-runtime.py | tee phone-capability-evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: private-phone-activation
          path: phone-*-evidence.json
          retention-days: 14
