name: Retire authorized legacy phone and verify active ingress
on:
  workflow_dispatch:
  pull_request:
    paths: ['scripts/gcp/retire-legacy-phone*', 'scripts/gcp/audit-inbound-voicemail.py', '.github/workflows/retire-legacy-phone.yml']
  push:
    branches: [main]
    paths: ['scripts/gcp/retire-legacy-phone.mjs', 'scripts/gcp/audit-inbound-voicemail.py', '.github/workflows/retire-legacy-phone.yml']
permissions:
  contents: read
  actions: write
  id-token: write
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'google-pbx-infrastructure' || format('legacy-phone-checks-{0}', github.ref) }}
  cancel-in-progress: false
jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test scripts/gcp/retire-legacy-phone.test.mjs
      - run: python3 -m py_compile scripts/gcp/audit-inbound-voicemail.py
  dispatch:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/retire-legacy-phone.yml/dispatches" -f ref=main
  retire:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test scripts/gcp/retire-legacy-phone.test.mjs
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        with: {skip_install: true}
      - name: Release only the explicitly authorized legacy number and inspect active voice routing
        env:
          AUTHORIZED_LEGACY_PHONE_REMOVAL: '+13179999620'
        run: node scripts/gcp/retire-legacy-phone.mjs
      - name: Read live incoming dialplan and voicemail ingestion evidence
        if: always()
        run: |
          test "$(gcloud compute instances describe elevate-pbx --project=elegant-racer-299721 --zone=us-central1-a --format='value(networkInterfaces[0].accessConfigs[0].natIP)')" = 107.178.216.162
          gcloud compute ssh elevate-pbx --project=elegant-racer-299721 --zone=us-central1-a --quiet --command='sudo python3 -' < scripts/gcp/audit-inbound-voicemail.py
