name: Sync verified Admin GitHub token to Google
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sync-admin-github-token.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: write
  id-token: write
jobs:
  dispatch:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/$GITHUB_REPOSITORY/actions/workflows/sync-admin-github-token.yml/dispatches -f ref=main
  sync:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 25
    concurrency:
      group: google-runtime-us-central1
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify scoped credential synchronization contract
        run: node --test scripts/gcp/sync-admin-github-token.test.mjs
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        with: {skip_install: true}
      - name: Verify existing Admin credential and destination before writing
        run: node scripts/gcp/sync-admin-github-token.mjs
      - name: Replace stale literal with a verified numeric Google secret binding
        run: node scripts/gcp/sync-admin-github-token.mjs --apply
