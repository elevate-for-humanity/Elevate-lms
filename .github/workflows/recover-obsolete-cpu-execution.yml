name: Recover obsolete CPU course execution
on:
  workflow_dispatch:
    inputs:
      execution:
        description: Exact previously diagnosed central Course Builder execution; never starts a replacement
        required: true
        default: elevate-course-builder-x7tbr
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: recover-exact-course-execution
  cancel-in-progress: false
jobs:
  recover:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/gcp/recover-exact-course-execution.test.mjs
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        with:
          skip_install: true
      - run: node scripts/gcp/verify-sdk.mjs
      - name: Verify historical execution and preserve active image integrity
        env:
          COURSE_EXECUTION: ${{ inputs.execution }}
        run: node scripts/gcp/recover-exact-course-execution.mjs
