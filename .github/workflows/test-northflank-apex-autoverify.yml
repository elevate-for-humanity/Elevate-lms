name: Test Northflank apex auto-verification

on:
  push:
    branches:
      - diagnose/northflank-apex-20260922
    paths:
      - '.github/workflows/test-northflank-apex-autoverify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
      NORTHFLANK_TEAM_ID: ${{ secrets.NORTHFLANK_TEAM_ID || 'elevates-team' }}
    steps:
      - name: Request apex auto-verification
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NORTHFLANK_API_TOKEN"
          node <<'NODE'
          const base = 'https://api.northflank.com/v1';
          const token = process.env.NORTHFLANK_API_TOKEN;
          const team = process.env.NORTHFLANK_TEAM_ID;
          const domain = 'elevateforhumanity.org';
          const root = `/teams/${team}/domains/${encodeURIComponent(domain)}/subdomains`;

          async function request(path, init = {}) {
            const response = await fetch(base + path, {
              ...init,
              headers: {
                Authorization: `Bearer ${token}`,
                'Content-Type': 'application/json',
                ...(init.headers || {}),
              },
            });
            const text = await response.text();
            let body;
            try {
              body = text ? JSON.parse(text) : {};
            } catch {
              body = { raw: text.slice(0, 500) };
            }
            console.log(JSON.stringify({ status: response.status, body }, null, 2));
            if (!response.ok) {
              throw new Error(`Northflank ${response.status}: ${JSON.stringify(body)}`);
            }
            return body.data ?? body;
          }

          const current = await request(`${root}/%40`);
          const updated = await request(root, {
            method: 'PUT',
            body: JSON.stringify({
              name: '@',
              options: {
                tlsMode: current.options?.tlsMode ?? 'default',
                autoVerify: true,
              },
            }),
          });
          console.log(JSON.stringify({
            fullName: updated.fullName,
            verified: updated.verified,
            options: updated.options,
          }, null, 2));
          NODE
