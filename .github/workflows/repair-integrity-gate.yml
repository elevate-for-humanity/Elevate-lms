name: Repair Integrity Gate

on:
  push:
    paths:
      - '.github/workflows/repair-integrity-gate.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/integrity-public-ux
          fetch-depth: 1
      - name: Finalize remaining canonical hero literals
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/marketing/app/how-it-works/page.tsx')
          text = path.read_text()
          text = text.replace(
              'posterImage="/images/pages/how-it-works-hero.webp"',
              'posterImage={HOW_IT_WORKS_HERO}',
              1,
          )
          path.write_text(text)

          path = Path('apps/marketing/app/funding/page.tsx')
          text = path.read_text()
          text = text.replace(
              'src="/images/pages/funding-page-5.webp"',
              'src={FUNDING_HERO}',
              1,
          )
          path.write_text(text)
          PY

          git config user.name "elevateforhumanity"
          git config user.email "Elizabethpowell6262@gmail.com"
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/repair-integrity-gate.yml
          git add .github/workflows/repair-integrity-gate.yml \
                  apps/marketing/app/how-it-works/page.tsx \
                  apps/marketing/app/funding/page.tsx
          git diff --cached --check
          git commit -m "fix(integrity): remove final duplicate hero literals"
          git push origin HEAD:fix/integrity-public-ux
