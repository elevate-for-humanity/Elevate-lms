name: Database Backup

on:
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify backup configuration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "⚠️ Supabase secrets not configured. Database backup requires:"
            echo "   - SUPABASE_ACCESS_TOKEN"
            echo "   - SUPABASE_PROJECT_ID"
            echo "Add these secrets at: https://github.com/elevate-for-humanity/Elevate-lms/settings/secrets/actions"
            echo "Skipping backup for now."
            exit 0
          fi
          echo "Supabase backup configured."
