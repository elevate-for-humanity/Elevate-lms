name: Inspect existing PARIS App key
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-existing-paris-app-key.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: write
  id-token: write
jobs:
  dispatch:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch trusted main credential check
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/inspect-existing-paris-app-key.yml/dispatches" -f ref=main
  inspect:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 5
    steps:
      - name: Check existing App-key availability without exposing credentials
        env:
          AVAILABLE_SECRETS: ${{ toJSON(secrets) }}
        shell: bash
        run: |
          set +x
          node --input-type=module <<'NODE'
          import {createPrivateKey,sign} from 'node:crypto';
          const values=JSON.parse(process.env.AVAILABLE_SECRETS || '{}');
          const names=Object.keys(values).filter(name=>/GITHUB|PARIS|GH_APP/i.test(name) && /PRIVATE|PEM|APP_KEY/i.test(name));
          console.log(JSON.stringify({candidateSecretNames:names}));
          let matched=false;
          for(const name of names) {
            try {
              const pem=String(values[name]).replace(/\\n/g,'\n');
              const key=createPrivateKey(pem);
              if(key.asymmetricKeyType!=='rsa')continue;
              const enc=v=>Buffer.from(JSON.stringify(v)).toString('base64url');
              const now=Math.floor(Date.now()/1000);
              const data=enc({alg:'RS256',typ:'JWT'})+'.'+enc({iat:now-60,exp:now+300,iss:'5477907'});
              const jwt=data+'.'+sign('RSA-SHA256',Buffer.from(data),key).toString('base64url');
              const response=await fetch('https://api.github.com/app',{headers:{Authorization:'Bearer '+jwt,Accept:'application/vnd.github+json'},redirect:'error',signal:AbortSignal.timeout(15000)});
              if(!response.ok)continue;
              const app=await response.json();
              if(String(app.id)!=='5477907')continue;
              console.log(JSON.stringify({verifiedExistingAppKeySecret:name,appId:String(app.id)}));
              matched=true;
            } catch {}
          }
          if(!matched){console.error('PARIS_EXISTING_APP_KEY_NOT_AVAILABLE');process.exitCode=1;}
          NODE
