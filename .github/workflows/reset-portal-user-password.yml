name: Reset portal user password

on:
  workflow_dispatch:
    inputs:
      target_email:
        description: Existing Supabase Auth email
        required: true
        type: string
      expected_user_id:
        description: Expected Supabase Auth user ID
        required: true
        type: string
      confirmation:
        description: Type RESET-PORTAL-PASSWORD
        required: true
        type: string

permissions:
  contents: read

jobs:
  reset-and-verify:
    if: inputs.confirmation == 'RESET-PORTAL-PASSWORD'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_EMAIL: ${{ inputs.target_email }}
      EXPECTED_USER_ID: ${{ inputs.expected_user_id }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      LMS_SITE_URL: https://app.elevateforhumanity.org
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Reset password, verify sign-in, and email user
        run: pnpm exec tsx scripts/ops/reset-portal-user-password.ts
