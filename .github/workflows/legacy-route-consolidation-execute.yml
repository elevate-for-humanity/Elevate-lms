name: Execute Legacy Route Consolidation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/legacy-route-consolidation-execute.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: legacy-route-consolidation-execute
  cancel-in-progress: false

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Execute collision-safe migration
        run: node scripts/consolidate-legacy-routes.mjs --execute
      - name: Commit migrated routes to reconciliation branch
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="consolidate/legacy-routes-20260814"
          git config user.name "elevate-platform-bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/app apps/admin/app apps/lms/app
          if git diff --cached --quiet; then
            echo "No migratable route changes found"
            exit 0
          fi
          git checkout -B "$BRANCH"
          git commit -m "refactor(routes): migrate unique legacy APIs into canonical apps"
          git push --force-with-lease origin HEAD:"$BRANCH"
          echo "Migration branch pushed: $BRANCH"
