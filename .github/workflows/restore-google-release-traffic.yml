name: Restore verified automatic Google release traffic
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/restore-google-release-traffic.yml', 'scripts/gcp/restore-release-traffic.mjs']
permissions:
  contents: read
  actions: write
  id-token: write
concurrency:
  group: google-runtime-operations
  cancel-in-progress: false
jobs:
  dispatch:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/restore-google-release-traffic.yml/dispatches" -f ref=main
  restore:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        with:
          skip_install: true
      - run: node scripts/gcp/restore-release-traffic.mjs
