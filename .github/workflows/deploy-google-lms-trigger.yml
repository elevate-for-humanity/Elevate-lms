name: Deploy LMS automatically on Google
on:
  push:
    branches: [main]
    paths:
      - 'scripts/gcp/production-acceptance.*'
      - 'scripts/gcp/smoke-lms-container*'
      - 'scripts/build-memory-policy.*'
      - 'scripts/check-build-memory-policy.mjs'
      - 'scripts/run-bounded-build.*'
      - 'scripts/build-next-app.*'
      - 'scripts/container-build-policy.mjs'
      - 'public/**'
      - 'content/**'
      - 'config/**'
      - 'next.config.mjs'
      - 'tsconfig.json'
      - 'tsconfig.*.json'
      - '.dockerignore'
      - 'apps/admin/package.json'
      - 'apps/marketing/package.json'
      - '.github/workflows/deploy-google-repaired.yml'
      - 'apps/lms/**'
      - 'lib/**'
      - 'components/**'
      - 'styles/**'
      - 'packages/**'
      - 'Dockerfile.northflank-lms'
      - 'scripts/gcp/preflight-billing.mjs'
      - 'scripts/gcp/preflight-billing.test.mjs'
      - '.github/workflows/build-google-migration-images.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'scripts/gcp/activate-tested-public-revision.mjs'
      - '.github/workflows/deploy-google-lms-trigger.yml'
      - 'scripts/gcp/resolve-main-release*'
  workflow_dispatch:
    inputs:
      requested_sha:
        description: Exact main commit requested by a push dispatch
        required: false
        type: string
permissions:
  contents: read
  actions: write
  id-token: write
jobs:
  dispatch:
    if: vars.GOOGLE_RELEASE_HOLD != 'true' && (github.event_name == 'push')
    concurrency:
      group: google-lms-dispatch-main
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch Google-trusted release from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          [[ "$latest" =~ ^[a-f0-9]{40}$ ]]
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-google-lms-trigger.yml/dispatches" -f ref=main -f "inputs[requested_sha]=$latest"
  validate:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.release.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Resolve current main or hand off superseded release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ inputs.requested_sha }}
          RELEASE_WORKFLOW: deploy-google-lms-trigger.yml
        run: |
          node --test scripts/gcp/resolve-main-release.test.mjs
          node scripts/gcp/resolve-main-release.mjs
  build:
    needs: validate
    if: vars.GOOGLE_RELEASE_HOLD != 'true' && (needs.validate.outputs.ready == 'true')
    uses: ./.github/workflows/build-google-migration-images.yml
    with:
      component: lms
    secrets: inherit
  deploy:
    if: vars.GOOGLE_RELEASE_HOLD != 'true'
    needs: build
    uses: ./.github/workflows/deploy-google-repaired.yml
    with:
      component: lms
      image_sha: ${{ github.sha }}
      candidate_size: lms-2cpu-4gi
    secrets: inherit
  acceptance:
    needs: deploy
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && needs.deploy.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Explicitly hand the verified LMS release to production acceptance
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPTANCE_COMPONENT: lms
          ACCEPTANCE_SHA: ${{ github.sha }}
          ACCEPTANCE_RUN_ID: ${{ github.run_id }}
        run: |
          node --test scripts/gcp/production-acceptance.test.mjs
          node scripts/gcp/production-acceptance.mjs dispatch
