name: Deploy Studio Browser to Google
on:
  workflow_dispatch:
    inputs:
      image_sha:
        required: true
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: google-studio-browser
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Reconcile stateful Studio runtime
        env:
          IMAGE_SHA: ${{ inputs.image_sha }}
        run: node scripts/gcp/deploy-studio-browser.mjs
