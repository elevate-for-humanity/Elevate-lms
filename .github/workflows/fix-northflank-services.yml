name: Northflank Services Audit (supervised)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
  NORTHFLANK_TEAM_ID: ${{ secrets.NORTHFLANK_TEAM_ID || 'elevates-team' }}
  NORTHFLANK_PROJECT_ID: ${{ secrets.NORTHFLANK_PROJECT_ID || 'elevate-platform' }}

concurrency:
  group: northflank-services-audit
  cancel-in-progress: true

jobs:
  audit-services:
    name: Audit all 3 Northflank services
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies deterministically
        run: pnpm install --frozen-lockfile --strict-peer-dependencies=false

      - name: Require Northflank credentials
        run: |
          set -euo pipefail
          test -n "${NORTHFLANK_API_TOKEN:-}" || { echo '::error::NORTHFLANK_API_TOKEN is missing'; exit 1; }
          test -n "${NORTHFLANK_PROJECT_ID:-}" || { echo '::error::NORTHFLANK_PROJECT_ID is missing'; exit 1; }

      - name: Verify all service health-check contracts
        run: pnpm tsx scripts/northflank/verify-health-checks.ts --all

      - name: Verify public Marketing health
        run: |
          set -euo pipefail
          status=$(curl -sS --max-time 15 -o /tmp/mkt-health.json -w "%{http_code}" https://www.elevateforhumanity.org/api/health || true)
          test "$status" = "200" || { echo "::error::Marketing health returned HTTP $status"; cat /tmp/mkt-health.json || true; exit 1; }

      - name: Verify public Admin health
        run: |
          set -euo pipefail
          status=$(curl -sS --max-time 15 -o /tmp/admin-health.json -w "%{http_code}" https://admin.elevateforhumanity.org/api/health || true)
          test "$status" = "200" || { echo "::error::Admin health returned HTTP $status"; cat /tmp/admin-health.json || true; exit 1; }

      - name: Verify public LMS health
        run: |
          set -euo pipefail
          status=$(curl -sS --max-time 15 -o /tmp/lms-health.json -w "%{http_code}" https://app.elevateforhumanity.org/api/health || true)
          test "$status" = "200" || { echo "::error::LMS health returned HTTP $status"; cat /tmp/lms-health.json || true; exit 1; }

      - name: Recovery policy
        run: |
          echo 'Audit complete. This workflow does not mutate or restart production services.'
          echo 'Runtime configuration changes must be performed by the canonical supervised deployment path.'
