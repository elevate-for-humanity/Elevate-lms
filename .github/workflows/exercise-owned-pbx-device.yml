name: Repair and exercise approved operator device creation
on:
  workflow_dispatch:
  pull_request:
    paths: ['infra/pbx/provisioner/**', 'scripts/gcp/*provisioner-reload*', 'scripts/gcp/probe-operator-provisioning.py', 'scripts/gcp/test-operator-provisioning.py', '.github/workflows/exercise-owned-pbx-device.yml']
  push:
    branches: [main]
    paths: ['.github/workflows/exercise-owned-pbx-device.yml']
permissions:
  actions: write
  contents: read
  id-token: write
concurrency:
  group: google-pbx-infrastructure
  cancel-in-progress: false
  queue: max
jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test infra/pbx/provisioner/server.test.mjs
      - run: python3 scripts/gcp/test-provisioner-reload-repair.py
      - run: python3 scripts/gcp/test-operator-provisioning.py
  dispatch:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/exercise-owned-pbx-device.yml/dispatches" -f ref=main
  exercise:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        with:
          skip_install: true
      - name: Verify VM identity and readiness
        shell: bash
        run: |
          set -euo pipefail
          PROJECT=elegant-racer-299721
          ZONE=us-central1-a
          VM=elevate-pbx
          test "$(gcloud compute instances describe "$VM" --project="$PROJECT" --zone="$ZONE" --format='value(status)')" = RUNNING
          test "$(gcloud compute instances describe "$VM" --project="$PROJECT" --zone="$ZONE" --format='value(networkInterfaces[0].accessConfigs[0].natIP)')" = 107.178.216.162
      - name: Inspect actual serving application bindings without printing values
        run: |
          node --input-type=module <<'NODE'
          import {google,PROJECT} from './scripts/gcp/runtime-config.mjs';
          const keys={lms:['PBX_CONTROL_URL','PBX_PROVISIONING_TOKEN','PBX_TURN_URLS','PBX_TURN_SHARED_SECRET'],admin:['PBX_PROVISIONING_TOKEN','PBX_PHONE_SYSTEM_ID']};
          const read=args=>JSON.parse(google([...args,'--project',PROJECT,'--region','us-central1','--format=json']));
          for(const component of ['admin','lms']){
            const service=read(['run','services','describe','elevate-'+component+'-migration']);
            const names=[...new Set((service.status?.traffic||[]).filter(t=>t.percent>0).map(t=>t.revisionName))];
            if(!names.length)throw Error('Serving application revision unavailable');
            for(const name of names){
              const revision=read(['run','revisions','describe',name]);
              const env=new Map((revision.spec?.containers?.[0]?.env||[]).map(e=>[e.name,e]));
              const present=Object.fromEntries(keys[component].map(key=>[key,Boolean(env.get(key)?.value||env.get(key)?.valueFrom?.secretKeyRef)]));
              console.log(JSON.stringify({servingPhoneBindings:{component,revision:name,googleProvider:env.get('ELEVATE_RUNTIME_CONFIG_PROVIDER')?.value==='google-secret-manager',present}}));
            }
          }
          NODE
      - name: Upgrade only the idle provisioner with local rollback
        run: |
          set -euo pipefail
          node --test infra/pbx/provisioner/server.test.mjs
          python3 scripts/gcp/test-provisioner-reload-repair.py
          gcloud compute scp infra/pbx/provisioner/server.mjs "elevate-pbx:/tmp/elevate-provisioner-$GITHUB_SHA.mjs" --project=elegant-racer-299721 --zone=us-central1-a --quiet
          gcloud compute ssh elevate-pbx --project=elegant-racer-299721 --zone=us-central1-a --quiet \
            --command="sudo python3 - /tmp/elevate-provisioner-$GITHUB_SHA.mjs $GITHUB_SHA" < scripts/gcp/repair-pbx-provisioner-reload.py
      - name: Verify authenticated provisioning recovered before creating a device
        run: |
          set -euo pipefail
          gcloud compute ssh elevate-pbx --project=elegant-racer-299721 --zone=us-central1-a --quiet \
            --command='sudo python3 -' < scripts/gcp/probe-operator-provisioning.py
      - name: Create and revoke one temporary device for the approved operator
        run: |
          set -euo pipefail
          python3 scripts/gcp/test-operator-provisioning.py
          gcloud compute ssh elevate-pbx --project=elegant-racer-299721 --zone=us-central1-a --quiet \
            --command='sudo python3 - --exercise' < scripts/gcp/probe-operator-provisioning.py
