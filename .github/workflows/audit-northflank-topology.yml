name: Audit Northflank Topology

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  audit:
    if: startsWith(github.event.issue.title, '[NORTHFLANK TOPOLOGY AUDIT]')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
      NORTHFLANK_TEAM_ID: ${{ secrets.NORTHFLANK_TEAM_ID || 'elevates-team' }}
      WEB_PROJECT_ID: ${{ secrets.NORTHFLANK_PROJECT_ID || 'elevate-platform' }}
      GPU_PROJECT_ID: elevate-media-gpu
    steps:
      - name: Read Northflank topology
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$NORTHFLANK_API_TOKEN"
          auth=(-H "Authorization: Bearer ${NORTHFLANK_API_TOKEN}" -H 'Content-Type: application/json')
          api="https://api.northflank.com/v1/teams/${NORTHFLANK_TEAM_ID}/projects"
          for project in "$WEB_PROJECT_ID" "$GPU_PROJECT_ID"; do
            echo "===== PROJECT $project =====" >> /tmp/topology.txt
            for endpoint in services volumes secrets; do
              code=$(curl -sS -o "/tmp/${project}-${endpoint}.json" -w '%{http_code}' "${auth[@]}" "$api/$project/$endpoint" || true)
              echo "$endpoint http=$code" >> /tmp/topology.txt
              if [ "$code" = "200" ]; then
                PROJECT="$project" ENDPOINT="$endpoint" FILE="/tmp/${project}-${endpoint}.json" node <<'NODE' >> /tmp/topology.txt
          const fs=require('fs');
          const project=process.env.PROJECT, endpoint=process.env.ENDPOINT;
          const raw=JSON.parse(fs.readFileSync(process.env.FILE,'utf8'));
          const data=raw.data||raw;
          const arr=Array.isArray(data)?data:(data[endpoint]||[]);
          for (const x of arr) {
            if (endpoint==='services') {
              const env=x.runtimeEnvironment||x.environment||{};
              const gpu=x.deployment?.gpu||x.billing?.gpu||{};
              console.log(JSON.stringify({project,id:x.id||x.name,name:x.name,disabledCI:x.disabledCI,buildSource:x.buildSource,vcsProject:x.vcsData?.projectUrl,vcsBranch:x.vcsData?.projectBranch,instances:x.deployment?.instances??x.deployment?.spec?.instances,plan:x.billing?.deploymentPlan,buildPlan:x.billing?.buildPlan,gpu,buildStatus:x.status?.build?.status,deploymentStatus:x.status?.deployment?.status,ports:x.ports,envKeys:Object.keys(env).filter(k=>/GPU|VIDEO|MEDIA|SERVICE_ROLE|PORT/i.test(k))}));
            } else if (endpoint==='volumes') {
              console.log(JSON.stringify({project,id:x.id||x.name,name:x.name,status:x.status,storageMB:x.spec?.storageSize,storageClass:x.spec?.storageClassName,mounts:x.mounts}));
            } else {
              const restrictions=x.restrictions||{};
              const vars=x.secrets?.variables||x.variables||{};
              console.log(JSON.stringify({project,id:x.id||x.name,name:x.name,restricted:restrictions.restricted,nfObjects:restrictions.nfObjects,variableKeys:Object.keys(vars).filter(k=>/GPU|VIDEO|MEDIA|NORTHFLANK|SERVICE/i.test(k))}));
            }
          }
          NODE
              fi
            done
          done
      - name: Post audit
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            let out='No topology output.';
            try { out=fs.readFileSync('/tmp/topology.txt','utf8'); } catch {}
            if (out.length>60000) out=out.slice(0,60000)+'\n[truncated]';
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:`Northflank topology audit: **${{ job.status }}**\n\n\`\`\`text\n${out}\n\`\`\``});
