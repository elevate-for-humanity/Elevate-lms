name: Import existing Cloudflare AI settings from Northflank to Google
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  migrate-cloudflare:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/gcp/migrate-cloudflare-from-northflank.test.mjs
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        with:
          skip_install: true
      - name: Transfer only existing Cloudflare provider configuration
        env:
          NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/gcp/migrate-cloudflare-from-northflank.mjs
      - name: Explain remaining verification
        run: echo 'Configuration archived in Google Secret Manager. No Admin runtime, GPU or paid inference was activated. Verify Admin env binding and Workers AI reachability before changing AI_PROVIDER.'
