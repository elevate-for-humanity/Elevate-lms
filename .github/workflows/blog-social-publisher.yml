name: Blog Social Publisher

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

concurrency:
  group: blog-social-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Generate and publish queued blog content
        env:
          ADMIN_URL: ${{ secrets.ADMIN_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$ADMIN_URL"
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            -X POST "$ADMIN_URL/api/internal/social-media/process" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            --max-time 300
