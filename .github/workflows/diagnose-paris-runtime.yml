name: Diagnose PARIS production inference
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-paris-runtime.yml
      - scripts/gcp/diagnose-paris-runtime.mjs
      - scripts/gcp/diagnose-paris-runtime.test.mjs
permissions:
  contents: read
  id-token: write
concurrency:
  group: paris-runtime-diagnostics
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify diagnostic redaction and read-only contract
        run: node --test scripts/gcp/diagnose-paris-runtime.test.mjs
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        with: {skip_install: true}
      - name: Read bounded production inference failure evidence
        run: node scripts/gcp/diagnose-paris-runtime.mjs
