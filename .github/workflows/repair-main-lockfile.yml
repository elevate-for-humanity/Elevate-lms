name: Repair Main Lockfile

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/repair-main-lockfile.yml

permissions:
  contents: read

jobs:
  repair-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Regenerate lockfile from current package configuration
        run: pnpm install --lockfile-only --no-frozen-lockfile --strict-peer-dependencies=false

      - name: Verify frozen install accepts repaired lockfile
        run: pnpm install --frozen-lockfile --strict-peer-dependencies=false

      - name: Upload repaired lockfile
        uses: actions/upload-artifact@v4
        with:
          name: repaired-pnpm-lockfile
          path: pnpm-lock.yaml
          retention-days: 1
