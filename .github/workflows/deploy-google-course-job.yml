name: Deploy finite Google Course Builder job
on:
  workflow_dispatch:
    inputs:
      image_sha:
        description: Full SHA of successfully uploaded ultimate-worker image
        type: string
        required: true
permissions:
  contents: read
  id-token: write
concurrency:
  group: google-course-builder-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: node --test workers/worker-loop.test.mjs scripts/gcp/deploy-course-job.test.mjs
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Migrate worker configuration and deploy without executing
        env:
          IMAGE_SHA: ${{ inputs.image_sha }}
          NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
          NORTHFLANK_PROJECT_ID: ${{ secrets.NORTHFLANK_PROJECT_ID }}
        run: node scripts/gcp/deploy-course-job.mjs
