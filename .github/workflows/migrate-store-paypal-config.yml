name: Migrate verified Store PayPal configuration
on:
  pull_request:
    paths: ['scripts/gcp/migrate-store-paypal-config*', '.github/workflows/migrate-store-paypal-config.yml']
  workflow_dispatch:
    inputs:
      apply:
        description: 'Archive the verified existing PayPal family in Store config; no deployment or transactions'
        type: boolean
        default: false
      routing:
        description: 'Validate the exact deployed Store callback, or cut over the existing webhook after release acceptance'
        type: choice
        options: [none, validate, apply]
        default: none
      store_sha:
        description: 'Exact successfully deployed Store commit; defaults to current main'
        type: string
        required: false
      deployment_run_id:
        description: 'Exact Store deployment handoff; wait for this run to complete successfully'
        type: string
        required: false
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: google-store-config-preparation
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node --test scripts/gcp/migrate-store-paypal-config.test.mjs scripts/gcp/store-paypal-webhook-cutover.test.mjs scripts/gcp/verify-store-release-provenance.test.mjs scripts/gcp/prepare-store-config.test.mjs scripts/gcp/stage-web.test.mjs
  migrate:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Verify exact accepted Store deployment before callback acceptance or cutover
        if: inputs.routing != 'none' && inputs.routing != ''
        env:
          GH_TOKEN: ${{ github.token }}
          STORE_PAYPAL_EXPECTED_SHA: ${{ inputs.store_sha || github.sha }}
          STORE_PAYPAL_DEPLOYMENT_RUN_ID: ${{ inputs.deployment_run_id }}
        run: node scripts/gcp/verify-store-release-provenance.mjs
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        with: { skip_install: true }
      - name: Verify provider and prepare the existing Store secret without changing live billing
        env:
          STORE_PAYPAL_APPLY: ${{ inputs.apply == true && 'true' || 'false' }}
          STORE_PAYPAL_EXPECTED_SHA: ${{ inputs.store_sha || github.sha }}
          STORE_PAYPAL_ROUTE_MODE: ${{ inputs.routing || 'none' }}
          GOOGLE_RELEASE_HOLD: ${{ vars.GOOGLE_RELEASE_HOLD }}
        run: node scripts/gcp/migrate-store-paypal-config.mjs
