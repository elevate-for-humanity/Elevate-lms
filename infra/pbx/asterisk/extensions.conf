[general]
static=yes
writeprotect=yes

[internal]
; Operator 0 is a single-digit extension and does not match _X.
; The operator route lives in elevate-operator.conf (managed by the owned
; voicemail configuration flow): ring the operator's PWA devices, fall back
; to the owner's cellular line when configured, then voicemail.
exten => 0,1,Gosub(elevate-operator,s,1)
 same => n,Hangup()

; Extension-to-extension calls remain on Elevate infrastructure.
exten => _X.,1,NoOp(Elevate internal call to ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},30)
 same => n,VoiceMail(${EXTEN}@elevate,u)
 same => n,Hangup()

[pstn-out]
; E.164 destinations are the only calls eligible for the carrier trunk.
exten => _+X.,1,NoOp(External PSTN call)
 same => n,Dial(PJSIP/${EXTEN}@twilio,60)
 same => n,Hangup()

[pstn-in]
; Traditional public-number calls enter Elevate here, then route internally.
exten => _X.,1,Goto(internal,0,1)

; Provisioner-generated PWA device dialplan (elevate-pwa-extensions).
#include elevate-webrtc/current/extensions.conf
; PARIS inbound context for the Twilio trunk endpoint (elevate-paris-inbound).
#include elevate-paris-inbound.conf
; Managed operator route: PWA ring, cellular fallback, voicemail.
#include elevate-operator.conf

