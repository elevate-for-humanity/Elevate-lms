name: Controlled Video Acceptance

# Paid production acceptance runner. It cannot run from a repository push and
# is pinned to Elevate's designated non-canonical acceptance records.
on:
  workflow_dispatch:
    inputs:
      approve_paid_render:
        description: 'I approve one paid render of the controlled acceptance job'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: controlled-video-acceptance
  cancel-in-progress: false

env:
  ADMIN_URL: ${{ secrets.ADMIN_URL }}
  CRON_SECRET: ${{ secrets.CRON_SECRET }}
  COURSE_ID: 'a436e60a-6247-4ae3-a529-670eb37feeb8'
  JOB_ID: '0f5919f0-c9ef-4551-a1fe-26b0979f924c'

jobs:
  process-controlled-video:
    if: inputs.approve_paid_render == true
    name: Process the controlled video job once
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Require scheduler credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET" || { echo '::error::CRON_SECRET is not configured'; exit 1; }
          if [ -z "$ADMIN_URL" ]; then
            echo 'ADMIN_URL=https://admin.elevateforhumanity.org' >> "$GITHUB_ENV"
          fi

      - name: Call Admin-owned video queue worker once
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl -sS --connect-timeout 30 --max-time 1800             -o /tmp/video-worker.json -w '%{http_code}'             -X POST "$ADMIN_URL/api/internal/videos/process-queue"             -H "Authorization: Bearer $CRON_SECRET"             -H 'Content-Type: application/json'             --data '{"courseId":"a436e60a-6247-4ae3-a529-670eb37feeb8","jobId":"0f5919f0-c9ef-4551-a1fe-26b0979f924c","maxJobs":1,"queueOneDraft":true}' || true)
          cat /tmp/video-worker.json 2>/dev/null || true
          case "$status" in
            200|202) ;;
            *) echo "::error::Video worker returned HTTP $status"; exit 1 ;;
          esac
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('/tmp/video-worker.json','utf8')); if(p.ok!==true) process.exit(1); console.log('Video worker contract accepted:', p);"
