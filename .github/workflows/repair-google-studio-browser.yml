name: Repair Google Studio browser runtime
on:
  push:
    branches: [main]
    paths:
      - '.dockerignore'
      - '.github/workflows/repair-google-studio-browser.yml'
      - 'scripts/gcp/repair-studio-browser-cloud-run.mjs'
      - 'scripts/gcp/verify-studio-workspace-preservation*.mjs'
      - 'services/studio-browser/**'
      - 'Dockerfile.studio-browser'
      - 'scripts/gcp/preflight-studio-browser-permissions.mjs'
      - 'scripts/test-studio-browser-cutover.mjs'
      - 'scripts/gcp/verify-studio-connected-runtime*'
  workflow_dispatch:
    inputs:
      candidate_only:
        description: Verify a candidate without switching existing traffic or Admin
        type: boolean
        default: true
permissions:
  contents: read
  actions: write
  id-token: write
jobs:
  dispatch:
    if: vars.GOOGLE_RELEASE_HOLD != 'true' && (github.event_name == 'push')
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch through trusted Google workflow identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/repair-google-studio-browser.yml/dispatches" -f ref=main -f 'inputs[candidate_only]=false'
  repair:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (vars.GOOGLE_RELEASE_HOLD != 'true' || inputs.candidate_only == true)
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 45
    concurrency:
      group: google-runtime-us-central1
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require CI acceptance on this exact commit before building
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&per_page=20" --jq '.workflow_runs[0].id // empty')"
            if test -n "$run_id"; then
              conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" --jq '.jobs[] | select(.name == "CI Required Gate") | .conclusion // empty')"
              if test "$conclusion" = success; then exit 0; fi
              if test -n "$conclusion"; then echo "Required CI did not pass"; exit 1; fi
            fi
            sleep 10
          done
          echo "Required CI did not finish"; exit 1
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        with:
          skip_install: true
      - name: Verify cutover, encryption-key preservation and exact revision diagnostics
        run: node --test scripts/test-studio-browser-cutover.mjs scripts/gcp/verify-studio-runtime-replacement.test.mjs scripts/gcp/verify-studio-workspace-preservation.test.mjs
      - name: Verify the existing Studio target and prepared boundary before building
        run: node scripts/gcp/preflight-studio-browser-permissions.mjs
      - name: Verify the owner-prepared dedicated Studio runtime identity
        run: |
          node --test scripts/gcp/verify-studio-service-identity.test.mjs
          node scripts/gcp/verify-studio-service-identity.mjs
      - name: Verify registry upload admission before building
        run: node scripts/gcp/preflight-billing.mjs
      - name: Verify automatic container memory policy
        run: node scripts/check-build-memory-policy.mjs --source-only
      - name: Build actual immutable Studio browser container
        run: docker build -f Dockerfile.studio-browser --build-arg "NF_GIT_SHA=$GITHUB_SHA" -t "studio-browser:$GITHUB_SHA" .
      - name: Verify direct CDP and browser authorization contracts
        run: >-
          docker run --rm --init
          -e STUDIO_BROWSER_EXECUTABLE_PATH=/usr/bin/chromium
          -v "$PWD/services/studio-browser:/tests:ro"
          --entrypoint sh "studio-browser:$GITHUB_SHA"
          -c 'test "$(id -u)" = 1001 && test -x "$STUDIO_BROWSER_EXECUTABLE_PATH" && cp -f /tests/*.test.mjs /app/ && node --test --test-concurrency=1 /app/*.test.mjs && for attempt in 1 2; do node --test /app/cdp-browser.integration.test.mjs || exit $?; done'
      - name: Prove actual server startup, persistent storage and authorization
        run: |
          set -euo pipefail
          AUTH_DIR="$RUNNER_TEMP/studio-auth-test"
          mkdir -p "$AUTH_DIR"
          sudo chown 1001:1001 "$AUTH_DIR"
          docker run -d --init --name studio-startup -p 127.0.0.1:3100:3100 \
            -e STUDIO_BROWSER_SECRET=container-test-secret-no-production-access \
            -e STUDIO_BROWSER_AUTH_STATE_DIR=/var/lib/studio-browser-auth \
            -v "$AUTH_DIR:/var/lib/studio-browser-auth" "studio-browser:$GITHUB_SHA"
          trap 'docker logs studio-startup; docker rm -f studio-startup' EXIT
          node --input-type=module <<'NODE'
          const base='http://127.0.0.1:3100';
          let state;
          for(let attempt=0;attempt<30;attempt++){
            try{const response=await fetch(base+'/health',{signal:AbortSignal.timeout(2000)});state=await response.json();if(response.ok&&state.ready)break;}catch{}
            await new Promise(resolve=>setTimeout(resolve,1000));
          }
          if(!state?.ready||state.commit!==process.env.GITHUB_SHA||!state.providerAuthStorage?.persistent)throw Error('Actual container startup/persistence proof failed');
          const anonymous=await fetch(base+'/workspace/files');
          if(anonymous.status!==401)throw Error('Anonymous workspace access must be denied');
          const authorized=await fetch(base+'/workspace/files',{headers:{'x-studio-browser-secret':'container-test-secret-no-production-access'}});
          if(!authorized.ok)throw Error('Authenticated workspace must respond');
          console.log(JSON.stringify({commit:state.commit,ready:state.ready,persistent:true,anonymousDenied:true,authorized:true}));
          NODE
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - name: Publish tested browser image
        run: |
          set -euo pipefail
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
          IMAGE="us-central1-docker.pkg.dev/elegant-racer-299721/elevate/studio-browser:$GITHUB_SHA"
          docker tag "studio-browser:$GITHUB_SHA" "$IMAGE"
          docker push "$IMAGE"
      - name: Restore browser and persistent encrypted provider storage before Admin cutover
        env:
          IMAGE_SHA: ${{ github.sha }}
          STUDIO_CANDIDATE_ONLY: ${{ inputs.candidate_only && 'true' || 'false' }}
        run: |
          node --input-type=module <<'NODE'
          import {inspectRegionalCapacity} from "./scripts/gcp/regional-capacity.mjs";
          const capacity=await inspectRegionalCapacity({region:"us-central1",task:{containers:[{resources:{limits:{cpu:"2",memory:"4Gi"}}}]}});
          if(!capacity.fits)throw Error("STUDIO_ROLLOUT_REGIONAL_CAPACITY_UNAVAILABLE");
          console.log(JSON.stringify(capacity));
          NODE
          node scripts/gcp/repair-studio-browser-cloud-run.mjs
      - name: Preserve exact failed browser revision diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: studio-browser-startup-${{ github.run_id }}
          path: reports/studio-browser
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify the serving Studio and Admin connection after cutover
        if: ${{ success() && !inputs.candidate_only }}
        run: |
          node --test scripts/gcp/verify-studio-connected-runtime.test.mjs
          node scripts/gcp/verify-studio-connected-runtime.mjs
