name: Deploy production (both services)

# Manual full-platform deploy when production SHAs lag behind main.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: northflank-production-full
  cancel-in-progress: false

jobs:
  deploy-both:
    name: Configure, build, and verify LMS + Admin
    runs-on: ubuntu-latest
    env:
      NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
      NORTHFLANK_TEAM_ID: ${{ secrets.NORTHFLANK_TEAM_ID || 'elevates-team' }}
      NORTHFLANK_PROJECT_ID: ${{ secrets.NORTHFLANK_PROJECT_ID || 'elevate-platform' }}
      NORTHFLANK_LMS_SERVICE_ID: ${{ secrets.NORTHFLANK_LMS_SERVICE_ID || 'elevate-lms' }}
      NORTHFLANK_ADMIN_SERVICE_ID: ${{ secrets.NORTHFLANK_ADMIN_SERVICE_ID || 'elevate-admin' }}
      DEPLOY_BRANCH: main
      NORTHFLANK_EPHEMERAL_STORAGE_MB: '32768'
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      EXPECTED_SHA: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install --legacy-peer-deps

      - name: Configure Northflank (LMS + admin)
        run: npx tsx scripts/northflank/configure-services.ts --all --execute

      - name: Verify health probes on /api/ping
        run: npx tsx scripts/northflank/verify-health-checks.ts --all

      - name: Set branches to main
        run: |
          npx tsx scripts/northflank/set-service-branch.ts "$NORTHFLANK_LMS_SERVICE_ID" main
          npx tsx scripts/northflank/set-service-branch.ts "$NORTHFLANK_ADMIN_SERVICE_ID" main

      - name: Trigger builds
        run: |
          npx tsx scripts/northflank/trigger-build.ts "$NORTHFLANK_LMS_SERVICE_ID"
          npx tsx scripts/northflank/trigger-build.ts "$NORTHFLANK_ADMIN_SERVICE_ID"

      - name: Wait for admin
        run: npx tsx scripts/northflank/wait-service.ts "$NORTHFLANK_ADMIN_SERVICE_ID" --timeout-ms 1200000

      - name: Wait for LMS
        run: npx tsx scripts/northflank/wait-service.ts "$NORTHFLANK_LMS_SERVICE_ID" --timeout-ms 3600000

      - name: Verify both SHAs match main
        run: npx tsx scripts/northflank/verify-deployed-sha.ts
