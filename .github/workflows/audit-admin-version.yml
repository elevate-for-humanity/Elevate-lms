name: Audit Admin Deployed Version

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  audit:
    if: startsWith(github.event.issue.title, '[ADMIN VERSION AUDIT]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read live Admin version
        shell: bash
        run: |
          set -Eeuo pipefail
          status=$(curl -sS --max-time 20 -o /tmp/version.json -w '%{http_code}' https://admin.elevateforhumanity.org/api/version || true)
          echo "$status" >/tmp/status.txt
          cat /tmp/version.json || true
      - name: Post result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            let status='unknown', body='';
            try { status=fs.readFileSync('/tmp/status.txt','utf8').trim(); } catch {}
            try { body=fs.readFileSync('/tmp/version.json','utf8'); } catch {}
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:`Admin /api/version HTTP ${status}\n\n\`\`\`json\n${body.slice(0,12000)}\n\`\`\``});
