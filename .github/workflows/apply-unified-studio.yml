name: Apply unified Studio release
on:
  push:
    branches: [unified-studio-production]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: unified-studio-production
          fetch-depth: 0
      - name: Apply verified Studio commit
        env:
          PATCH_B64: 
        run: |
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/unified-studio.patch
          git apply --check /tmp/unified-studio.patch
          git apply /tmp/unified-studio.patch
          rm .github/workflows/apply-unified-studio.yml
          git config user.name "Elevate Release Automation"
          git config user.email "admin@elevateforhumanity.org"
          git add -A
          git commit -m "Unify Studio conversation and execution workflow"
          git push origin HEAD:unified-studio-production
