name: Audit independent Elevate PBX call path
on:
  workflow_dispatch:
  pull_request:
    paths: ['.github/workflows/audit-owned-pbx-callpath.yml', 'scripts/gcp/*pbx*']
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-owned-pbx-callpath.yml'
      - 'scripts/gcp/audit-pbx-runtime.py'
      - 'scripts/gcp/verify-pbx-transport.mjs'
permissions:
  actions: write
  contents: read
  id-token: write
concurrency:
  group: google-pbx-infrastructure
  cancel-in-progress: false
jobs:
  audit-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 scripts/gcp/test-audit-pbx-runtime.py
      - run: node --check scripts/gcp/verify-pbx-transport.mjs
  dispatch:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Start read-only PBX audit through approved Google identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/audit-owned-pbx-callpath.yml/dispatches" -f ref=main
  audit:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        with:
          skip_install: true
      - name: Verify VM identity and readiness
        shell: bash
        run: |
          set -euo pipefail
          PROJECT=elegant-racer-299721
          ZONE=us-central1-a
          VM=elevate-pbx
          test "$(gcloud compute instances describe "$VM" --project="$PROJECT" --zone="$ZONE" --format='value(status)')" = RUNNING
          test "$(gcloud compute instances describe "$VM" --project="$PROJECT" --zone="$ZONE" --format='value(networkInterfaces[0].accessConfigs[0].natIP)')" = 107.178.216.162
      - name: Verify authoritative phone DNS, trusted TLS and SIP transport
        if: always()
        run: node scripts/gcp/verify-pbx-transport.mjs
      - name: Inspect actual PBX capabilities without exposing runtime configuration
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          gcloud compute ssh elevate-pbx --project=elegant-racer-299721 --zone=us-central1-a --quiet \
            --command='sudo python3 -' < scripts/gcp/audit-pbx-runtime.py | tee pbx-runtime-evidence.json
      - name: Preserve sanitized runtime and transport evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pbx-runtime-evidence
          path: pbx-*-evidence.json
          if-no-files-found: error
          retention-days: 14
