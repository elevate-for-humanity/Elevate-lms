name: Supabase Migrations

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Apply pending migrations after the official history check'
        required: false
        type: boolean
        default: false

jobs:
  supabase-migrations:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify migration credentials
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for key in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF SUPABASE_DB_PASSWORD; do
            if [ -z "${!key:-}" ]; then
              echo "::error::$key is required for the official Supabase migration workflow"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Lint migrations
        run: node scripts/lint-migrations.cjs

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Compare local and official remote migration history
        run: supabase migration list

      - name: Dry-run pending migrations
        run: supabase db push --dry-run

      - name: Apply pending migrations
        if: ${{ inputs.apply == true }}
        run: supabase db push

      - name: Migration mode summary
        run: |
          if [ "${{ inputs.apply }}" = "true" ]; then
            echo "Official Supabase migration push completed."
          else
            echo "Audit-only run completed. Re-run with apply=true only after migration history is reconciled."
          fi
