name: Repair public HTTP entry
on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair-public-http-entry.yml', 'scripts/gcp/repair-public-http-entry.mjs', 'scripts/gcp/repair-public-http-entry.test.mjs']
  workflow_dispatch:
permissions:
  actions: write
  contents: read
  id-token: write
jobs:
  dispatch:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch through approved Google identity event
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/repair-public-http-entry.yml/dispatches" -f ref=main
  repair:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    concurrency:
      group: google-public-http-entry
      cancel-in-progress: false
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test redirect policy and frontend guards
        run: node --test scripts/gcp/repair-public-http-entry.test.mjs
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Add missing HTTP redirect on the existing public address
        run: node scripts/gcp/repair-public-http-entry.mjs
      - name: Verify apprenticeship facts and all public entry variants
        run: node scripts/gcp/verify-public-entry.mjs
