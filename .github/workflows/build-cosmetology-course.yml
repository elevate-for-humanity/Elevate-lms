name: Build Cosmetology Course
# Dedicated production runner; subsequent main pushes are resumable through lesson checkpoints.

on:
  workflow_dispatch:
  issues:
    types: [reopened]
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-cosmetology-course.yml'
      - 'scripts/course-factory/build-cosmetology-course.ts'
      - 'scripts/course-factory/wait-for-cosmetology-database.mjs'
      - 'lib/course-factory/content-generator.ts'
      - 'lib/course-factory/publisher.ts'
      - 'lib/course-factory/generation-checkpoints.ts'
      - 'lib/course-factory/durable-generation-journal.ts'
      - 'lib/course-factory/learning-intelligence.ts'
      - 'lib/course-factory/post-generation-governance.ts'
      - 'lib/course-builder/persisted-publish-service.ts'
      - 'lib/curriculum/blueprints/cosmetology.ts'

permissions:
  contents: read

env:
  CI: true
  NODE_ENV: production
  # Course generation uses Elevate's single self-hosted canonical provider.
  AI_PROVIDER: elevate
  AI_PROVIDER_ORDER: elevate
  AI_CIRCUIT_RECOVERY_WAIT: '1'
  COURSE_FACTORY_LESSON_MAX_TOKENS: '4000'
  COURSE_FACTORY_LESSON_MAX_ATTEMPTS: '2'
  ELEVATE_LLM_TIMEOUT_MS: '600000'
  # A long-running batch must wait out transient Data API latency instead of
  # sharing the short-fail circuit policy used by interactive web requests.
  SUPABASE_FETCH_TIMEOUT_MS: '30000'
  SUPABASE_READ_MAX_ATTEMPTS: '2'
  SUPABASE_CIRCUIT_BREAKER_ENABLED: 'false'
  COURSE_FACTORY_CHECKPOINT_DIR: .course-build-cache/cosmetology
  NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_AI_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_API_TOKEN }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_AI_MODEL: ${{ secrets.CLOUDFLARE_AI_MODEL }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  # Public project URL is repository-owned configuration, not a credential.
  # Pin it here so a stale generic SUPABASE_URL secret cannot route this
  # production-only workflow to another project or an unreachable endpoint.
  SUPABASE_URL: https://cuxzzpsyufcewtmicszk.supabase.co
  NEXT_PUBLIC_SUPABASE_URL: https://cuxzzpsyufcewtmicszk.supabase.co
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  NODE_OPTIONS: --conditions=react-server

jobs:
  build:
    if: >-
      github.event_name != 'issues' ||
      (github.event.issue.number == 928 &&
       github.event.issue.title == 'RUN COSMETOLOGY COURSE PRODUCTION BUILD')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: cosmetology-course-production-build
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          clean: true

      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Restore durable Cosmetology generation journal
        uses: actions/cache@v5
        with:
          path: .course-build-cache/cosmetology
          key: cosmetology-generation-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            cosmetology-generation-v1-

      - run: pnpm install --frozen-lockfile --strict-peer-dependencies=false

      - name: Require production database credentials
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"

      - name: Wait for authenticated production database readiness
        run: node scripts/course-factory/wait-for-cosmetology-database.mjs

      - name: Resolve and accept canonical Elevate LLM
        run: node scripts/northflank/export-course-llm-env.mjs

      - name: Build canonical cosmetology course and queue media
        run: pnpm tsx scripts/course-factory/build-cosmetology-course.ts

      - name: Verify apprenticeship architecture
        run: pnpm tsx scripts/audit-apprenticeship-architecture.ts
