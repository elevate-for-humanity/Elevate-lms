name: Parallel Wrapper Audit

on:
  push:
    branches: [consolidate/legacy-routes-20260814]
    paths:
      - '.github/workflows/parallel-wrapper-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trace retired wrapper and route references
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          {
            echo '=== apps root files ==='
            find apps -maxdepth 1 -type f -print | sort
            echo
            echo '=== references to apps root wrapper files ==='
            for p in apps/package.json apps/next.config.mjs apps/server.js apps/middleware.ts apps/instrumentation.ts apps/postcss.config.cjs apps/postcss.config.mjs apps/tailwind.config.cjs apps/tsconfig.json; do
              echo "--- $p ---"
              git grep -n -F "$p" -- ':!*.md' ':!docs/**' ':!.github/workflows/parallel-wrapper-audit.yml' || true
            done
            echo
            echo '=== stale apps/app references ==='
            git grep -n -E '(^|[^[:alnum:]_])apps/app(/|[^[:alnum:]_]|$)' -- ':!*.md' ':!docs/**' || true
            echo
            echo '=== retired portal PWA references ==='
            git grep -n -E 'manifest-portal\.json|sw-portal\.js|PortalPWA' -- ':!*.md' ':!docs/**' || true
            echo
            echo '=== marketing program-holder references ==='
            git grep -n -F 'apps/marketing/app/program-holder' -- ':!*.md' ':!docs/**' || true
            echo
            echo '=== generic legacy /portal trade references ==='
            git grep -n -E "['\"]\/portal\/(barber|cosmetology|nail|esthetic|apprentice|student)" -- ':!*.md' ':!docs/**' || true
            echo
            echo '=== apps/lib imports/references ==='
            git grep -n -E "apps/lib|from ['\"]\.\.?/.*lib|@/apps/lib" -- ':!*.md' ':!docs/**' || true
            echo
            echo '=== apps/public references ==='
            git grep -n -F 'apps/public' -- ':!*.md' ':!docs/**' || true
          } | tee audit/report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: parallel-wrapper-audit
          path: audit/report.txt
          retention-days: 2
