name: Recovery Hardening Gate

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'apps/**'
      - 'components/**'
      - 'lib/**'
      - 'supabase/**'

permissions:
  contents: read

# This gate is intentionally keyed to the exact SHA. Recovery autopilots may
# continue committing while validation runs; an older validation must finish
# rather than being cancelled before later domains (Stripe/Platform Doctor) run.
concurrency:
  group: recovery-hardening-${{ github.sha }}
  cancel-in-progress: false

jobs:
  hardening:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release/production-recovery-')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: '--max-old-space-size=6144'

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Frozen dependency install
        run: pnpm install --frozen-lockfile --strict-peer-dependencies=false

      - name: Recovery gate regression guard
        if: ${{ always() }}
        run: node scripts/verify-recovery-gate-hardening.mjs

      - name: Migration discipline
        if: ${{ always() }}
        run: node scripts/audit-migration-discipline.mjs

      - name: Analytics integrity
        if: ${{ always() }}
        run: node scripts/check-analytics-integrity.mjs

      - name: Strict auth audit
        if: ${{ always() }}
        run: bash scripts/audit-auth-gaps.sh --strict

      - name: Stripe implementation integrity
        if: ${{ always() }}
        run: node scripts/check-stripe-integrity.mjs

      - name: Platform Doctor strict enforcement
        if: ${{ always() }}
        run: node scripts/run-platform-doctor-strict.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}

      - name: Upload hardening evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: recovery-hardening-${{ github.sha }}
          path: |
            artifacts/platform-doctor-report.json
            reports/*.json
            audit-packet/*.json
          if-no-files-found: ignore
          retention-days: 30
