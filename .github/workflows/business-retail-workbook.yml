name: Business and Retail workbook checks
on:
  pull_request:
    paths:
      - 'lib/lms/business-retail-workbook*'
      - 'components/lms/BusinessRetailWorkbookLab.tsx'
      - 'components/lms/DigitalWorkbook.tsx'
      - 'tests/unit/business-retail-workbook.test.tsx'
      - '.github/workflows/business-retail-workbook.yml'
  push:
    branches: [main]
    paths:
      - 'lib/lms/business-retail-workbook*'
      - '.github/workflows/business-retail-workbook.yml'
permissions:
  contents: read
jobs:
  coverage-and-calculations:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: node --test lib/lms/business-retail-workbook.test.mjs
