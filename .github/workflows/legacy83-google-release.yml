name: Legacy 83 Google deployment inspection
on:
  push:
    branches: [main]
    paths: ['.github/workflows/legacy83-google-release.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: write
  id-token: write
concurrency:
  group: legacy83-google-release
  cancel-in-progress: false
jobs:
  dispatch:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Use the established main-branch Google identity event
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/legacy83-google-release.yml/dispatches" -f ref=main
  inspect:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Inspect Legacy 83 deployment resources without exposing secret values
        shell: bash
        run: |
          set -euo pipefail
          for region in us-central1 us-east1; do
            gcloud run services list --project=elegant-racer-299721 --region="$region" --format='json(metadata.name,status.url,status.latestReadyRevisionName)' > "/tmp/services-$region.json"
          done
          python3 - <<'PY'
          import json
          for region in ['us-central1','us-east1']:
            rows=json.load(open('/tmp/services-'+region+'.json'))
            for row in rows:
              if 'legacy' in row.get('metadata',{}).get('name','').lower():
                print(json.dumps({'region':region,'service':row}))
          PY
          gcloud secrets list --project=elegant-racer-299721 --format='value(name)' | grep -Ei 'legacy|github|icy' || true
      - name: Check existing GitHub credential access to the standalone source
        shell: bash
        run: |
          set -euo pipefail
          token="$(gcloud secrets versions access latest --secret=elevate-admin-github-token --project=elegant-racer-299721)"
          test -n "$token"
          echo "::add-mask::$token"
          GH_TOKEN="$token" gh api repos/elevate-for-humanity/legacy83-unified-platform --jq '{name:.full_name,defaultBranch:.default_branch,push:.permissions.push}'
          GH_TOKEN="$token" gh api repos/elevate-for-humanity/legacy83-unified-platform/commits/main --jq '{sha:.sha}'
