name: Deploy GPU Video Worker

on:
  push:
    branches: [main]
    paths:
      - 'services/media-gpu-worker/**'
      - 'lib/video/gpu-video-client.ts'
      - 'lib/video/process-video-job.ts'
      - 'apps/admin/app/api/health/gpu-video/route.ts'
      - 'scripts/northflank/provision-gpu-worker.ts'
      - '.github/workflows/deploy-gpu-worker.yml'
  issues:
    types: [opened, edited]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: northflank-gpu-video-deploy
  cancel-in-progress: false

jobs:
  deploy-gpu-worker:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, '[GPU DEPLOY]')
    name: Provision, deploy, and accept GPU video worker
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 180
    env:
      NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
      NORTHFLANK_TEAM_ID: ${{ secrets.NORTHFLANK_TEAM_ID || 'elevates-team' }}
      NORTHFLANK_PROJECT_ID: ${{ secrets.NORTHFLANK_PROJECT_ID || 'elevate-platform' }}
      NORTHFLANK_ADMIN_SERVICE_ID: ${{ secrets.NORTHFLANK_ADMIN_SERVICE_ID || 'elevate-admin' }}
      NORTHFLANK_GPU_PROJECT_ID: elevate-media-gpu
      NORTHFLANK_GPU_REGION: us-central
      NORTHFLANK_GPU_SERVICE_ID: elevate-media-gpu-worker
      NORTHFLANK_GPU_TYPE: l4-24
      NORTHFLANK_GPU_COUNT: '1'
      NORTHFLANK_GPU_DEPLOYMENT_PLAN: nf-gpu-l4-24-1g
      NORTHFLANK_GPU_BUILD_PLAN: nf-compute-800-16
      NORTHFLANK_GPU_MODEL_VOLUME_MB: '153600'
      NORTHFLANK_GPU_EPHEMERAL_MB: '262144'
      NORTHFLANK_GPU_BUILD_EPHEMERAL_MB: '32768'
      GPU_VIDEO_PROVIDER: wan
      GPU_MAX_CONCURRENCY: '1'
      WAN_MIN_VRAM_GB: '22'
      GITHUB_SHA: ${{ github.sha }}
      BUILD_SHA: ${{ github.sha }}

    steps:
      - name: Post run ID
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `GPU deployment started: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\nCommit: \`${context.sha}\``
            });

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Prove exact main SHA
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main --depth=200
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          git merge-base --is-ancestor "${{ github.sha }}" origin/main
          test -z "$(git status --porcelain)"

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pnpm install --frozen-lockfile --strict-peer-dependencies=false

      - name: Validate GPU source and provisioning contracts
        run: |
          python -m py_compile services/media-gpu-worker/worker.py
          python -m py_compile services/media-gpu-worker/bootstrap_models.py
          pnpm tsx scripts/northflank/provision-gpu-worker.ts

      - name: Provision, exact-SHA deploy, bootstrap Wan, and generate real MP4
        run: pnpm tsx scripts/northflank/provision-gpu-worker.ts --execute

      - name: Build exact Admin SHA
        id: admin_build
        run: pnpm tsx scripts/northflank/trigger-build.ts "$NORTHFLANK_ADMIN_SERVICE_ID"

      - name: Wait, verify, and deploy Admin
        run: |
          set -Eeuo pipefail
          test -n "${{ steps.admin_build.outputs.build_id }}"
          pnpm tsx scripts/northflank/wait-service.ts "$NORTHFLANK_ADMIN_SERVICE_ID" --build-id "${{ steps.admin_build.outputs.build_id }}" --timeout-ms 3600000
          pnpm tsx scripts/northflank/verify-build.ts "$NORTHFLANK_ADMIN_SERVICE_ID" --build-id "${{ steps.admin_build.outputs.build_id }}" --sha "${{ github.sha }}"
          pnpm tsx scripts/northflank/trigger-deployment.ts "$NORTHFLANK_ADMIN_SERVICE_ID" --build-id "${{ steps.admin_build.outputs.build_id }}" --sha "${{ github.sha }}"
          pnpm tsx scripts/northflank/wait-service.ts "$NORTHFLANK_ADMIN_SERVICE_ID" --timeout-ms 3600000

      - name: Prove Admin and Admin-to-GPU readiness
        shell: bash
        run: |
          set -Eeuo pipefail
          for i in $(seq 1 40); do
            ping=$(curl -sS --max-time 10 -o /tmp/admin-ping.json -w '%{http_code}' https://admin.elevateforhumanity.org/api/ping || true)
            health=$(curl -sS --max-time 10 -o /tmp/admin-health.json -w '%{http_code}' https://admin.elevateforhumanity.org/api/health || true)
            gpu=$(curl -sS --max-time 15 -o /tmp/admin-gpu.json -w '%{http_code}' https://admin.elevateforhumanity.org/api/health/gpu-video || true)
            if [ "$ping" = 200 ] && [ "$health" = 200 ] && [ "$gpu" = 200 ] && grep -q '"ready":true' /tmp/admin-health.json && grep -q '"ready":true' /tmp/admin-gpu.json; then
              cat /tmp/admin-gpu.json
              exit 0
            fi
            sleep 15
          done
          cat /tmp/admin-ping.json 2>/dev/null || true
          cat /tmp/admin-health.json 2>/dev/null || true
          cat /tmp/admin-gpu.json 2>/dev/null || true
          exit 1

      - name: Post final result
        if: always() && github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `GPU deployment run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\nJob result: **${{ job.status }}**\nCommit: \`${context.sha}\``
            });
