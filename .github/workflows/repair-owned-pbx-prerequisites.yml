name: Repair independent PBX prerequisites
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/repair-owned-pbx-prerequisites.yml'
      - 'scripts/gcp/*pbx*'
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-owned-pbx-prerequisites.yml'
      - 'scripts/gcp/repair-pbx-scope.mjs'
      - 'scripts/gcp/prepare-pbx-secrets.mjs'
      - 'scripts/gcp/pbx-restart-guard.py'
permissions:
  contents: read
  actions: write
  id-token: write
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'google-pbx-infrastructure' || format('google-pbx-checks-{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: false
  queue: max
jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/gcp/repair-pbx-scope.test.mjs scripts/gcp/prepare-pbx-secrets.test.mjs
      - run: python3 scripts/gcp/test-pbx-restart-guard.py
  dispatch:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Start guarded repair from protected main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/repair-owned-pbx-prerequisites.yml/dispatches" -f ref=main
  repair:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        with:
          skip_install: true
      - name: Repair VM scope only when the existing PBX is unused and safely recoverable
        run: node scripts/gcp/repair-pbx-scope.mjs --apply
      - name: Prepare narrowly scoped runtime secrets and Google voice API access
        if: always()
        run: node scripts/gcp/prepare-pbx-secrets.mjs --apply
      - name: Recheck actual authoritative DNS, trusted TLS and SIP transport
        if: always()
        run: node scripts/gcp/verify-pbx-transport.mjs
      - name: Inspect actual runtime without printing private configuration
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          gcloud compute ssh elevate-pbx --project=elegant-racer-299721 --zone=us-central1-a --quiet \
            --command='sudo python3 -' < scripts/gcp/audit-pbx-runtime.py | tee pbx-runtime-evidence.json
      - name: Retain sanitized results and scope rollback inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pbx-prerequisite-evidence
          path: pbx-*-evidence.json
          if-no-files-found: error
          retention-days: 14
