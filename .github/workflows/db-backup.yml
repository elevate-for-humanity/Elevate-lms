name: Database Recovery Verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/db-backup.yml'
      - 'scripts/gcp/check-database-recovery.mjs'
      - 'scripts/gcp/check-database-recovery.test.mjs'
      - 'supabase/migrations/*paris_bounded_context_retry_contract.sql'
  schedule:
    - cron: '23 7 * * *'

permissions:
  contents: read

concurrency:
  group: production-database-recovery-metadata
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Verify recovery metadata contract
        run: node --test scripts/gcp/check-database-recovery.test.mjs
      - name: Confirm backup-read credential is bound to production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is unavailable in the production environment. Backup recency is unverified. Configure the existing scoped secret; do not paste it in workflow logs."
            exit 1
          fi
      - name: Verify a recent provider recovery point
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: cuxzzpsyufcewtmicszk
        run: node scripts/gcp/check-database-recovery.mjs
