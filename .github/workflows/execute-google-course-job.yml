name: Execute one Google Course Builder task
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: google-runtime-operations
  cancel-in-progress: false
jobs:
  execute:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - run: node --test scripts/gcp/execute-course-job.test.mjs
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Refuse overlap and wait for one finite task
        run: node scripts/gcp/execute-course-job.mjs
