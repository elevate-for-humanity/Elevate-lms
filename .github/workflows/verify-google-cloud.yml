name: Verify Google Cloud connection
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: google-cloud-connection
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@v3
      - name: Verify authenticated Cloud Run access
        run: gcloud run services list --project=elegant-racer-299721 --region=us-central1 --format='table(metadata.name,status.url)'
