name: Resume barber and HVAC repairs
on:
  workflow_run:
    workflows: ['Deploy Google Course Builder on source changes']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
  id-token: write
jobs:
  dispatch:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_sha == '3927868c1e27252017948994e5e0283dd3b6565c'
    runs-on: ubuntu-24.04
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/resume-barber-hvac-repairs.yml/dispatches" -f ref=main
  resume:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: google-course-runtime-operations
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - run: node --test scripts/gcp/start-barber-hvac-repair.test.mjs
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        with:
          skip_install: true
      - env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REPAIRED_IMAGE_SHA: '3927868c1e27252017948994e5e0283dd3b6565c'
        run: node scripts/gcp/start-barber-hvac-repair.mjs
