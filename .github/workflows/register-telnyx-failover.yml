name: Register Telnyx Failover
on:
  # Disabled: do not reconfigure legacy Telnyx carrier routing during Twilio migration.
  # Historical job retained for forensic review; explicit recovery needs a new reviewed PR.
  # workflow_dispatch:
permissions:
  contents: read
  actions: write
  id-token: write
jobs:
  register:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        with:
          skip_install: true
      - run: node scripts/northflank/register-telnyx-failover.ts
