; Elevate-owned PBX foundation.
; Runtime provisioning writes authenticated PWA endpoints separately.
[global]
type=global
user_agent=Elevate Communications

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0:8089

; Twilio is the selected external PSTN carrier. Configure the verified
; Twilio TLS/SRTP endpoint using the owned deployment flow and protected runtime
; secrets before activating any public calling. Never place credentials here.

; Provisioner-generated PWA device endpoints and AORs.
#include elevate-webrtc/current/pjsip.conf
; Twilio carrier endpoint fragment (written by the guarded trunk staging flow).
#include elevate-twilio.conf
; Twilio carrier identity: match signaling IPs to the trunk endpoint.
#include elevate-twilio-identity.conf

