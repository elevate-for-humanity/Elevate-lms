name: Deploy repaired Google services
on:
  workflow_call:
    inputs:
      component:
        type: string
        required: true
      candidate_size:
        type: string
        default: preserve
        required: false
      image_sha:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      component:
        description: Service to update; other services keep their current images
        type: choice
        required: true
        options: [marketing, admin, lms, store, all]
      candidate_size:
        description: Tested candidate allocation; preserve keeps existing service resources
        type: choice
        default: preserve
        options: [preserve, admin-2cpu-4gi, lms-2cpu-4gi]
      image_sha:
        description: Full commit SHA of the successfully uploaded image
        type: string
        required: true
permissions:
  contents: read
  id-token: write
concurrency:
  group: google-runtime-us-central1
  cancel-in-progress: false
  queue: max
jobs:
  deploy:
    if: vars.GOOGLE_RELEASE_HOLD != 'true' && (github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        component: ${{ fromJSON(inputs.component == 'all' && '["marketing","admin","lms"]' || format('["{0}"]', inputs.component)) }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        with:
          skip_install: true
      - name: Verify runner-supplied Google SDK compatibility
        run: node scripts/gcp/verify-sdk.mjs
      - name: Update only the image of the existing migration service
        env:
          COMPONENT: ${{ matrix.component }}
          IMAGE_SHA: ${{ inputs.image_sha }}
          CANDIDATE_SIZE: ${{ inputs.candidate_size || 'preserve' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          PROJECT=elegant-racer-299721
          SERVICE="elevate-$COMPONENT-migration"
          IMAGE="us-central1-docker.pkg.dev/$PROJECT/elevate/$COMPONENT"
          SHA="$IMAGE_SHA"
          [[ "$SHA" =~ ^[a-f0-9]{40}$ ]]
          gcloud run services describe "$SERVICE" --project="$PROJECT" --region=us-central1 --format='value(metadata.name)'
          DIGEST="$(gcloud artifacts docker images describe "$IMAGE:$SHA" --project="$PROJECT" --format='value(image_summary.digest)')"
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          # Bounded candidates must fit verified headroom; traffic stays pinned until acceptance.
          resource_args=()
          case "$CANDIDATE_SIZE" in
            preserve) ;;
            admin-2cpu-4gi)
              test "$COMPONENT" = admin
              export CANDIDATE_CPU=2 CANDIDATE_MEMORY=4Gi
              resource_args=(--cpu=2 --memory=4Gi --no-cpu-throttling --update-env-vars=AI_NARRATION_PROVIDER=kokoro)
              ;;
            lms-2cpu-4gi)
              test "$COMPONENT" = lms
              export CANDIDATE_CPU=2 CANDIDATE_MEMORY=4Gi
              resource_args=(--cpu=2 --memory=4Gi)
              # Test the same immutable image and allocation, including manual releases.
              gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
              docker pull "$IMAGE@$DIGEST"
              node --test scripts/gcp/smoke-lms-container.test.mjs
              SMOKE_IMAGE="$IMAGE@$DIGEST" node scripts/gcp/smoke-lms-container.mjs
              ;;
            *) echo 'Unsupported candidate allocation'; exit 1 ;;
          esac
          CANDIDATE_SERVICE="$SERVICE" node scripts/gcp/cleanup-unused-candidate-tags.mjs
          CANDIDATE_SERVICE="$SERVICE" node scripts/gcp/preflight-web-rollout.mjs
          gcloud run services update "$SERVICE" --project="$PROJECT" --region=us-central1 --image="$IMAGE@$DIGEST" --no-cpu-boost --no-traffic "${resource_args[@]}" --quiet
      - name: Verify and activate the exact candidate before moving public traffic
        env:
          COMPONENT: ${{ matrix.component }}
          IMAGE_SHA: ${{ inputs.image_sha }}
        run: |
          set -euo pipefail
          export CANDIDATE_SERVICE="elevate-$COMPONENT-migration"
          export CANDIDATE_REVISION="$(gcloud run services describe "$CANDIDATE_SERVICE" --project=elegant-racer-299721 --region=us-central1 --format='value(status.latestCreatedRevisionName)')"
          node --test scripts/test-public-revision-activation.mjs
          node scripts/gcp/activate-tested-public-revision.mjs
      - name: Resolve the canonical service URL for health authentication
        id: health_target
        env:
          COMPONENT: ${{ matrix.component }}
        shell: bash
        run: |
          set -euo pipefail
          SERVICE_URL="$(gcloud run services describe "elevate-$COMPONENT-migration" --project=elegant-racer-299721 --region=us-central1 --format='value(status.url)')"
          [[ "$SERVICE_URL" =~ ^https://[a-z0-9.-]+\.run\.app$ ]]
          echo "url=$SERVICE_URL" >> "$GITHUB_OUTPUT"
      - uses: google-github-actions/auth@v3
        id: health_auth
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
          token_format: id_token
          id_token_audience: ${{ steps.health_target.outputs.url }}
          id_token_include_email: true
      - name: Verify image version and Supabase health
        env:
          TOKEN: ${{ steps.health_auth.outputs.id_token }}
          HEALTH_BASE_URL: ${{ steps.health_target.outputs.url }}
          COMPONENT: ${{ matrix.component }}
          IMAGE_SHA: ${{ inputs.image_sha }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const component = process.env.COMPONENT;
          const baseUrl = process.env.HEALTH_BASE_URL;
          if (!/^https:\/\/[a-z0-9.-]+\.run\.app$/.test(baseUrl || '')) throw new Error('Canonical Cloud Run health URL required');
          const deadline=Date.now()+120000;
          let consecutive=0;
          for(let attempt=1; Date.now()<deadline; attempt++) {
            let response, body={};
            try {
              response=await fetch(baseUrl + '/api/health', {
                headers: {'X-Serverless-Authorization':'Bearer '+process.env.TOKEN},
                redirect:'manual', signal:AbortSignal.timeout(Math.min(20000,deadline-Date.now()))
              });
              body=await response.json();
            } catch (error) {
              // Only retry bounded transport failures; malformed JSON and all
              // actual HTTP responses still fail their existing release gates.
              const transient = ['TimeoutError', 'AbortError', 'TypeError'].includes(error?.name);
              console.log(JSON.stringify({component,attempt,httpStatus:response?.status,contentType:response?.headers?.get('content-type'),error:transient
                ? 'transient_health_transport' : 'health_probe_invalid_response'}));
              if (!transient || Date.now() >= deadline) {
                throw new Error('Health endpoint did not return a valid bounded response');
              }
              consecutive = 0;
              await new Promise(resolve => setTimeout(resolve, 5000));
              continue;
            }
            const dependency=body.dependencies?.supabase;
            const result={component,attempt,httpStatus:response.status,
              correctService:body.service===component, healthy:body.healthy===true,
              ready:body.ready===true, supabase:dependency?.ok===true,
              dependencyStatus:dependency?.status, dependencyLatencyMs:dependency?.latencyMs,
              dependencyTimeout:dependency?.error==='TimeoutError',
              correctCommit:body.commit===process.env.IMAGE_SHA};
            console.log(JSON.stringify(result));
            const passed=response.status===200 && result.correctService && result.healthy &&
              result.ready && result.supabase && result.correctCommit;
            consecutive=passed ? consecutive+1 : 0;
            if(consecutive===3) {
              break;
            }
            // Only the observed cold-start dependency timeout gets a bounded warm-up window.
            // Wrong image, missing config, bad credentials and unexpected responses fail immediately.
            if(!passed && !(response.status===503 && result.correctService && result.ready &&
                result.correctCommit && result.dependencyTimeout)) {
              throw new Error('Non-transient runtime health failure');
            }
            await new Promise(resolve=>setTimeout(resolve,5000));
          }
          if(consecutive<3) throw new Error('Service did not establish stable dependency health within two minutes');
          // /health confirms dependency access; /ready enforces the application's own readiness contract.
          const readinessResponse=await fetch(baseUrl + '/api/ready',{
            headers:{'X-Serverless-Authorization':'Bearer '+process.env.TOKEN},
            redirect:'manual',signal:AbortSignal.timeout(20000)
          });
          const readiness=await readinessResponse.json();
          const readyResult={component,httpStatus:readinessResponse.status,ready:readiness.ready===true,
            correctService:readiness.service===component,
            correctCommit:readiness.commit===process.env.IMAGE_SHA,
            executorReady:component!=='admin' || readiness.agenticExecutorReady===true};
          console.log(JSON.stringify(readyResult));
          if(readinessResponse.status!==200 || !readyResult.ready || !readyResult.correctService ||
              !readyResult.correctCommit || !readyResult.executorReady)
            throw new Error('Canonical application readiness failed');
          if(component==='marketing') {
            const qbResponse=await fetch(baseUrl + '/api/health/quickbooks',{
              headers:{'X-Serverless-Authorization':'Bearer '+process.env.TOKEN},
              redirect:'manual',signal:AbortSignal.timeout(20000)
            });
            const qb=await qbResponse.json().catch(()=>({}));
            const qbResult={component:'marketing',quickBooksHttpStatus:qbResponse.status,
              quickBooksReady:qb.ready===true,quickBooksConfigured:qb.configured===true,
              quickBooksConnected:qb.connected===true,quickBooksWebhookVerifier:qb.webhookVerifierConfigured===true};
            console.log(JSON.stringify(qbResult));
            if(qbResponse.status!==200 || !qbResult.quickBooksReady || !qbResult.quickBooksConfigured ||
                !qbResult.quickBooksConnected || !qbResult.quickBooksWebhookVerifier)
              throw new Error('QuickBooks runtime is not synchronized with the Google deployment');
          }
          if(component==='admin') {
            // The legacy /api/health/telnyx endpoint checks a retired provider.
            // Do not require it for Google Admin readiness or infer that the
            // standalone Asterisk/Twilio/PARIS voice flow is production-ready.
            console.log(JSON.stringify({component:'admin',phoneAcceptance:'NOT_TESTED',
              carrier:'Twilio (reported; live cutover not verified)',
              scope:'application readiness only; PBX acceptance is a separate gate'}));
            appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              'Admin: legacy Telnyx carrier gate retired. PBX/Twilio/PARIS calling NOT VERIFIED by this deployment.\\n');
          }
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,component+': dependency health and canonical readiness passed.\n');

          NODE
      - name: Check standalone PBX public transport (read-only, not call acceptance)
        if: ${{ matrix.component == 'admin' }}
        continue-on-error: true
        run: |
          node scripts/gcp/verify-pbx-transport.mjs
          echo "Public DNS/TLS/SIP WebSocket transport does not prove Twilio carrier routing, SIP registration, audio, ASR, or PARIS."
