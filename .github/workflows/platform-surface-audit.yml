name: Platform Surface Audit

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/platform-surface-audit.yml'
      - 'scripts/audit-platform-surfaces.mjs'
      - 'apps/marketing/**'
      - 'apps/admin/**'
      - 'apps/lms/**'
      - 'components/**'
      - 'lib/navigation/**'
      - 'lib/routing/**'
      - 'config/**'
      - 'content/**'
      - 'public/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/platform-surface-audit.yml'
      - 'scripts/audit-platform-surfaces.mjs'
      - 'apps/marketing/**'
      - 'apps/admin/**'
      - 'apps/lms/**'
      - 'components/**'
      - 'lib/navigation/**'
      - 'lib/routing/**'
      - 'config/**'
      - 'content/**'
      - 'public/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  surfaces:
    name: Routes, assets, and portal ownership
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify production contracts
        run: node scripts/verify-portal-production-contracts.mjs
      - name: Audit all platform surfaces
        run: node scripts/audit-platform-surfaces.mjs
