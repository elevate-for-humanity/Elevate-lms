name: Restore PR695 valid fixes and deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-pr695-live.yml'

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Restore valid PR695 route and compliance fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          exts = {'.ts', '.tsx', '.js', '.jsx', '.mjs'}

          def source_files(root):
              p = Path(root)
              if not p.exists():
                  return []
              return [f for f in p.rglob('*') if f.is_file() and f.suffix in exts]

          def admin_owned(text):
              text = re.sub(r'(["\'`])/admin(?=/)', r'\1', text)
              text = re.sub(r'(["\'`])/admin(["\'`])', r'\1/\2', text)
              return text

          def cross_service(text):
              text = re.sub(r'(["\'`])/admin(?=/)', r'\1https://admin.elevateforhumanity.org', text)
              text = re.sub(r'(["\'`])/admin(["\'`])', r'\1https://admin.elevateforhumanity.org/\2', text)
              return text

          changed = []
          for path in source_files('apps/admin/app'):
              before = path.read_text(encoding='utf-8')
              after = admin_owned(before)
              after = after.replace('https://www.elevateforhumanity.org/admin/tenants', 'https://admin.elevateforhumanity.org/tenants')
              after = after.replace('https://www.elevateforhumanity.org/admin/videos/upload', 'https://admin.elevateforhumanity.org/videos/upload')
              if after != before:
                  path.write_text(after, encoding='utf-8')
                  changed.append(str(path))

          for root in ['apps/lms/app', 'components', 'lib/routes']:
              for path in source_files(root):
                  before = path.read_text(encoding='utf-8')
                  after = cross_service(before)
                  if after != before:
                      path.write_text(after, encoding='utf-8')
                      changed.append(str(path))

          # Preserve the full production AIChat implementation. Only its Admin links are canonicalized above.

          cf = Path('apps/lms/app/ai/course-factory/page.tsx')
          if cf.exists():
              before = cf.read_text(encoding='utf-8')
              after = before
              replacements = {
                'Build complete courses in hours, not months. AI accelerates curriculum development by 10x.': 'AI-assisted workflows accelerate curriculum drafting while preserving human review and approval.',
                'Build Courses 10x Faster': 'Build Courses with AI Assistance',
                'Build credential-aligned curriculum for healthcare, trades, and workforce programs \n              in minutes. AI-powered lesson generation, quiz creation, and video scripting.': 'Build and review credential-aligned curriculum for healthcare, trades, and workforce programs with AI-assisted lesson generation, quiz creation, and video scripting.',
                'Every course generated by Course Factory is aligned to industry-recognized credentials \n                and certifications. Students graduate ready for certification exams.': 'Course Factory supports curriculum mapping to industry-recognized credentials and certifications. Program staff remain responsible for review, approval, and exam-readiness claims.',
                'Create credential-aligned courses in minutes, not months.': 'Draft and review credential-aligned courses with AI-assisted workflows.'
              }
              for a,b in replacements.items(): after = after.replace(a,b)
              if after != before:
                  cf.write_text(after, encoding='utf-8')
                  changed.append(str(cf))

          ce = Path('apps/lms/app/ai/credential-engine/page.tsx')
          if ce.exists():
              before = ce.read_text(encoding='utf-8')
              after = before
              replacements = {
                'Issue, manage, and verify digital credentials and certifications. Blockchain-verified credentials with instant employer verification.': 'Issue, manage, and verify digital credential records through protected platform workflows.',
                'Blockchain Verified': 'Controlled Issuance',
                'Credentials are cryptographically signed and stored on blockchain for tamper-proof verification.': 'Authorized staff can manage credential records through protected administrative workflows.',
                'Employers verify credentials in seconds with QR codes or direct URL. No more paper certificates.': 'Credential records can be shared through configured verification workflows.',
                'Students receive credentials in digital wallets. Share with employers instantly.': 'Students can access configured digital credential records through supported learner experiences.',
                'Track credential issuance, verification rates, and graduate outcomes.': 'Authorized users can review available credential issuance and verification activity.',
                'Automatic renewal reminders and expiration tracking for time-limited credentials.': 'Track expiration dates for time-limited credentials and support renewal workflows.',
                'Replace paper certificates with verifiable digital credentials that employers trust.': 'Manage digital credential records through controlled platform workflows.',
                'Replace paper certificates with blockchain-verified digital credentials.': 'Manage digital credential records through controlled platform workflows.'
              }
              for a,b in replacements.items(): after = after.replace(a,b)
              # Remove fabricated credential-volume data/section if still present.
              after = re.sub(r"\nconst credentials = \[[\s\S]*?\n\];\n", "\n", after, count=1)
              after = re.sub(r"\n\s*\{\/\* Stats \*\/\}[\s\S]*?(?=\n\s*\{\/\* How It Works \*\/\})", "\n", after, count=1)
              if after != before:
                  ce.write_text(after, encoding='utf-8')
                  changed.append(str(ce))

          print('Changed files:')
          for p in sorted(set(changed)): print(p)

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies=false

      - name: Route consolidation gate
        run: pnpm exec vitest run tests/unit/course-builder-route-consolidation.test.ts

      - name: Course Factory authority gate
        run: node scripts/check-course-factory-authority.mjs

      - name: Production typecheck
        run: pnpm typecheck:production

      - name: Commit verified source and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/restore-pr695-live.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/admin/app apps/lms/app components lib/routes .github/workflows/restore-pr695-live.yml
          if git diff --cached --quiet; then
            echo 'No source changes required.'
            exit 0
          fi
          git commit -m 'fix(release): restore validated PR695 production fixes'
          git push origin HEAD:main
