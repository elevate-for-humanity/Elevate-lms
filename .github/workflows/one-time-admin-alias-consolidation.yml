name: One-time Admin Prefix Alias Consolidation

on:
  push:
    branches:
      - 'fix/full-platform-cleanup-continuation-20260809'

permissions:
  contents: write

concurrency:
  group: one-time-admin-prefix-aliases
  cancel-in-progress: false

jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/full-platform-cleanup-continuation-20260809
          fetch-depth: 1

      - name: Convert proven /admin aliases to canonical root redirects
        shell: bash
        run: |
          node <<'NODE'
          const crypto = require('crypto');
          const fs = require('fs');
          const path = require('path');

          const appRoot = 'apps/admin/app';
          const aliasRoot = path.join(appRoot, 'admin');
          const pagePattern = /^page\.(tsx|ts|jsx|js)$/;

          function walk(dir, out = []) {
            for (const entry of fs.readdirSync(dir)) {
              if (entry === 'node_modules' || entry === '.next' || entry.startsWith('_')) continue;
              const full = path.join(dir, entry);
              const stat = fs.statSync(full);
              if (stat.isDirectory()) walk(full, out);
              else if (pagePattern.test(entry)) out.push(full);
            }
            return out;
          }

          function normalizedHash(source) {
            return crypto.createHash('sha256').update(
              source.replace(/\/\*[\s\S]*?\*\//g, '').replace(/^\s*\/\/.*$/gm, '').replace(/\s+/g, ' ').trim(),
            ).digest('hex');
          }

          function routeForRelative(relativeDir) {
            const bits = relativeDir.split(path.sep).filter(Boolean).filter((part) => !/^\(.+\)$/.test(part) && !/^@/.test(part));
            return `/${bits.join('/')}`.replace(/\/+/g, '/');
          }

          function paramsFor(route) {
            const params = [];
            for (const segment of route.split('/').filter(Boolean)) {
              if (segment.includes('...')) return null;
              const match = segment.match(/^\[([^.[\]]+)\]$/);
              if (match) params.push(match[1]);
            }
            return params;
          }

          function redirectSource(route, ext) {
            const params = paramsFor(route);
            if (params === null) return null;
            const typed = ext === 'ts' || ext === 'tsx';
            const header = "import { permanentRedirect } from 'next/navigation';\n\nexport const metadata = { robots: { index: false, follow: false } };\n";
            if (!params.length) {
              return `${header}\nexport default function LegacyAdminAlias() {\n  permanentRedirect('${route}');\n}\n`;
            }
            const shape = params.map((name) => `${name}: string`).join('; ');
            const signature = typed ? `({ params }: { params: Promise<{ ${shape} }> })` : '({ params })';
            let target = route;
            for (const name of params) target = target.replace(`[${name}]`, `\${encodeURIComponent(${name})}`);
            return `${header}\nexport default async function LegacyAdminAlias${signature} {\n  const { ${params.join(', ')} } = await params;\n  permanentRedirect(\`${target}\`);\n}\n`;
          }

          const modified = [];
          const skipped = [];
          for (const aliasFile of walk(aliasRoot)) {
            const rel = path.relative(aliasRoot, aliasFile);
            const canonicalFile = path.join(appRoot, rel);
            if (!fs.existsSync(canonicalFile)) continue;

            const aliasSource = fs.readFileSync(aliasFile, 'utf8');
            const canonicalSource = fs.readFileSync(canonicalFile, 'utf8');
            if (/\b(?:redirect|permanentRedirect)\s*\(/.test(aliasSource)) continue;

            const exactCopy = normalizedHash(aliasSource) === normalizedHash(canonicalSource);
            const wrapper = aliasSource.length < 700 && (
              /export\s*\{[^}]*default[^}]*\}\s*from\s*['"][^'"]+\/page['"]/.test(aliasSource) ||
              (/import\s+Page\s+from\s*['"][^'"]+\/page['"]/.test(aliasSource) && /export\s+default\s+Page/.test(aliasSource))
            );
            if (!exactCopy && !wrapper) continue;

            const relativeDir = path.dirname(rel);
            const route = routeForRelative(relativeDir === '.' ? '' : relativeDir);
            const ext = aliasFile.split('.').at(-1);
            const replacement = redirectSource(route, ext);
            if (!replacement) {
              skipped.push({ aliasFile, canonicalFile, route, reason: 'catch-all dynamic route' });
              continue;
            }
            fs.writeFileSync(aliasFile, replacement);
            modified.push({ aliasFile, canonicalFile, route, reason: exactCopy ? 'exact-copy' : 'wrapper' });
          }

          fs.mkdirSync('artifacts', { recursive: true });
          fs.writeFileSync('artifacts/admin-prefix-alias-consolidation.json', JSON.stringify({ modified, skipped }, null, 2) + '\n');
          console.log(`Converted ${modified.length} proven /admin prefix aliases to redirects.`);
          for (const item of modified) console.log(`  ${item.aliasFile} -> ${item.route} (${item.reason})`);
          console.log(`Skipped ${skipped.length} unsupported aliases.`);
          NODE

      - name: Commit safe aliases and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-time-admin-alias-consolidation.yml
          if git diff --quiet; then
            echo 'No proven aliases needed conversion.'
            exit 0
          fi
          git config user.name 'elevateforhumanity'
          git config user.email '221907459+elevateforhumanity@users.noreply.github.com'
          git add apps/admin/app .github/workflows/one-time-admin-alias-consolidation.yml
          git commit -m 'fix(admin): redirect proven admin-prefix aliases'
          git push origin HEAD:fix/full-platform-cleanup-continuation-20260809
