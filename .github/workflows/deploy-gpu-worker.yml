name: Deploy GPU Video Worker

on:
  push:
    branches: [main]
    paths:
      - 'services/media-gpu-worker/**'
      - 'lib/video/gpu-video-client.ts'
      - 'lib/video/process-video-job.ts'
      - 'apps/admin/app/api/health/gpu-video/route.ts'
      - 'scripts/northflank/provision-media-gpu.ts'
      - 'scripts/northflank/accept-media-gpu.ts'
      - '.github/workflows/deploy-gpu-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: northflank-gpu-video-deploy
  cancel-in-progress: false

jobs:
  deploy-gpu-worker:
    name: Provision, deploy, and accept GPU video worker
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 180
    env:
      NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
      NORTHFLANK_TEAM_ID: ${{ secrets.NORTHFLANK_TEAM_ID || 'elevates-team' }}
      NORTHFLANK_WEB_PROJECT_ID: ${{ secrets.NORTHFLANK_PROJECT_ID || 'elevate-platform' }}
      NORTHFLANK_ADMIN_SERVICE_ID: ${{ secrets.NORTHFLANK_ADMIN_SERVICE_ID || 'elevate-admin' }}
      NORTHFLANK_GPU_PROJECT_ID: elevate-media-gpu
      NORTHFLANK_GPU_PROJECT_NAME: Elevate Media GPU
      NORTHFLANK_GPU_REGION: us-central
      NORTHFLANK_GPU_SERVICE_ID: elevate-media-gpu-worker
      NORTHFLANK_GPU_COMPUTE_PLAN: nf-compute-800-32
      NORTHFLANK_GPU_BUILD_PLAN: nf-compute-800-32
      NORTHFLANK_GPU_MODEL_VOLUME_MB: '153600'
      NORTHFLANK_GPU_STORAGE_CLASS: ssd
      GPU_VIDEO_PROVIDER: wan
      GPU_MAX_CONCURRENCY: '1'
      WAN_MIN_VRAM_GB: '22'
      GITHUB_SHA: ${{ github.sha }}
      BUILD_SHA: ${{ github.sha }}

    steps:
      - name: Checkout exact main revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Prove release SHA belongs to main
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main --depth=200
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          git merge-base --is-ancestor "${{ github.sha }}" origin/main
          test -z "$(git status --porcelain)"

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install repository dependencies deterministically
        run: pnpm install --frozen-lockfile --strict-peer-dependencies=false

      - name: Validate GPU worker Python
        run: |
          python -m py_compile services/media-gpu-worker/worker.py
          python -m py_compile services/media-gpu-worker/bootstrap_models.py

      - name: Validate GPU integration TypeScript
        run: pnpm exec tsc --noEmit --pretty false

      - name: Build CUDA worker image locally
        run: docker build -f services/media-gpu-worker/Dockerfile -t elevate-media-gpu-worker:${{ github.sha }} .

      - name: Provision isolated Northflank GPU project/service and wire Admin
        id: provision
        run: pnpm tsx scripts/northflank/provision-media-gpu.ts --execute

      - name: Export provisioned GPU topology
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${{ steps.provision.outputs.gpu_project_id }}"
          test -n "${{ steps.provision.outputs.gpu_service_id }}"
          test -n "${{ steps.provision.outputs.gpu_worker_url }}"
          echo "NORTHFLANK_PROJECT_ID=${{ steps.provision.outputs.gpu_project_id }}" >> "$GITHUB_ENV"
          echo "GPU_VIDEO_WORKER_URL=${{ steps.provision.outputs.gpu_worker_url }}" >> "$GITHUB_ENV"
          echo "GPU_TYPE=${{ steps.provision.outputs.gpu_type }}" >> "$GITHUB_ENV"

      - name: Trigger exact-SHA GPU worker build
        id: gpu_build
        run: pnpm tsx scripts/northflank/trigger-build.ts "$NORTHFLANK_GPU_SERVICE_ID"

      - name: Require concrete GPU build id
        run: test -n "${{ steps.gpu_build.outputs.build_id }}"

      - name: Wait for GPU image build
        run: pnpm tsx scripts/northflank/wait-service.ts "$NORTHFLANK_GPU_SERVICE_ID" --build-id "${{ steps.gpu_build.outputs.build_id }}" --timeout-ms 3600000

      - name: Verify exact GPU image build
        run: pnpm tsx scripts/northflank/verify-build.ts "$NORTHFLANK_GPU_SERVICE_ID" --build-id "${{ steps.gpu_build.outputs.build_id }}" --sha "${{ github.sha }}"

      - name: Deploy exact GPU image
        run: pnpm tsx scripts/northflank/trigger-deployment.ts "$NORTHFLANK_GPU_SERVICE_ID" --build-id "${{ steps.gpu_build.outputs.build_id }}" --sha "${{ github.sha }}"

      - name: Wait for GPU deployment
        run: pnpm tsx scripts/northflank/wait-service.ts "$NORTHFLANK_GPU_SERVICE_ID" --timeout-ms 7200000

      - name: Require live CUDA, model bootstrap, and real Wan MP4
        env:
          GPU_READY_TIMEOUT_MS: '7200000'
          GPU_GENERATION_TIMEOUT_MS: '2400000'
        run: pnpm tsx scripts/northflank/accept-media-gpu.ts "$GPU_VIDEO_WORKER_URL"

      - name: Redeploy Admin so GPU client secrets are loaded
        id: admin_build
        env:
          NORTHFLANK_PROJECT_ID: ${{ secrets.NORTHFLANK_PROJECT_ID || 'elevate-platform' }}
        run: pnpm tsx scripts/northflank/trigger-build.ts "$NORTHFLANK_ADMIN_SERVICE_ID"

      - name: Wait for exact Admin build
        env:
          NORTHFLANK_PROJECT_ID: ${{ secrets.NORTHFLANK_PROJECT_ID || 'elevate-platform' }}
        run: pnpm tsx scripts/northflank/wait-service.ts "$NORTHFLANK_ADMIN_SERVICE_ID" --build-id "${{ steps.admin_build.outputs.build_id }}" --timeout-ms 3600000

      - name: Verify exact Admin build
        env:
          NORTHFLANK_PROJECT_ID: ${{ secrets.NORTHFLANK_PROJECT_ID || 'elevate-platform' }}
        run: pnpm tsx scripts/northflank/verify-build.ts "$NORTHFLANK_ADMIN_SERVICE_ID" --build-id "${{ steps.admin_build.outputs.build_id }}" --sha "${{ github.sha }}"

      - name: Deploy Admin with GPU client configuration
        env:
          NORTHFLANK_PROJECT_ID: ${{ secrets.NORTHFLANK_PROJECT_ID || 'elevate-platform' }}
        run: pnpm tsx scripts/northflank/trigger-deployment.ts "$NORTHFLANK_ADMIN_SERVICE_ID" --build-id "${{ steps.admin_build.outputs.build_id }}" --sha "${{ github.sha }}"

      - name: Wait for Admin deployment
        env:
          NORTHFLANK_PROJECT_ID: ${{ secrets.NORTHFLANK_PROJECT_ID || 'elevate-platform' }}
        run: pnpm tsx scripts/northflank/wait-service.ts "$NORTHFLANK_ADMIN_SERVICE_ID" --timeout-ms 3600000

      - name: Smoke Admin after GPU wiring
        shell: bash
        run: |
          set -Eeuo pipefail
          for i in $(seq 1 30); do
            ping=$(curl -sS --max-time 10 -o /tmp/admin-ping.json -w '%{http_code}' https://admin.elevateforhumanity.org/api/ping || true)
            health=$(curl -sS --max-time 10 -o /tmp/admin-health.json -w '%{http_code}' https://admin.elevateforhumanity.org/api/health || true)
            if [ "$ping" = 200 ] && [ "$health" = 200 ] && grep -q '"ok":true' /tmp/admin-ping.json && grep -q '"ready":true' /tmp/admin-health.json; then
              echo 'Admin is healthy with GPU client configuration loaded.'
              break
            fi
            if [ "$i" = 30 ]; then
              cat /tmp/admin-ping.json 2>/dev/null || true
              cat /tmp/admin-health.json 2>/dev/null || true
              exit 1
            fi
            sleep 15
          done

      - name: Prove Admin can authenticate to the GPU worker
        shell: bash
        run: |
          set -Eeuo pipefail
          for i in $(seq 1 30); do
            status=$(curl -sS --max-time 15 -o /tmp/admin-gpu.json -w '%{http_code}' https://admin.elevateforhumanity.org/api/health/gpu-video || true)
            if [ "$status" = 200 ] && grep -q '"ready":true' /tmp/admin-gpu.json; then
              echo 'Admin GPU client is authenticated and ready.'
              cat /tmp/admin-gpu.json
              exit 0
            fi
            sleep 15
          done
          cat /tmp/admin-gpu.json 2>/dev/null || true
          exit 1
