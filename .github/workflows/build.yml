name: Multi-Container Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'lib/**'
      - 'components/**'
      - 'public/**'
      - 'styles/**'
      - 'data/**'
      - 'types/**'
      - 'hooks/**'
      - 'contexts/**'
      - 'config/**'
      - 'content/**'
      - 'utils/**'
      - 'next.config.mjs'
      - 'tailwind.config.js'
      - 'tsconfig.json'
      - 'proxy.ts'
      - 'Dockerfile.*'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'lib/**'
      - 'components/**'
      - 'next.config.mjs'
      - 'tailwind.config.js'
      - 'tsconfig.json'
      - 'proxy.ts'
      - 'Dockerfile.*'
      - 'pnpm-lock.yaml'
      - 'package.json'

    branches: [main]

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.28.2'

jobs:
  # ============================================
  # BUILD: LMS (Root Next.js App)
  # ============================================
  build-lms:
    name: Build LMS
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build LMS
        run: pnpm run build:lms:phased
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          BUILD_SCOPE: LMS

  # ============================================
  # BUILD: Admin Dashboard
  # ============================================
  build-admin:
    name: Build Admin
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Admin
        run: pnpm run build:admin
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SITE_URL: https://www.elevateforhumanity.org
          NEXT_PUBLIC_WWW_URL: https://www.elevateforhumanity.org
          NEXT_PUBLIC_APP_URL: https://app.elevateforhumanity.org
          NEXT_PUBLIC_ADMIN_URL: https://admin.elevateforhumanity.org

  # ============================================
  # BUILD: Marketing (Public Pages)
  # ============================================
  build-marketing:
    name: Build Marketing
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Marketing
        run: pnpm run build:marketing
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          BUILD_SCOPE: MARKETING

  # ============================================
  # INTEGRITY CHECK
  # ============================================
  integrity:
    name: Integrity Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run integrity checks
        run: |
          pnpm run integrity:links
          pnpm run integrity:media
