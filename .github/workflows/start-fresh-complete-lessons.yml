name: Start fresh complete lesson courses
on:
  workflow_run:
    workflows: ['Deploy Google Course Builder on source changes']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
  id-token: write
jobs:
  dispatch:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_sha == 'ca722cd0a8841db73f74258fb470d4c504347586'
    runs-on: ubuntu-24.04
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/start-fresh-complete-lessons.yml/dispatches" -f ref=main
  start:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: google-course-regional-repair
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - run: node --test tests/worker/complete-lesson-before-advance.test.mjs scripts/gcp/regional-capacity.test.mjs
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        with:
          skip_install: true
      - env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COMPLETE_LESSON_IMAGE_SHA: 'ca722cd0a8841db73f74258fb470d4c504347586'
        run: node scripts/gcp/start-fresh-complete-lessons.mjs
