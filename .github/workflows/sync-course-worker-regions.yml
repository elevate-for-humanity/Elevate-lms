name: Synchronize approved course worker images
on:
  push:
    branches: [main]
    paths: ['scripts/gcp/sync-course-worker-regions.mjs', 'scripts/gcp/sync-course-worker-regions.test.mjs', '.github/workflows/sync-course-worker-regions.yml']
  workflow_run:
    workflows: ['Deploy Google Course Builder on source changes']
    types: [completed]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Successful main Course Builder release to use for renderer recovery
        required: false
        type: string
permissions:
  contents: read
  actions: write
  id-token: write
jobs:
  request:
    if: github.event_name == 'push' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    steps:
      - env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          source_sha="${{ github.event.workflow_run.head_sha }}"
          if test -z "$source_sha"; then
            source_sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-google-course-worker.yml/runs?status=success&branch=main&per_page=1" --jq '.workflow_runs[0].head_sha')"
          fi
          [[ "$source_sha" =~ ^[a-f0-9]{40}$ ]]
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/sync-course-worker-regions.yml/dispatches" -f ref=main -f "inputs[source_sha]=$source_sha"
  sync:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    concurrency:
      group: google-course-parallel-us-east1
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test scripts/gcp/sync-course-worker-regions.test.mjs scripts/gcp/recover-stale-course-renderer.test.mjs
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        with: {skip_install: true}
      - name: Synchronize immutable image without changing worker resources
        run: node scripts/gcp/sync-course-worker-regions.mjs
      - name: Safely transition the diagnosed stale renderer execution
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RENDER_RECOVERY_JOB_ID: a9b85487-5465-4bc0-bed0-9fc3411c4e50
          RENDER_RECOVERY_GENERATION: '53'
          RENDER_RECOVERY_WORKER_SHA: ${{ inputs.source_sha || github.sha }}
        run: node scripts/gcp/recover-stale-course-renderer.mjs
      - name: Wake the existing PARIS course coordinator
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/dispatch-google-course-job.yml/dispatches" -f ref=main
