name: Diagnose finite course execution (read-only)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-google-course-job.yml']
  workflow_dispatch:
    inputs:
      job:
        description: Existing course execution to inspect without mutation
        required: true
        default: elevate-direct-course-release
        type: choice
        options: [elevate-direct-course-release, elevate-course-builder, elevate-course-builder-parallel, elevate-course-builder-overflow, elevate-course-builder-repair]
      region:
        description: Region of the direct completion job
        required: false
        default: us-east1
        type: choice
        options: [us-central1, us-east1]
      execution:
        description: Existing course execution name to inspect
        required: false
        default: latest
        type: string
permissions:
  contents: read
  actions: write
  id-token: write
jobs:
  dispatch:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch read-only Google diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/diagnose-google-course-job.yml/dispatches" -f ref=main
  diagnose:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        with:
          skip_install: true
      - run: node scripts/gcp/verify-sdk.mjs
      - name: Read current deployment identity permission to repair job access
        run: |
          node --input-type=module <<'NODE'
          import {google} from './scripts/gcp/runtime-config.mjs';
          const token=google(['auth','print-access-token']).trim();
          const response=await fetch('https://cloudresourcemanager.googleapis.com/v1/projects/elegant-racer-299721:testIamPermissions',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({permissions:['resourcemanager.projects.setIamPolicy']})});
          if(!response.ok)throw Error('IAM_PERMISSION_READ_HTTP_'+response.status);
          const result=await response.json();
          console.log(JSON.stringify({existingIdentityCanRepairProjectIam:result.permissions?.includes('resourcemanager.projects.setIamPolicy')===true}));
          NODE
      - name: Read Admin worker launch failure codes without secrets
        run: |
          node --input-type=module <<'NODE'
          import {google} from './scripts/gcp/runtime-config.mjs';
          const filter='resource.type="cloud_run_revision" AND resource.labels.service_name="elevate-admin-migration" AND (jsonPayload.message="Direct Google course worker execution unavailable" OR jsonPayload.message="Course Builder worker launch failed through both authorized paths" OR textPayload:"Course Builder worker launch failed")';
          const rows=JSON.parse(google(['logging','read',filter,'--project=elegant-racer-299721','--freshness=2h','--limit=30','--format=json']));
          const code=value=>String(value??'').match(/GOOGLE_[A-Z0-9_]+|HTTP [0-9]{3}|token is not configured|operation was aborted|signal timed out|fetch failed/gi)?.join('; ') || 'unclassified';
          for(const row of rows) {
            let entry=row.jsonPayload;
            if(!entry && row.textPayload)try{entry=JSON.parse(row.textPayload)}catch{}
            const context=entry?.context??{};
            console.log(JSON.stringify({timestamp:row.timestamp,revision:row.resource?.labels?.revision_name,message:entry?.message,google:code(context.google??context.reason),github:code(context.github)}));
          }
          console.log(JSON.stringify({adminLaunchLogCount:rows.length}));
          NODE
      - name: Inspect existing execution without mutation
        env:
          COURSE_EXECUTION: ${{ inputs.execution }}
          COURSE_JOB: ${{ inputs.job }}
          COURSE_REGION: ${{ inputs.region }}
        run: |
          node --input-type=module <<'NODE'
          import {google} from './scripts/gcp/runtime-config.mjs';
          let execution=process.env.COURSE_EXECUTION || 'latest';
          const job=process.env.COURSE_JOB || 'elevate-direct-course-release';
          const regions={'elevate-course-builder':'us-central1','elevate-course-builder-parallel':'us-east1','elevate-course-builder-overflow':'us-east1','elevate-course-builder-repair':'us-east1'};
          const region=job==='elevate-direct-course-release'?(process.env.COURSE_REGION||'us-east1'):regions[job];
          if(!['us-central1','us-east1'].includes(region))throw Error('COURSE_REGION_NOT_AUTHORIZED');
          if(!region)throw Error('COURSE_JOB_NOT_AUTHORIZED');
          const call=args=>JSON.parse(google(args));
          if(execution === 'latest') {
            const executions=call(['run','jobs','executions','list','--job='+job,'--project=elegant-racer-299721','--region='+region,'--limit=100','--sort-by=~metadata.creationTimestamp','--format=json']);
            console.log(JSON.stringify({executionInventory:executions.slice(0,8).map(x=>({name:x.metadata?.name,created:x.metadata?.creationTimestamp,completed:x.status?.conditions?.find(c=>c.type==='Completed')}))}));
            const active=executions.find(x=>!x.status?.completionTime && !['True','False'].includes(x.status?.conditions?.find(c=>c.type==='Completed')?.status));
            execution=(active || executions[0])?.metadata?.name;
          }
          if(!new RegExp('^'+job+'-[a-z0-9]+$').test(execution)) throw new Error('COURSE_EXECUTION_NAME_INVALID');
          const run=call(['run','jobs','executions','describe',execution,'--project=elegant-racer-299721','--region='+region,'--format=json']);
          const task=run.spec?.template?.spec ?? {};
          const container=task.containers?.[0] ?? {};
          console.log(JSON.stringify({job,region,execution,status:run.status,image:container.image,timeoutSeconds:task.timeoutSeconds,maxRetries:task.maxRetries,mode:(container.env || []).filter(x=>['ULTIMATE_WORKER_ONCE','AI_NARRATION_PROVIDER','AI_TRANSCRIPTION_PROVIDER'].includes(x.name))}));
          const filter='resource.type="cloud_run_job" AND resource.labels.job_name="'+job+'" AND labels."run.googleapis.com/execution_name"="'+execution+'"';
          const logs=call(['logging','read',filter,'--project=elegant-racer-299721','--freshness=2h','--limit=200','--format=json']);
          console.log(JSON.stringify({logCount:logs.length,logTypes:[...new Set(logs.map(x=>x.logName))]}));
          for(const item of logs) {
            const structured=Object.fromEntries(['courseId','lessonId','step','state','code','phase','completed','total','at'].filter(key=>item.jsonPayload?.[key]!==undefined).map(key=>[key,item.jsonPayload[key]]));
            const message=String(item.textPayload ?? item.jsonPayload?.message ?? (Object.keys(structured).length?JSON.stringify(structured):''));
            if(!/error|failed|exception|ultimate_|claim|complete|starting|polling|once|narration|render|bundl|mp4|TeachingPhoto|blockReason|finishReasons|candidateCount|partTypes|blocked|BLUEPRINT|grounding|author|model|timeout|attempt|reason|code|message|step|phase|stalled|quota/i.test(message)) continue;
            let safe=message;
            for(const entry of container.env||[])if(/KEY|TOKEN|SECRET|PASSWORD|URL/i.test(entry.name)&&entry.value?.length>5)safe=safe.split(entry.value).join('[redacted]');
            safe=safe.replace(/https?:\/\/\S+/g,'[url]').replace(/Bearer\s+\S+/gi,'Bearer [redacted]').replace(/eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+/g,'[token]').replace(/(token|password|secret|api[_-]?key)\s*[:=]\s*\S+/gi,'$1=[redacted]').slice(0,1500);
            const context=item.jsonPayload?.context ?? {};
            const render=Object.fromEntries(['lessonId','percent','renderedFrames','encodedFrames','totalFrames','fps','concurrency','bytes'].filter(k=>context[k]!==undefined).map(k=>[k,context[k]]));
            console.log(JSON.stringify({timestamp:item.timestamp,severity:item.severity,message:safe,render}));
          }
          NODE
