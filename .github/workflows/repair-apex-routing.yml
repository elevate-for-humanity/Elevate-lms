name: Repair and verify apex routing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-apex-routing.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-apex-routing
  cancel-in-progress: false

jobs:
  repair:
    name: Repair elevateforhumanity.org redirect
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      APEX_DOMAIN: elevateforhumanity.org
    steps:
      - name: Require Cloudflare authorization
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || {
            echo "::error::CLOUDFLARE_API_TOKEN is not configured in the production environment"
            exit 1
          }

      - name: Ensure permanent apex-to-www redirect
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const domain = process.env.APEX_DOMAIN;
          const api = 'https://api.cloudflare.com/client/v4';

          async function request(path, init = {}) {
            const response = await fetch(api + path, {
              ...init,
              headers: {
                Authorization: `Bearer ${token}`,
                'Content-Type': 'application/json',
                ...(init.headers || {}),
              },
            });
            const body = await response.json().catch(() => ({}));
            if (!response.ok || body.success === false) {
              const details = body.errors?.map((item) => item.message).join('; ') || `HTTP ${response.status}`;
              const error = new Error(details);
              error.status = response.status;
              throw error;
            }
            return body.result;
          }

          const zones = await request(`/zones?name=${encodeURIComponent(domain)}&status=active&per_page=1`);
          if (!zones.length) throw new Error(`Active Cloudflare zone not found: ${domain}`);
          const zone = zones[0];

          let ruleset = null;
          try {
            ruleset = await request(`/zones/${zone.id}/rulesets/phases/http_request_dynamic_redirect/entrypoint`);
          } catch (error) {
            if (error.status !== 404) throw error;
          }

          const rule = {
            ref: 'elevate-apex-to-www',
            description: 'Redirect apex to canonical www origin',
            expression: `(http.host eq "${domain}")`,
            action: 'redirect',
            action_parameters: {
              from_value: {
                status_code: 301,
                preserve_query_string: true,
                target_url: {
                  expression: `concat("https://www.${domain}", http.request.uri.path)`,
                },
              },
            },
            enabled: true,
          };

          if (!ruleset) {
            await request(`/zones/${zone.id}/rulesets`, {
              method: 'POST',
              body: JSON.stringify({
                name: 'Canonical hostname redirects',
                kind: 'zone',
                phase: 'http_request_dynamic_redirect',
                rules: [rule],
              }),
            });
            console.log('Created canonical apex redirect ruleset.');
          } else {
            const rules = [...(ruleset.rules || [])];
            const index = rules.findIndex((candidate) =>
              candidate.ref === rule.ref ||
              candidate.expression?.includes(`http.host eq "${domain}"`)
            );
            if (index >= 0) rules[index] = { ...rules[index], ...rule };
            else rules.push(rule);
            await request(`/zones/${zone.id}/rulesets/${ruleset.id}`, {
              method: 'PUT',
              body: JSON.stringify({
                name: ruleset.name,
                description: ruleset.description || '',
                kind: ruleset.kind,
                phase: ruleset.phase,
                rules,
              }),
            });
            console.log(index >= 0 ? 'Updated canonical apex redirect.' : 'Added canonical apex redirect.');
          }
          NODE

      - name: Verify apex and canonical production host
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            apex=$(curl -sS -o /dev/null -w '%{http_code}|%{redirect_url}' --max-time 20 https://elevateforhumanity.org/ || true)
            www=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://www.elevateforhumanity.org/ || true)
            echo "Attempt ${attempt}/12: apex=${apex:-failed} www=${www:-failed}"
            apex_code="${apex%%|*}"
            apex_target="${apex#*|}"
            if { [ "$apex_code" = "301" ] || [ "$apex_code" = "308" ]; } &&
               [[ "$apex_target" == https://www.elevateforhumanity.org/* ]] &&
               [ "$www" = "200" ]; then
              echo "Apex routing is healthy."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Apex routing failed to converge to a permanent www redirect"
          exit 1
