name: Repair Admin PWA Surface

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'fix/northflank-admin-webpack-20260815'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/northflank-admin-webpack-20260815
          fetch-depth: 0
      - name: Remove stale admin restriction copy and diagnostic webpack override
        run: |
          python3 - <<'PY'
          from pathlib import Path

          dashboard = Path('components/admin/dashboard/DashboardShell.tsx')
          s = dashboard.read_text()
          old = '''              <div className="col-span-2 rounded-2xl border border-rose-200 bg-white p-4 shadow-sm sm:col-span-1">\n                <p className="text-xs font-bold text-slate-600">Portal security</p>\n                <p className="mt-1 text-sm font-black text-rose-800">Role restricted</p>\n              </div>'''
          new = '''              <div className="col-span-2 rounded-2xl border border-emerald-200 bg-white p-4 shadow-sm sm:col-span-1">\n                <p className="text-xs font-bold text-slate-600">Access status</p>\n                <p className="mt-1 text-sm font-black text-emerald-800">Authenticated admin</p>\n              </div>'''
          if old not in s:
              raise SystemExit('Expected stale Role restricted dashboard block not found')
          dashboard.write_text(s.replace(old, new, 1))

          config = Path('apps/admin/next.config.mjs')
          s = config.read_text()
          diagnostic = '''    } else {\n      // Diagnostic isolation: determine whether the migrated Admin regression is\n      // exclusively in the browser minification phase. This is not the final fix.\n      config.optimization.minimize = false;\n    }'''
          if diagnostic in s:
              s = s.replace(diagnostic, '    }', 1)
          config.write_text(s)

          audit = Path('scripts/audit-pwa.mjs')
          s = audit.read_text()
          marker = "console.log('\\n── Authenticated role manifests ──');"
          block = """const PWA_LAUNCH_ROUTES = [\n  ['Learner', 'apps/lms/app/lms/(app)/dashboard/page.tsx'],\n  ['Apprentice', 'apps/lms/app/apprentice/page.tsx'],\n  ['Host Shop', 'apps/lms/app/host-shop/dashboard/page.tsx'],\n  ['Program Holder', 'apps/lms/app/program-holder/dashboard/page.tsx'],\n];\n\nconsole.log('\\n── PWA launch routes ──');\nfor (const [name, routeFile] of PWA_LAUNCH_ROUTES) {\n  if (!exists(routeFile)) fail(`${name}: launch route source missing: ${routeFile}`);\n  else pass(`${name}: launch route exists`);\n}\n\n"""
          if 'const PWA_LAUNCH_ROUTES' not in s:
              if marker not in s:
                  raise SystemExit('PWA audit insertion marker not found')
              s = s.replace(marker, block + marker, 1)
              audit.write_text(s)
          PY
      - name: Run PWA source audit
        run: node scripts/audit-pwa.mjs
      - name: Commit repair
        run: |
          git config user.name elevate-production-recovery
          git config user.email actions@users.noreply.github.com
          git add components/admin/dashboard/DashboardShell.tsx apps/admin/next.config.mjs scripts/audit-pwa.mjs
          git commit -m 'fix: repair admin access status and enforce PWA launch routes' || exit 0
          git push origin HEAD:fix/northflank-admin-webpack-20260815
