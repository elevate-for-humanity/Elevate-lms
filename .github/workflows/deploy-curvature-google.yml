name: Verify isolated Curvature deployment prerequisites
on:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy-curvature-google.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: write
  id-token: write
concurrency:
  group: curvature-production
  cancel-in-progress: false
jobs:
  dispatch:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch through approved Google identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-curvature-google.yml/dispatches" -f ref=main
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 20
    env:
      SOURCE_SHA: 452509ab67f6072f8e2270ddb8b27c04162f2977
      PROJECT: elegant-racer-299721
      REGION: us-central1
      RUNTIME: curvature-runtime@elegant-racer-299721.iam.gserviceaccount.com
    steps:
      - uses: actions/checkout@v4
        with:
          repository: elevate-for-humanity/curvature-body-sculpting
          ref: 452509ab67f6072f8e2270ddb8b27c04162f2977
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Test every Curvature page and request handler
        run: npm test
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Verify isolated runtime prerequisites without changing access
        run: |
          set -euo pipefail
          # Provisioning requires the Google project owner. Never substitute a shared runtime.
          gcloud secrets versions describe latest --secret=curvature-supabase-service-role-key --project="$PROJECT" --format='value(state)' | grep -Fx ENABLED
          gcloud iam service-accounts describe "$RUNTIME" --project="$PROJECT" --format='value(email)'
          echo 'Curvature source tests passed and the dedicated runtime exists. Image admission, deployment and custom-domain acceptance remain required.'
