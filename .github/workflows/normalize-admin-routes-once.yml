name: Normalize Admin Routes Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/normalize-admin-routes-once.yml'

permissions:
  contents: write

concurrency:
  group: normalize-admin-routes-once
  cancel-in-progress: false

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize quoted Admin UI routes
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const root = path.join(process.cwd(), 'apps/admin/app');
          const extensions = new Set(['.ts', '.tsx', '.js', '.jsx', '.mjs', '.cjs']);
          let changedFiles = 0;
          let replacements = 0;

          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (extensions.has(path.extname(entry.name))) normalize(full);
            }
          }

          function normalize(file) {
            const original = fs.readFileSync(file, 'utf8');
            let next = original;

            // Admin UI is hosted at admin.elevateforhumanity.org root. Only
            // quoted/template UI paths are changed. /api/admin/* is unaffected.
            for (const quote of ["'", '"', '`']) {
              const prefixed = `${quote}/admin/`;
              const canonical = `${quote}/`;
              const count = next.split(prefixed).length - 1;
              if (count) {
                replacements += count;
                next = next.split(prefixed).join(canonical);
              }

              const exact = `${quote}/admin${quote}`;
              const dashboard = `${quote}/dashboard${quote}`;
              const exactCount = next.split(exact).length - 1;
              if (exactCount) {
                replacements += exactCount;
                next = next.split(exact).join(dashboard);
              }
            }

            if (next !== original) {
              fs.writeFileSync(file, next);
              changedFiles += 1;
            }
          }

          walk(root);
          console.log(`Normalized ${replacements} retired Admin UI references across ${changedFiles} files.`);
          NODE

      - name: Verify API namespace was not rewritten
        shell: bash
        run: |
          set -euo pipefail
          if git diff -- apps/admin/app | grep -E '^[+-].*/api/admin/' >/tmp/admin-api-diff.txt; then
            echo '::error::Codemod attempted to modify /api/admin/ references.'
            cat /tmp/admin-api-diff.txt
            exit 1
          fi

      - name: Commit normalized routes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/admin/app; then
            echo 'No Admin route normalization changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/admin/app
          git commit -m 'fix(admin): normalize internal UI routes to domain roots'
          git push origin HEAD:main
