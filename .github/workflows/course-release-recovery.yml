name: Course release recovery
on:
  workflow_dispatch:
    inputs:
      hours:
        description: 'Diagnostic window in hours'
        default: '720'
        type: string
      apply:
        description: 'Apply checkpoint-specific build recovery (dead leases; exhausted jobs only for requeue_codes)'
        default: false
        type: boolean
      requeue_codes:
        description: 'Comma-separated fixed error codes whose exhausted jobs may be requeued'
        default: ''
        type: string
      sync_release_state:
        description: 'Align courses.status/is_active with durable releases (no republish)'
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: approved-course-publication
  cancel-in-progress: false
jobs:
  recover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      HOURS: ${{ inputs.hours }}
      APPLY: ${{ inputs.apply }}
      REQUEUE_CODES: ${{ inputs.requeue_codes }}
      SYNC_RELEASE_STATE: ${{ inputs.sync_release_state }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/course-recovery" --no-audit --no-fund --ignore-scripts @supabase/supabase-js@2.89.0
          ln -s "$RUNNER_TEMP/course-recovery/node_modules" node_modules
          mkdir -p recovery-evidence
      - name: Reconciliation (before)
        run: node scripts/audits/run-management-sql.mjs scripts/audits/course-release-reconciliation-20261031.sql recovery-evidence/reconciliation-before.json > /dev/null
      - name: Diagnose course builds
        run: |
          set -euo pipefail
          args=(--hours "$HOURS" --json)
          if [ "$APPLY" = "true" ]; then args+=(--apply); fi
          if [ -n "$REQUEUE_CODES" ]; then args+=(--requeue-codes "$REQUEUE_CODES"); fi
          node scripts/diagnose-course-builds.mjs "${args[@]}" | tee recovery-evidence/diagnose.json
      - name: PARIS blocked repairs by error code
        run: node scripts/audits/run-management-sql.mjs scripts/audits/paris-blocked-repairs-by-error.sql recovery-evidence/paris-blocked-by-error.json
      - name: Sync released course state
        if: inputs.sync_release_state
        run: node scripts/audits/run-management-sql.mjs scripts/audits/sync-released-course-state.sql recovery-evidence/sync-release-state.json
      - name: Reconciliation (after)
        run: node scripts/audits/run-management-sql.mjs scripts/audits/course-release-reconciliation-20261031.sql recovery-evidence/reconciliation-after.json > /dev/null
      - name: Summarize findings
        run: |
          node -e '
          const fs=require("fs");
          for (const f of ["before","after"]) {
            const [courses,jobs]=JSON.parse(fs.readFileSync(`recovery-evidence/reconciliation-${f}.json`,"utf8"));
            const counts={};for(const c of courses)counts[c.reconciliation_finding]=(counts[c.reconciliation_finding]||0)+1;
            console.log(f, JSON.stringify(counts));
            for (const c of courses.filter(c=>c.reconciliation_finding!=="RELEASE_CONSISTENT"))
              console.log(`  ${c.reconciliation_finding}\t${c.title}\tstatus=${c.lms_status} active=${c.is_active} total=${c.total_lessons} published=${c.published_lessons} actual=${c.actual_lessons} builds=${c.build_count} release=${c.release_version??"-"}`);
          }'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: course-release-recovery-${{ github.run_id }}
          path: recovery-evidence/
          retention-days: 30
