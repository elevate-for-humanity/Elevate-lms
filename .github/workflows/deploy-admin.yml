name: Deploy Admin

on:
  push:
    branches:
      - main
    paths:
      - 'apps/admin/**'
      - 'lib/**'
      - 'packages/**'
      - 'components/admin/**'
      - 'components/studio/**'
      - 'public/**'
      - 'scripts/northflank/**'
      - 'scripts/verify-no-retired-admin-ui-routes.mjs'
      - 'next.config.mjs'
      - 'tailwind.config.js'
      - 'tsconfig.json'
      - 'proxy.ts'
      - 'Dockerfile.admin'
      - 'Dockerfile.northflank-admin'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy-admin.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: northflank-admin-deploy
  cancel-in-progress: true

jobs:
  deploy-admin:
    name: Build and deploy admin on Northflank
    runs-on: ubuntu-latest
    environment: production
    env:
      NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
      NORTHFLANK_TEAM_ID: ${{ secrets.NORTHFLANK_TEAM_ID || 'elevates-team' }}
      NORTHFLANK_PROJECT_ID: ${{ secrets.NORTHFLANK_PROJECT_ID || 'elevate-platform' }}
      NORTHFLANK_ADMIN_SERVICE_ID: ${{ secrets.NORTHFLANK_ADMIN_SERVICE_ID || 'elevate-admin' }}
      NORTHFLANK_TARGET_SERVICE: admin
      DEPLOY_BRANCH: main
      NORTHFLANK_EPHEMERAL_STORAGE_MB: '32768'
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SITE_URL: https://www.elevateforhumanity.org
      NEXT_PUBLIC_WWW_URL: https://www.elevateforhumanity.org
      NEXT_PUBLIC_APP_URL: https://app.elevateforhumanity.org
      NEXT_PUBLIC_ADMIN_URL: https://admin.elevateforhumanity.org
      NEXT_PUBLIC_FACEBOOK_PIXEL_ID: ${{ secrets.NEXT_PUBLIC_FACEBOOK_PIXEL_ID }}
      ONET_API_KEY: ${{ secrets.ONET_API_KEY }}
      CAREERONESTOP_USER_ID: ${{ secrets.CAREERONESTOP_USER_ID }}
      CAREERONESTOP_TOKEN: ${{ secrets.CAREERONESTOP_TOKEN }}
      USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Prove deployment SHA belongs to main
        shell: bash
        run: |
          set -Eeuo pipefail
          REQUESTED_SHA="${{ github.sha }}"
          git fetch origin main --depth=200
          RESOLVED_SHA="$(git rev-parse "$REQUESTED_SHA^{commit}" 2>/dev/null || true)"
          test -n "$RESOLVED_SHA" || { echo '::error::Deployment SHA cannot be resolved'; exit 1; }
          git merge-base --is-ancestor "$RESOLVED_SHA" origin/main || { echo "::error::Refusing production deploy of SHA not contained in main: $RESOLVED_SHA"; exit 1; }
          test "$RESOLVED_SHA" = "$(git rev-parse HEAD)" || { echo '::error::Checkout SHA mismatch'; exit 1; }
          test "$(git status --porcelain)" = ""
          echo "Verified production Admin SHA $RESOLVED_SHA"

      - name: Block retired Admin UI routes
        run: node scripts/verify-no-retired-admin-ui-routes.mjs

      - name: Set build environment variables
        run: |
          echo "GITHUB_SHA=${{ github.sha }}" >> "$GITHUB_ENV"
          echo "BUILD_SHA=${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Generate version file
        run: |
          cat > public/version.json <<EOF
          {
            "service": "admin",
            "commit": "${{ github.sha }}",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies deterministically
        run: pnpm install --frozen-lockfile --strict-peer-dependencies=false

      - name: Enforce canonical Northflank Admin runtime configuration
        run: pnpm tsx scripts/northflank/configure-services.ts "$NORTHFLANK_ADMIN_SERVICE_ID" --execute

      - name: Verify Admin health-check contract
        run: pnpm tsx scripts/northflank/verify-health-checks.ts "$NORTHFLANK_ADMIN_SERVICE_ID"

      - name: Trigger admin build
        id: trigger_admin_build
        run: pnpm tsx scripts/northflank/trigger-build.ts "$NORTHFLANK_ADMIN_SERVICE_ID"

      - name: Require concrete build id
        run: |
          set -euo pipefail
          test -n "${{ steps.trigger_admin_build.outputs.build_id }}" || { echo '::error::Northflank trigger returned no build_id'; exit 1; }

      - name: Wait for admin build to complete
        run: pnpm tsx scripts/northflank/wait-build.ts "$NORTHFLANK_ADMIN_SERVICE_ID" --build-id "${{ steps.trigger_admin_build.outputs.build_id }}" --timeout-ms 900000

      - name: Verify exact admin build succeeded
        run: |
          pnpm tsx scripts/northflank/verify-build.ts \
            "$NORTHFLANK_ADMIN_SERVICE_ID" \
            --build-id "${{ steps.trigger_admin_build.outputs.build_id }}" \
            --sha "${{ github.sha }}"

      - name: Deploy exact admin build
        run: |
          pnpm tsx scripts/northflank/trigger-deployment.ts \
            "$NORTHFLANK_ADMIN_SERVICE_ID" \
            --build-id "${{ steps.trigger_admin_build.outputs.build_id }}" \
            --sha "${{ github.sha }}"

      - name: Wait for admin deployment
        run: pnpm tsx scripts/northflank/wait-service.ts "$NORTHFLANK_ADMIN_SERVICE_ID" --timeout-ms 1200000

      - name: Smoke Admin liveness and readiness
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            ping_status=$(curl -sS --max-time 10 -o /tmp/admin-ping.json -w "%{http_code}" https://admin.elevateforhumanity.org/api/ping || true)
            health_status=$(curl -sS --max-time 10 -o /tmp/admin-health.json -w "%{http_code}" https://admin.elevateforhumanity.org/api/health || true)
            ping_body=$(cat /tmp/admin-ping.json 2>/dev/null || true)
            health_body=$(cat /tmp/admin-health.json 2>/dev/null || true)
            if [ "$ping_status" = "200" ] && [ "$health_status" = "200" ] \
              && echo "$ping_body" | grep -q '"ok":true' \
              && echo "$health_body" | grep -q '"ready":true'; then
              echo "Admin liveness and readiness passed."
              exit 0
            fi
            echo "Admin not ready: ping=${ping_status} health=${health_status}. Retry ${i}/20."
            sleep 15
          done
          echo "::error::Admin health contract failed after deploy."
          cat /tmp/admin-ping.json 2>/dev/null || true
          cat /tmp/admin-health.json 2>/dev/null || true
          exit 1

      - name: Smoke Admin login API contract
        run: |
          set -euo pipefail
          headers=/tmp/admin-login-headers.txt
          body=/tmp/admin-login-body.json
          status=$(curl -sS --max-time 15 \
            -D "$headers" -o "$body" -w "%{http_code}" -X POST \
            -H 'Content-Type: application/json' -H 'Accept: application/json' \
            --data '{}' https://admin.elevateforhumanity.org/api/auth/admin-login || true)
          content_type=$(awk 'BEGIN{IGNORECASE=1} /^content-type:/ {print $2}' "$headers" | tr -d '\r' | tail -1)
          echo "Admin login contract: status=${status} content-type=${content_type}"
          test "$status" = "400"
          echo "$content_type" | grep -qi '^application/json'
          grep -q '"error":"Email and password required."' "$body"
          if grep -qi '<!DOCTYPE\|<html' "$body"; then
            echo '::error::Admin login endpoint returned HTML instead of JSON.'
            exit 1
          fi

      - name: Verify deployed SHA matches main
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: pnpm tsx scripts/northflank/verify-deployed-sha.ts elevate-admin --trust-deploy-status

      - name: Smoke canonical Admin routes
        run: |
          set -euo pipefail
          for route in /dashboard /studio /course-builder /instructor/dashboard; do
            status=$(curl -sS --max-time 15 -o /tmp/admin-route.html -w "%{http_code}" "https://admin.elevateforhumanity.org${route}" || true)
            case "$status" in
              2*|3*) echo "${route} served HTTP ${status}." ;;
              *) echo "::error::${route} failed HTTP ${status}."; cat /tmp/admin-route.html || true; exit 1 ;;
            esac
          done
