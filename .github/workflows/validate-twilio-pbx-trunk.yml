name: Validate Twilio trunk on isolated PBX image
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/validate-twilio-pbx-trunk.yml', 'scripts/gcp/stage-twilio-trunk.py']
permissions:
  contents: read
  actions: write
  id-token: write
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'google-pbx-infrastructure' || format('twilio-validation-{0}', github.ref) }}
  cancel-in-progress: false
jobs:
  dispatch:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/validate-twilio-pbx-trunk.yml/dispatches" -f ref=main
  validate:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 scripts/gcp/test-stage-twilio-trunk.py
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        with:
          skip_install: true
      - name: Validate existing identity and isolated TLS carrier configuration
        shell: bash
        run: |
          set -euo pipefail
          test "$(gcloud compute instances describe elevate-pbx --project=elegant-racer-299721 --zone=us-central1-a --format='value(networkInterfaces[0].accessConfigs[0].natIP)')" = 107.178.216.162
          gcloud compute ssh elevate-pbx --project=elegant-racer-299721 --zone=us-central1-a --quiet --command='sudo python3 - --install-endpoint' < scripts/gcp/stage-twilio-trunk.py | tee twilio-trunk-validation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: twilio-trunk-validation
          path: twilio-trunk-validation.json
          retention-days: 14
