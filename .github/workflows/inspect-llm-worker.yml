name: Inspect Elevate LLM Worker

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.title == 'INSPECT ELEVATE LLM WORKER'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
    steps:
      - name: Inspect live service and container logs
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$NORTHFLANK_API_TOKEN"
          node <<'NODE'
          const token = process.env.NORTHFLANK_API_TOKEN;
          const base = 'https://api.northflank.com/v1/projects/elevate-media-gpu';
          async function get(path) {
            const response = await fetch(base + path, {
              headers: { authorization: `Bearer ${token}`, accept: 'application/json' },
            });
            const text = await response.text();
            if (!response.ok) throw new Error(`${response.status} ${path}: ${text.slice(0, 1000)}`);
            const parsed = text ? JSON.parse(text) : {};
            return parsed.data ?? parsed;
          }
          const service = await get('/services/elevate-llm-worker');
          console.log('SERVICE_STATUS', JSON.stringify({
            id: service.id,
            name: service.name,
            status: service.status,
            deploymentStatus: service.deploymentStatus,
            image: service.deployment?.external?.imagePath,
            ports: service.ports,
            volumes: service.volumes ?? service.attachedVolumes,
          }, null, 2));
          try {
            const logs = await get('/services/elevate-llm-worker/logs?queryType=range&lineLimit=250&direction=backward');
            const entries = Array.isArray(logs) ? logs : [];
            console.log('CONTAINER_LOG_TAIL');
            for (const entry of entries.reverse()) {
              if (typeof entry.log === 'string') console.log(entry.log);
            }
          } catch (error) {
            console.error('CONTAINER_LOG_UNAVAILABLE', error instanceof Error ? error.message : String(error));
          }
          NODE
