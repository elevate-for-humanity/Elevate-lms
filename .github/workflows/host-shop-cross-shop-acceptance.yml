name: Host Shop authenticated isolation acceptance

# Dedicated production security suite. Do not blend its result with Admin Studio E2E.
# Production service-role credentials must never execute source from PR heads.
# Certify only reviewed main after the LMS release workflow completes.
on:
  pull_request:
    paths:
      - '.github/workflows/host-shop-cross-shop-acceptance.yml'
      - 'scripts/gcp/production-acceptance.*'
  workflow_dispatch:
    inputs:
      deployed_sha:
        description: Exact main LMS commit from a successful release handoff
        required: true
        type: string
      deployment_run_id:
        description: Trusted source LMS deployment workflow run ID
        required: true
        type: string
  workflow_run:
    workflows: ['Deploy LMS automatically on Google']
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: host-shop-cross-shop-qa-${{ github.ref }}
  # Never terminate a running fixture cleanup to start a newer test.
  cancel-in-progress: false

jobs:
  cleanup-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/gcp/production-acceptance.test.mjs scripts/qa/qa-host-shop-alert-cleanup.test.mjs
  authenticated-cross-shop:
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'workflow_dispatch') }}
    name: Authenticated cross-shop isolation (production)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PLAYWRIGHT_LMS_URL: https://lms.elevateforhumanity.org
      PLAYWRIGHT_APPS: lms
      TEST_MODE: 'true'
      QA_CROSS_SHOP_ACCEPTANCE: '1'
      QA_CROSS_SHOP_PREFIX: .qa-host-shop-cross
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Validate production-only, approved QA configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${NEXT_PUBLIC_SUPABASE_URL:-}"
          test -n "${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}"
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}"
          case "${NEXT_PUBLIC_SUPABASE_URL}" in
            https://cuxzzpsyufcewtmicszk.supabase.co) ;;
            *) echo "::error::Refusing to provision against an unexpected database"; exit 1 ;;
          esac
          test "${PLAYWRIGHT_LMS_URL}" = "https://lms.elevateforhumanity.org"
      - name: Verify source release completed before dispatched security acceptance
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPTANCE_COMPONENT: lms
          ACCEPTANCE_SHA: ${{ inputs.deployed_sha }}
          ACCEPTANCE_RUN_ID: ${{ inputs.deployment_run_id }}
        run: |
          set -euo pipefail
          test -n "$ACCEPTANCE_SHA"
          test -n "$ACCEPTANCE_RUN_ID"
          node scripts/gcp/production-acceptance.mjs verify
      - name: Verify exact source-release and current-main production SHA before QA
        shell: bash
        env:
          # Bind a dispatched release to its attested SHA; workflow_run carries its own SHA.
          DEPLOYED_SHA: ${{ inputs.deployed_sha || github.event.workflow_run.head_sha || '' }}
        run: |
          set -euo pipefail
          MAIN_SHA=$(git ls-remote origin refs/heads/main | cut -f1)
          test -n "$MAIN_SHA"
          if [[ -n "$DEPLOYED_SHA" ]]; then
            [[ "$DEPLOYED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Invalid source release SHA"; exit 1; }
            test "$MAIN_SHA" = "$DEPLOYED_SHA" || { echo "::error::main advanced beyond source release"; exit 1; }
          fi
          EXPECTED_SHA="${DEPLOYED_SHA:-$MAIN_SHA}"
          echo "QA_EXPECTED_MAIN_SHA=$EXPECTED_SHA" >> "$GITHUB_ENV"
          EXPECTED_SHA="$EXPECTED_SHA" node --input-type=module -e '
            const r=await fetch("https://lms.elevateforhumanity.org/api/ready",{headers:{"Cache-Control":"no-cache"}});
            const j=await r.json();
            if (!r.ok || j.ready!==true || j.service!=="lms" || j.commit!==process.env.EXPECTED_SHA || (j.missing||[]).length)
              throw new Error("Production LMS readiness/commit mismatch");
            console.log("Production LMS exact SHA:",j.commit);
          '
      - name: Install dependencies and Chromium
        run: |
          pnpm install --frozen-lockfile --strict-peer-dependencies=false --ignore-scripts
          pnpm exec playwright install chromium webkit --with-deps
      - name: Provision two disposable approved Host Shop identities and match requests
        id: provision
        # This job is restricted to trusted main and the attested production LMS.
        # The shared fixture refuses production unless explicitly opted in.
        env:
          QA_E2E_ALLOW_PRODUCTION_DISPOSABLES: '1'
        run: node scripts/qa/host-shop-cross-shop-acceptance.mjs provision
      - name: Certify authenticated roster and cross-shop API isolation
        id: browser
        run: >-
          pnpm exec playwright test tests/e2e/host-shop-cross-shop-production.spec.ts
          --config playwright.config.ts --reporter=line
          --project=desktop-chrome --project=android-chrome --project=iphone-webkit --workers=1 --retries=0
      - name: Confirm exact source-release SHA and current main unchanged after test
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          MAIN_SHA=$(git ls-remote origin refs/heads/main | cut -f1)
          test "$MAIN_SHA" = "$QA_EXPECTED_MAIN_SHA" || { echo "::error::main advanced during Host Shop acceptance"; exit 1; }
          EXPECTED_SHA="$QA_EXPECTED_MAIN_SHA" node --input-type=module -e '
            const r=await fetch("https://lms.elevateforhumanity.org/api/ready",{headers:{"Cache-Control":"no-cache"}});
            const j=await r.json();
            if (!r.ok || j.ready!==true || j.commit!==process.env.EXPECTED_SHA)
              throw new Error("Serving LMS commit changed during security acceptance");
            console.log("Authenticated isolation validated on exact serving SHA:",j.commit);
          '
      - name: Remove disposable match requests, shops, placements, and QA users
        id: cleanup
        # A pre-provision failure has no fixtures; avoid masking the original error
        # with an import failure when pnpm install never ran. Cancellation can leave
        # partial fixtures too, so clean up every started provisioning outcome.
        if: ${{ always() && (steps.provision.outcome == 'success' || steps.provision.outcome == 'failure' || steps.provision.outcome == 'cancelled') }}
        env:
          QA_E2E_ALLOW_PRODUCTION_DISPOSABLES: '1'
        run: node scripts/qa/host-shop-cross-shop-acceptance.mjs cleanup
      # Playwright screenshots, videos, traces and error contexts can contain
      # authenticated browser state. Never upload the raw test-results directory.
      - name: Prepare metadata-only Host Shop failure record
        if: failure()
        shell: bash
        env:
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
        run: |
          set -euo pipefail
          mkdir -p qa-safe-failure
          {
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'workflow_sha=%s\n' "$GITHUB_SHA"
            printf 'attested_release_sha=%s\n' "${QA_EXPECTED_MAIN_SHA:-not_verified}"
            printf 'browser_test_outcome=%s\n' "${BROWSER_OUTCOME:-not_run}"
            printf 'fixture_cleanup_outcome=%s\n' "${CLEANUP_OUTCOME:-not_run}"
            printf 'workflow_outcome=failed\n'
            printf 'browser_artifacts=not_uploaded\n'
          } > qa-safe-failure/summary.txt
      - name: Upload metadata-only Host Shop failure record
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: host-shop-cross-shop-qa-failure
          path: qa-safe-failure/summary.txt
          retention-days: 7
