name: Release approved Google web repairs
# Deploy only after exact-commit CI and an explicitly cleared release hold.
# Service workflows independently retain their hold, capacity and health gates.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-approved-google-web.yml'
      - 'scripts/gcp/release-approved-web.mjs'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: google-approved-web-release-controller
  cancel-in-progress: false
jobs:
  ci-complete:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # workflow_run is privileged: use trusted main only, never PR artifacts.
      - uses: actions/checkout@v4
        with: { ref: main, persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node --test scripts/gcp/release-approved-web.test.mjs
      - name: Hand successful current-main CI to the existing release controller
        env:
          GH_TOKEN: ${{ github.token }}
          GOOGLE_RELEASE_HOLD: ${{ vars.GOOGLE_RELEASE_HOLD }}
        run: node scripts/gcp/release-approved-web.mjs --completed-ci
  dispatch:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch through trusted main identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/release-approved-google-web.yml/dispatches" -f ref=main
  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - run: node --test scripts/gcp/release-approved-web.test.mjs
      - name: Wait for required CI on this exact commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Use the same exact-main, latest-run, CI Required Gate inspector as
          # LMS/Admin release admission; never accept a stale green push result
          # in place of a newer failed workflow_dispatch CI.
          node --input-type=module -e '
            import { requireExactLmsCI } from "./scripts/gcp/require-exact-lms-ci.mjs";
            await requireExactLmsCI(process.env, { attempts: 90, intervalMs: 10000 });
          '
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Dispatch existing guarded web releases using this workflow identity
        if: steps.ci.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GOOGLE_RELEASE_HOLD: ${{ vars.GOOGLE_RELEASE_HOLD }}
        run: node scripts/gcp/release-approved-web.mjs
