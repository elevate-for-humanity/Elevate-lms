name: Consolidate LMS Routes Once

on:
  push:
    branches:
      - main
      - fix/lms-route-consolidation-20260814
    paths:
      - 'scripts/consolidate-lms-routes-once.mjs'
      - '.github/workflows/consolidate-lms-routes-once.yml'

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Consolidate LMS routes
        run: node scripts/consolidate-lms-routes-once.mjs

      - name: Verify canonical LMS routes exist
        run: |
          test -f apps/lms/app/lms/'(app)'/dashboard/page.tsx
          test -f apps/lms/app/apprentice/page.tsx
          test -f apps/lms/app/host-shop/dashboard/page.tsx
          test -f apps/lms/app/login/page.tsx
          test ! -f apps/lms/app/learner/page.tsx
          test ! -f apps/lms/app/lms/login/page.tsx

      - name: Commit consolidation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "refactor(lms): consolidate canonical portal routes"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
