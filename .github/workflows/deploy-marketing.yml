name: Deploy Marketing (www)

on:
  push:
    branches:
      - main
    paths:
      - 'apps/marketing/**'
      - 'apps/lms/**'
      - 'apps/admin/**'
      - 'packages/**'
      - 'public/**'
      - 'styles/**'
      - 'data/**'
      - 'types/**'
      - 'lib/**'
      - 'hooks/**'
      - 'contexts/**'
      - 'config/**'
      - 'content/**'
      - 'utils/**'
      - 'next.config.mjs'
      - 'tailwind.config.js'
      - 'tsconfig.json'
      - 'Dockerfile.marketing'
      - 'Dockerfile.lms'
      - 'Dockerfile.northflank-admin'
      - 'scripts/northflank/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - '.github/workflows/deploy-marketing.yml'
      - 'middleware.ts'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy (defaults to main)'
        required: false
        default: ''

permissions:
  contents: read

# FIX #1: Use separate concurrency group - marketing deploys INDEPENDENTLY
# FIX #2: cancel-in-progress: false to prevent ambiguous states during rollout
concurrency:
  group: northflank-marketing-deploy
  cancel-in-progress: false

env:
  EXPECTED_SHA: ${{ github.sha }}

jobs:
  deploy-marketing:
    name: Build and deploy Marketing (www) on Northflank
    runs-on: ubuntu-latest
    env:
      NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
      NORTHFLANK_TEAM_ID: ${{ secrets.NORTHFLANK_TEAM_ID || 'elevates-team' }}
      NORTHFLANK_PROJECT_ID: ${{ secrets.NORTHFLANK_PROJECT_ID || 'elevate-platform' }}
      NORTHFLANK_MARKETING_SERVICE_ID: ${{ secrets.NORTHFLANK_MARKETING_SERVICE_ID || 'elevate-marketing' }}
      # FIX: Use actual branch from PR (github.head_ref) not hardcoded main
      DEPLOY_BRANCH: ${{ github.head_ref || 'main' }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SITE_URL: https://www.elevateforhumanity.org
      NEXT_PUBLIC_WWW_URL: https://www.elevateforhumanity.org
      NEXT_PUBLIC_APP_URL: https://app.elevateforhumanity.org
      NEXT_PUBLIC_ADMIN_URL: https://admin.elevateforhumanity.org
      NEXT_PUBLIC_FACEBOOK_PIXEL_ID: ${{ secrets.NEXT_PUBLIC_FACEBOOK_PIXEL_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          clean: true

      # FIX: Set GITHUB_SHA env var so trigger-build.ts can read it
      - name: Set build environment variables
        run: |
          echo "GITHUB_SHA=${{ github.sha }}" >> $GITHUB_ENV
          echo "BUILD_SHA=${{ github.sha }}" >> $GITHUB_ENV

      - name: Verify source commit SHA
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          EXPECTED_SHA="${{ github.sha }}"
          echo "Expected SHA: $EXPECTED_SHA"
          echo "Actual SHA:   $ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          test "$(git status --porcelain)" = ""
          echo "GITHUB_SHA env var: $GITHUB_SHA"
          echo "SHA verification passed"

      # Generate version.json for runtime reference (GitHub Actions only)
      - name: Generate version file
        run: |
          cat > public/version.json <<'VERSIONEOF'
          {
            "service": "marketing",
            "commit": "${{ github.sha }}",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          VERSIONEOF
          echo "Generated version.json with SHA: ${{ github.sha }}"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # FIX #3: Cache pnpm store for faster builds
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # Note: Ensure elevate-marketing service is set to "external-git" build mode
      # with Dockerfile path /Dockerfile.marketing in Northflank dashboard before running
      # NOTE: set-service-branch.ts removed — it PATCHes vcsData which can trigger a Northflank
      # auto-build in addition to trigger-build.ts, causing multiple containers to build.
      # trigger-build.ts checks for existing builds by SHA and skips duplicates.

      - name: Trigger Marketing build
        id: trigger_build
        run: pnpm tsx scripts/northflank/trigger-build.ts "$NORTHFLANK_MARKETING_SERVICE_ID"

      - name: Wait for Marketing build to complete
        run: pnpm tsx scripts/northflank/wait-service.ts "$NORTHFLANK_MARKETING_SERVICE_ID" --build-id "${{ steps.trigger_build.outputs.build_id }}" --timeout-ms 3600000

      - name: Roll out latest Marketing image
        run: pnpm tsx scripts/northflank/trigger-deployment.ts "$NORTHFLANK_MARKETING_SERVICE_ID"

      - name: Wait for Marketing deployment
        run: pnpm tsx scripts/northflank/wait-service.ts "$NORTHFLANK_MARKETING_SERVICE_ID" --timeout-ms 1800000

      # FIX #5: Verify deployed SHA matches expected
      - name: Verify Deployed SHA
        run: |
          echo "=========================================="
          echo "SHA VERIFICATION"
          echo "=========================================="
          echo "Expected SHA: ${{ github.sha }}"
          echo "Waiting for deployment to propagate..."
          sleep 30
          
          # Use the verify-sha script to check Northflank API (FAIL on mismatch)
          pnpm tsx scripts/northflank/verify-sha.ts "$NORTHFLANK_MARKETING_SERVICE_ID" --sha "${{ github.sha }}"
          
          echo "SHA verification from Northflank API passed!"

      # FIX #4: Better smoke test - checks actual page content
      - name: Smoke Marketing (www) - Full Validation
        run: |
          set -euo pipefail
          EXPECTED_SHA="${{ github.sha }}"
          MAX_RETRIES=30
          RETRY_INTERVAL=20
          
          echo "=========================================="
          echo "SMOKE TEST"
          echo "=========================================="
          echo "Expected SHA: $EXPECTED_SHA"
          
          for i in $(seq 1 $MAX_RETRIES); do
            # Check health endpoint (use /api/health which returns proper status)
            status=$(curl -sk --max-time 10 -o /tmp/www-health.json -w "%{http_code}" https://www.elevateforhumanity.org/api/health || true)
            body=$(cat /tmp/www-health.json 2>/dev/null || true)
            
            # Accept either "ok":true or "status":"ok" or "status":"healthy"
            if [ "$status" = "200" ] && echo "$body" | grep -qE '"ok":true|"status":"(ok|healthy)"'; then
              echo "✓ Health check passed (HTTP $status)"
              
              # Check build ID in headers (best effort - may not be available)
              build_id=$(curl -sk --max-time 10 -I https://www.elevateforhumanity.org/ 2>/dev/null | grep -i "x-build-id" | head -1 || true)
              if [ -n "$build_id" ]; then
                echo "Build ID: $build_id"
                # Check for dev build
                if echo "$build_id" | grep -qi "dev"; then
                  echo "❌ ERROR: Site is still showing DEV build!"
                  exit 1
                fi
              fi
              
              # Check page loads
              page_status=$(curl -sk --max-time 10 -o /tmp/www-page.html -w "%{http_code}" https://www.elevateforhumanity.org/ || true)
              if [ "$page_status" = "200" ]; then
                echo "✓ Homepage loads (HTTP $page_status)"
                
                # Verify page has expected content
                if grep -q "Elevate" /tmp/www-page.html 2>/dev/null; then
                  echo "✓ Page content verified"
                  echo ""
                  echo "=========================================="
                  echo "✅ MARKETING (WWW) DEPLOYMENT SUCCESSFUL"
                  echo "=========================================="
                  exit 0
                else
                  echo "⚠️  Page loaded but content doesn't match expected"
                fi
              fi
            fi
            
            echo "Attempt $i/$MAX_RETRIES: Not ready. HTTP $status. Retrying in ${RETRY_INTERVAL}s..."
            sleep $RETRY_INTERVAL
          done
          
          echo ""
          echo "=========================================="
          echo "❌ DEPLOYMENT FAILED"
          echo "=========================================="
          echo "Last health response: $body"
          echo ""
          echo "Possible causes:"
          echo "  1. Northflank is returning OLD/dev build"
          echo "  2. DNS/proxy is caching old responses"
          echo "  3. Health check endpoint is not configured"
          exit 1
