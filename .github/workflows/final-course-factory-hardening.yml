name: Final Course Factory Hardening

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: final-course-factory-hardening
  cancel-in-progress: false

jobs:
  harden:
    if: github.event.issue.title == 'RUN FINAL COURSE FACTORY HARDENING'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Re-read current main
        run: |
          git fetch origin main
          git reset --hard origin/main
          echo "MAIN_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Mark started
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment ${{ github.event.issue.number }} --body "FINAL COURSE FACTORY HARDENING STARTED\n\nMain SHA: $(git rev-parse HEAD)"

      - name: Connect deterministic baseline to canonical Course Factory
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          p = Path('lib/course-factory/factory.ts')
          s = p.read_text()

          old_import = "import { buildCourseEvidenceContext } from './evidence-context';\n"
          new_import = old_import + "import { buildDeterministicLessonBaseline } from './deterministic-content';\n"
          if "buildDeterministicLessonBaseline" not in s:
              if old_import not in s:
                  raise SystemExit('factory import anchor changed; refusing unsafe patch')
              s = s.replace(old_import, new_import, 1)

          anchor = "async function enrichBlueprint(\n"
          if "function buildDeterministicBaselineBlueprint(" not in s:
              if anchor not in s:
                  raise SystemExit('enrichBlueprint anchor changed; refusing unsafe patch')
              helper = r'''function deterministicAssessmentQuestions(
            lessonSlug: string,
            lessonTitle: string,
            moduleTitle: string,
            objective: string,
            requestedCount: number,
          ) {
            const stems = [
              {
                question: `What is the best first step when applying ${lessonTitle}?`,
                options: ['Define the goal and gather relevant evidence', 'Choose the first familiar answer', 'Skip documentation', 'Assume missing facts'],
                correctAnswer: 0,
                explanation: 'A defensible decision starts by defining the goal and gathering evidence.',
              },
              {
                question: `Which approach best supports a decision about ${lessonTitle}?`,
                options: ['Compare reasonable options against current evidence', 'Rely on an unsupported assumption', 'Ignore constraints', 'Avoid reviewing results'],
                correctAnswer: 0,
                explanation: 'Comparing options against evidence produces an explainable decision.',
              },
              {
                question: `What should happen after an action related to ${lessonTitle} is completed?`,
                options: ['Review the outcome and complete required follow-up', 'Delete the supporting evidence', 'Assume success', 'Restart unrelated work'],
                correctAnswer: 0,
                explanation: 'Review confirms whether the intended outcome was achieved and whether follow-up is required.',
              },
              {
                question: `If important information about ${lessonTitle} is missing, what is the strongest next action?`,
                options: ['Obtain the missing information before making an unsupported conclusion', 'Invent a value', 'Ignore the gap', 'Choose randomly'],
                correctAnswer: 0,
                explanation: 'Missing evidence should be resolved rather than replaced with an unsupported claim.',
              },
              {
                question: `Why should a ${lessonTitle} decision be documented?`,
                options: ['So another person can understand the evidence, action, and follow-up', 'To avoid accountability', 'To replace the objective', 'To remove the need for review'],
                correctAnswer: 0,
                explanation: 'Documentation preserves evidence and makes the reasoning reviewable.',
              },
              {
                question: `What should you do when conditions affecting ${lessonTitle} change?`,
                options: ['Revisit assumptions and update the plan using current evidence', 'Keep the old answer automatically', 'Ignore new facts', 'Remove the objective'],
                correctAnswer: 0,
                explanation: 'Changed conditions require reassessment using current evidence.',
              },
              {
                question: `Which result best demonstrates mastery of ${objective}?`,
                options: ['Explain and apply the objective using evidence in a realistic situation', 'Repeat a phrase without applying it', 'Skip the practice task', 'Guess until correct'],
                correctAnswer: 0,
                explanation: 'Mastery requires accurate explanation and application, not guessing.',
              },
              {
                question: `A learner repeatedly misses the same ${lessonTitle} objective. What is the appropriate response?`,
                options: ['Complete targeted remediation and retry the objective-aligned practice', 'Restart every completed module', 'Ignore the weak objective', 'Mark mastery anyway'],
                correctAnswer: 0,
                explanation: 'Targeted remediation addresses the demonstrated gap without discarding completed work.',
              },
              {
                question: `Which evidence is strongest when evaluating work in ${moduleTitle}?`,
                options: ['Current approved course/workplace evidence tied to the objective', 'An unsupported guess', 'An unrelated example', 'A stale assumption known to be wrong'],
                correctAnswer: 0,
                explanation: 'Evidence should be current, relevant, and tied to the learning objective.',
              },
              {
                question: `What makes a professional ${lessonTitle} decision explainable?`,
                options: ['A clear goal, verified facts, compared options, documented action, and reviewed result', 'Speed alone', 'Personal preference without evidence', 'Skipping constraints'],
                correctAnswer: 0,
                explanation: 'An explainable decision connects evidence and reasoning to the selected action.',
              },
            ];
            return Array.from({ length: requestedCount }, (_, index) => {
              const base = stems[index % stems.length];
              const cycle = Math.floor(index / stems.length) + 1;
              return {
                id: `${lessonSlug}-baseline-q${index + 1}`,
                ...base,
                question: cycle === 1 ? base.question : `${base.question} (Application set ${cycle})`,
              };
            });
          }

          function buildDeterministicBaselineBlueprint(
            blueprint: CredentialBlueprint,
            courseTitle: string,
            progress: ProgressTracker,
          ): { blueprint: CredentialBlueprint; assessmentsGenerated: number } {
            const baselineBlueprint = cloneBlueprint(blueprint);
            const totalLessons = baselineBlueprint.modules.reduce(
              (sum, courseModule) => sum + (courseModule.lessons ?? []).length,
              0,
            );
            let lessonCounter = 0;
            let assessmentsGenerated = 0;

            for (const courseModule of baselineBlueprint.modules) {
              for (const lesson of courseModule.lessons ?? []) {
                lessonCounter += 1;
                const stepType = inferStepType(lesson.slug);
                const baseline = buildDeterministicLessonBaseline({
                  courseTitle,
                  module: courseModule,
                  lesson,
                });
                lesson.objective = baseline.objective;
                lesson.learningObjectives = baseline.learningObjectives;
                lesson.content = JSON.stringify(baseline.content);
                lesson.learningPoints = baseline.bulletPoints;
                lesson.scenario = baseline.content.scenario;
                lesson.script = baseline.script;
                lesson.bulletPoints = baseline.bulletPoints;

                const assessmentCount = stepType === 'exam' ? 25 : ['checkpoint', 'quiz'].includes(stepType) ? 10 : 3;
                lesson.quizQuestions = deterministicAssessmentQuestions(
                  lesson.slug,
                  lesson.title,
                  courseModule.title,
                  baseline.objective,
                  assessmentCount,
                );
                if (isAssessmentStep(stepType)) assessmentsGenerated += 1;
                synchronizeLessonExperience(lesson as unknown as Record<string, any>);
                progress.emit(
                  isAssessmentStep(stepType) ? 'assess' : 'enrich',
                  `Built deterministic baseline for ${lesson.title}`,
                  Math.max(5, Math.min(75, Math.round((lessonCounter / Math.max(totalLessons, 1)) * 70))),
                );
              }
            }

            return { blueprint: baselineBlueprint, assessmentsGenerated };
          }

          '''
              s = s.replace(anchor, helper + anchor, 1)

          old_logic = """    const courseTitle = input.title || blueprint.title || blueprint.credentialTitle;\n    if (!isAIAvailable() && input.contentSource !== 'blueprint') {\n      throw new Error('AI service is required to generate complete lesson and assessment content.');\n    }\n\n    const enriched =\n      input.contentSource === 'blueprint'\n        ? { blueprint, assessmentsGenerated: 0 }\n        : await enrichBlueprint(blueprint, courseTitle, input, tracker);\n"""
          new_logic = """    const courseTitle = input.title || blueprint.title || blueprint.credentialTitle;\n    const requestedContentSource = input.contentSource ?? 'ai';\n    let effectiveContentSource = requestedContentSource;\n    let enriched: { blueprint: CredentialBlueprint; assessmentsGenerated: number };\n\n    if (requestedContentSource === 'blueprint') {\n      // Blueprint mode remains the durable structure-only checkpoint used by\n      // resumable two-phase builds. It intentionally does not fabricate content.\n      enriched = { blueprint, assessmentsGenerated: 0 };\n    } else {\n      // Every complete-content build starts from a substantive deterministic\n      // baseline. AI is an optional enrichment layer over this durable package.\n      const baseline = buildDeterministicBaselineBlueprint(blueprint, courseTitle, tracker);\n      enriched = baseline;\n      effectiveContentSource = 'curriculum_lessons';\n\n      if (requestedContentSource === 'ai' && isAIAvailable()) {\n        try {\n          enriched = await enrichBlueprint(baseline.blueprint, courseTitle, input, tracker);\n          effectiveContentSource = 'ai';\n        } catch (error) {\n          logger.warn('[course-factory] AI enrichment unavailable; preserving deterministic baseline', {\n            error: error instanceof Error ? error.message : String(error),\n          });\n          tracker.emit('enrich', 'AI enrichment unavailable; continuing with deterministic baseline.', 75);\n        }\n      } else if (requestedContentSource === 'ai') {\n        tracker.emit('enrich', 'No AI provider available; continuing with deterministic baseline.', 75);\n      }\n    }\n"""
          if old_logic not in s:
              raise SystemExit('factory AI dependency block changed; refusing unsafe patch')
          s = s.replace(old_logic, new_logic, 1)

          old_publish = "      contentSource: input.contentSource ?? 'ai',\n"
          new_publish = "      contentSource: effectiveContentSource,\n"
          if old_publish not in s:
              raise SystemExit('factory publish source anchor changed; refusing unsafe patch')
          s = s.replace(old_publish, new_publish, 1)

          p.write_text(s)

          # Clarify that Studio requests optional enrichment rather than a hard dependency.
          ep = Path('lib/agentic/course-executor.ts')
          e = ep.read_text()
          old = "      contentSource: 'ai',\n      videoMode: 'off',\n"
          new = "      // 'ai' means deterministic baseline + optional AI enrichment in the canonical factory.\n      // Provider exhaustion must never prevent the baseline course from completing.\n      contentSource: 'ai',\n      videoMode: 'off',\n"
          if old not in e:
              raise SystemExit('agentic course executor anchor changed; refusing unsafe patch')
          e = e.replace(old, new, 1)
          ep.write_text(e)
          PY

      - name: Verify no hard AI requirement remains in canonical factory
        run: |
          ! grep -R "AI service is required to generate complete lesson and assessment content" lib/course-factory lib/agentic
          grep -q "buildDeterministicBaselineBlueprint" lib/course-factory/factory.ts
          grep -q "AI enrichment unavailable; preserving deterministic baseline" lib/course-factory/factory.ts

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies=false

      - name: Run architecture gates
        run: |
          node scripts/check-course-factory-authority.mjs
          node scripts/check-studio-architecture.mjs

      - name: Typecheck changed execution path
        run: pnpm exec tsc --noEmit --pretty false

      - name: Commit canonical hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/course-factory/factory.ts lib/agentic/course-executor.ts
          if git diff --cached --quiet; then
            echo "No changes required"
          else
            git commit -m "fix(course-factory): make AI enrichment optional"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          echo "RESULT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Report success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment ${{ github.event.issue.number }} --body "FINAL COURSE FACTORY HARDENING PASS\n\nMain SHA: $(git rev-parse HEAD)\n\nDeterministic baseline now precedes optional AI enrichment in the canonical Course Factory; provider exhaustion preserves baseline content."

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment ${{ github.event.issue.number }} --body "FINAL COURSE FACTORY HARDENING FAIL\n\nMain SHA: $(git rev-parse HEAD). Inspect this workflow run; no completion claim is valid."
