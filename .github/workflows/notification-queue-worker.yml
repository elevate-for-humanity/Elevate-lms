name: Notification Queue Worker
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: read
  actions: write
  id-token: write
concurrency:
  group: canonical-notification-queue-worker-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  dispatch:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch trusted main worker
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/notification-queue-worker.yml/dispatches" -f ref=main
  process-notifications:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        with:
          skip_install: true
      - name: Process reviewed outbox through Google Admin
        run: node scripts/gcp/process-notifications.mjs
