name: Supabase Migrations

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Apply pending migrations after the official history check'
        required: false
        type: boolean
        default: false
      confirm:
        description: 'Type APPLY_PRODUCTION when apply=true'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

jobs:
  supabase-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify migration credentials
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for key in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF SUPABASE_DB_PASSWORD; do
            if [ -z "${!key:-}" ]; then
              echo "::error::$key is required for the official Supabase migration workflow"
              missing=1
            fi
          done
          test "$missing" -eq 0

      - name: Verify production apply authorization
        if: ${{ inputs.apply == true }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ inputs.confirm }}" = "APPLY_PRODUCTION" || { echo '::error::confirm must equal APPLY_PRODUCTION when apply=true'; exit 1; }
          REQUESTED_SHA="${{ github.sha }}"
          git fetch origin main --depth=200
          RESOLVED_SHA="$(git rev-parse "$REQUESTED_SHA^{commit}" 2>/dev/null || true)"
          test -n "$RESOLVED_SHA" || { echo '::error::Migration SHA cannot be resolved'; exit 1; }
          git merge-base --is-ancestor "$RESOLVED_SHA" origin/main || { echo "::error::Refusing production migration from SHA not contained in main: $RESOLVED_SHA"; exit 1; }
          test "$RESOLVED_SHA" = "$(git rev-parse HEAD)" || { echo '::error::Checkout SHA mismatch'; exit 1; }
          echo "Authorized supervised production migration SHA $RESOLVED_SHA"

      - name: Lint migrations
        run: node scripts/lint-migrations.cjs

      - name: Audit migration discipline
        run: node scripts/audit-migration-discipline.mjs

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Compare local and official remote migration history
        run: supabase migration list

      - name: Dry-run pending migrations
        run: supabase db push --dry-run

      - name: Apply pending migrations
        if: ${{ inputs.apply == true }}
        run: supabase db push

      - name: Migration mode summary
        run: |
          if [ "${{ inputs.apply }}" = "true" ]; then
            echo "Official supervised Supabase migration push completed."
          else
            echo "Audit-only run completed. Re-run with apply=true and confirm=APPLY_PRODUCTION only after history is reconciled."
          fi
