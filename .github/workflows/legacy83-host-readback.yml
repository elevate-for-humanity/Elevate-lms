name: Legacy 83 host readiness readback
on:
  push:
    branches: [main]
    paths: ['.github/workflows/legacy83-host-readback.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: write
  id-token: write
jobs:
  dispatch:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/legacy83-host-readback.yml/dispatches" -f ref=main
  inspect:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Read isolated host state
        run: |
          gcloud compute instances describe legacy83-website --project=elegant-racer-299721 --zone=us-central1-a --format='json(name,status,networkInterfaces,serviceAccounts,labels)'
          gcloud compute instances get-serial-port-output legacy83-website --project=elegant-racer-299721 --zone=us-central1-a --port=1 --start=0 2>&1 | tail -n 65
          gcloud secrets list --project=elegant-racer-299721 --format='value(name)' | grep -Ei 'cloudflare|dns|domain' || true
