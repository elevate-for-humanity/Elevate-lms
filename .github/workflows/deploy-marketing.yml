name: Deploy Marketing (www)

# Deployment checkpoint: strict-boundary repair convergence

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'apps/admin/**'
      - 'components/admin/**'
      - 'lib/admin/**'
      - 'apps/lms/**'
      - 'components/lms/**'
      - '.github/workflows/deploy-admin.yml'
      - '.github/workflows/deploy-lms.yml'
      - 'scripts/verify-admin-*.mjs'
      - 'scripts/verify-lms-*.mjs'
      - 'public/manifest-admin.json'
      - 'public/sw-admin.js'
  workflow_dispatch:
    inputs:
      sync_secrets:
        description: 'Synchronize shared production secret group to all three services'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: northflank-marketing-deploy
  # Never terminate an active production deployment when another commit lands.
  # GitHub still keeps only the newest pending run for this concurrency group.
  cancel-in-progress: false

env:
  EXPECTED_SHA: ${{ github.sha }}

jobs:
  deploy-marketing:
    name: Build and deploy Marketing (www) on Northflank
    runs-on: ubuntu-latest
    environment: production
    env:
      NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
      NORTHFLANK_TEAM_ID: ${{ secrets.NORTHFLANK_TEAM_ID || 'elevates-team' }}
      NORTHFLANK_PROJECT_ID: ${{ secrets.NORTHFLANK_PROJECT_ID || 'elevate-platform' }}
      NORTHFLANK_MARKETING_SERVICE_ID: ${{ secrets.NORTHFLANK_MARKETING_SERVICE_ID || 'elevate-marketing' }}
      NORTHFLANK_LMS_SERVICE_ID: ${{ secrets.NORTHFLANK_LMS_SERVICE_ID || 'elevate-lms' }}
      NORTHFLANK_ADMIN_SERVICE_ID: ${{ secrets.NORTHFLANK_ADMIN_SERVICE_ID || 'elevate-admin' }}
      NORTHFLANK_SECRET_GROUP_ID: ${{ secrets.NORTHFLANK_SECRET_GROUP_ID || 'elevate-production-env' }}
      FORCE_FRESH_BUILD: 'true'
      DEPLOY_BRANCH: main
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
      NEXT_PUBLIC_SITE_URL: https://www.elevateforhumanity.org
      NEXT_PUBLIC_PUBLIC_SITE_URL: https://www.elevateforhumanity.org
      NEXT_PUBLIC_WWW_URL: https://www.elevateforhumanity.org
      NEXT_PUBLIC_APP_URL: https://app.elevateforhumanity.org
      NEXT_PUBLIC_LMS_URL: https://app.elevateforhumanity.org
      NEXT_PUBLIC_ADMIN_URL: https://admin.elevateforhumanity.org
      NEXT_PUBLIC_FACEBOOK_PIXEL_ID: ${{ secrets.NEXT_PUBLIC_FACEBOOK_PIXEL_ID }}

    steps:
      - name: Checkout exact triggering revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Prove deployment SHA belongs to main
        shell: bash
        run: |
          set -Eeuo pipefail
          REQUESTED_SHA="${{ github.sha }}"
          git fetch origin main --depth=200
          RESOLVED_SHA="$(git rev-parse "$REQUESTED_SHA^{commit}" 2>/dev/null || true)"
          test -n "$RESOLVED_SHA" || { echo '::error::Deployment SHA cannot be resolved'; exit 1; }
          git merge-base --is-ancestor "$RESOLVED_SHA" origin/main || { echo "::error::Refusing production deploy of SHA not contained in main: $RESOLVED_SHA"; exit 1; }
          test "$RESOLVED_SHA" = "$(git rev-parse HEAD)" || { echo '::error::Checkout SHA mismatch'; exit 1; }
          test "$(git status --porcelain)" = ""
          echo "Verified production Marketing SHA $RESOLVED_SHA belongs to main"

      - name: Set build environment variables
        run: |
          echo "GITHUB_SHA=${{ github.sha }}" >> "$GITHUB_ENV"
          echo "GIT_SHA=${{ github.sha }}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_GIT_SHA=${{ github.sha }}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_BUILD_ID=marketing-${{ github.sha }}" >> "$GITHUB_ENV"
          echo "BUILD_SHA=${{ github.sha }}" >> "$GITHUB_ENV"
          echo "BUILD_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies deterministically
        run: pnpm install --frozen-lockfile --strict-peer-dependencies=false

      - name: Audit all canonical hero videos
        run: pnpm tsx scripts/verify-hero-video-registry.ts --live

      - name: Enforce public government-claim integrity
        run: node scripts/check-public-claims.mjs

      - name: Enforce public address integrity
        run: node scripts/check-public-address-integrity.mjs

      - name: Verify production deployment credentials
        run: |
          set -euo pipefail
          required=(NORTHFLANK_API_TOKEN NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY)
          for name in "${required[@]}"; do
            test -n "${!name:-}" || { echo "::error::$name GitHub secret is missing"; exit 1; }
          done
          echo "Marketing deployment credentials are configured"

      - name: Sync production env when explicitly requested
        if: github.event_name == 'workflow_dispatch' && inputs.sync_secrets == true
        run: pnpm tsx scripts/northflank/sync-env.ts --execute

      - name: Enforce canonical Northflank Marketing configuration
        run: pnpm tsx scripts/northflank/configure-services.ts "$NORTHFLANK_MARKETING_SERVICE_ID" --execute

      - name: Record predeploy upstream health
        id: predeploy
        run: |
          set -euo pipefail
          status=$(curl -sS --max-time 10 -o /tmp/predeploy-health.json -w "%{http_code}" https://www.elevateforhumanity.org/api/health || true)
          if [ "$status" = "200" ]; then
            echo "was_healthy=true" >> "$GITHUB_OUTPUT"
          else
            echo "was_healthy=false" >> "$GITHUB_OUTPUT"
            echo "Existing upstream returned HTTP $status; continuing in supervised recovery mode."
          fi

      - name: Acquire queued Marketing build
        id: trigger_build
        run: pnpm tsx scripts/northflank/trigger-build.ts "$NORTHFLANK_MARKETING_SERVICE_ID"

      - name: Require concrete Northflank build id
        run: |
          set -euo pipefail
          BUILD_ID="${{ steps.trigger_build.outputs.build_id }}"
          test -n "$BUILD_ID" || { echo "::error::Northflank trigger returned no build_id"; exit 1; }
          echo "Northflank build id: $BUILD_ID"
          echo "Reused existing build: ${{ steps.trigger_build.outputs.reused_build }}"

      - name: Wait for Marketing build
        run: pnpm tsx scripts/northflank/wait-service.ts "$NORTHFLANK_MARKETING_SERVICE_ID" --build-id "${{ steps.trigger_build.outputs.build_id }}" --timeout-ms 3600000

      - name: Verify exact Marketing build
        run: |
          pnpm tsx scripts/northflank/verify-build.ts \
            "$NORTHFLANK_MARKETING_SERVICE_ID" \
            --build-id "${{ steps.trigger_build.outputs.build_id }}" \
            --sha "${{ github.sha }}"

      - name: Reconfirm exact checkout before deployment
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main --depth=200
          test "$(git rev-parse HEAD)" = "${{ github.sha }}" || { echo '::error::Checkout moved during deployment'; exit 1; }
          git merge-base --is-ancestor "${{ github.sha }}" origin/main || { echo '::error::Deployment SHA no longer belongs to main'; exit 1; }
          test "$(git status --porcelain)" = "" || { echo '::error::Checkout became dirty during deployment'; git status --short; exit 1; }
          echo "Exact verified Marketing SHA remains ready for deployment: ${{ github.sha }}"

      - name: Deploy exact Marketing build
        run: |
          set -euo pipefail
          pnpm tsx scripts/northflank/trigger-deployment.ts \
            "$NORTHFLANK_MARKETING_SERVICE_ID" \
            --build-id "${{ steps.trigger_build.outputs.build_id }}" \
            --sha "${{ github.sha }}"
          pnpm tsx scripts/northflank/wait-service.ts "$NORTHFLANK_MARKETING_SERVICE_ID" --timeout-ms 900000

      - name: Verify Northflank deployment SHA
        run: pnpm tsx scripts/northflank/verify-sha.ts "$NORTHFLANK_MARKETING_SERVICE_ID" --sha "${{ github.sha }}"

      - name: Smoke production and require exact live SHA
        run: |
          set -euo pipefail
          EXPECTED_SHA="${{ github.sha }}"
          for i in $(seq 1 30); do
            ping_status=$(curl -sS --max-time 10 -o /tmp/www-ping.json -w "%{http_code}" "https://www.elevateforhumanity.org/api/ping?deploy=${EXPECTED_SHA}" || true)
            ready_status=$(curl -sS --max-time 10 -o /tmp/www-ready.json -w "%{http_code}" "https://www.elevateforhumanity.org/api/ready?deploy=${EXPECTED_SHA}" || true)
            health_status=$(curl -sS --max-time 10 -o /tmp/www-health.json -w "%{http_code}" "https://www.elevateforhumanity.org/api/health?deploy=${EXPECTED_SHA}" || true)
            version_status=$(curl -sS --max-time 10 -o /tmp/www-version.json -w "%{http_code}" "https://www.elevateforhumanity.org/api/version?deploy=${EXPECTED_SHA}" || true)
            home_status=$(curl -sS --max-time 15 -o /tmp/www-home.html -w "%{http_code}" "https://www.elevateforhumanity.org/?deploy=${EXPECTED_SHA}" || true)
            barber_status=$(curl -sS --max-time 15 -o /tmp/www-barber.html -w "%{http_code}" "https://www.elevateforhumanity.org/programs/barber-apprenticeship?deploy=${EXPECTED_SHA}" || true)
            esthetics_status=$(curl -sS --max-time 15 -o /tmp/www-esthetics.html -w "%{http_code}" "https://www.elevateforhumanity.org/programs/esthetician-apprenticeship?deploy=${EXPECTED_SHA}" || true)
            sitemap_status=$(curl -sS --max-time 15 -o /tmp/www-sitemap.xml -w "%{http_code}" "https://www.elevateforhumanity.org/sitemap.xml?deploy=${EXPECTED_SHA}" || true)
            razors_status=$(curl -sS --max-time 15 -o /tmp/razors-image.webp -w "%{http_code}" "https://www.elevateforhumanity.org/images/partners/razors-image-storefront.webp?deploy=${EXPECTED_SHA}" || true)
            hero_status=$(curl -sS --max-time 15 -o /tmp/home-hero.webp -w "%{http_code}" "https://www.elevateforhumanity.org/images/heroes/hero-homepage.webp?deploy=${EXPECTED_SHA}" || true)
            audio_status=$(curl -sS --max-time 15 -o /tmp/home-audio.mp3 -w "%{http_code}" "https://www.elevateforhumanity.org/audio/heroes/home.mp3?deploy=${EXPECTED_SHA}" || true)
            LIVE_SHA="$(node -e "try{const d=require('/tmp/www-version.json');process.stdout.write(d.commitSha||d.commit||'')}catch(e){}")"
            razors_bytes=$(wc -c < /tmp/razors-image.webp 2>/dev/null || echo 0)
            hero_bytes=$(wc -c < /tmp/home-hero.webp 2>/dev/null || echo 0)
            audio_bytes=$(wc -c < /tmp/home-audio.mp3 2>/dev/null || echo 0)
            echo "Attempt $i/30: ping=$ping_status ready=$ready_status health=$health_status version=$version_status home=$home_status barber=$barber_status esthetics=$esthetics_status sitemap=$sitemap_status razors=$razors_status/$razors_bytes hero=$hero_status/$hero_bytes audio=$audio_status/$audio_bytes live_sha=${LIVE_SHA:-missing}"

            html_ok=false
            if grep -qi '<html' /tmp/www-home.html \
              && grep -q 'Earn while you learn—or become a Host Shop for free.' /tmp/www-home.html \
              && grep -q 'Barber Apprenticeship' /tmp/www-barber.html \
              && grep -q 'Esthetician Apprenticeship Pathway' /tmp/www-esthetics.html \
              && grep -q '300 related-instruction hours' /tmp/www-esthetics.html \
              && grep -q 'RAPIDS occupation 2089CB' /tmp/www-esthetics.html \
              && ! grep -q '700-hour' /tmp/www-esthetics.html \
              && ! grep -q 'Professional Esthetician & Client Services' /tmp/www-esthetics.html \
              && grep -q '/programs/esthetician-apprenticeship' /tmp/www-sitemap.xml; then
              html_ok=true
            fi

            if [ "$ping_status" = "200" ] \
              && [ "$ready_status" = "200" ] \
              && [ "$health_status" = "200" ] \
              && [ "$version_status" = "200" ] \
              && grep -q '"ok":true' /tmp/www-ping.json \
              && grep -q '"ready":true' /tmp/www-ready.json \
              && grep -q '"healthy":true' /tmp/www-health.json \
              && [ "$home_status" = "200" ] \
              && [ "$barber_status" = "200" ] \
              && [ "$esthetics_status" = "200" ] \
              && [ "$sitemap_status" = "200" ] \
              && [ "$razors_status" = "200" ] \
              && [ "$hero_status" = "200" ] \
              && [ "$audio_status" = "200" ] \
              && [ "$razors_bytes" -gt 1000 ] \
              && [ "$hero_bytes" -gt 1000 ] \
              && [ "$audio_bytes" -gt 1000 ] \
              && [ "$LIVE_SHA" = "$EXPECTED_SHA" ] \
              && [ "$html_ok" = "true" ]; then
              echo "MARKETING DEPLOYMENT VERIFIED: $EXPECTED_SHA is live, ready, dependency-healthy, and serving canonical homepage media"
              exit 0
            fi
            sleep 20
          done
          echo "::error::DEPLOYMENT FAILED: production did not converge to $EXPECTED_SHA with required runtime, homepage media, canonical, and Esthetician regression checks"
          cat /tmp/www-ping.json 2>/dev/null || true
          cat /tmp/www-ready.json 2>/dev/null || true
          cat /tmp/www-health.json 2>/dev/null || true
          cat /tmp/www-version.json 2>/dev/null || true
          grep -Eo '<title>[^<]+' /tmp/www-esthetics.html 2>/dev/null || true
          exit 1

      - name: Smoke compatibility routes, recovery UI, legal copy, and CDL media
        run: |
          set -euo pipefail

          assert_redirect() {
            label="$1"
            source_url="$2"
            expected_url="$3"
            result=$(curl -sS -L --max-redirs 5 --max-time 30 -o "/tmp/${label}.body" -w '%{http_code}|%{url_effective}' "$source_url")
            status="${result%%|*}"
            effective_url="${result#*|}"
            echo "$label: status=$status effective_url=$effective_url"
            test "$status" = "200"
            test "$effective_url" = "$expected_url"
          }

          assert_redirect legal-terms https://www.elevateforhumanity.org/legal/terms https://www.elevateforhumanity.org/terms-of-service
          assert_redirect testing-schedule https://www.elevateforhumanity.org/testing/schedule https://www.elevateforhumanity.org/testing/book
          assert_redirect legal-privacy https://www.elevateforhumanity.org/legal/privacy https://www.elevateforhumanity.org/privacy
          assert_redirect verify-credentials https://www.elevateforhumanity.org/verify-credentials https://app.elevateforhumanity.org/verify-credentials

          # Northflank may briefly route the first post-deploy request through
          # a draining replica. Require the real 404 UI, but allow the same
          # bounded convergence window used by the deployment health check.
          missing_ready=false
          for attempt in $(seq 1 6); do
            missing_status=$(curl -sS --max-time 20 -o /tmp/www-not-found.html -w '%{http_code}' https://www.elevateforhumanity.org/deployment-route-audit-not-found || true)
            echo "404 recovery attempt ${attempt}/6: status=${missing_status:-request-failed}"
            if [ "$missing_status" = "404" ] && grep -q 'right path' /tmp/www-not-found.html; then
              missing_ready=true
              break
            fi
            sleep 5
          done
          test "$missing_ready" = "true"

          curl -fsS --max-time 20 https://www.elevateforhumanity.org/legal/student-handbook -o /tmp/student-handbook.html
          ! grep -q 'Indianapolis, IN 46220, Indianapolis, IN 46220' /tmp/student-handbook.html

          curl -fsS --max-time 30 https://www.elevateforhumanity.org/programs/cdl-training -o /tmp/cdl-page.html
          grep -q 'https://pub-23811be4d3844e45a8bc2d3dc5e7aaec.r2.dev/videos/cdl-hero.mp4' /tmp/cdl-page.html
          grep -q '/audio/heroes/cdl.mp3' /tmp/cdl-page.html
          grep -q 'Video transcript' /tmp/cdl-page.html
          grep -q 'Play hero audio' /tmp/cdl-page.html

          curl -fsS --range 0-1023 --max-time 30 -D /tmp/cdl-video.headers -o /tmp/cdl-video.bin https://pub-23811be4d3844e45a8bc2d3dc5e7aaec.r2.dev/videos/cdl-hero.mp4
          grep -qi '^content-type: video/mp4' /tmp/cdl-video.headers
          grep -qi '^accept-ranges: bytes' /tmp/cdl-video.headers
          test "$(wc -c < /tmp/cdl-video.bin)" -gt 0

          curl -fsS --max-time 30 -D /tmp/cdl-audio.headers -o /tmp/cdl-audio.mp3 https://www.elevateforhumanity.org/audio/heroes/cdl.mp3
          grep -qi '^content-type: audio/' /tmp/cdl-audio.headers
          test "$(wc -c < /tmp/cdl-audio.mp3)" -gt 1000

          curl -fsS --max-time 30 -D /tmp/cdl-poster.headers -o /tmp/cdl-poster.webp https://www.elevateforhumanity.org/images/pages/cdl-hero.webp
          grep -qi '^content-type: image/webp' /tmp/cdl-poster.headers
          test "$(wc -c < /tmp/cdl-poster.webp)" -gt 1000

          # CNA must remain explicitly self-pay and must use claim-free, playable hero media.
          curl -fsS --max-time 30 https://www.elevateforhumanity.org/programs/cna -o /tmp/cna-page.html
          grep -q 'Self-Pay Program' /tmp/cna-page.html
          grep -q 'Self-Pay Available' /tmp/cna-page.html
          grep -q 'cna-hero.mp4' /tmp/cna-page.html

          curl -fsS --range 0-1023 --max-time 30 -D /tmp/cna-video.headers -o /tmp/cna-video.bin https://pub-23811be4d3844e45a8bc2d3dc5e7aaec.r2.dev/videos/cna-hero.mp4
          grep -qi '^content-type: video/mp4' /tmp/cna-video.headers
          test "$(wc -c < /tmp/cna-video.bin)" -gt 0

          # Trial owners must be directed through password creation before PARIS.
          curl -fsS --max-time 20 https://www.elevateforhumanity.org/auth/set-password -o /tmp/set-password.html
          grep -qi 'create.*password\|set.*password' /tmp/set-password.html
