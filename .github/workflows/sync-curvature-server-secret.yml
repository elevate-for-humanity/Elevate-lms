name: Sync Curvature server credential
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sync-curvature-server-secret.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: write
  id-token: write
jobs:
  dispatch:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/sync-curvature-server-secret.yml/dispatches" -f ref=main
  sync:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        with: { skip_install: true }
      - name: Validate and transfer existing key between provider APIs without logging values
        env:
          MANAGEMENT_TOKEN: ${{ secrets.SUPABASE_MANAGEMENT_API_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import {spawnSync} from 'node:child_process';
          const token=process.env.MANAGEMENT_TOKEN;
          if(!token) throw new Error('Supabase management credential is not configured');
          const ref='pztctqvzvsitcsvdolqr', project='elegant-racer-299721', secret='curvature-supabase-service-role-key';
          const response=await fetch('https://api.supabase.com/v1/projects/'+ref+'/api-keys?reveal=true',{headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(30000)});
          if(!response.ok) throw new Error('Supabase management API credential lookup failed: HTTP '+response.status);
          const data=await response.json();
          const keys=Array.isArray(data)?data:data.keys;
          const selected=keys?.find(k=>k.type==='secret'&&k.name==='default'&&!k.disabled)||keys?.find(k=>k.name==='service_role'&&!k.disabled);
          const key=selected?.api_key;
          if(typeof key!=='string'||key.length<30||key.includes('*')||key.includes('•')) throw new Error('No usable existing server key was returned');
          const headers={apikey:key};
          if(!key.startsWith('sb_secret_')) headers.Authorization='Bearer '+key;
          const ready=await fetch('https://'+ref+'.supabase.co/rest/v1/curvature_requests?select=id&limit=0',{headers,signal:AbortSignal.timeout(30000)});
          if(!ready.ok) throw new Error('Dedicated Curvature key validation failed: HTTP '+ready.status);
          function cloud(args,input){const r=spawnSync('gcloud',args,{input,encoding:'utf8',stdio:['pipe','pipe','pipe'],timeout:60000});if(r.status!==0)throw new Error('Google credential configuration failed for '+args.slice(0,3).join(' '));return r.stdout;}
          const exists=spawnSync('gcloud',['secrets','describe',secret,'--project='+project],{stdio:'pipe'}).status===0;
          if(!exists) cloud(['secrets','create',secret,'--project='+project,'--replication-policy=automatic','--data-file=-','--quiet'],key);
          else {
            const current=cloud(['secrets','versions','access','latest','--secret='+secret,'--project='+project]);
            if(current.trim()!==key.trim()) cloud(['secrets','versions','add',secret,'--project='+project,'--data-file=-','--quiet'],key);
          }
          const account='curvature-runtime@'+project+'.iam.gserviceaccount.com';
          if(spawnSync('gcloud',['iam','service-accounts','describe',account,'--project='+project],{stdio:'pipe'}).status!==0) cloud(['iam','service-accounts','create','curvature-runtime','--project='+project,'--display-name=Curvature backend runtime','--quiet']);
          cloud(['secrets','add-iam-policy-binding',secret,'--project='+project,'--member=serviceAccount:'+account,'--role=roles/secretmanager.secretAccessor','--quiet']);
          console.log('Existing Curvature key validated against its dedicated database and installed in Google Secret Manager. No key values emitted.');
          NODE
