name: Verified B2 Course Media Transfer
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Inspect the existing connection or copy a verified private batch
        required: true
        type: choice
        default: audit
        options: [audit, copy]
      limit:
        description: Number of objects in this batch (1-25)
        required: true
        default: '1'
      skip:
        description: Number of source objects already examined
        required: true
        default: '0'
permissions:
  contents: read
  id-token: write
concurrency:
  group: course-media-b2-transfer
  cancel-in-progress: false
jobs:
  transfer:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    environment: production
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install locked dependencies
        run: corepack enable && corepack pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify the runtime transfer boundary
        run: node --test scripts/gcp/run-runtime-b2-transfer.test.mjs scripts/gcp/resolve-owner-preview-b2.test.mjs scripts/gcp/course-media-transfer-retry.test.mjs
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Use the existing Google worker connection without logging credentials
        env:
          COURSE_MEDIA_TRANSFER_MODE: ${{ inputs.mode }}
          MIGRATION_LIMIT: ${{ inputs.limit }}
          MIGRATION_SKIP: ${{ inputs.skip }}
        run: |
          set -euo pipefail
          gcloud run jobs describe elevate-course-builder --project=elegant-racer-299721 --region=us-central1 --format=json | node scripts/gcp/run-runtime-b2-transfer.mjs
