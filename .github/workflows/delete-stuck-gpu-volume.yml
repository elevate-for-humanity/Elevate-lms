name: Delete Stuck GPU Volume

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/delete-stuck-gpu-volume.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delete-volume:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
      NORTHFLANK_TEAM_ID: ${{ secrets.NORTHFLANK_TEAM_ID || 'elevates-team' }}
      NORTHFLANK_GPU_PROJECT_ID: elevate-media-gpu
      GPU_VOLUME_ID: elevate-gpu-models
    steps:
      - name: Delete only the stuck GPU volume
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$NORTHFLANK_API_TOKEN"
          base="https://api.northflank.com/v1/teams/${NORTHFLANK_TEAM_ID}/projects/${NORTHFLANK_GPU_PROJECT_ID}"
          auth=(-H "Authorization: Bearer ${NORTHFLANK_API_TOKEN}" -H 'Content-Type: application/json')
          code=$(curl -sS -o /tmp/before.json -w '%{http_code}' "${auth[@]}" "$base/volumes/${GPU_VOLUME_ID}" || true)
          echo "before_http=$code"
          if [ "$code" = "200" ]; then
            dcode=$(curl -sS -o /tmp/delete.json -w '%{http_code}' -X DELETE "${auth[@]}" "$base/volumes/${GPU_VOLUME_ID}" || true)
            echo "delete_http=$dcode"
            if [ "$dcode" != "200" ] && [ "$dcode" != "202" ] && [ "$dcode" != "204" ]; then
              cat /tmp/delete.json || true
              exit 1
            fi
          elif [ "$code" != "404" ]; then
            cat /tmp/before.json || true
            exit 1
          fi
          sleep 5
          fcode=$(curl -sS -o /tmp/after.json -w '%{http_code}' "${auth[@]}" "$base/volumes/${GPU_VOLUME_ID}" || true)
          echo "after_http=$fcode"
          test "$fcode" = "404"
          echo "GPU volume removed"
