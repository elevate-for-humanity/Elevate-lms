name: PARIS repair unblock regressions
on:
  pull_request:
    paths:
      - 'scripts/gcp/smoke-marketing-container.mjs'
      - 'scripts/gcp/store-smoke-import-boundary.test.mjs'
      - 'scripts/gcp/paris-course-monitor.mjs'
      - 'scripts/gcp/paris-course-monitor.test.mjs'
      - '.github/workflows/deploy-google-store-runtime.yml'
      - '.github/workflows/paris-repair-unblock-regressions.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Store smoke dependency boundary and latest Course Builder producer
        run: node --test scripts/gcp/store-smoke-import-boundary.test.mjs scripts/gcp/paris-course-monitor.test.mjs
