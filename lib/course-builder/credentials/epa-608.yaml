# EPA Section 608 Universal Certification
# https://www.epa.gov/section608

name: EPA Section 608 Universal Technician Certification
slug: epa-608-universal
provider: Environmental Protection Agency (EPA)
category: trades
type: certification
description: EPA Section 608 Universal Certification for HVAC/R technicians who work with refrigerants. Required for any technician who purchases or works with refrigerants.

# Exam details
examSections:
  - name: Core
    questions: 25
    passingScore: 70
    topics:
      - Ozone depletion
      - Clean Air Act
      - Montreal Protocol
      - Refrigerant types
      - Recovery techniques
      - Safety procedures
  - name: Type I (Small Appliances)
    questions: 20
    passingScore: 70
    topics:
      - Small appliance recovery
      - Self-contained recovery equipment
      - Critical charging
  - name: Type II (High-Pressure)
    questions: 20
    passingScore: 70
    topics:
      - High-pressure recovery
      - Low-pressure recovery
      - Pressure gauges
      - Service procedures
  - name: Type III (Low-Pressure)
    questions: 20
    passingScore: 70
    topics:
      - Low-pressure refrigerants
      - Trichlorofluoromethane (R-11)
      - Centrifugal chillers
  - name: Universal
    questions: 15
    passingScore: 70
    topics:
      - Comprehensive recovery
      - Recovery equipment
      - Certification requirements

totalQuestions: 100
passingScore: 70
examFormat: "100 questions, multiple choice, 2 hours, closed book"
examFrequency: "By appointment at approved testing centers"
retakePolicy: "After 30 days"

# Validity
validityPeriod: "Lifetime (unless regulations change)"
renewalHours: 0
renewalFrequency: "Never (lifetime)"

# Prerequisites
minimumAge: 18
educationRequirement: "None required"
experienceRequirement: "None required, but recommended EPA-approved training"

# Costs
examFee: "$120"
studyMaterialsFee: "$50-$200"

# Compliance
states:
  - ALL
federalRequirements:
  - "40 CFR Part 82"
  - "Section 608 of the Clean Air Act"
wioaEligible: true
dolRegistered: false

# O*NET mapping
socCodes:
  - 49-9021.00  # Heating, Air Conditioning, and Refrigeration Mechanics and Installers
careerPathway: "Helper → Technician → Lead → Master → Contractor"

# Elevate integration
availableOnElevate: true
courseSlug: hvac
instructorAvatar: marcus

# Blueprint
blueprint:
  criticalNumbers:
    ozoneDepletionPotential: "0.05 for Class I, 0.2 for Class II"
    globalWarmingPotential: "Various per refrigerant"
    recoveryRequirements: "90% for small, 95% for other"
    civilPenalty: "$44,539 per day"
  vocabulary:
    - recovery
    - recycling
    - reclamation
    - evacuation
    - dehydration
    - charging
    - manifold gauge
    - service valve
  practiceAreas:
    - Recovery procedures
