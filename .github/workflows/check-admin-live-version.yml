name: Check Admin Live Version

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  check:
    if: startsWith(github.event.issue.title, '[CHECK ADMIN VERSION]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check live endpoints
        shell: bash
        run: |
          set -Eeuo pipefail
          for endpoint in api/version api/health api/ping; do
            code=$(curl -sS -L --max-time 15 -o "/tmp/${endpoint//\//-}.txt" -w '%{http_code}' "https://admin.elevateforhumanity.org/$endpoint" || true)
            echo "$endpoint HTTP $code" >> /tmp/result.txt
            cat "/tmp/${endpoint//\//-}.txt" >> /tmp/result.txt || true
            echo >> /tmp/result.txt
          done
      - name: Post result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'); let out='No output'; try{out=fs.readFileSync('/tmp/result.txt','utf8')}catch{}
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:`Live Admin identity check: **${{ job.status }}**\n\n\`\`\`text\n${out.slice(0,20000)}\n\`\`\``});
