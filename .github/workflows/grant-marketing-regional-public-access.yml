name: Apply regional public website invoker access
on:
  push:
    branches: [main]
    paths: ['.github/workflows/grant-marketing-regional-public-access.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: write
  id-token: write
jobs:
  dispatch:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/grant-marketing-regional-public-access.yml/dispatches" -f ref=main
  grant:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 5
    concurrency:
      group: google-marketing-runtime-operations
      cancel-in-progress: false
    steps:
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        with:
          skip_install: true
      - name: Apply public invoker access to exact prepared website service
        run: |
          set -euo pipefail
          gcloud run services add-iam-policy-binding elevate-marketing-migration \
            --project=elegant-racer-299721 --region=us-east1 \
            --member=allUsers --role=roles/run.invoker --quiet
          gcloud run services get-iam-policy elevate-marketing-migration \
            --project=elegant-racer-299721 --region=us-east1 --format=json |
            python3 -c 'import json,sys; p=json.load(sys.stdin); assert any(b.get("role")=="roles/run.invoker" and "allUsers" in b.get("members",[]) for b in p.get("bindings",[])), "Public website access not confirmed"'
      - name: Continue tested regional website release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/publish-built-host-shop.yml/dispatches" -f ref=main
