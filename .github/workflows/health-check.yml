name: Health Check

on:
  workflow_dispatch:

concurrency:
  group: northflank-health-check
  cancel-in-progress: true

jobs:
  northflank-health:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies deterministically
        run: pnpm install --frozen-lockfile --strict-peer-dependencies=false
      - name: Require Northflank health credentials
        env:
          NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
          NORTHFLANK_PROJECT_ID: ${{ secrets.NORTHFLANK_PROJECT_ID }}
          NORTHFLANK_TEAM_ID: ${{ secrets.NORTHFLANK_TEAM_ID }}
        run: |
          set -euo pipefail
          test -n "$NORTHFLANK_API_TOKEN" || { echo '::error::NORTHFLANK_API_TOKEN is missing'; exit 1; }
          test -n "$NORTHFLANK_PROJECT_ID" || { echo '::error::NORTHFLANK_PROJECT_ID is missing'; exit 1; }
          test -n "$NORTHFLANK_TEAM_ID" || { echo '::error::NORTHFLANK_TEAM_ID is missing'; exit 1; }
      - name: Verify all Northflank health-check contracts
        env:
          NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
          NORTHFLANK_PROJECT_ID: ${{ secrets.NORTHFLANK_PROJECT_ID }}
          NORTHFLANK_TEAM_ID: ${{ secrets.NORTHFLANK_TEAM_ID }}
        run: pnpm tsx scripts/northflank/verify-health-checks.ts --all
