name: Sync Admin Cron Secret

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  sync:
    if: startsWith(github.event.issue.title, '[SYNC ADMIN CRON]')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
      NORTHFLANK_TEAM_ID: ${{ secrets.NORTHFLANK_TEAM_ID || 'elevates-team' }}
      NORTHFLANK_PROJECT_ID: ${{ secrets.NORTHFLANK_PROJECT_ID || 'elevate-platform' }}
      NORTHFLANK_ADMIN_SERVICE_ID: ${{ secrets.NORTHFLANK_ADMIN_SERVICE_ID || 'elevate-admin' }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Align Admin CRON_SECRET
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$NORTHFLANK_API_TOKEN"
          test -n "$CRON_SECRET"
          base="https://api.northflank.com/v1/teams/${NORTHFLANK_TEAM_ID}/projects/${NORTHFLANK_PROJECT_ID}"
          auth=(-H "Authorization: Bearer ${NORTHFLANK_API_TOKEN}" -H 'Content-Type: application/json')
          id='elevate-cron-runtime'
          node <<'NODE' >/tmp/cron-secret.json
          const payload={
            name:'elevate-cron-runtime',
            description:'Canonical scheduler credential for Admin internal cron/queue endpoints',
            priority:40,
            type:'secret',
            secretType:'environment',
            restrictions:{restricted:true,nfObjects:[{id:process.env.NORTHFLANK_ADMIN_SERVICE_ID,type:'service'}],tagMatchCondition:'or'},
            secrets:{variables:{CRON_SECRET:process.env.CRON_SECRET}}
          };
          process.stdout.write(JSON.stringify(payload));
          NODE
          code=$(curl -sS -o /tmp/get.json -w '%{http_code}' "${auth[@]}" "$base/secrets/$id" || true)
          if [ "$code" = "200" ]; then
            curl -fsS -X POST "${auth[@]}" --data-binary @/tmp/cron-secret.json "$base/secrets/$id" >/tmp/upsert.json
            echo updated >/tmp/action.txt
          elif [ "$code" = "404" ]; then
            curl -fsS -X POST "${auth[@]}" --data-binary @/tmp/cron-secret.json "$base/secrets" >/tmp/upsert.json
            echo created >/tmp/action.txt
          else
            cat /tmp/get.json || true
            exit 1
          fi
          curl -fsS -X POST "${auth[@]}" --data '{}' "$base/services/${NORTHFLANK_ADMIN_SERVICE_ID}/restart" >/tmp/restart.json
          sleep 12
          echo "Admin CRON_SECRET $(cat /tmp/action.txt); restart requested." >/tmp/result.txt
      - name: Post result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            let body='Admin CRON secret sync did not produce a result.';
            try { body=fs.readFileSync('/tmp/result.txt','utf8'); } catch {}
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:`Admin cron sync: **${{ job.status }}**\n\n${body}`});
