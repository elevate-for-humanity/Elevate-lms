name: Patch platform audit branch

on:
  push:
    branches:
      - audit/platform-typography-pwa-dashboards-20260809
    paths:
      - '.github/workflows/patch-dashboard-audit-branch.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/platform-typography-pwa-dashboards-20260809
          fetch-depth: 1

      - name: Patch verified audit defects
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          def must_replace(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing expected pattern: {label}')
              return text.replace(old, new, 1)

          # Identity verification: collect full SSN only in the protected identity
          # flow, then the API hashes it and persists only hash + last four.
          p = Path('components/verification/IDVerificationForm.tsx')
          s = p.read_text()
          s = must_replace(s, "    ssnLast4: '',", "    ssn: '',", 'identity state ssn')
          s = must_replace(
              s,
              "      if (!files.idFront || !files.selfie) {\n        setError('Please upload ID front and selfie');",
              "      if (!files.idFront || !files.selfie || (formData.idType !== 'passport' && !files.idBack)) {\n        setError('Please upload the front of your government ID, the back unless using a passport, and a selfie.');",
              'identity required files',
          )
          s = must_replace(
              s,
              "      // Create form data\n      const submitData = new FormData();",
              "      const ssnDigits = formData.ssn.replace(/\\D/g, '');\n      if (ssnDigits.length !== 9) {\n        setError('Enter your complete 9-digit Social Security number.');\n        setLoading(false);\n        return;\n      }\n\n      // Create form data. Full SSN exists only in request memory; the server stores hash + last four.\n      const submitData = new FormData();",
              'identity ssn validation',
          )
          old_ssn = '''            <label className="block text-sm font-semibold mb-2">Last 4 of SSN (Optional)</label>
            <input
              type="text"
              name="ssnLast4"
              value={formData.ssnLast4}
              onChange={handleInputChange}
              maxLength={4}
              pattern="[0-9]{4}"
              placeholder="1234"
              className="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-brand-blue-500"
            />'''
          new_ssn = '''            <label className="block text-sm font-semibold mb-2">Social Security Number *</label>
            <input
              type="password"
              name="ssn"
              value={formData.ssn}
              onChange={handleInputChange}
              required
              inputMode="numeric"
              autoComplete="off"
              maxLength={11}
              pattern="(?:[0-9]{9}|[0-9]{3}-[0-9]{2}-[0-9]{4})"
              placeholder="123-45-6789"
              aria-describedby="ssn-security-note"
              className="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-brand-blue-500"
            />
            <p id="ssn-security-note" className="mt-2 text-xs font-semibold text-slate-700">
              Required for enrollment/workforce identity verification. Your complete SSN is hashed immediately; only the hash and last four are stored in the protected identity record.
            </p>'''
          s = must_replace(s, old_ssn, new_ssn, 'identity ssn input')
          s = must_replace(
              s,
              "      const data = await response.json();",
              "      const data = await response.json().catch(() => ({}));",
              'identity response json',
          )
          s = must_replace(
              s,
              "    } catch (err: any) {\n      setError('Failed to submit verification');",
              "    } catch (err: unknown) {\n      setError(err instanceof Error ? err.message : 'Unable to submit identity verification. Please try again.');",
              'identity error message',
          )
          p.write_text(s)

          # Canonical full application: make the required identity gate visible and
          # remove a final hard-coded support phone from the network-error fallback.
          p = Path('apps/marketing/app/apply/student/StudentApplicationForm.tsx')
          s = p.read_text()
          s = must_replace(
              s,
              "            : 'The application service could not be reached. Your progress is saved on this device. Please try again. If the issue continues, call (317) 314-3757.',",
              "            : 'The application service could not be reached. Your progress is saved on this device. Please try again or contact admissions if the issue continues.',",
              'application hard-coded support phone',
          )
          review_marker = '''          <div className="grid gap-3 rounded-xl bg-slate-50 p-5 text-sm text-slate-900 sm:grid-cols-2">
            <p><strong>Applicant:</strong> {form.firstName} {form.lastName}</p>'''
          review_replacement = '''          <div className="grid gap-3 rounded-xl bg-slate-50 p-5 text-sm text-slate-900 sm:grid-cols-2">
            <p><strong>Applicant:</strong> {form.firstName} {form.lastName}</p>'''
          if review_marker not in s:
              raise SystemExit('missing expected pattern: application review summary')
          identity_notice = '''          <div className="rounded-xl border border-blue-300 bg-blue-50 p-4 text-sm leading-6 text-blue-950">
            <strong>Required before enrollment:</strong> after submission and secure account access, complete identity verification with your full Social Security number and government-issued photo ID (front/back as applicable) plus selfie. The SSN is not stored in this application record; the protected identity service stores only its hash and last four.
          </div>
'''
          # Insert identity notice immediately before certification checkbox, once.
          consent_marker = '''          <label className="flex items-start gap-3 rounded-xl border border-slate-300 p-4 text-sm font-semibold leading-6 text-slate-900">'''
          s = must_replace(s, consent_marker, identity_notice + consent_marker, 'application identity notice')
          p.write_text(s)

          # Static store catalog: replace one generic repeated image with unique,
          # existing, trade-specific photography for each of the 13 products.
          p = Path('lib/store/products.ts')
          s = p.read_text()
          repeated = "image: '/images/pages/comp-home-hero.webp',"
          replacements = [
              "image: '/images/pages/barber-fade.webp',",
              "image: '/images/pages/cna-vitals.webp',",
              "image: '/images/pages/hvac-unit.webp',",
              "image: '/images/healthcare/hero-program-medical-assistant.jpg',",
              "image: '/images/pages/barber-training.webp',",
              "image: '/images/healthcare/program-cna-training.jpg',",
              "image: '/images/pages/barber-apprentice-learning.webp',",
              "image: '/images/pages/cna-patient-care.jpg',",
              "image: '/images/hvac-hero.webp',",
              "image: '/images/barber-professional.webp',",
              "image: '/images/pages/cna-nursing-real.webp',",
              "image: '/images/pages/hvac-technician.webp',",
              "image: '/images/hero/hero-skilled-trades.webp',",
          ]
          if s.count(repeated) != len(replacements):
              raise SystemExit(f'expected {len(replacements)} generic store images, found {s.count(repeated)}')
          for replacement in replacements:
              s = s.replace(repeated, replacement, 1)
          p.write_text(s)
          PY

          git diff --check
          git diff -- \
            components/verification/IDVerificationForm.tsx \
            apps/marketing/app/apply/student/StudentApplicationForm.tsx \
            lib/store/products.ts

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            components/verification/IDVerificationForm.tsx \
            apps/marketing/app/apply/student/StudentApplicationForm.tsx \
            lib/store/products.ts
          git commit -m 'fix(platform): secure identity gate and unique store imagery' || exit 0
          git push origin HEAD:audit/platform-typography-pwa-dashboards-20260809
