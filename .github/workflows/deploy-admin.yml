name: Deploy Admin

on:
  push:
    branches: [main]
    paths:
      - 'apps/admin/**'
      - 'lib/**'
      - 'remotion-src/**'
      - 'packages/**'
      - 'components/admin/**'
      - 'components/studio/**'
      - 'instrumentation.ts'
      - 'Dockerfile.northflank-admin'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-admin.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: google-runtime-operations
  cancel-in-progress: false

jobs:
  deploy-admin:
    name: Build and deploy Admin on Google
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build the Admin image
        shell: bash
        run: |
          set -euo pipefail
          test "$NEXT_PUBLIC_SUPABASE_URL" = 'https://cuxzzpsyufcewtmicszk.supabase.co'
          test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY"
          node scripts/verify-admin-instrumentation-boundary.mjs
          node scripts/verify-portal-production-contracts.mjs
          docker build -f Dockerfile.northflank-admin -t "elevate-admin:$GITHUB_SHA" \
            --build-arg "NF_GIT_SHA=$GITHUB_SHA" \
            --build-arg "BUILD_TIMESTAMP=$(date -u +%FT%TZ)" \
            --build-arg NEXT_PUBLIC_SUPABASE_URL \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY .
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        with:
          skip_install: true
      - name: Verify Google SDK
        run: node scripts/gcp/verify-sdk.mjs
      - name: Upload and deploy the exact Admin image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE='us-central1-docker.pkg.dev/elegant-racer-299721/elevate/admin'
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
          docker tag "elevate-admin:$GITHUB_SHA" "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:$GITHUB_SHA"
          DIGEST="$(gcloud artifacts docker images describe "$IMAGE:$GITHUB_SHA" --project=elegant-racer-299721 --format='value(image_summary.digest)')"
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          # Keep the existing runtime identity, secrets, memory and scaling.
          # CPU must remain allocated while leased background renders execute.
          gcloud run services update elevate-admin-migration \
            --project=elegant-racer-299721 --region=us-central1 \
            --image="$IMAGE@$DIGEST" --no-cpu-throttling --quiet
      - name: Verify exact live revision and wake the video worker
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const root='https://elevate-admin-migration-aabnh2y32a-uc.a.run.app';
          let verified=false;
          for(let attempt=0;attempt<24;attempt++) {
            const response=await fetch(root+'/api/health',{signal:AbortSignal.timeout(15000)});
            const body=await response.json().catch(()=>({}));
            if(response.ok && body.service==='admin' && body.commit===process.env.GITHUB_SHA && body.healthy===true && body.dependencies?.supabase?.ok===true) {verified=true;break;}
            await new Promise(resolve=>setTimeout(resolve,5000));
          }
          if(!verified) throw new Error('Exact Google Admin revision did not become healthy');
          if(!process.env.CRON_SECRET) throw new Error('Video worker wake secret is unavailable');
          const response=await fetch(root+'/api/internal/videos/process-queue',{
            method:'POST',headers:{Authorization:'Bearer '+process.env.CRON_SECRET,'Content-Type':'application/json'},
            body:JSON.stringify({maxJobs:1}),signal:AbortSignal.timeout(60000)
          });
          const body=await response.json().catch(()=>({}));
          if(!response.ok || body.ok!==true) throw new Error('Google video worker wake failed: HTTP '+response.status);
          console.log(JSON.stringify({verified:true,started:body.started,reason:body.reason}));
          NODE
