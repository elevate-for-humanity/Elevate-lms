name: Inspect Google AI and Studio runtime
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  transfer:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Run the Google-owned replacement
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/verify-google-ai-runtime.yml/dispatches" -f ref=main
