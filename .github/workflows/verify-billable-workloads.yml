name: Verify paid model browser and phone work
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-billable-workloads.yml']
  workflow_dispatch:
permissions: {contents: read, actions: write, id-token: write}
jobs:
  dispatch:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - env: {GH_TOKEN: '${{ github.token }}'}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/verify-billable-workloads.yml/dispatches" -f ref=main
  functional-checks:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test scripts/gcp/accept-owned-cpu-model.test.mjs scripts/gcp/inventory-studio-live-state.test.mjs
      - uses: google-github-actions/auth@v3
        id: invocation
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
          token_format: id_token
          id_token_audience: https://elevate-owned-cpu-llm-aabnh2y32a-ue.a.run.app
          id_token_include_email: true
      - uses: google-github-actions/setup-gcloud@v3
        with: {skip_install: true}
      - run: mkdir -p audit-reports
      - name: Prove actual private model inference tools and streaming
        env: {MODEL_INVOKER_TOKEN: '${{ steps.invocation.outputs.id_token }}'}
        run: |
          set -o pipefail
          node --input-type=module <<'NODE' | tee audit-reports/model-work.json
          import {loadGoogleConfig,google,PROJECT} from './scripts/gcp/runtime-config.mjs';
          import {modelCredential} from './scripts/gcp/deploy-owned-llm.mjs';
          import {acceptOwnedCpuModel} from './scripts/gcp/accept-owned-cpu-model.mjs';
          const base='https://elevate-owned-cpu-llm-aabnh2y32a-ue.a.run.app';
          try{
            const service=JSON.parse(google(['run','services','describe','elevate-owned-cpu-llm','--region=us-east1','--project='+PROJECT,'--format=json']));
            if(service.status?.url!==base)throw Error('MODEL_ENDPOINT_CHANGED');
            const result=await acceptOwnedCpuModel({base,token:modelCredential(loadGoogleConfig('admin')),invokerToken:process.env.MODEL_INVOKER_TOKEN});
            console.log(JSON.stringify({checkedAt:new Date().toISOString(),...result,scope:'existing model service; not proof of application routing or a completed PARIS repair'}));
          }catch(error){console.log(JSON.stringify({passed:false,error:/^(OWNED_CPU_MODEL_[A-Z_]+|MODEL_ENDPOINT_CHANGED)$/.test(error.message||'')?error.message:error.code||'MODEL_ACCEPTANCE_UNAVAILABLE'}));process.exitCode=1;}
          NODE
      - name: Verify authenticated browser workspace access and retained state
        if: always()
        run: |
          set -o pipefail
          node scripts/gcp/inventory-studio-live-state.mjs | tee audit-reports/studio-work.json
      - name: Verify configured Vertex model using the existing course worker identity
        if: always()
        run: |
          set -o pipefail
          node --input-type=module <<'NODE' | tee audit-reports/vertex-work.json
          import {google,loadGoogleConfig,PROJECT} from './scripts/gcp/runtime-config.mjs';
          import {vertexLessonGenerationConfig} from './lib/ultimate-course-builder/instructional/vertex-response.mjs';
          try{
            const job=JSON.parse(google(['run','jobs','describe','elevate-course-builder','--region=us-central1','--project='+PROJECT,'--format=json']));
            const identity=job.spec?.template?.spec?.template?.spec?.serviceAccountName;
            if(!/^[a-z0-9-]+@elegant-racer-299721\.iam\.gserviceaccount\.com$/.test(identity||''))throw Error('VERTEX_WORKER_IDENTITY_UNVERIFIED');
            const config=loadGoogleConfig('ultimate-worker').runtimeEnvironment;
            const base=config.NEXT_PUBLIC_SUPABASE_URL||config.SUPABASE_URL;
            if(base!=='https://cuxzzpsyufcewtmicszk.supabase.co'||!config.SUPABASE_SERVICE_ROLE_KEY)throw Error('VERTEX_PROFILE_LOOKUP_UNAVAILABLE');
            const profiles=await fetch(base+'/rest/v1/ultimate_course_builds?select=profile&profile->instructionalAuthoring->>provider=eq.google&order=updated_at.desc&limit=1',{headers:{apikey:config.SUPABASE_SERVICE_ROLE_KEY,Authorization:'Bearer '+config.SUPABASE_SERVICE_ROLE_KEY},redirect:'error',signal:AbortSignal.timeout(15000)});
            if(!profiles.ok)throw Error('VERTEX_PROFILE_LOOKUP_UNAVAILABLE');
            const selected=(await profiles.json())[0]?.profile?.instructionalAuthoring;
            const model=selected?.model,location=selected?.location;
            if(!/^gemini-[a-z0-9.-]+$/.test(model||'')||!['us','eu','global','us-central1','us-east1'].includes(location))throw Error('VERTEX_PROFILE_UNVERIFIED');
            const token=google(['auth','print-access-token','--impersonate-service-account='+identity]);
            const host=location==='global'?'aiplatform.googleapis.com':['us','eu'].includes(location)?'aiplatform.'+location+'.rep.googleapis.com':location+'-aiplatform.googleapis.com';
            const response=await fetch('https://'+host+'/v1/projects/'+PROJECT+'/locations/'+location+'/publishers/google/models/'+model+':generateContent',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({contents:[{role:'user',parts:[{text:'Return only the JSON object {"answer":4} for two plus two.'}]}],generationConfig:vertexLessonGenerationConfig(model,512)}),redirect:'error',signal:AbortSignal.timeout(60000)});
            const result=await response.json();let answer;
            try{answer=JSON.parse(result.candidates?.[0]?.content?.parts?.filter(p=>!p.thought).map(p=>p.text||'').join('')||'');}catch{}
            const passed=response.ok&&answer?.answer===4;
            console.log(JSON.stringify({passed,httpStatus:response.status,model,location,identity,actualGeneration:passed,finishReason:result.candidates?.[0]?.finishReason||null,totalTokens:result.usageMetadata?.totalTokenCount||null,scope:'bounded synthetic model work; not a course quality or publication approval'}));
            if(!passed)process.exitCode=1;
          }catch(error){console.log(JSON.stringify({passed:false,error:/^VERTEX_[A-Z_]+$/.test(error.message||'')?error.message:error.code||'VERTEX_AUTHENTICATED_PROBE_UNAVAILABLE'}));process.exitCode=1;}
          NODE
      - name: Verify phone VM routing and voicemail worker without dialing
        if: always()
        run: |
          set -o pipefail
          gcloud compute ssh elevate-pbx --project=elegant-racer-299721 --zone=us-central1-a --quiet --command='sudo python3 -' < scripts/gcp/phone-acceptance-preflight.py | tee audit-reports/phone-work.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paid-workload-functional-evidence-${{ github.run_id }}
          path: audit-reports/
          retention-days: 30
