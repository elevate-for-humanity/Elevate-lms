name: Repair Google Marketing release headroom
on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair-google-release-headroom.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: write
  id-token: write
jobs:
  dispatch:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - env: {GH_TOKEN: '${{ github.token }}'}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/repair-google-release-headroom.yml/dispatches" -f ref=main
  repair:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    concurrency:
      # This only lowers a service ceiling; it creates no revision or traffic change.
      group: google-marketing-capacity-reduction
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        with: {skip_install: true}
      - name: Cap Marketing service without replacing its tested revision
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          const name='elevate-marketing-migration';
          const scope=['--project=elegant-racer-299721','--region=us-central1'];
          const run=args=>execFileSync('gcloud',[...args,...scope],{encoding:'utf8',timeout:180000,stdio:['ignore','pipe','pipe']});
          const read=()=>JSON.parse(run(['run','services','describe',name,'--format=json']));
          const before=read();
          const current=before.metadata.annotations?.['run.googleapis.com/maxScale'];
          if(current!==undefined&&!['1','2'].includes(current))throw Error('Unexpected service maximum; no change');
          const c=before.spec.template.spec.containers[0];
          assert.equal(c.resources.limits.cpu,'1');
          assert.equal(c.resources.limits.memory,'4Gi');
          const traffic=(s)=>(s.status.traffic||[]).filter(t=>t.percent>0).map(t=>[t.revisionName,t.percent]).sort();
          assert.equal(traffic(before).reduce((n,t)=>n+t[1],0),100);
          async function health(){
            const r=await fetch('https://www.elevateforhumanity.org/api/health',{redirect:'error',cache:'no-store',signal:AbortSignal.timeout(30000)});
            const h=await r.json();assert.equal(r.status,200);assert.equal(h.service,'marketing');assert.equal(h.healthy,true);
            return h.commit||h.commitSha;
          }
          const commit=await health();assert.match(commit,/^[a-f0-9]{40}$/);
          if(current!=='1')run(['run','services','update',name,'--max=1','--quiet']);
          const after=read();
          assert.equal(after.metadata.annotations['run.googleapis.com/maxScale'],'1');
          assert.deepEqual(after.spec.template,before.spec.template);
          assert.deepEqual(traffic(after),traffic(before));
          assert.equal(after.status.latestCreatedRevisionName,before.status.latestCreatedRevisionName);
          for(let i=0;i<3;i++)assert.equal(await health(),commit);
          console.log(JSON.stringify({service:name,maximumInstances:1,imageAndTemplatePreserved:true,servingTrafficPreserved:true,healthVerified:true,commit}));
          NODE
  stop-unused-studio-trial:
    needs: repair
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    concurrency:
      group: google-studio-browser
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        with: {skip_install: true}
      - name: Verify production browser and stop only its isolated trial VM
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          import {cleanupTrial} from './scripts/gcp/deploy-studio-vm-trial.mjs';
          const project='elegant-racer-299721',region='us-central1';
          const read=args=>JSON.parse(execFileSync('gcloud',[...args,'--project='+project,'--format=json'],{encoding:'utf8',timeout:30000,stdio:['ignore','pipe','pipe']}));
          const expected='https://elevate-studio-browser-aabnh2y32a-uc.a.run.app';
          async function verify(){
            const admin=read(['run','services','describe','elevate-admin-migration','--region='+region]);
            const revisions=new Set((admin.status.traffic||[]).filter(t=>t.percent>0).map(t=>t.revisionName));
            assert.ok(revisions.size);
            for(const name of revisions){
              const r=read(['run','revisions','describe',name,'--region='+region]);
              const env=Object.fromEntries(r.spec.containers[0].env.map(e=>[e.name,e.value]));
              assert.equal(env.STUDIO_BROWSER_URL?.replace(/\/$/,''),expected);
              assert.equal(env.STUDIO_BROWSER_PUBLIC_URL?.replace(/\/$/,''),expected);
            }
            const response=await fetch(expected+'/health',{signal:AbortSignal.timeout(30000),redirect:'error',cache:'no-store'});
            const health=await response.json();assert.equal(response.status,200);assert.equal(health.ready,true);
            assert.equal(health.lifecycle?.browserConnected ?? health.browserConnected,true);
          }
          await verify();
          const trial=read(['compute','instances','describe','elevate-studio-browser-trial','--zone=us-central1-a']);
          console.log(JSON.stringify({kind:'trial_ownership',purpose:trial.labels?.purpose??null,zone:trial.zone?.split('/').at(-1),machineType:trial.machineType?.split('/').at(-1),status:trial.status,serviceAccountAttached:Boolean(trial.serviceAccounts?.length),disks:trial.disks.map(d=>({name:d.source?.split('/').at(-1),autoDelete:d.autoDelete}))}));
          if(trial.labels?.purpose==='studio-browser-ready'){
            const destinations=[];
            for(const [name,region] of [['elevate-course-builder','us-central1'],['elevate-course-builder-parallel','us-east1']]){
              const job=read(['run','jobs','describe',name,'--region='+region]);
              const env=job.spec.template.spec.template.spec.containers[0].env||[];
              const entry=env.find(e=>e.name==='ULTIMATE_LEARNER_RUNTHROUGH_URL');
              let destination=null;try{destination=new URL(entry?.value).origin;}catch{}
              destinations.push({job:name,region,destination});
            }
            const response=await fetch('https://browser.elevateforhumanity.org/health',{signal:AbortSignal.timeout(30000),redirect:'error',cache:'no-store'});
            const health=await response.json();
            console.log(JSON.stringify({preparedBrowserPreserved:true,trialVmStopped:false,learnerBrowserHttpStatus:response.status,learnerBrowserReady:health.ready===true,persistent:health.providerAuthStorage?.persistent===true,destinations}));
            assert.equal(response.status,200);assert.equal(health.ready,true);assert.equal(health.providerAuthStorage?.persistent,true);
          }else{
            cleanupTrial();
            const vm=read(['compute','instances','describe','elevate-studio-browser-trial','--zone=us-central1-a']);
            assert.equal(vm.status,'TERMINATED');
            assert.ok(vm.disks.some(d=>d.source.endsWith('/elevate-studio-browser-auth-trial')&&d.autoDelete===false));
            await verify();
            console.log(JSON.stringify({trialVmStopped:true,persistentDiskRetained:true,productionBrowserReady:true,productionDestinationVerified:true}));
          }
          NODE
  repair-inventory-access:
    needs: repair
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    concurrency:
      group: google-project-iam-repair
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        with: {skip_install: true}
      - name: Repair asset inventory availability and verify actual resource search
        run: |
          node --input-type=module <<'NODE'
          import {spawnSync} from 'node:child_process';
          const project='elegant-racer-299721';
          const run=args=>spawnSync('gcloud',[...args,'--project='+project,'--quiet'],{encoding:'utf8',timeout:120000,maxBuffer:16*1024*1024});
          const enabled=run(['services','list','--enabled','--format=value(config.name)']);
          if(enabled.status!==0)throw Error('Cannot inspect enabled APIs; no IAM change made');
          if(!enabled.stdout.split(/\s+/).includes('cloudasset.googleapis.com')){
            const enable=run(['services','enable','cloudasset.googleapis.com']);
            if(enable.status!==0)throw Error('Cloud Asset Inventory API enable failed; no IAM change made');
          }
          const search=()=>run(['asset','search-all-resources','--scope=projects/'+project,'--limit=1','--format=json']);
          let result=search();
          if(result.status!==0){
            if(!/cloudasset\.assets\.searchAllResources/.test(result.stderr||'')||!/PERMISSION_DENIED|permission.*denied/i.test(result.stderr||'')){
              console.log(JSON.stringify({assetSearchVerified:false,permissionDenied:/PERMISSION_DENIED|permission.*denied/i.test(result.stderr||''),apiUnavailable:/SERVICE_DISABLED|has not been used|is disabled/i.test(result.stderr||'')}));
              throw Error('Asset search failed without the exact resource-search permission diagnosis; no IAM change made');
            }
            const grant=run(['projects','add-iam-policy-binding',project,'--member=serviceAccount:elevate-github-deploy@'+project+'.iam.gserviceaccount.com','--role=roles/cloudasset.viewer','--condition=None','--format=value(etag)']);
            if(grant.status!==0)throw Error('Read-only Cloud Asset Viewer binding could not be applied');
            for(let i=0;i<6;i++){
              result=search();if(result.status===0)break;
              await new Promise(resolve=>setTimeout(resolve,5000));
            }
          }
          if(result.status!==0)throw Error('Resource search remains unavailable');
          if(!Array.isArray(JSON.parse(result.stdout)))throw Error('Unexpected inventory response');
          console.log(JSON.stringify({assetSearchVerified:true,scope:project,resourceMetadataOnly:true}));
          NODE
      - name: Verify complete bounded cost inventory
        run: node scripts/gcp/audit-cost-resources.mjs
