name: Parallel Surface Audit

on:
  push:
    branches: [main]
    paths:
      - 'scripts/audit-parallel-surfaces.mjs'
      - '.github/workflows/parallel-surface-audit.yml'
      - 'apps/app/**'
      - 'apps/partner/**'
      - 'apps/admin/app/**'
      - 'apps/lms/app/**'
      - 'apps/marketing/app/**'
      - 'public/**'
      - 'apps/*/public/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit parallel routes and PWA surfaces
        run: node scripts/audit-parallel-surfaces.mjs
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: parallel-surface-audit
          path: |
            artifacts/parallel-surface-audit.json
            artifacts/parallel-surface-audit.md
