name: Audit Google Studio browser connection
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-google-studio-browser.yml'
      - 'scripts/gcp/audit-studio-browser.mjs'
      - 'scripts/gcp/audit-studio-backend-end-to-end.mjs'
      - 'scripts/gcp/audit-studio-backend-end-to-end.test.mjs'
  workflow_dispatch:
permissions:
  actions: write
  contents: read
  id-token: write
jobs:
  dispatch:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch through approved Google identity event
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/audit-google-studio-browser.yml/dispatches" -f ref=main
  audit:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        with:
          skip_install: true
      - name: Verify active Google browser endpoint and persistent state topology
        run: node scripts/gcp/audit-studio-browser.mjs
      - run: node --test scripts/gcp/audit-studio-backend-end-to-end.test.mjs
      - name: Trace deployed Studio, Google secret bindings, browser and Cloudflare authentication
        run: node scripts/gcp/audit-studio-backend-end-to-end.mjs
      - name: Diagnose anonymous tax route boundary
        run: |
          node --input-type=module <<'NODE'
          for(const path of ['/api/tax/returns','/api/tax/interview']) {
            const r=await fetch('https://www.elevateforhumanity.org'+path,{cache:'no-store',signal:AbortSignal.timeout(15000)});
            const body=await r.text();
            console.log(JSON.stringify({path,status:r.status,contentType:r.headers.get('content-type'),
              bodyKind:body.startsWith('{')?'json':body.includes('<html')?'html':'text',
              errorClass:(body.match(/(?:TypeError|ReferenceError|MODULE_NOT_FOUND|Unauthorized|Internal Server Error)/)||[])[0]}));
          }
          NODE
