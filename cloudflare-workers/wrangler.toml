name = "elevate-scorm-worker"
main = "scorm-player-worker.js"
compatibility_date = "2024-12-02"

# R2 Bucket Binding
[[r2_buckets]]
binding = "SCORM_BUCKET"
bucket_name = "elevate-scorm-courses"

# Tracking persists to the canonical LMS Supabase enrollment, under the user's
# verified session and existing RLS. Set SUPABASE_PUBLISHABLE_KEY (or the legacy
# SUPABASE_ANON_KEY) with wrangler secret put; no service-role credential is used.

# Routes
routes = [
  { pattern = "scorm.elevateforhumanity.org/*", zone_name = "elevateforhumanity.org" }
]

# Environment variables
[vars]
ENVIRONMENT = "production"
