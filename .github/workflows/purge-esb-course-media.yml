name: Purge ESB Course Media

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  purge:
    if: github.event.issue.title == 'PURGE ESB COURSE MEDIA'
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          clean: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile --strict-peer-dependencies=false

      - name: Delete only canonical ESB media and verify zero remain
        run: pnpm tsx scripts/course-factory/purge-esb-media.ts

      - name: Report result
        if: always()
        uses: actions/github-script@v7
        env:
          RESULT: ${{ job.status }}
          TESTED_SHA: ${{ github.sha }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `ESB MEDIA PURGE ${process.env.RESULT === 'success' ? 'PASS' : 'FAIL'}\n\nChecked-out SHA: ${process.env.TESTED_SHA}`,
            });
