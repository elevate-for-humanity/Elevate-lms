name: Repair QuickBooks production configuration
on:
  push:
    branches: [main]
    paths: ['scripts/gcp/repair-quickbooks-production*', '.github/workflows/repair-quickbooks-production.yml']
  pull_request:
    paths: ['scripts/gcp/repair-quickbooks-production*', '.github/workflows/repair-quickbooks-production.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: write
  id-token: write
concurrency:
  group: google-quickbooks-production-repair
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --check scripts/gcp/repair-quickbooks-production.mjs
      - run: node --test scripts/gcp/repair-quickbooks-production.test.mjs
  dispatch:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/$GITHUB_REPOSITORY/actions/workflows/repair-quickbooks-production.yml/dispatches -f ref=main
  repair:
    needs: test
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        with: {skip_install: true}
      - run: node scripts/gcp/verify-sdk.mjs
      - name: Recover existing verifier and bind production configuration
        env:
          QB_PRODUCTION_REPAIR: 'true'
        run: node scripts/gcp/repair-quickbooks-production.mjs
