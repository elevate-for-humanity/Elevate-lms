name: Final Private Surface Migration

on:
  push:
    branches: [consolidate/legacy-routes-20260814]
    paths: ['.github/workflows/final-private-surface-migration.yml']

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: consolidate/legacy-routes-20260814
          fetch-depth: 0
      - name: Move private role surfaces and retire trade routes
        shell: bash
        run: |
          set -euo pipefail

          for surface in case-manager workforce-board provider; do
            src="apps/marketing/app/$surface"
            dst="apps/lms/app/$surface"
            if [ -e "$src" ]; then
              if [ -e "$dst" ]; then
                echo "Collision: $dst already exists" >&2
                exit 1
              fi
              git mv "$src" "$dst"
            fi
          done

          python3 - <<'PY'
          import json, pathlib
          root = pathlib.Path('.')
          old_routes = [
              '/portal/barber', '/portal/cosmetology', '/portal/esthetician',
              '/portal/nail-technician', '/portal/culinary', '/portal/electrical',
              '/portal/plumbing'
          ]
          exts = {'.ts','.tsx','.js','.jsx','.mjs','.cjs','.json'}
          excluded_parts = {'.git','node_modules','.next','artifacts'}
          for p in root.rglob('*'):
              if not p.is_file() or p.suffix not in exts:
                  continue
              parts = set(p.parts)
              if parts & excluded_parts or p.as_posix().startswith('docs/audits/'):
                  continue
              try:
                  text = p.read_text()
              except UnicodeDecodeError:
                  continue
              new = text
              for old in old_routes:
                  new = new.replace(old, '/apprentice')
              if new != text:
                  p.write_text(new)

          contract_path = pathlib.Path('lib/routes/platform-surface-contracts.json')
          data = json.loads(contract_path.read_text())
          data['version'] = max(int(data.get('version', 0)) + 1, 6)
          data['updated'] = '2026-08-14'
          surfaces = data['surfaces']
          apprentice = surfaces['apprenticePortal']
          apprentice['canonical'] = {'app':'lms','path':'/apprentice'}
          apprentice['operational'] = [
              {'app':'lms','path':'/apprentice/timeclock','purpose':'OJT timeclock and hour entry'}
          ]
          for key in ('caseManagerPortal','workforceBoardPortal','providerPortal','programHolderPortal'):
              if key in surfaces:
                  surfaces[key]['canonical']['app'] = 'lms'
                  for item in surfaces[key].get('operational', []):
                      item['app'] = 'lms'
          contract_path.write_text(json.dumps(data, indent=2) + '\n')

          audit_path = pathlib.Path('scripts/audit-parallel-surfaces.mjs')
          text = audit_path.read_text()
          needle = "&& !f.includes(`${path.sep}artifacts${path.sep}`)"
          replacement = needle + " && !f.includes(`${path.sep}docs${path.sep}audits${path.sep}`)"
          if needle in text and 'docs${path.sep}audits' not in text:
              audit_path.write_text(text.replace(needle, replacement))
          PY

          echo "Remaining operational retired trade-route references:"
          git grep -n -I -E '/portal/(barber|cosmetology|esthetician|nail-technician|culinary|electrical|plumbing)' -- ':!docs/audits/**' || true

          if git grep -n -I -E '/portal/(barber|cosmetology|esthetician|nail-technician|culinary|electrical|plumbing)' -- ':!docs/audits/**'; then
            echo 'Retired trade route references remain' >&2
            exit 1
          fi

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'elevate-production-recovery'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No migration changes required.'
            exit 0
          fi
          git commit -m 'consolidate: move private portals to LMS and retire trade routes'
          git push origin HEAD:consolidate/legacy-routes-20260814
