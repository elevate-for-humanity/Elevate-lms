name: Audit Google Studio browser connection
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-google-studio-browser.yml'
      - 'scripts/gcp/audit-studio-browser.mjs'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        with:
          skip_install: true
      - name: Trace the actual browser endpoint and durable Google runtime
        run: node scripts/gcp/audit-studio-browser.mjs
