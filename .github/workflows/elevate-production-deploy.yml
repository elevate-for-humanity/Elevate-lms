name: Elevate Production Deployment

on:
  workflow_dispatch:
    inputs:
      service:
        description: Service to deploy
        required: true
        type: choice
        options: [marketing, admin, lms, all]
      environment:
        description: Deployment environment
        required: true
        default: staging
        type: choice
        options: [staging, production]
      git_sha:
        description: Exact Git SHA to deploy; production SHA must belong to main
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: elevate-${{ inputs.environment }}-${{ inputs.service }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.28.2'
  REGISTRY: ghcr.io
  GITHUB_OWNER: elevate-for-humanity

jobs:
  prepare:
    name: Resolve and authorize deployment
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      short_sha: ${{ steps.resolve.outputs.short_sha }}
      deploy_marketing: ${{ steps.services.outputs.marketing }}
      deploy_admin: ${{ steps.services.outputs.admin }}
      deploy_lms: ${{ steps.services.outputs.lms }}
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and validate Git SHA
        id: resolve
        shell: bash
        run: |
          set -Eeuo pipefail
          REQUESTED_SHA='${{ inputs.git_sha }}'
          if [[ -n "$REQUESTED_SHA" ]]; then
            SHA="$REQUESTED_SHA"
          else
            SHA='${{ github.sha }}'
          fi
          [[ "$SHA" =~ ^[a-fA-F0-9]{7,40}$ ]] || { echo "::error::Invalid Git SHA: $SHA"; exit 1; }
          git fetch origin main --depth=300
          RESOLVED_SHA="$(git rev-parse "$SHA^{commit}" 2>/dev/null || true)"
          test -n "$RESOLVED_SHA" || { echo "::error::Git SHA cannot be resolved: $SHA"; exit 1; }
          if [[ '${{ inputs.environment }}' == 'production' ]]; then
            git merge-base --is-ancestor "$RESOLVED_SHA" origin/main || {
              echo "::error::Production SHA is not contained in main: $RESOLVED_SHA"
              exit 1
            }
          fi
          echo "sha=$RESOLVED_SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=${RESOLVED_SHA:0:12}" >> "$GITHUB_OUTPUT"
          echo "Authorized ${{ inputs.environment }} deployment of $RESOLVED_SHA"

      - name: Resolve selected services
        id: services
        shell: bash
        run: |
          set -Eeuo pipefail
          case '${{ inputs.service }}' in
            marketing) echo 'marketing=true' >> "$GITHUB_OUTPUT"; echo 'admin=false' >> "$GITHUB_OUTPUT"; echo 'lms=false' >> "$GITHUB_OUTPUT" ;;
            admin) echo 'marketing=false' >> "$GITHUB_OUTPUT"; echo 'admin=true' >> "$GITHUB_OUTPUT"; echo 'lms=false' >> "$GITHUB_OUTPUT" ;;
            lms) echo 'marketing=false' >> "$GITHUB_OUTPUT"; echo 'admin=false' >> "$GITHUB_OUTPUT"; echo 'lms=true' >> "$GITHUB_OUTPUT" ;;
            all) echo 'marketing=true' >> "$GITHUB_OUTPUT"; echo 'admin=true' >> "$GITHUB_OUTPUT"; echo 'lms=true' >> "$GITHUB_OUTPUT" ;;
            *) echo '::error::Unknown service selection'; exit 1 ;;
          esac

  validate-repository:
    name: Validate repository and recovery policy
    runs-on: ubuntu-latest
    needs: prepare
    timeout-minutes: 30
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 1
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies deterministically
        env:
          NODE_OPTIONS: --max-old-space-size=16384
        run: pnpm install --frozen-lockfile --strict-peer-dependencies=false
      - name: Validate required files
        shell: bash
        run: |
          set -Eeuo pipefail
          for FILE in Dockerfile.marketing Dockerfile.admin Dockerfile.lms apps/marketing/next.config.mjs apps/admin/next.config.mjs apps/lms/next.config.mjs; do
            test -f "$FILE" || { echo "::error::Missing required file: $FILE"; exit 1; }
          done
      - name: Recovery hardening regression check
        run: node scripts/verify-recovery-gate-hardening.mjs
      - name: Check Docker startup commands
        shell: bash
        run: |
          set -Eeuo pipefail
          for FILE in Dockerfile.marketing Dockerfile.admin Dockerfile.lms; do
            grep -Eq 'CMD.*server\.(js|cjs)|CMD.*pnpm.*start|ENTRYPOINT.*server\.(js|cjs)' "$FILE" || {
              echo "::error file=$FILE::No valid production startup command found."
              exit 1
            }
          done

  build-marketing:
    name: Build and test Marketing
    runs-on: ubuntu-latest
    needs: [prepare, validate-repository]
    if: needs.prepare.outputs.deploy_marketing == 'true'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 1
      - uses: docker/setup-buildx-action@v3
      - name: Build marketing image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.marketing
          load: true
          push: false
          tags: elevate-marketing:test
          build-args: |
            NF_GIT_SHA=${{ needs.prepare.outputs.sha }}
            GITHUB_SHA=${{ needs.prepare.outputs.sha }}
            GIT_SHA=${{ needs.prepare.outputs.sha }}
            NEXT_PUBLIC_GIT_SHA=${{ needs.prepare.outputs.sha }}
            BUILD_TIMESTAMP=${{ github.event.repository.updated_at }}
          cache-from: type=gha,scope=marketing
          cache-to: type=gha,mode=max,scope=marketing
      - name: Smoke test marketing container
        run: |
          chmod +x scripts/smoke-test-container.sh
          scripts/smoke-test-container.sh elevate-marketing:test marketing-smoke 3100

  build-admin:
    name: Build and test Admin
    runs-on: ubuntu-latest
    needs: [prepare, validate-repository]
    if: needs.prepare.outputs.deploy_admin == 'true'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 1
      - uses: docker/setup-buildx-action@v3
      - name: Build admin image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.admin
          load: true
          push: false
          tags: elevate-admin:test
          build-args: |
            GITHUB_SHA=${{ needs.prepare.outputs.sha }}
            GIT_SHA=${{ needs.prepare.outputs.sha }}
            NEXT_PUBLIC_GIT_SHA=${{ needs.prepare.outputs.sha }}
            BUILD_TIMESTAMP=${{ github.event.repository.updated_at }}
            NODE_OPTIONS=--max-old-space-size=16384
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin
      - name: Smoke test admin container
        run: |
          chmod +x scripts/smoke-test-container.sh
          scripts/smoke-test-container.sh elevate-admin:test admin-smoke 3200

  build-lms:
    name: Build and test LMS
    runs-on: ubuntu-latest
    needs: [prepare, validate-repository]
    if: needs.prepare.outputs.deploy_lms == 'true'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 1
      - uses: docker/setup-buildx-action@v3
      - name: Build LMS image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.lms
          load: true
          push: false
          tags: elevate-lms:test
          build-args: |
            GITHUB_SHA=${{ needs.prepare.outputs.sha }}
            GIT_SHA=${{ needs.prepare.outputs.sha }}
            NEXT_PUBLIC_GIT_SHA=${{ needs.prepare.outputs.sha }}
            BUILD_TIMESTAMP=${{ github.event.repository.updated_at }}
            NODE_OPTIONS=--max-old-space-size=16384
          cache-from: type=gha,scope=lms
          cache-to: type=gha,mode=max,scope=lms
      - name: Smoke test LMS container
        run: |
          chmod +x scripts/smoke-test-container.sh
          scripts/smoke-test-container.sh elevate-lms:test lms-smoke 3300

  publish-images:
    name: Publish validated images
    runs-on: ubuntu-latest
    needs: [prepare, validate-repository, build-marketing, build-admin, build-lms]
    if: |
      always() &&
      needs.validate-repository.result == 'success' &&
      (needs.build-marketing.result == 'success' || needs.build-marketing.result == 'skipped') &&
      (needs.build-admin.result == 'success' || needs.build-admin.result == 'skipped') &&
      (needs.build-lms.result == 'success' || needs.build-lms.result == 'skipped')
    outputs:
      marketing_image: ${{ steps.images.outputs.marketing_image }}
      admin_image: ${{ steps.images.outputs.admin_image }}
      lms_image: ${{ steps.images.outputs.lms_image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 1
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish marketing image
        if: needs.prepare.outputs.deploy_marketing == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.marketing
          push: true
          tags: |
            ghcr.io/${{ env.GITHUB_OWNER }}/elevate-marketing:${{ needs.prepare.outputs.sha }}
            ghcr.io/${{ env.GITHUB_OWNER }}/elevate-marketing:${{ inputs.environment }}-${{ needs.prepare.outputs.short_sha }}
          build-args: |
            NF_GIT_SHA=${{ needs.prepare.outputs.sha }}
            GITHUB_SHA=${{ needs.prepare.outputs.sha }}
            GIT_SHA=${{ needs.prepare.outputs.sha }}
            NEXT_PUBLIC_GIT_SHA=${{ needs.prepare.outputs.sha }}
            BUILD_TIMESTAMP=${{ github.event.repository.updated_at }}
          cache-from: type=gha,scope=marketing
      - name: Publish admin image
        if: needs.prepare.outputs.deploy_admin == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.admin
          push: true
          tags: |
            ghcr.io/${{ env.GITHUB_OWNER }}/elevate-admin:${{ needs.prepare.outputs.sha }}
            ghcr.io/${{ env.GITHUB_OWNER }}/elevate-admin:${{ inputs.environment }}-${{ needs.prepare.outputs.short_sha }}
          build-args: |
            GITHUB_SHA=${{ needs.prepare.outputs.sha }}
            GIT_SHA=${{ needs.prepare.outputs.sha }}
            NEXT_PUBLIC_GIT_SHA=${{ needs.prepare.outputs.sha }}
            BUILD_TIMESTAMP=${{ github.event.repository.updated_at }}
            NODE_OPTIONS=--max-old-space-size=16384
          cache-from: type=gha,scope=admin
      - name: Publish LMS image
        if: needs.prepare.outputs.deploy_lms == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.lms
          push: true
          tags: |
            ghcr.io/${{ env.GITHUB_OWNER }}/elevate-lms:${{ needs.prepare.outputs.sha }}
            ghcr.io/${{ env.GITHUB_OWNER }}/elevate-lms:${{ inputs.environment }}-${{ needs.prepare.outputs.short_sha }}
          build-args: |
            GITHUB_SHA=${{ needs.prepare.outputs.sha }}
            GIT_SHA=${{ needs.prepare.outputs.sha }}
            NEXT_PUBLIC_GIT_SHA=${{ needs.prepare.outputs.sha }}
            BUILD_TIMESTAMP=${{ github.event.repository.updated_at }}
            NODE_OPTIONS=--max-old-space-size=16384
          cache-from: type=gha,scope=lms
      - name: Export image names
        id: images
        shell: bash
        run: |
          echo "marketing_image=ghcr.io/${GITHUB_OWNER}/elevate-marketing:${{ needs.prepare.outputs.sha }}" >> "$GITHUB_OUTPUT"
          echo "admin_image=ghcr.io/${GITHUB_OWNER}/elevate-admin:${{ needs.prepare.outputs.sha }}" >> "$GITHUB_OUTPUT"
          echo "lms_image=ghcr.io/${GITHUB_OWNER}/elevate-lms:${{ needs.prepare.outputs.sha }}" >> "$GITHUB_OUTPUT"

  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    environment: staging
    needs: [prepare, publish-images]
    if: inputs.environment == 'staging'
    steps:
      - name: Trigger selected staging deployments
        shell: bash
        env:
          MKT: ${{ secrets.NORTHFLANK_MARKETING_STAGING_WEBHOOK }}
          ADM: ${{ secrets.NORTHFLANK_ADMIN_STAGING_WEBHOOK }}
          LMS: ${{ secrets.NORTHFLANK_LMS_STAGING_WEBHOOK }}
        run: |
          set -Eeuo pipefail
          if [[ '${{ needs.prepare.outputs.deploy_marketing }}' == 'true' ]]; then scripts/trigger-northflank.sh "$MKT" '${{ needs.publish-images.outputs.marketing_image }}'; fi
          if [[ '${{ needs.prepare.outputs.deploy_admin }}' == 'true' ]]; then scripts/trigger-northflank.sh "$ADM" '${{ needs.publish-images.outputs.admin_image }}'; fi
          if [[ '${{ needs.prepare.outputs.deploy_lms }}' == 'true' ]]; then scripts/trigger-northflank.sh "$LMS" '${{ needs.publish-images.outputs.lms_image }}'; fi
      - name: Verify staging services
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ '${{ needs.prepare.outputs.deploy_marketing }}' == 'true' ]]; then scripts/wait-for-public-health.sh https://staging.elevateforhumanity.org/api/health '${{ needs.prepare.outputs.sha }}'; fi
          if [[ '${{ needs.prepare.outputs.deploy_admin }}' == 'true' ]]; then scripts/wait-for-public-health.sh https://admin-staging.elevateforhumanity.org/api/health '${{ needs.prepare.outputs.sha }}'; fi
          if [[ '${{ needs.prepare.outputs.deploy_lms }}' == 'true' ]]; then scripts/wait-for-public-health.sh https://app-staging.elevateforhumanity.org/api/health '${{ needs.prepare.outputs.sha }}'; fi

  deploy-production:
    name: Deploy to production
    runs-on: ubuntu-latest
    environment: production
    needs: [prepare, publish-images]
    if: inputs.environment == 'production'
    steps:
      - name: Trigger selected production deployments
        shell: bash
        env:
          MKT: ${{ secrets.NORTHFLANK_MARKETING_PRODUCTION_WEBHOOK }}
          ADM: ${{ secrets.NORTHFLANK_ADMIN_PRODUCTION_WEBHOOK }}
          LMS: ${{ secrets.NORTHFLANK_LMS_PRODUCTION_WEBHOOK }}
        run: |
          set -Eeuo pipefail
          if [[ '${{ needs.prepare.outputs.deploy_marketing }}' == 'true' ]]; then scripts/trigger-northflank.sh "$MKT" '${{ needs.publish-images.outputs.marketing_image }}'; fi
          if [[ '${{ needs.prepare.outputs.deploy_admin }}' == 'true' ]]; then scripts/trigger-northflank.sh "$ADM" '${{ needs.publish-images.outputs.admin_image }}'; fi
          if [[ '${{ needs.prepare.outputs.deploy_lms }}' == 'true' ]]; then scripts/trigger-northflank.sh "$LMS" '${{ needs.publish-images.outputs.lms_image }}'; fi
      - name: Verify production services and exact SHA
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ '${{ needs.prepare.outputs.deploy_marketing }}' == 'true' ]]; then scripts/wait-for-public-health.sh https://www.elevateforhumanity.org/api/health '${{ needs.prepare.outputs.sha }}'; fi
          if [[ '${{ needs.prepare.outputs.deploy_admin }}' == 'true' ]]; then scripts/wait-for-public-health.sh https://admin.elevateforhumanity.org/api/health '${{ needs.prepare.outputs.sha }}'; fi
          if [[ '${{ needs.prepare.outputs.deploy_lms }}' == 'true' ]]; then scripts/wait-for-public-health.sh https://app.elevateforhumanity.org/api/health '${{ needs.prepare.outputs.sha }}'; fi

  deployment-failed:
    name: Deployment failure report
    runs-on: ubuntu-latest
    if: failure()
    needs: [prepare, validate-repository, build-marketing, build-admin, build-lms, publish-images, deploy-staging, deploy-production]
    steps:
      - name: Report blocked deployment
        run: |
          echo '::error::Deployment was blocked because validation, container startup, publishing, or exact-SHA health verification failed.'
          echo 'Do not retry production until the failing condition is corrected.'
