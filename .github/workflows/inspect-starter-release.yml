name: Inspect starter Google release targets
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-starter-release.yml']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: google-starter-release-inspection
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        with: {skip_install: true}
      - name: Inspect existing service names, source images, and traffic
        run: |
          set -euo pipefail
          gcloud run services list --project=elegant-racer-299721 --region=us-central1 --format=json > /tmp/services.json
          python3 - <<'PY'
          import json
          for service in json.load(open('/tmp/services.json')):
              metadata = service.get('metadata', {})
              spec = service.get('spec', {}).get('template', {}).get('spec', {})
              status = service.get('status', {})
              containers = spec.get('containers', [])
              print(json.dumps({
                  'name': metadata.get('name'),
                  'url': status.get('url'),
                  'images': [c.get('image') for c in containers],
                  'readyRevision': status.get('latestReadyRevisionName'),
                  'traffic': status.get('traffic'),
                  'ready': [c for c in status.get('conditions', []) if c.get('type') == 'Ready'],
              }))
          PY
          gcloud artifacts repositories list --project=elegant-racer-299721 --location=us-central1 --format='table(name,format)'
