name: Audit complete Google migration parity
on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-google-runtime-parity.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: write
  id-token: write
concurrency:
  group: google-runtime-parity-read
  cancel-in-progress: false
jobs:
  dispatch:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch Google-trusted workflow event
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/audit-google-runtime-parity.yml/dispatches" -f ref=main
  audit:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/gcp/audit-runtime-parity.test.mjs
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        with:
          skip_install: true
      - name: Verify runner-supplied Google SDK compatibility
        run: node scripts/gcp/verify-sdk.mjs
      - name: Compare all source services and inherited environments without exporting credentials
        env:
          NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
          NORTHFLANK_PROJECT_ID: ${{ secrets.NORTHFLANK_PROJECT_ID }}
        run: node scripts/gcp/audit-runtime-parity.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: google-runtime-parity
          path: google-runtime-parity.json
          retention-days: 3
          if-no-files-found: warn
