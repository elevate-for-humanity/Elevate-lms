name: Restore Northflank canonical domains

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/northflank/configure-services.ts'
      - 'scripts/northflank/configure-domains.ts'
      - '.github/workflows/restore-apex-northflank.yml'

concurrency:
  group: restore-northflank-canonical-domains
  cancel-in-progress: true

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
      NORTHFLANK_TEAM_ID: ${{ secrets.NORTHFLANK_TEAM_ID || 'elevates-team' }}
      NORTHFLANK_PROJECT_ID: ${{ secrets.NORTHFLANK_PROJECT_ID || 'elevate-platform' }}
      NORTHFLANK_MARKETING_SERVICE_ID: ${{ secrets.NORTHFLANK_MARKETING_SERVICE_ID || 'elevate-marketing' }}
      NORTHFLANK_LMS_SERVICE_ID: ${{ secrets.NORTHFLANK_LMS_SERVICE_ID || 'elevate-lms' }}
      NORTHFLANK_ADMIN_SERVICE_ID: ${{ secrets.NORTHFLANK_ADMIN_SERVICE_ID || 'elevate-admin' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require Northflank access
        run: test -n "$NORTHFLANK_API_TOKEN"
      - name: Register missing Northflank service domains
        run: pnpm tsx scripts/northflank/register-domains.ts || true
      - name: Verify registered Northflank service domains
        run: pnpm tsx scripts/northflank/register-domains.ts --verify
      - name: Restore canonical service assignments
        run: pnpm tsx scripts/northflank/configure-domains.ts --execute
      - name: Verify Northflank marketing host
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://www.elevateforhumanity.org/ || true)"
            if [ "$code" = "200" ]; then
              echo "Northflank marketing host is healthy."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Northflank marketing host is unhealthy"
          exit 1
      - name: Verify Durable apex forward
        run: |
          set -euo pipefail
          result="$(curl -sS -o /dev/null -w '%{http_code}|%{redirect_url}' --max-time 20 https://elevateforhumanity.org/ || true)"
          code="${result%%|*}"
          target="${result#*|}"
          if { [ "$code" = "301" ] || [ "$code" = "308" ]; } &&
             [[ "$target" == https://www.elevateforhumanity.org/* ]]; then
            echo "Durable apex forward is healthy: $result"
            exit 0
          fi
          echo "::error::Durable must forward elevateforhumanity.org to https://www.elevateforhumanity.org with a permanent redirect; received $result"
          exit 1
