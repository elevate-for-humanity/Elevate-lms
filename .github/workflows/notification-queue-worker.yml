name: Notification Queue Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/lms/app/api/cron/process-notifications/**'
      - '.github/workflows/notification-queue-worker.yml'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

concurrency:
  group: canonical-notification-queue-worker
  cancel-in-progress: false

jobs:
  process-notifications:
    name: Drain canonical notification outbox
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      RUNTIME_URL: https://site--elevate-lms--pknyktykz4wg.code.run
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Require cron secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET" || { echo '::error::CRON_SECRET is not configured'; exit 1; }

      - name: Process canonical notification queue through direct LMS runtime
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl -sS -X POST "$RUNTIME_URL/api/cron/process-notifications" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            --max-time 60 \
            -o "$response_file" \
            -w '%{http_code}')"
          cat "$response_file"
          test "$status" = "200" || { echo "::error::notification queue worker returned HTTP $status"; exit 1; }
          grep -q '"success":true' "$response_file" || { echo '::error::notification queue worker did not report success'; exit 1; }
