name: Configure saved Google video startup health
on:
  push:
    branches: [main]
    paths: ['.github/workflows/configure-video-health.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: write
  id-token: write
jobs:
  dispatch:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/configure-video-health.yml/dispatches" -f ref=main
  configure:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    concurrency:
      group: google-video-settings-us-east1
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node --test scripts/gcp/execute-finite-video-render.test.mjs scripts/gcp/finite-video-render.test.mjs
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        with:
          skip_install: true
      - name: Apply and read back future health settings while preserving active execution
        run: |
          node --input-type=module <<'NODE'
          import { executeFiniteVideoJob } from './scripts/gcp/execute-finite-video-render.mjs';
          await executeFiniteVideoJob({ configuration: 'redeploy', validateOnly: true, configureOnly: true, region: 'us-east1' });
          NODE
