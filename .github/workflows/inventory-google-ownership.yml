name: Inventory Google ownership and persistence
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inventory-google-ownership.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: write
  id-token: write
jobs:
  dispatch:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Launch read-only Google ownership inventory
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/inventory-google-ownership.yml/dispatches" -f ref=main
  inventory:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        with: {skip_install: true}
      - run: node scripts/gcp/verify-sdk.mjs
      - name: Inspect Google runtime, persistence and ownership metadata
        run: |
          node scripts/gcp/inventory-google-ownership.mjs || result=$?
          cat google-ownership-inventory.json
          exit "${result:-0}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: google-ownership-inventory
          path: google-ownership-inventory.json
          retention-days: 3
          if-no-files-found: error
