# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json

description: Elevate Course Factory AI regression gate

prompts:
  - |
      {{instruction}}

      Return raw JSON only. Do not use markdown fences, commentary, or extra keys.

providers:
  - file://./provider.ts

defaultTest:
  options:
    runSerially: true

tests:
  - description: lesson generation preserves the canonical structured contract
    vars:
      instruction: |
        Create a workforce-training lesson titled "Barber Infection Control" for a barber apprenticeship course.
        Return exactly these keys:
        objective: non-empty string
        learning_points: array of 3 to 5 non-empty strings
        scenario: realistic workplace scenario of at least 80 characters
        content: HTML instructional content of at least 500 characters
        quiz_questions: array with at least 1 object, each containing question, exactly 4 options, correct integer 0-3, and explanation.
    assert:
      - type: is-json
        value:
          type: object
          additionalProperties: false
          required: [objective, learning_points, scenario, content, quiz_questions]
          properties:
            objective: { type: string, minLength: 1 }
            learning_points:
              type: array
              minItems: 3
              maxItems: 5
              items: { type: string, minLength: 1 }
            scenario: { type: string, minLength: 80 }
            content: { type: string, minLength: 500 }
            quiz_questions:
              type: array
              minItems: 1
              items:
                type: object
                additionalProperties: false
                required: [question, options, correct, explanation]
                properties:
                  question: { type: string, minLength: 1 }
                  options:
                    type: array
                    minItems: 4
                    maxItems: 4
                    items: { type: string, minLength: 1 }
                  correct: { type: integer, minimum: 0, maximum: 3 }
                  explanation: { type: string, minLength: 1 }
      - type: javascript
        value: |
          const data = JSON.parse(output);
          return !output.trim().startsWith('```') && data.content.includes('<') && data.learning_points.length >= 3;
      - type: llm-rubric
        provider: openai:chat:gpt-4.1
        value: The lesson is job-ready, specifically about barber infection control, and does not invent unrelated regulatory claims.

  - description: assessment generation returns bounded answer choices and indexes
    vars:
      instruction: |
        Generate exactly 4 job-relevant knowledge-check questions for barber infection control.
        Return one object with exactly one key named questions. Each question must contain question, exactly 4 options, correct as an integer from 0 through 3, and explanation.
    assert:
      - type: is-json
        value:
          type: object
          additionalProperties: false
          required: [questions]
          properties:
            questions:
              type: array
              minItems: 4
              maxItems: 4
              items:
                type: object
                additionalProperties: false
                required: [question, options, correct, explanation]
                properties:
                  question: { type: string, minLength: 1 }
                  options:
                    type: array
                    minItems: 4
                    maxItems: 4
                    items: { type: string, minLength: 1 }
                  correct: { type: integer, minimum: 0, maximum: 3 }
                  explanation: { type: string, minLength: 1 }
      - type: javascript
        value: |
          const data = JSON.parse(output);
          return data.questions.every((q) => Number.isInteger(q.correct) && q.correct >= 0 && q.correct <= 3 && q.options.length === 4);

  - description: blueprint generation preserves canonical module lesson shape
    vars:
      instruction: |
        Create a short workforce-training blueprint titled "Barber Safety Fundamentals".
        Return exactly title, description, and modules. Return exactly 2 modules. Each module must contain exactly title, description, and lessons. Each module must contain 2 lessons. Each lesson must contain exactly title, slug, and stepType. Slugs must be lowercase kebab-case. stepType must be one of lesson, checkpoint, quiz, exam, lab, assignment.
    assert:
      - type: is-json
        value:
          type: object
          additionalProperties: false
          required: [title, description, modules]
          properties:
            title: { type: string, minLength: 1 }
            description: { type: string, minLength: 1 }
            modules:
              type: array
              minItems: 2
              maxItems: 2
              items:
                type: object
                additionalProperties: false
                required: [title, description, lessons]
                properties:
                  title: { type: string, minLength: 1 }
                  description: { type: string, minLength: 1 }
                  lessons:
                    type: array
                    minItems: 2
                    maxItems: 2
                    items:
                      type: object
                      additionalProperties: false
                      required: [title, slug, stepType]
                      properties:
                        title: { type: string, minLength: 1 }
                        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
                        stepType:
                          type: string
                          enum: [lesson, checkpoint, quiz, exam, lab, assignment]
      - type: javascript
        value: |
          const data = JSON.parse(output);
          return data.modules.length === 2 && data.modules.every((m) => m.lessons.length === 2);

commandLineOptions:
  maxConcurrency: 1
  share: false
  cache: false
