name: Business Course Builder Draft Bootstrap

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

env:
  CI: true
  NODE_ENV: production
  AI_CIRCUIT_RECOVERY_WAIT: '1'
  AI_PROVIDER: gemini
  SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GOOGLE_CLOUD_API_KEY: ${{ secrets.GOOGLE_CLOUD_API_KEY }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_AI_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_API_TOKEN }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}

jobs:
  bootstrap:
    if: github.event.issue.title == 'RUN BUSINESS COURSE BUILDER DRAFT NOW'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: business-course-builder-draft-bootstrap
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          clean: true

      - name: Record exact tested commit
        id: tested
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Post start evidence
        uses: actions/github-script@v7
        env:
          TESTED_SHA: ${{ steps.tested.outputs.sha }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `BUSINESS DRAFT BOOTSTRAP STARTED\n\nExact checked-out main SHA: ${process.env.TESTED_SHA}`,
            });

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies=false

      - name: Enforce architecture before generation
        run: |
          node scripts/check-course-factory-authority.mjs
          node scripts/check-studio-architecture.mjs
          node scripts/audit-course-builder-procurement.mjs

      - name: Build canonical Business draft and queue media
        id: build
        env:
          NODE_OPTIONS: --conditions=react-server
        run: |
          set +e
          pnpm tsx scripts/course-factory/bootstrap-business-draft.ts > /tmp/business-draft.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          tail -n 300 /tmp/business-draft.log
          exit 0

      - name: Post result
        if: always()
        uses: actions/github-script@v7
        env:
          TESTED_SHA: ${{ steps.tested.outputs.sha }}
          BUILD_EXIT_CODE: ${{ steps.build.outputs.exit_code }}
        with:
          script: |
            const fs = require('fs');
            const code = process.env.BUILD_EXIT_CODE || 'not-run';
            const log = fs.existsSync('/tmp/business-draft.log') ? fs.readFileSync('/tmp/business-draft.log', 'utf8').slice(-28000) : 'No build log.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `BUSINESS DRAFT BOOTSTRAP ${code === '0' ? 'PASS' : 'FAIL'}\n\nTested SHA: ${process.env.TESTED_SHA}\n\n\`\`\`text\n${log}\n\`\`\``,
            });

      - name: Fail when bootstrap failed
        if: always()
        run: test "${{ steps.build.outputs.exit_code }}" = "0"
