name: Health Check

on:
  workflow_dispatch:

jobs:
  northflank-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Check Northflank secrets
        env:
          NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
          NORTHFLANK_PROJECT_ID: ${{ secrets.NORTHFLANK_PROJECT_ID }}
          NORTHFLANK_TEAM_ID: ${{ secrets.NORTHFLANK_TEAM_ID }}
        run: |
          if [ -z "$NORTHFLANK_API_TOKEN" ] || [ -z "$NORTHFLANK_PROJECT_ID" ]; then
            echo "⚠️ Northflank secrets not configured. Add these secrets at:"
            echo "   https://github.com/elevate-for-humanity/Elevate-lms/settings/secrets/actions"
            echo "   - NORTHFLANK_API_TOKEN"
            echo "   - NORTHFLANK_PROJECT_ID"
            echo "   - NORTHFLANK_TEAM_ID"
            echo "Skipping health check for now."
            exit 0
          fi
          pnpm tsx scripts/northflank/verify-health-checks.ts --all
