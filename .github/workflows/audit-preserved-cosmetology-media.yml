name: Audit preserved cosmetology media
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/gcp/audit-preserved-cosmetology-media.mjs'
      - 'scripts/gcp/audit-preserved-cosmetology-media.test.mjs'
      - '.github/workflows/audit-preserved-cosmetology-media.yml'
      - 'scripts/gcp/transcribe-preserved-cosmetology-media.mjs'
      - 'scripts/gcp/transcribe-preserved-cosmetology-media.test.mjs'
permissions:
  contents: read
  id-token: write
concurrency:
  group: audit-preserved-cosmetology-media
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/gcp/audit-preserved-cosmetology-media.test.mjs
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg tesseract-ocr
      - name: Measure exact preserved private film without modifying course records
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/gcp/audit-preserved-cosmetology-media.mjs
      - run: node --test scripts/gcp/transcribe-preserved-cosmetology-media.test.mjs
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        with:
          skip_install: true
      - name: Independently transcribe the same audited bytes using the verified offline worker image
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
          docker run --rm --cpus=2 --memory=4g --network=none --entrypoint node \
            -v "$PWD/preserved-media-audit:/audit" \
            -v "$PWD/scripts/gcp/transcribe-preserved-cosmetology-media.mjs:/audit-driver.mjs:ro" \
            us-central1-docker.pkg.dev/elegant-racer-299721/elevate/ultimate-worker@sha256:0a6ad85cd905a8b7363c35b9f46254ff80d8d5c53fc88a17bcc94a3573309c54 \
            /audit-driver.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preserved-cosmetology-media-evidence
          path: preserved-media-audit/
          retention-days: 30
          if-no-files-found: error
