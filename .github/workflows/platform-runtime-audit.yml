name: Audit platform Google runtime bindings
on:
  push:
    branches: [main]
    paths: ['.github/workflows/platform-runtime-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: write
  id-token: write
jobs:
  dispatch:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch with approved Google identity event
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/platform-runtime-audit.yml/dispatches" -f ref=main
  inspect:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    steps:
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Read runtime health and domain bindings without secrets
        run: |
          gcloud run services list --project=elegant-racer-299721 --platform=managed --format='json(metadata.name,metadata.labels,status.url,status.latestReadyRevisionName,status.conditions)' > services.json
          cat services.json
          gcloud billing projects describe elegant-racer-299721 --format='json(projectId,billingEnabled)' || true
          gcloud --quiet beta run domain-mappings list --project=elegant-racer-299721 --region=us-central1 --format='json(metadata.name,spec.routeName,status.resourceRecords,status.conditions)' || true
          gcloud dns managed-zones list --project=elegant-racer-299721 --format='json(name,dnsName)' || true
          gcloud iam service-accounts describe curvature-runtime@elegant-racer-299721.iam.gserviceaccount.com --project=elegant-racer-299721 --format='json(email,disabled)' || true
          gcloud secrets versions describe latest --secret=curvature-supabase-service-role-key --project=elegant-racer-299721 --format='json(name,state)' || true
      - uses: actions/upload-artifact@v4
        with:
          name: platform-runtime-bindings
          path: services.json
