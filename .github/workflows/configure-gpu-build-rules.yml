name: Configure GPU Build Rules

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

jobs:
  configure:
    if: startsWith(github.event.issue.title, '[GPU RULES]')
    runs-on: ubuntu-latest
    environment: production
    env:
      NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
      NORTHFLANK_TEAM_ID: ${{ secrets.NORTHFLANK_TEAM_ID || 'elevates-team' }}
      NORTHFLANK_PROJECT_ID: elevate-platform
      NORTHFLANK_GPU_PROJECT_ID: elevate-media-gpu
      NORTHFLANK_GPU_BUILD_SERVICE_ID: elevate-gpu-worker-build
      NORTHFLANK_GPU_SERVICE_ID: elevate-gpu-worker
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies=false
      - name: Configure Northflank build rules
        run: pnpm tsx scripts/northflank/configure-gpu-build-rules.ts | tee /tmp/gpu-rules.txt
      - name: Post result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = 'No build-rule output was captured.';
            try { body = fs.readFileSync('/tmp/gpu-rules.txt','utf8'); } catch {}
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:`GPU build-rule configuration: **${{ job.status }}**\n\n\`\`\`text\n${body}\n\`\`\``});
