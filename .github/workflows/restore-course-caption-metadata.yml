name: Restore saved course caption metadata
on:
  push:
    branches: [main]
    paths: ['.github/workflows/restore-course-caption-metadata.yml']
  workflow_dispatch:
permissions: {contents: read, actions: write, id-token: write}
jobs:
  dispatch:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - env: {GH_TOKEN: '${{ github.token }}'}
        run: gh api --method POST repos/$GITHUB_REPOSITORY/actions/workflows/restore-course-caption-metadata.yml/dispatches -f ref=main
  restore:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    concurrency: {group: cosmetology-caption-metadata, cancel-in-progress: false}
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        with: {skip_install: true}
      - name: Restore captions only from matching saved films with concurrent update guards
        run: node scripts/gcp/restore-course-caption-metadata.mjs
