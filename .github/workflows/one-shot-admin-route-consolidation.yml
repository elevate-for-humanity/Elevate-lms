name: One-shot Admin Route Consolidation

on:
  push:
    branches: [main]
    paths:
      - 'scripts/consolidate-retired-admin-ui-routes.mjs'
      - '.github/workflows/one-shot-admin-route-consolidation.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-shot-admin-route-consolidation
  cancel-in-progress: true

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Consolidate retired Admin UI references
        run: node scripts/consolidate-retired-admin-ui-routes.mjs

      - name: Verify retired namespace is gone
        run: node scripts/verify-no-retired-admin-ui-routes.mjs

      - name: Commit canonical route rewrite
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No route changes required.'
            exit 0
          fi
          git config user.name 'elevateforhumanity'
          git config user.email 'Elizabethpowell6262@gmail.com'
          git add apps/admin/app apps/lms/app apps/marketing/app components lib/routes lib/auth
          git commit -m 'fix(routes): eliminate retired admin UI references'
          git pull --rebase origin main
          git push origin HEAD:main
