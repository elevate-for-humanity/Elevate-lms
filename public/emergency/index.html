<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Elevate Emergency Student Access</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#f8fafc;color:#0f172a}.wrap{max-width:760px;margin:auto;padding:32px 18px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:24px;margin:18px 0}input,button{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;margin:7px 0;border:1px solid #cbd5e1}button{background:#1d4ed8;color:#fff;border:0;font-weight:700}.hidden{display:none}.muted{color:#64748b}.err{color:#b91c1c}.ok{color:#166534}</style></head><body><main class="wrap"><h1>Elevate Student Access</h1><p class="muted">Emergency continuity portal</p><!-- deploy-trigger: 2026-09-24 --><section id="login" class="card"><h2>Sign in</h2><input id="email" type="email" autocomplete="email" placeholder="Email"><input id="password" type="password" autocomplete="current-password" placeholder="Password"><button id="signin">Sign in</button><p id="msg"></p></section><section id="dash" class="card hidden"><h2 id="name">Dashboard</h2><div id="summary"></div><div id="clock" class="hidden"><h3>Timeclock</h3><button data-action="clock_in">Clock In</button><button data-action="lunch_start">Start Lunch</button><button data-action="lunch_end">End Lunch</button><button data-action="clock_out">Clock Out</button><p id="clockmsg"></p></div><button id="signout">Sign out</button></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const U='https://cuxzzpsyufcewtmicszk.supabase.co';let sb;async function boot(){let r=await fetch(U+'/functions/v1/emergency-public-config');if(!r.ok)throw Error('Configuration unavailable');let j=await r.json();sb=supabase.createClient(U,j.anonKey,{auth:{persistSession:true,autoRefreshToken:true}});await load()}async function tok(){return(await sb.auth.getSession()).data.session?.access_token}async function load(){let t=await tok();if(!t)return;let r=await fetch(U+'/functions/v1/emergency-student-dashboard',{headers:{Authorization:'Bearer '+t}});if(!r.ok)return;let d=await r.json();login.classList.add('hidden');dash.classList.remove('hidden');name.textContent=(d.profile?.full_name||'Student')+' Dashboard';summary.innerHTML='<p><b>Enrollments:</b> '+d.enrollments.length+'</p>'+d.enrollments.map(e=>'<p>'+(e.title||'Program')+' — '+(e.status||e.access_status||'active')+'</p>').join('');if(d.apprentice)clock.classList.remove('hidden')}signin.onclick=async()=>{let x=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(x.error){msg.textContent=x.error.message;msg.className='err';return}await load()};signout.onclick=async()=>{await sb.auth.signOut();location.reload()};document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>navigator.geolocation.getCurrentPosition(async p=>{let t=await tok(),r=await fetch(U+'/functions/v1/emergency-timeclock',{method:'POST',headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify({action:b.dataset.action,lat:p.coords.latitude,lng:p.coords.longitude,accuracy_m:p.coords.accuracy})}),j=await r.json();clockmsg.textContent=r.ok?'Recorded':j.error||'Unable to record';clockmsg.className=r.ok?'ok':'err'}));boot().catch(e=>{msg.textContent=e.message;msg.className='err'})</script><!-- pages-enabled-retry -->
</body></html>
