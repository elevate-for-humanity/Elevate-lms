name: Blog Social Publisher

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

concurrency:
  group: blog-social-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Generate and publish queued blog content
        env:
          ADMIN_URL: ${{ secrets.ADMIN_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$ADMIN_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Required ADMIN_URL or CRON_SECRET secret is missing"
            exit 1
          fi
          endpoint="${ADMIN_URL%/}/api/internal/social-media/process"
          response_file="$(mktemp)"
          status="$(curl --silent --show-error \
            --retry 3 --retry-all-errors --retry-delay 2 \
            -o "$response_file" -w '%{http_code}' \
            -X POST "$endpoint" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            --connect-timeout 20 --max-time 300)"
          echo "Publisher endpoint returned HTTP $status"
          sed -E 's/(token|secret|authorization)"?[[:space:]]*:[[:space:]]*"[^"]+"/\1":"[redacted]"/Ig' "$response_file"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            exit 1
          fi
