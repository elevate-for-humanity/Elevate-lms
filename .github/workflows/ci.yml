name: Approved obsolete PR run cleanup
on:
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
  actions: write
jobs:
  cleanup:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            if (context.repo.owner !== 'elevate-for-humanity' || context.repo.repo !== 'Elevate-lms' || context.ref !== 'refs/heads/ops/cancel-approved-merged-pr-ci-20261123') throw new Error('Unexpected execution context');
            const targets = [{"id":45140984167,"pr":2783,"sha":"8f72e02b594021401ba148acfa91ea2748cef09a","branch":"fix/admin-orientation","attempt":1},{"id":45140901931,"pr":2785,"sha":"1f138c5e871a9d3faf2dfa341183399b95da13ba","branch":"fix/hvac-instructor-course-resources","attempt":1},{"id":45140423402,"pr":2782,"sha":"d5b42da2a369619dccc1b80639b508d7456634e6","branch":"fix/paris-provider-approval-queue","attempt":1},{"id":45140262176,"pr":2788,"sha":"e420a76fccfa41c28fe9a92715a1ee4c6fd16694","branch":"fix/host-shop-readiness-and-learner-checklists","attempt":1}];
            for (const t of targets) {
             const {data:pr}=await github.rest.pulls.get({...context.repo,pull_number:t.pr});
             const {data:run}=await github.rest.actions.getWorkflowRun({...context.repo,run_id:t.id});
             if (!pr.merged || pr.state !== 'closed' || pr.head.sha !== t.sha || run.head_sha !== t.sha || run.head_branch !== t.branch || run.run_attempt !== t.attempt || run.event !== 'pull_request') throw new Error('Identity mismatch: '+t.id);
             if (run.status === 'completed') { core.info(t.id+' already completed: '+run.conclusion); continue; }
             await github.request('POST /repos/{owner}/{repo}/actions/runs/{run_id}/force-cancel', {...context.repo,run_id:t.id});
             let terminal=false;
             for(let i=0;i<12;i++) {
              await new Promise(r=>setTimeout(r,3000));
              const {data:receipt}=await github.rest.actions.getWorkflowRun({...context.repo,run_id:t.id});
              if(receipt.status==='completed') { core.info(t.id+' completed: '+receipt.conclusion);terminal=true;break; }
             }
             if(!terminal) throw new Error('Cancellation unverified: '+t.id);
            }
