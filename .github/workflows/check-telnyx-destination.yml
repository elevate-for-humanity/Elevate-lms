name: Check Telnyx Destination Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check 317-760-7908 verification
    runs-on: ubuntu-latest
    environment: production
    env:
      NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
      NORTHFLANK_PROJECT_ID: ${{ secrets.NORTHFLANK_PROJECT_ID || 'elevate-platform' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Check verified destination
        run: node .github/scripts/check-telnyx-destination.mjs
