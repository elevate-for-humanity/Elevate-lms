name: Align Root Next Version

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-root-next-version.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: align-root-next-version
  cancel-in-progress: true

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Align root Next.js to deployed runtime
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          let changed = false;
          for (const section of ['dependencies', 'devDependencies', 'optionalDependencies']) {
            if (p[section] && p[section].next) {
              if (p[section].next !== '15.5.23') changed = true;
              p[section].next = '15.5.23';
            }
          }
          if (!changed) console.log('Root Next.js already aligned.');
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          NODE
          pnpm install --lockfile-only --no-frozen-lockfile
      - name: Verify single Next.js production version
        run: |
          node scripts/verify-next-version-parity.cjs
          grep -n "next:" package.json | head
      - name: Commit package and lockfile
        run: |
          if git diff --quiet -- package.json pnpm-lock.yaml; then
            echo 'No version changes required.'
            exit 0
          fi
          git config user.name 'elevate-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add package.json pnpm-lock.yaml
          git commit -m 'fix(deps): align root Next.js to 15.5.23'
          git push origin HEAD:main
