name: AI Regression Gate

on:
  pull_request:
    paths:
      - 'lib/ai/**'
      - 'lib/course-factory/**'
      - 'tests/unit/course-factory/**'
      - 'evals/ai/**'
      - 'scripts/ai/**'
      - 'supabase/migrations/*ai_evaluation*'
      - '.github/workflows/ai-regression.yml'
  push:
    branches: [main]
    paths:
      - 'lib/ai/**'
      - 'lib/course-factory/**'
      - 'tests/unit/course-factory/**'
      - 'evals/ai/**'
      - 'scripts/ai/**'
      - 'supabase/migrations/*ai_evaluation*'
      - '.github/workflows/ai-regression.yml'
  workflow_dispatch:

permissions:
  contents: read
  models: read

env:
  CI: true
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  AI_EVAL_SUITE: course-factory
  PROMPTFOO_DISABLE_UPDATE: 'true'

jobs:
  course-factory-ai-contracts:
    name: Course Factory AI contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install repository dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies=false

      - name: Run deterministic Course Factory contract tests
        run: pnpm vitest run tests/unit/course-factory/ai-contracts.test.ts

      - name: Require AI evaluation credentials
        shell: bash
        run: |
          if [ -z "$GITHUB_TOKEN" ] && [ -z "$OPENAI_API_KEY" ] && [ -z "$GROQ_API_KEY" ] && [ -z "$GEMINI_API_KEY" ] && [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "At least one AI provider credential is required for the AI regression release gate."
            exit 1
          fi

      - name: Run Promptfoo Course Factory regression suite
        id: promptfoo
        continue-on-error: true
        run: >-
          pnpm dlx promptfoo@0.121.20 eval
          -c evals/ai/course-factory/promptfooconfig.yaml
          --no-share
          --no-cache
          --no-progress-bar
          --no-table
          -o ai-regression-results.json

      - name: Normalize regression evidence
        if: always()
        shell: bash
        run: |
          if [ -f ai-regression-results.json ]; then
            pnpm tsx scripts/ai/record-eval-results.ts ai-regression-results.json evals/ai/course-factory/cases.json
          else
            echo '{"suite":"course-factory","status":"failed","reason":"Promptfoo did not produce ai-regression-results.json"}' > ai-regression-normalized.json
          fi

      - name: Classify Promptfoo failure
        if: steps.promptfoo.outcome == 'failure'
        run: pnpm tsx scripts/ai/classify-eval-failure.ts ai-regression-results.json

      - name: Enforce approved regression baseline
        if: steps.promptfoo.outcome == 'success'
        run: pnpm tsx scripts/ai/check-eval-baseline.ts ai-regression-normalized.json evals/ai/course-factory/baseline.json

      - name: Persist regression evidence to Supabase
        if: always() && vars.AI_EVAL_PERSIST == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm tsx scripts/ai/record-eval-results.ts ai-regression-results.json evals/ai/course-factory/cases.json

      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: course-factory-ai-regression-results
          path: |
            ai-regression-results.json
            ai-regression-normalized.json
            ai-regression-baseline.json
            ai-regression-provider-status.json
          if-no-files-found: warn
          retention-days: 14
