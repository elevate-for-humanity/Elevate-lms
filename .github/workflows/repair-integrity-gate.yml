name: Integrity Repair Audit (Manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies=false

      - name: Reproduce public UX/media findings
        run: |
          pnpm run audit:public-media-nav
          node scripts/audit-homepage-section-media.mjs
          node scripts/audit-platform-media-duplicates.mjs || true

      - name: Supervision policy
        run: |
          echo "Automatic source mutation and force-pushing repair branches are disabled."
          echo "Repairs must be committed to the active canonical recovery branch and reviewed by the supervising recovery workflow."
