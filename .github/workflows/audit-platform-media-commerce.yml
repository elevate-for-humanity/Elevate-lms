name: Audit platform media commerce applications and PWA

on:
  push:
    branches:
      - audit/platform-typography-pwa-dashboards-20260809
    paths:
      - 'scripts/audit-platform-media-commerce.mjs'
      - 'scripts/audit-program-image-assets.mjs'
      - 'scripts/audit-critical-wiring.mjs'
      - 'scripts/audit-hero-banners.mjs'
      - '.github/workflows/audit-platform-media-commerce.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/platform-typography-pwa-dashboards-20260809
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run repository-wide audit
        run: |
          node scripts/audit-platform-media-commerce.mjs
          node scripts/audit-program-image-assets.mjs
          node scripts/audit-critical-wiring.mjs
          node scripts/audit-hero-banners.mjs

      - name: Commit audit reports to audit branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/audits/platform-media-commerce-scan.md \
            docs/audits/program-image-assets.md \
            docs/audits/critical-wiring.md \
            docs/audits/hero-banner-audit.md
          git commit -m 'docs(audit): refresh platform media commerce image wiring and hero scans' || exit 0
          git push origin HEAD:audit/platform-typography-pwa-dashboards-20260809
