name: Verify Studio on isolated iPhone WebKit
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: studio-iphone-live-acceptance
  cancel-in-progress: false
jobs:
  iphone:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BASE_URL: https://app.elevateforhumanity.org
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/studio-iphone
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: pnpm/action-setup@v4
        with: {version: 10.28.2, run_install: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: pnpm}
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Record actual serving Admin revision before the isolated diagnostic
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {mkdirSync,writeFileSync} from 'node:fs';
          const response=await fetch('https://admin.elevateforhumanity.org/api/health',{cache:'no-store',signal:AbortSignal.timeout(20000)});
          assert.equal(response.status,200);const health=await response.json();
          assert.equal(health.service,'admin');assert.equal(health.ready,true);assert.equal(health.healthy,true);
          assert.match(health.commit,/^[a-f0-9]{40}$/);
          mkdirSync('test-results',{recursive:true});
          writeFileSync('test-results/studio-iphone-release.json',JSON.stringify({checkedAt:new Date().toISOString(),testSource:process.env.GITHUB_SHA,runtimeCommit:health.commit,revision:health.revision,physicalHandsetVerified:false}));
          NODE
      - name: Provision disposable portal identities using the existing guarded QA helper
        run: node scripts/qa/provision-remaining-portal-e2e.mjs provision
      - name: Require the isolated Admin identity before any browser test
        run: test -n "$E2E_ADMIN_EMAIL" && test -n "$E2E_ADMIN_PASSWORD"
      - run: pnpm exec playwright install webkit --with-deps
      - name: Run the unchanged authenticated Studio assertions on iPhone WebKit
        run: pnpm exec playwright test tests/e2e/portal-responsive-design.spec.ts --grep "Admin session opens Studio and optional external browser tools remain usable on the active device" --config playwright.config.ts --output=test-results/studio-iphone --trace retain-on-failure --project=iphone-webkit
      - name: Require the same actual Admin release at the end of the diagnostic
        if: ${{ !cancelled() }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          const before=JSON.parse(readFileSync('test-results/studio-iphone-release.json','utf8'));
          const response=await fetch('https://admin.elevateforhumanity.org/api/health',{cache:'no-store',signal:AbortSignal.timeout(20000)});
          assert.equal(response.status,200);const health=await response.json();
          writeFileSync('test-results/studio-iphone-release-end.json',JSON.stringify({checkedAt:new Date().toISOString(),runtimeCommit:health.commit,revision:health.revision,physicalHandsetVerified:false}));
          assert.equal(health.commit,before.runtimeCommit,'Admin changed during the diagnostic');
          assert.equal(health.revision,before.revision,'Admin revision changed during the diagnostic');
          assert.equal(health.ready,true);assert.equal(health.healthy,true);
          NODE
      - name: Clean only this run's disposable portal identities
        if: always()
        run: node scripts/qa/provision-remaining-portal-e2e.mjs cleanup
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-iphone-diagnostic
          path: |
            test-results/
            playwright-report/studio-iphone/
          retention-days: 14
          if-no-files-found: error
