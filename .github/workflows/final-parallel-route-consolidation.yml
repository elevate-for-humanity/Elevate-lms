name: Final Parallel Route Consolidation

on:
  push:
    branches: [consolidate/legacy-routes-20260814]
    paths:
      - '.github/workflows/final-parallel-route-consolidation.yml'

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconcile divergent routes without losing real implementations
        shell: bash
        run: |
          set -euo pipefail

          # These legacy handlers contain real behavior that the canonical copy
          # currently replaces with a proxy/stub or omits HTTP methods from.
          preserve_legacy=(
            'api/admin/applications/follow-up-blast/route.ts'
            'api/admin/courses/generate/publish/route.ts'
            'api/admin/courses/generate/regenerate/route.ts'
            'api/admin/courses/generate/route.ts'
            'api/admin/promo-codes/route.ts'
            'api/admin/students/route.ts'
            'api/devstudio/execute/route.ts'
            'api/devstudio/smoke-test/route.ts'
          )

          for rel in "${preserve_legacy[@]}"; do
            src="apps/app/$rel"
            case "$rel" in
              api/apprentice/*|api/learner/*) dst="apps/lms/app/$rel" ;;
              *) dst="apps/admin/app/$rel" ;;
            esac
            test -f "$src"
            test -f "$dst"
            cp "$src" "$dst"
            echo "Preserved real legacy implementation: $rel -> $dst"
          done

          # Before retiring the parallel shell, preserve any non-API file that
          # has no canonical Admin counterpart. Existing canonical shell files win.
          while IFS= read -r src; do
            rel="${src#apps/app/}"
            [[ "$rel" == api/* ]] && continue
            dst="apps/admin/app/$rel"
            if [[ ! -e "$dst" ]]; then
              mkdir -p "$(dirname "$dst")"
              cp "$src" "$dst"
              echo "Preserved unique legacy shell file: $src -> $dst"
            fi
          done < <(find apps/app -type f | sort)

          # The remaining divergent handlers have canonical implementations with
          # equal/superset methods, stronger authorization/validation, or are the
          # intended service boundary. Remove only their old parallel copies.
          rm -rf apps/app
          test ! -e apps/app

      - name: Move private Program Holder surface from Marketing to LMS
        shell: bash
        run: |
          set -euo pipefail
          src='apps/marketing/app/program-holder'
          dst='apps/lms/app/program-holder'
          if [[ -d "$src" ]]; then
            if [[ -e "$dst" ]]; then
              echo "Refusing to overwrite existing LMS Program Holder surface" >&2
              exit 1
            fi
            mkdir -p "$(dirname "$dst")"
            mv "$src" "$dst"
            echo 'Moved Program Holder portal to LMS'
          fi

          # Move its private manifest with the portal when present.
          for base in apps/marketing/public public; do
            if [[ -f "$base/manifest-program-holder.json" ]]; then
              mkdir -p apps/lms/public
              if [[ ! -e apps/lms/public/manifest-program-holder.json ]]; then
                mv "$base/manifest-program-holder.json" apps/lms/public/manifest-program-holder.json
              else
                rm -f "$base/manifest-program-holder.json"
              fi
            fi
          done

      - name: Remove stale portal PWA artifacts and hard references
        shell: bash
        run: |
          set -euo pipefail
          # Retired generic portal PWA artifacts. Canonical private portals now
          # live in LMS and use their own service-owned PWA/runtime assets.
          find apps/marketing/public apps/admin/public apps/lms/public public -type f \
            \( -name 'manifest-portal.json' -o -name 'sw-portal.js' \) -print -delete 2>/dev/null || true

          # Fail if runtime source still explicitly references the retired assets.
          if git grep -n -E 'manifest-portal\.json|sw-portal\.js|PortalPWA' -- \
             'apps/**/*.ts' 'apps/**/*.tsx' 'lib/**/*.ts' 'lib/**/*.tsx' 2>/dev/null; then
            echo 'Retired portal PWA references remain in runtime source' >&2
            exit 1
          fi

      - name: Verify parallel app is gone and Program Holder ownership is canonical
        shell: bash
        run: |
          set -euo pipefail
          test ! -e apps/app
          test -d apps/lms/app/program-holder
          test ! -e apps/marketing/app/program-holder
          count=$(find apps/lms/app/program-holder -type f | wc -l)
          echo "LMS Program Holder files: $count"
          test "$count" -gt 0

      - name: Commit consolidation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'elevate-platform-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'refactor(routes): retire parallel app and consolidate private portal ownership'
          git push origin HEAD:consolidate/legacy-routes-20260814
