name: Build ESB Course Acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/course-factory/build-esb-acceptance.ts'
      - 'scripts/course-factory/build-business-program.ts'
      - '.github/workflows/build-esb-acceptance.yml'
      - 'lib/ai/ai-service.ts'
      - 'lib/ai/providers/**'
      - 'lib/curriculum/blueprints/entrepreneurship.ts'
      - 'lib/curriculum/blueprints/business-administration.ts'
      - 'lib/curriculum/lesson-content-schema.ts'
      - 'lib/curriculum/normalize-lesson-content.ts'
      - 'lib/course-factory/**'
      - 'lib/course-builder/video-queue.ts'
      - 'lib/video/job-queue.ts'
      - 'lib/video/edge-tts.ts'
      - 'lib/video/process-video-job.ts'
      - 'lib/video/remotion-render.ts'
      - 'components/lms/CommercialLessonExperience.tsx'
      - 'components/lms/LessonContentRenderer.tsx'
      - 'apps/lms/app/lms/courses/**'
      - 'apps/admin/app/api/internal/videos/process-queue/route.ts'
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

env:
  CI: true
  NODE_ENV: production
  AI_CIRCUIT_RECOVERY_WAIT: '1'
  AI_PROVIDER: gemini
  SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GOOGLE_CLOUD_API_KEY: ${{ secrets.GOOGLE_CLOUD_API_KEY }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_AI_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_API_TOKEN }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

jobs:
  build-audit-publish:
    if: github.event_name != 'issues' || github.event.issue.title == 'RUN ESB COURSE BUILDER ACCEPTANCE' || github.event.issue.title == 'RUN BUSINESS COURSE BUILDER ACCEPTANCE'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: course-builder-production-acceptance
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          clean: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies deterministically
        id: install
        shell: bash
        run: |
          set +e
          pnpm install --frozen-lockfile --strict-peer-dependencies=false > /tmp/course-install.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Require production Supabase credentials
        id: credentials
        shell: bash
        run: |
          set +e
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_SERVICE_ROLE_KEY"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build, audit, render full media package, and publish requested course
        id: acceptance
        shell: bash
        env:
          NODE_OPTIONS: --conditions=react-server
        run: |
          set +e
          if [ "${{ steps.install.outputs.exit_code }}" != "0" ] || [ "${{ steps.credentials.outputs.exit_code }}" != "0" ]; then
            echo "Preflight failed" > /tmp/course-acceptance.log
            echo "exit_code=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event.issue.title }}" = "RUN BUSINESS COURSE BUILDER ACCEPTANCE" ]; then
            pnpm tsx scripts/course-factory/build-business-program.ts > /tmp/course-acceptance.log 2>&1
          else
            pnpm tsx scripts/course-factory/build-esb-acceptance.ts > /tmp/course-acceptance.log 2>&1
          fi
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          tail -n 320 /tmp/course-acceptance.log > /tmp/course-acceptance-tail.log || true
          exit 0

      - name: Post result to trigger issue
        if: always() && github.event_name == 'issues'
        uses: actions/github-script@v7
        env:
          INSTALL_EXIT_CODE: ${{ steps.install.outputs.exit_code }}
          CREDENTIAL_EXIT_CODE: ${{ steps.credentials.outputs.exit_code }}
          ACCEPTANCE_EXIT_CODE: ${{ steps.acceptance.outputs.exit_code }}
        with:
          script: |
            const fs = require('fs');
            const ok = process.env.INSTALL_EXIT_CODE === '0' && process.env.CREDENTIAL_EXIT_CODE === '0' && process.env.ACCEPTANCE_EXIT_CODE === '0';
            const tail = fs.existsSync('/tmp/course-acceptance-tail.log') ? fs.readFileSync('/tmp/course-acceptance-tail.log', 'utf8').slice(-30000) : 'Course Builder did not produce a log.';
            const label = context.payload.issue.title.includes('BUSINESS') ? 'BUSINESS COURSE BUILDER' : 'ESB ACCEPTANCE';
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: `${label} ${ok ? 'PASS' : 'FAIL'}\n\nCommit: ${context.sha}\n\n\`\`\`text\n${tail}\n\`\`\`` });

      - name: Fail workflow when preflight or acceptance failed
        if: always()
        shell: bash
        run: |
          test "${{ steps.install.outputs.exit_code }}" = "0"
          test "${{ steps.credentials.outputs.exit_code }}" = "0"
          test "${{ steps.acceptance.outputs.exit_code }}" = "0"
