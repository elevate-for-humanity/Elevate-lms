; Managed Elevate operator fallback
[internal]
exten => 0,1,Gosub(elevate-operator,s,1)
 same => n,Hangup()
[elevate-operator]
exten => s,1,GotoIf($[${DIALPLAN_EXISTS(elevate-pwa-extensions,0,1)}=0]?voicemail)
 same => n,Gosub(elevate-pwa-extensions,0,1)
 same => n,GotoIf($["${DIALSTATUS}"="ANSWER"]?done)
 same => n(voicemail),VoiceMail(0@elevate,u)
 same => n(done),Return()
