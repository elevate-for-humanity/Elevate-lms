name: Legacy Route Consolidation Audit

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/audit-route-reachability.mjs'
      - 'scripts/tests/route-source-contract.test.mjs'
      - 'apps/lms/next.config.mjs'
      - 'apps/marketing/app/platform/student-portal/page.tsx'
      - '.github/workflows/legacy-route-consolidation-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate legacy login and route evidence contracts
        run: node --test scripts/tests/route-source-contract.test.mjs
      - name: Dry-run collision-safe consolidation
        run: node scripts/consolidate-legacy-routes.mjs
      - name: Inventory legacy routes and potential inbound references (advisory only)
        run: node scripts/audit-route-reachability.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: legacy-route-consolidation-audit
          path: |
            artifacts/legacy-route-consolidation.json
            artifacts/route-reachability-advisory.json
